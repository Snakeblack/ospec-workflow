tiers:
  cheap:
    claude:
      model: haiku
      effort: low
    vscode:
      - GPT-5.6 Luna (copilot)
      - Gemini 3.5 Flash-Lite (copilot)
    opencode: openai/gpt-5.6-luna
    codex:
      model: gpt-5.6-luna
      model_reasoning_effort: low
      model_verbosity: low
    cursor: composer-2.5[fast=false]
    antigravity: flash_lite
  default:
    claude:
      model: sonnet
      effort: medium
    vscode:
      - GPT-5.6 Terra (copilot)
      - Claude Sonnet 5 (copilot)
      - Gemini 3.7 Flash (copilot)
    opencode: openai/gpt-5.6-terra
    codex:
      model: gpt-5.6-terra
      model_reasoning_effort: high
      model_verbosity: medium
    cursor: grok-4.6[fast=false]
    antigravity: flash
  premium:
    claude:
      model: opus
      effort: high
    vscode:
      - GPT-5.6 Sol (copilot)
      - Claude Opus 5 (copilot)
      - Gemini 3.1 Pro (copilot)
    opencode: openai/gpt-5.6-sol
    codex:
      model: gpt-5.6-sol
      model_reasoning_effort: high
      model_verbosity: medium
    cursor: gpt-5.6-sol
    antigravity: pro
assignments:
