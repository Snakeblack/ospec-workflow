# Per-agent model configuration for the multi-target generator.
#
# Two tables:
#   agents: which tier each agent needs. THIS is the only agent→tier policy.
#   tiers:  how each tier maps to a concrete model per target.
#
# Cost/intelligence policy (Codex pins):
#   premium -> Sol medium
#   default -> Terra medium
#   cheap   -> Luna low
#
# Reassign agents freely among known tiers here; the validator only checks
# roster completeness and structural invariants. Before changing a tier's
# concrete model mapping, run the golden orchestrator eval suite.

agents:
  # Premium:
  # Infrequent decisions with high blast radius.
  # A weak result here can invalidate the complete implementation direction.
  sdd-design: premium
  sdd-verify: premium
  sdd-foundation: premium
  sdd-workspace: premium

  # Default:
  # Frequent semantic work requiring solid reasoning, but not Sol-level spend.
  sdd-orchestrator: default
  sdd-propose: default
  sdd-spec: default
  sdd-clarify: default
  sdd-apply: default
  sdd-reconcile: default
  sdd-baseline: default

  # Cheap:
  # Bounded or mostly mechanical work.
  sdd-init: cheap
  sdd-explore: cheap
  sdd-tasks: cheap
  sdd-archive: cheap
  sdd-onboard: cheap
  sdd-document: cheap

  # Reviewers:
  # Keep them on default while 4R can still fan out to four agents.
  # A future risk-aware route can promote review-risk selectively.
  review-change: default
  review-correction: default
  review-risk: default
  review-readability: default
  review-reliability: default
  review-resilience: default

  _default: default

tiers:
  # Premium:
  # Sol medium is reserved for infrequent, high-blast-radius decisions.
  premium:
    claude: opus
    vscode:
      - "GPT-5.6 Luna (copilot)"
    opencode: openai/gpt-5.6-sol
    codex:
      model: gpt-5.6-sol
      model_reasoning_effort: medium
      model_verbosity: medium
    cursor: grok-4.6[fast=false]

  # Default:
  # Terra medium is the balanced default for frequent semantic work.
  default:
    claude: sonnet
    vscode:
      - "GPT-5.6 Luna (copilot)"
    opencode: openai/gpt-5.6-terra
    codex:
      model: gpt-5.6-terra
      model_reasoning_effort: medium
      model_verbosity: medium
    cursor: grok-4.6[fast=false]

  # Cheap:
  # Luna low is the efficient option for bounded or mechanical work.
  cheap:
    claude: haiku
    vscode:
      - "GPT-5.6 Luna (copilot)"
    opencode: openai/gpt-5.6-luna
    codex:
      model: gpt-5.6-luna
      model_reasoning_effort: low
      model_verbosity: low
    cursor: composer-2.5[fast=false]
