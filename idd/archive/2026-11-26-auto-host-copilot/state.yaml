  "changelog_line": "**`ospec auto` en GitHub Copilot CLI** (auto-host-copilot, E1.110, tramo 4). `ospec auto start --host github-copilot` conduce `copilot --output-format json` con el prompt por stdin y reanuda la sesión con `--resume`, verificado en vivo con el plan Free: delega `open-facts`, para en otro gate y cierra el cambio con su commit. En `copilot` sin interfaz el juez de `--assisted-approval` deniega toda edición, así que corre con `--allow-all-tools`, y la primera línea de la ejecución avisa de que no revisa cada acción; `--add-dir` le abre su propio directorio (`COPILOT_HOME` o `~/.copilot`), donde está ospec, porque sin usuario deniega toda orden que nombre una ruta fuera del repositorio. Copilot no da coste y sus tokens solo vienen en el primer turno de cada sesión, así que la ejecución gana un tope opcional, `--max-ai-credits`, con los créditos de IA de cada sesión: cada turno lo recibe también como tope de Copilot desde 30 créditos, su mínimo, y al pasarlo la ejecución falla con `max-credits`. REQ-idd-031 lo fija.",
  "closed_at": "2026-11-26T21:29:18.222Z"
