    "request": "ponte con el issue 485. Issue #485: Al final de `foundation`, dentro del mismo paso de aprobación del hand-off: Preguntar la estrategia de entrega, con la recomendación que `ospec team` deduce del perfil, sus motivos y las alternativas con sus pros y contras: `delivery.branching` (`serial` / `parallel`); si hay remoto y dónde (p. ej. crearlo con `gh`, como repo privado si el código es cerrado), o si se trabaja sin PRs. Escribir `delivery:` en `idd/config.yaml` solo tras la aprobación explícita, conservando las demás claves. Ofrecer un commit de la fundación como último paso, siempre con confirmación explícita del usuario: si la rama por defecto no tiene commits, proponer el nombre de la rama (`main`) y un commit inicial con los artefactos de la fundación (`docs/`, `idd/config.yaml`, `openspec/` si existe), en formato Conventional Commits (p. ej. `docs: add architecture foundation`); no hacer push ni crear el remoto sin aprobación. Decisión del usuario: Solo la skill: foundation presenta la estrategia como consecuencia de team.size (se cambia cambiando el tamaño) y pregunta y declara branching, changelog, release e integration_branch, más el remoto y el commit final. No toca el CLI.",
