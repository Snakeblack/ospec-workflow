      "id": "open-facts",
      "status": "resolved",
      "answer": "1) record retract: nuevo ospec record retract --change --signal --reason, solo para señales de declaración de rutas o unidades (public-contract, persistent-data, security-boundary, multi-unit-or-decision); se rechaza si el diff actual la deriva o si su obligación ya está satisfecha; la señal sale de signals, su obligación pendiente pasa a withdrawn con el motivo y queda un historial retracted en el state; si luego el diff la dispara, vuelve con source diff y reabre la obligación. 2) Campo plan bloqueante: ospec signals guarda el plan declarado; next devuelve declare-plan tras los gates de intención y open-facts y antes de las obligaciones, mientras no haya plan, señales del diff ni ejecuciones registradas; los states antiguos siguen siendo válidos.",
