  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "La valla de fin de turno (E1.49) da falsos user-unverified tras reiniciar .ospec/turns, el hook JS crea .ospec/turns en un cwd inexistente, una sesión en un subdirectorio cuenta fuera de la raíz que lee el CLI, el aviso de la valla propone un remedio que no funciona y gate-conflict confunde fuente con respuesta",
    "acceptance": "Tras perderse .ospec/turns, una respuesta registrada después de otro fin de turno queda user; un Stop con cwd inexistente no crea directorios (Node y Go cuentan en el cwd del proceso) y Go escribe latest.md de forma atómica; el aviso user-unverified nombra el remedio según el motivo y no pide re-registrar; gate-conflict distingue otra respuesta de otra fuente; Antigravity no toma un fichero por directorio; la doc del Stop y del guard nombra .ospec/turns; el test de Copilot reintenta ante el plazo del lanzador"
  },
  "facts": {
    "open": [
      "Cuando el cwd de la sesión es un subdirectorio del proyecto, ¿dónde debe contar el Stop el turno: en la raíz del repositorio que lo contiene (subiendo hasta el primer .git, en Node y Go), o se deja en el cwd del payload como hoy?"
    ]
  },
