  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "vale, hagamos el punto 7 del informe y creo que dependia de otro cambio asi que hagamos los dos en un idd. [Tras ver que E1.51 es el que depende de E1.57, eligió la opción 1: solo E1.57 ahora y E1.51 en la PR siguiente]",
    "kind": "feature",
    "summary": "ospec abandon archiva como abandoned, con la respuesta del usuario y sin exigir evidencia, un cambio IDD sustituido, descartado o abierto por error.",
    "acceptance": "Un cambio abierto con obligaciones pendientes y señales activas pasa a idd/archive/<fecha>-<id>/ con status abandoned y su motivo, sin ejecutar checks ni revisiones; sin la respuesta del usuario el comando se niega; ospec status y ospec next dejan de listarlo, close no devuelve sus decisiones para la memoria ni escribe entrada en el changelog, y un cambio que se entrega sigue sin cerrar sin su evidencia."
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿La orden es ospec abandon --change <id> --reason <texto> [--superseded-by <id>], en dos pasos como record base: abre un gate abandon con el motivo, el usuario responde al acabar el turno, y al resolverlo con record gate --resolve el cambio se archiva; con --cancel se retira la pregunta? ¿Y vale para cualquier cambio abierto, también con el intent ambiguo, con otros gates abiertos o sin base?"
      },
      {
        "category": "uniqueness",
        "question": "¿--superseded-by es opcional, nombra un solo cambio distinto del abandonado que exista abierto o archivado, y se rechaza si no existe? ¿Y el id de un cambio abandonado se puede volver a abrir después con record intent, como hoy el de uno cerrado?"
      },
      {
        "category": "persistence",
        "question": "¿El archivo guarda state.yaml con status abandoned y un bloque con el motivo, la respuesta, su fuente, la fecha y el sustituto, con obligaciones y gates tal como estaban, y change.md sin tocar? ¿Y abandon no toca el árbol de trabajo (el diff del cambio se queda), solo mueve idd/<id>/ y borra .ospec/runs/<id>/?"
      },
      {
        "category": "copy",
        "question": "¿La salida de abandon dice que el cambio quedó abandonado, dónde está archivado, que no deja entrada en el changelog ni registros de memoria y que el árbol no cambia? ¿Y la skill lo nombra solo en references/approvals.md y en ospec --help, sin que close-refused ni withdraw-refused lo sugieran, para que el agente no lo use como atajo?"
      },
      {
        "category": "url-state",
