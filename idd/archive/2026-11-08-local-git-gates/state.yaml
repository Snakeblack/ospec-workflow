{
  "schema": "idd-state/v1",
  "change": "local-git-gates",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "PR3b: el pre-commit valida el índice real con git commit -a o con rutas; el escaneo de secretos no bloquea por fixtures ya versionados y su bypass no rompe los tests; tdd_mode y trailers se leen con un lector YAML-lite que ignora comentarios y respeta secciones; los directorios de fixtures quedan en LF",
    "acceptance": "Un commit -a con un .js roto es rechazado por check.js --staged; un commit que toca pre-tool-use.test.js sin añadir secretos pasa el escaneo; un comentario '# tdd_mode: strict' no activa Strict TDD y 'trailers: required' de otra sección no exige trailers; scripts/evals/bench/scenarios y los demás fixtures llevan eol=lf"
  },
  "facts": {
    "open": [
      "¿Los tres avisos que quedaron fuera del guard de atribución (grupo '( … ) |', 'sh -c' alimentado por tubería y '<>') entran en esta PR o en otra?",
      "Escaneo de secretos del pre-commit: ¿(A) escanear solo las líneas que añade el commit, (B) eximir tests y fixtures por ruta, o (C) un marcador por línea en los fixtures?",
      "¿check.js --staged deja de heredar DISABLE_AGENT_SHIELD (y el resto de bypass del hook) a los tests que lanza?",
      "¿Cómo recibe check.js --staged el índice real: argumento --index <ruta>, variable de entorno, o la lista de ficheros ya calculada por el hook?",
      ".gitattributes: ¿patrones genéricos (**/fixtures/**, **/__fixtures__/**, **/testdata/**, más los dos scenarios) con text=auto eol=lf, o la lista explícita de directorios?",
      "Lector YAML-lite: ¿solo sustituye los dos lectores por regex del hallazgo (tdd_mode y trailers) o también los demás lectores ad hoc de openspec/config.yaml (team, routing, capabilities)?"
    ]
  },
  "plan": {
    "paths": [
      ".gitattributes",
      "docs/harness-runtime.md",
      "docs/tdd-y-revision.md",
      "openspec/specs/agent-shield-security/spec.md",
