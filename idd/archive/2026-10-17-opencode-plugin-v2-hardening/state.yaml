    "kind": "bug",
    "summary": "Endurecer el bridge OpenCode v2 (E1.25/E1.26): proteger setup() cuando ctx.permission.hook no existe, omitir source en permissionRequest si faltan messageID/id e incluir file_path/target_file en resources, alinear spec/changelog/roadmap y pasar trust-review real.",
