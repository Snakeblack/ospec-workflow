  "intent": {
    "request": "Issue #458 (Empiezo ya la #458 en IDD: A). Aceptar si: idd/config.yaml puede declarar la rama de integración, y ospec next y ospec close dan su guía: rama de trabajo, destino del PR, cuándo se propone la versión, release/x.y y la fusión de vuelta. Sin declararla, la salida de ospec next, ospec close y ospec team no cambia. Un valor no válido (una rama de integración igual a la de producción o vacía) se rechaza al leer la configuración, con su error. Tests del parser de configuración y de la guía de entrega, y la documentación (docs/README.md) con la estrategia.",
    "kind": "feature",
    "summary": "delivery en idd/config.yaml puede declarar una rama de integración (dev) separada de producción (main): las ramas de trabajo salen de ella y sus PR van a ella, cada paso a producción es una versión con tag, release/x.y es una preproducción opcional que vuelve a la integración, y la versión se propone al promover, no en cada fusión (#458)",
    "acceptance": "Con la rama de integración declarada, ospec next y ospec close dan su guía (rama de trabajo, destino del PR, cuándo se propone la versión, release/x.y y la fusión de vuelta); sin declararla, la salida de ospec next, ospec close y ospec team no cambia; un valor no válido (vacío o igual a la rama de producción) se rechaza al leer idd/config.yaml con config-invalid; tests del parser y de la guía, y docs/README.md con la estrategia"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿La rama de integración se declara con una clave nueva `delivery.integration_branch: dev`, combinable con `branching: serial|parallel`, más `delivery.production_branch` opcional (sin ella, la rama por defecto del repositorio, sin nombrarla); con `production_branch` obligatoria junto a ella; o con un valor nuevo de `branching`?"
      },
      {
        "category": "uniqueness",
        "question": "¿Qué nombres acepta `integration_branch` (y `production_branch`): solo no vacío y distinto de producción, comparado exacto (`Dev` distinto de `dev`, como git), o además las reglas de `git check-ref-format` sin ejecutar git (sin espacios, `..`, `~^:?*[\\`, `@{`, `/` inicial o final, ni `.lock` final)?"
      },
      {
        "category": "persistence",
        "question": "¿`ospec close` sigue sin leer git (la guía no lee estado de git ni de PR, REQ-idd-023), o lee la rama actual con `git rev-parse --abbrev-ref HEAD` y avisa si cierra en la rama de integración o en la de producción?"
      },
      {
        "category": "copy",
        "question": "¿`ospec close` devuelve un bloque `delivery` con la guía de la rama de integración (destino del PR, versión al promover, `release/x.y` y fusión de vuelta) solo cuando está declarada, o esa guía sale solo en `ospec next` en el paso `close`?"
      },
