{
  "schema": "idd-state/v1",
  "change": "copilot-stop-deadline",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "El test del hook Stop de Copilot global falla en Windows cuando el hijo Node pasa el plazo de 4 s del lanzador; stop.js carga 38 módulos antes de contar el turno",
    "acceptance": "stop.js cuenta el turno antes de cargar los módulos de la traza, y el test de Copilot global deja de depender del plazo del lanzador sin reintentos a ciegas"
  },
  "facts": {
    "open": [
      "¿Qué enfoque: (A) stop.js cuenta primero con un grafo mínimo y el test, si el lanzador da su plazo, verifica el conteo ejecutando el stop.js instalado sin plazo; (B) solo contar primero y quitar los reintentos; (C) un env que alargue el plazo del lanzador en los tests?",
      "¿El mismo arreglo se aplica al reintento de codex-hook-shell.test.js (runHookOnceMore, #321) o se deja como está?",
      "Si un módulo de la traza no carga, ¿vale que stop.js cuente el turno y avise con systemMessage en vez de fallar antes de contar?"
    ]
  },
  "plan": {
    "paths": [
      "scripts/configure/install-global-copilot.test.js",
      "scripts/hooks/stop.js",
      "scripts/hooks/stop.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "stop.js carga al inicio solo los módulos del conteo (atomic-write, ospec-gitignore, pathsafe, turn-fence); pre-compact, artifact-store e idd-session se cargan después del conteo con trace(), con require literales que el generador sigue empaquetando",
      "El test de Copilot global no reintenta: si el lanzador informa de su plazo y no hay conteo, ejecuta el stop.js instalado sin plazo desde el repo",
      "runHookOnceMore de codex-hook-shell.test.js queda igual: en los logs revisados sus reintentos fueron de session-start (13 módulos), no de Stop, y su salida se comprueba, así que ejecutar el hook sin plazo no aplica"
    ]
  },
