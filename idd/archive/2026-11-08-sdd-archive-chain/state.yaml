  "intent": {
    "kind": "bug",
    "summary": "PR4a de la review 2026-10-29: la transacción de archivado SDD queda bloqueada para siempre tras un fallo sin efectos, archiva sin comprobar el linaje del quality-review-gate y el reducer marca archived antes de la transacción",
    "acceptance": "Un fallo de preflight (o un rollback completo) deja repetir el archivado sin borrar el journal a mano; el preflight rechaza con gate-not-satisfied una ruta con quality-review-gate cuyo linaje no está aprobado para archive; el reducer proyecta archive-pending al volver sdd-archive (JS y Go) y solo la transacción deja el cambio archivado; desaparecen el bucle vacío y el ternario muerto del preflight"
  },
  "facts": {
    "open": [
      "Partición de PR4 (13 hallazgos): ¿4 PRs (4a archivado: 2, 3, 5 y 13a; 4b proyección del envelope: 1, 6, 7; 4c runtime y prosa SDD: 4, 8, 11, 12; 4d linajes: 9, 10, 13b), 2 PRs (1-8 y 9-13) o 3?",
      "Tras un fallo sin efectos en vivo (preflight, staging o comparación A) o un rollback completo, ¿el siguiente run abre una transacción nueva desde init, o solo los fallos de preflight son reintentables?",
      "¿Qué exige el preflight del review: el linaje de gates.quality-review-gate aprobado para archive contra su propio current_candidate_id, o además recalcular el candidato vivo y fallar por deriva? ¿Y un verify_lineage presente debe estar closed?",
      "Un linaje de review terminal no aprobado (exhausted, escalated, invalidated): ¿bloquea el archivado sin excepción o admite un override del usuario en approvals como quality-gates?",
      "Con archive-pending, ¿quién escribe archived: la transacción en la copia staged de state.yaml (la comparación acepta solo ese cambio), o la copia archivada se queda en archive-pending y la carpeta archive/ basta?"
    ]
  },
