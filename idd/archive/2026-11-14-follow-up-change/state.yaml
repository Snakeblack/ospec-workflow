        "question": "Si entre la declaración y el close la entrada del original sale en una versión, ¿close se rechaza con un remedio (retirar la declaración con --clear para que el seguimiento escriba su propia entrada)? ¿Y en un proyecto sin delivery.changelog la declaración se rechaza, porque no hay entrada que evitar?"
      }
    ]
