  "intent": {
    "request": "si y si, soluciona todo con lo recomendado",
    "kind": "feature",
    "summary": "Un cambio de seguimiento declara con ospec record completes el cambio cerrado que completa, pasa su ceremonia entera y no añade una entrada propia al changelog.",
    "acceptance": "Un cambio que declara completar a otro archivado cuya entrada sigue bajo [Unreleased] cierra sin añadir entrada, y su estado archivado nombra al que completa; si la entrada del original ya salió en una versión o el original no existe, la declaración se rechaza con su remedio; un cambio que no declara nada escribe su entrada como hoy."
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿El cambio completado se nombra por su id, tiene que estar archivado en idd/archive y con su entrada todavía bajo [Unreleased] del changelog declarado, y la declaración se puede hacer en cualquier momento mientras el seguimiento esté abierto?"
      },
      {
        "category": "uniqueness",
        "question": "¿Un seguimiento completa un solo cambio, otra declaración sustituye a la anterior, y se rechaza nombrar como completado a otro seguimiento (que no tiene entrada propia), con un remedio que nombra al cambio original?"
      },
      {
        "category": "persistence",
        "question": "¿Se guarda en state.yaml como un campo opcional completes con el id del cambio completado, de modo que un estado anterior sigue siendo válido y un CLI anterior rechaza solo un estado que ya lo tenga?"
      },
      {
        "category": "copy",
        "question": "¿La orden se llama ospec record completes --change <id> --of <id del cambio cerrado>, con --clear para retirarla, sin gate, y close dice en su salida que no añade entrada y qué cambio completa? Y si el seguimiento declara además una línea con ospec record changelog, ¿close sustituye con ella el texto de la entrada del original, conservando el id del original?"
      },
      {
        "category": "url-state",
