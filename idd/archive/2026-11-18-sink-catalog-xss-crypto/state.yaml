      {
        "category": "errors",
        "question": "¿Qué funciones neutralizan el valor en la misma línea? Recomendada: (a) una llamada de saneado de librería que envuelve el valor entero (DOMPurify.sanitize, sanitizeHtml, bleach.clean, nh3.clean, Sanitize.fragment, HtmlSanitizer.Sanitize, bluemonday) o una plantilla compuesta en la que cada interpolación pasa por una función de escape (esc, escape, escapeHtml, htmlEscape); una variable saneada en otra línea sí cuenta y la respuesta del usuario la retira; JSON.stringify no neutraliza, porque no escapa < y un </script> en los datos cierra la etiqueta, salvo que la misma línea escape <. (b) ninguna: cuenta siempre y la revisión de confianza decide. (c) solo los saneadores de librería, no las funciones de escape propias"
      }
