    "kind": "feature",
    "summary": "Dos debilidades nuevas en el catálogo de sinks de scripts/lib/idd-sinks.js: salida HTML sin escapar (CWE-79) y cifrado débil (CWE-327), con un corpus de falsos positivos propio (E1.102)",
    "acceptance": "El corpus de idd-sinks.test.js encuentra la salida HTML sin escapar (CWE-79) y el cifrado débil (CWE-327) en los lenguajes y plantillas acordados, con dos etiquetas propias al final del catálogo; sus formas seguras no derivan la señal; cada caso anterior conserva su etiqueta; el barrido de los repositorios locales de E1.100 no da falsos positivos nuevos; la spec de IDD y el handbook nombran las dos debilidades; node scripts/check.js pasa"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué formas de CWE-79 cuentan siempre y cuáles solo con un valor compuesto o variable? Recomendada: (a) las API hechas para saltarse el escape del framework (dangerouslySetInnerHTML, v-html, {@html}, set:html, bypassSecurityTrust*, unsafeHTML, mark_safe, Markup, template.HTML, Html.Raw, HtmlString, MarkupString, html_safe, raw, |safe, {!! !!}, th:utext) cuentan salvo que su argumento sea un único literal constante; las del DOM (innerHTML/outerHTML asignado, insertAdjacentHTML, document.write) solo con un valor compuesto o variable, así que innerHTML = '' no cuenta; [innerHTML] de Angular no cuenta porque Angular lo sanea, ni .html() de jQuery por ser un nombre de método demasiado común. (b) todas cuentan siempre salvo el vaciado con ''. (c) todas solo con valor compuesto o variable"
      },
      {
        "category": "uniqueness",
        "question": "¿En qué ficheros miran las reglas nuevas? Recomendada: (a) las de los nueve lenguajes del catálogo en sus extensiones; .vue, .svelte, .astro y .html reciben las formas de plantilla y además todas las reglas de JS, porque su <script> y el frontmatter de Astro son JS/TS que hoy ninguna regla mira; las plantillas de servidor (.cshtml, .razor, .erb, .ejs, .hbs, .handlebars, .jinja, .jinja2, .j2, .twig) pasan a ser código de producto con sus formas (Html.Raw, <%==, <%-, {{{ }}}, |safe, |raw), así que también derivan untested-product como ya hace un .vue. (b) igual pero sin plantillas de servidor, con lo que Html.Raw de Razor no se ve. (c) solo .vue, .svelte y .astro, sin reglas de JS en ellos"
      },
      {
        "category": "persistence",
        "question": "¿Qué cuenta como cifrado débil y cuándo? Recomendada: (a) DES, 3DES, RC2, RC4, Blowfish y el modo ECB de cualquier cifrado (también Cipher.getInstance(\"AES\") de Java, que usa ECB por defecto), al cifrar y al descifrar, siempre que una línea de producto llame a la API que elige el algoritmo; los tests ya no cuentan y una palabra suelta como ECB (el Banco Central Europeo) tampoco. (b) solo DES, RC4 y ECB, como dice el roadmap. (c) como (a) pero solo al cifrar, no al descifrar datos heredados"
      },
      {
