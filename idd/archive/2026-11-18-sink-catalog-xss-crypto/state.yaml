                "acceptance_criteria": "Each line above derives `unescaped HTML output (CWE-79)`. These stay safe: `${(value / max) * 100}`, `${Math.round(size / 5)}`, `count - 1`, `items.length`, `.replace(/</g, '&lt;')` and `.replaceAll('<', '&lt;')`. The corpus holds both groups.",
