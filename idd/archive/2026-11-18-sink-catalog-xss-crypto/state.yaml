                "acceptance_criteria": "In a .html or .htm file, each of these derives 'unescaped HTML output (CWE-79)': <!-- {{ comment.text|safe }} -->, // {{ data|safe }} and <!--/*/ <div th:utext=\"${x}\"></div> /*/-->. <!-- <div v-html=\"post.body\"></div> --> in a .vue file and <!-- note --> in a .html file still find nothing. Corpus cases cover each of these.",
                "location": "scripts/lib/idd-sinks.js:698"
              },
              {
                "severity": "WARNING",
                "summary": "OPERAND (scripts/lib/idd-sinks.js:183) puts \\[.*\\] and \\(.*\\) inside a * loop, so an operand that fails to match backtracks exponentially in its bracket groups (V8 has no backtrack limit by default). isNumeric tests every operand split at a top-level * / % or minus (:209-212), reached from isSafeValue (:302) for any CWE-79 value. Trigger: a .js line 'x.innerHTML = a()()...()! / 2;' with about 32 '()' pairs. VALUE.assigned (:328) yields 'a()...()! / 2', no earlier branch returns, and OPERAND.test('a()...()!') explores about 2^31 paths. The catch at :373-375 handles only RangeError, so ospec check hangs instead of counting the line. Static trace, not executed. Direction: make the operand test linear (match brackets with valueEnd/topLevel instead of .* inside a repetition) or bound it, and count the line when the bound is hit.",
                "acceptance_criteria": "sinkOf on a .js line 'x.innerHTML = a' followed by 40 '()' pairs and '! / 2;' returns in bounded time, checked by a test with a time limit such as under 1 s, and reports 'unescaped HTML output (CWE-79)'. The same holds with 40 '[0]' groups. Existing number cases such as 'badge.innerHTML = count * 2;' and 'bar.innerHTML = `...${(value / max) * 100}%...`' stay safe.",
                "location": "scripts/lib/idd-sinks.js:183"
              },
              {
                "severity": "WARNING",
                "summary": "scripts/lib/idd-sinks.js:577 includes the backtick in the quote group of set:html and returns '' (a constant) for every quoted form. Astro's compiler parses a backtick attribute value as a template-literal attribute and evaluates its ${} expressions. That is stated as a condition, since it cannot be checked from this repository. Under it, <Fragment set:html=`<p>${post.body}</p>` /> in a .astro file writes post.body unescaped while sinkOf returns null. The corpus only covers the double-quoted constant (idd-sinks.test.js:420). Double and single quotes are real constants in Astro. Direction: read a backtick value with interpolations() like any template literal, keeping the constant shortcut for \" and '.",
                "acceptance_criteria": "<Fragment set:html=`<p>${post.body}</p>` /> in a .astro file derives 'unescaped HTML output (CWE-79)'. set:html=`<hr>` with no interpolation and set:html=\"<hr>\" do not. If Astro is shown not to interpolate backtick attributes, a corpus case with that source documents the behaviour instead.",
                "location": "scripts/lib/idd-sinks.js:577"
              },
              {
                "severity": "SUGGESTION",
                "summary": "The {{{ }}} rule (scripts/lib/idd-sinks.js:597) feeds the tag expression to isSafeValue, whose number test applies JS arithmetic (:204-217, isMinus :193-196). Handlebars has no operators: '-' is a valid identifier character and '/' is its deprecated but still supported path separator. So {{{post/body}}} (operands post and body) and {{{item-1}}} (a minus before a digit) are judged numbers. The triple-stash writes post.body, or the item-1 property, unescaped and derives no signal. {{{post-body}}} and {{{../body}}} already count. Direction: do not apply the number test, or any operator split, to Handlebars expressions.",
                "acceptance_criteria": "In a .hbs file, <div>{{{post/body}}}</div> and <div>{{{item-1}}}</div> derive 'unescaped HTML output (CWE-79)'. {{{body}}} in a file under layouts/ stays safe.",
                "location": "scripts/lib/idd-sinks.js:597"
              },
