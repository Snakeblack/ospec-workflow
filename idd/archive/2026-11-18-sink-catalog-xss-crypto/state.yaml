                "severity": "SUGGESTION",
                "summary": "VALUE.assigned (scripts/lib/idd-sinks.js:328) takes the value to the end of the line, and isSafeValue judges it alone. In leading-operator layout, list.innerHTML = '<ul>' is a constant, so it is judged safe. The added line after it, '  + items.map((i) => `<li>${i.name}</li>`).join(\"\") + \"</ul>\";', has no sink pattern, so nothing is derived. The spec (openspec/specs/idd/spec.md:1136-1138) names only a trailing operator as unfinished. Each line is judged alone (idd-signals.js:263-266). Option one is to look at the next added line of the same file when it starts with + || ?? && . ? or :. Option two is to treat a JS value without ';' as unfinished, but that would flag semicolon-less safe lines such as list.innerHTML = ''.",
