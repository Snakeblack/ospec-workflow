        "regression": {
          "detected": false,
          "evidence": [
            "F-15e4: the OPERAND regex is now isOperand (idd-sinks.js:184-202). It reads the head, then skips each bracket with valueEnd, so it does not backtrack. In 'a'+40x'()'+'! / 2', the operand stops at '!', so isNumeric is false and the line gets XSS. The test at idd-sinks.test.js:584-591 covers '()' and '[0]' with a limit under 1000 ms. 'count * 2' (:410) and '(value / max) * 100' (:396) still pass as numbers.",
            "F-712d: VALUE.handlebars (idd-sinks.js:370-374) treats a value as safe only when it is a constant literal (interpolations()?.length === 0), or {{{body}}} under layouts/. post/body and item-1 are not literals, so they return null and count as a sink. The corpus covers them at test.js:380-381, and layouts at :446.",
            "F-c472: VALUE.assigned (idd-sinks.js:348-352) returns null when the value runs to the end of the line and the next line opens with + - ? : . || &&. securityHits passes lines[index+1] (idd-signals.js:266-267). The tests are idd-sinks.test.js:593-598 and idd-signals.test.js:835-836. The second one derives a security boundary with CWE-79, and '' followed by render(list); derives none. The spec at :1137-1138 names this case.",
            "F-e000: set:html (idd-sinks.js:604-609) reads a backtick value up to stringEnd as a template literal. Its ${post.body} is not safe, so it counts (test.js:383). set:html=`<hr>` has no interpolation (:426), and \"<hr>\" becomes '' (:425). Both stay null.",
            "F-f3f3: .html and .htm are no longer in COMMENT_STYLE (idd-sinks.js:685-687), so isCommentOnly no longer skips their lines. The three forms map to XSS through the |safe rule (:611) and the th:utext rule (:610). <!-- note --> matches no rule. Vue keeps its web style. Tests: test.js:600-605. isCommentOnly is used only inside idd-sinks.js (idd-signals.js:17 imports only sinkOf).",
            "These checks are a static trace and I ran nothing. The caller reported (and I did not verify) that node --test on idd-sinks.test.js and idd-signals.test.js passes 80 of 80 and that node scripts/check.js exits 0. I found no evidence that the correction breaks a slice that had passed."
          ]
