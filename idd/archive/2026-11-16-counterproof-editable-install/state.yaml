  "change": "counterproof-editable-install",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "La contraprueba importa el producto del candidato cuando .venv tiene una instalación editable: el .pth, el finder editable y los shebangs de la copia siguen apuntando al repositorio (#523, E1.76)",
    "acceptance": "Con una instalación editable en .venv y layout src/, la contraprueba importa el producto de la base, y un test lo reproduce"
  },
  "facts": {
    "open": [
      "Mecanismo: ¿reescribir en la copia del .venv las rutas absolutas al repositorio hacia el árbol temporal, o anteponer en el entorno del comando un PYTHONPATH con las rutas del árbol que nombra el .pth?",
      "Alcance de la reescritura: ¿los .pth, .egg-link y módulos .py sueltos de site-packages (finders editables de setuptools, hatchling y pdm) y también los scripts de bin/ del virtualenv (shebang y trampolín /bin/sh de rutas largas)?",
      "Windows: los lanzadores .exe de Scripts/ (pip y uv) llevan la ruta del python dentro del binario. ¿Quedan fuera y documentados como límite?",
      "Entorno heredado: con el .venv activado en la sesión, PATH y VIRTUAL_ENV apuntan al original. ¿Reescribir hacia el árbol temporal las entradas de PATH, VIRTUAL_ENV y PYTHONPATH que apuntan al repositorio?",
      "Un editable que apunta a un directorio de build dentro del repositorio (modo strict de setuptools, meson-python, el .so de maturin) queda apuntando a un directorio que la contraprueba no copia: la contraprueba queda inconclusa en vez de dar un falso 'no detecta'. ¿Aceptable?"
    ]
  },
  "plan": {
    "paths": [
      "docs/roadmaps/harness-evolution.md",
      "handbook/idd/evidencia.md",
      "openspec/specs/idd/spec.md",
      "scripts/lib/idd-exec.js",
      "scripts/lib/idd-workspace.js",
      "scripts/lib/idd-workspace.test.js",
      "scripts/ospec.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "La copia de las dependencias reescribe hacia el árbol temporal las rutas absolutas al repositorio (como git la escribe, resuelta o como la escribe la raíz del proyecto) que aparecen en los .pth, .egg-link y módulos .py sueltos de un site-packages, y en los scripts que empiezan por #! del bin/ o Scripts/ de un virtualenv (con pyvenv.cfg); la sustitución es byte a byte y solo de rutas completas, así que conserva la codificación y los finales de línea",
      "El comando de la contraprueba y sus controles corren con PATH, VIRTUAL_ENV y PYTHONPATH reescritos: cada entrada que apunta al repositorio pasa a la misma ruta del árbol temporal (mountCounterproof devuelve el env y runCommand lo acepta)",
      "Los lanzadores .exe de Scripts/ en Windows quedan fuera: llevan la ruta del python dentro del binario con formatos distintos en pip y uv; queda documentado como límite",
      "Un editable que apunta a un build dentro del repositorio (modo strict de setuptools, meson-python, el .so de maturin) queda apuntando a un directorio que la contraprueba no copia, así que la contraprueba sale inconclusa en vez de dar un falso 'no detecta'"
    ]
  },
