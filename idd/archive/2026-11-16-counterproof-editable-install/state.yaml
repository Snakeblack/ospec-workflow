  "changelog_line": "**La contraprueba importa el producto de la base con una instalación editable de Python en `.venv`** (counterproof-editable-install, #523). En la copia de las dependencias, las rutas absolutas al repositorio de los `.pth`, `.egg-link` y finders editables de `site-packages`, y de los scripts con shebang de un virtualenv, apuntan al árbol temporal; el comando y su control corren con `PATH`, `VIRTUAL_ENV` y `PYTHONPATH` cambiados igual. Quedan fuera los lanzadores `.exe` de Windows.",
