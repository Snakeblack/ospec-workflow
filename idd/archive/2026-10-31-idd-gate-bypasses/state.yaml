  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Los gates de IDD dejan de poder saltarse: irreversible-operation pregunta por cada operación nueva, --operation rechaza ids desconocidos, la review de confianza ve lo commiteado con base null y check --base no se salta checks-changed",
    "acceptance": "Tras aprobar una operación irreversible, otra distinta (declarada, abierta a mano o en el diff) vuelve a abrir el gate; un --operation fuera de los ids es error de uso que los lista; review start de un cambio con base null revisa también lo commiteado; check --base <ref> con config cambiada abre checks-changed sin ejecutar nada"
  },
  "facts": {
    "open": [
      "Un --operation fuera de los 7 ids (drop-table, drop-column, drop-schema, drop-database, truncate-table, delete-data, rewrite-history): ¿error de uso (exit 2) que lista los ids y remite a record gate --open --reason para otras operaciones, o se acepta cualquier texto y abre el gate con él?",
      "Varias operaciones irreversibles nuevas en una misma derivación (dos --operation o dos sentencias destructivas en el diff): ¿una sola entrada del gate cuyo motivo las nombra todas y se responde una vez, o una entrada por operación que se pregunta de una en una?",
      "Si aparece una operación nueva mientras el gate sigue abierto sin responder: ¿se añade a esa entrada abierta, que se vuelve a preguntar con todas, o queda en otra entrada que se pregunta después?",
      "Sentencias destructivas del diff: hoy cuenta solo la primera. Aprobado un DROP COLUMN en la migración A, ¿un DROP TABLE en la migración B, o el mismo tipo de sentencia en otro fichero, vuelve a preguntar (una operación = tipo de sentencia + fichero), o basta la primera aprobación?"
    ]
  },
