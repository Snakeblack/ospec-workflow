    "kind": "feature",
    "summary": "Respuestas delegadas (E1.107): cada pregunta de un gate guarda la recomendación del modelo, y una ejecución automática autorizada puede resolver con la fuente delegated los gates que no son bloqueantes",
    "acceptance": "Un gate open-facts con recomendación en todas sus preguntas se resuelve con la fuente delegated dentro de una ejecución autorizada y close lo lista; el mismo intento fuera de una ejecución, sobre un gate bloqueante o con una pregunta sin recomendación se rechaza con su causa; el corpus compartido lo fija en JS y en Go; el ADR está aceptado"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Cómo deja el modelo su recomendación por pregunta y cómo se forma la respuesta delegada: con una orden nueva «ospec record recommendation --gate <id> --question <n> (--answer \"<texto>\" | --none)» válida en cualquier gate abierto, y resolviendo con «--source delegated» sin «--answer», para que el CLI componga la respuesta con las recomendaciones guardadas?"
      },
      {
        "category": "uniqueness",
        "question": "¿Cómo se identifica una ejecución autorizada y cuándo vale su respuesta: con la variable «OSPEC_AUTO_RUN=<id>» (kebab-case, hasta 64 caracteres) que el conductor pone solo en sus llamadas al CLI, exigiendo además que haya terminado al menos 1 turno desde que se abrió el gate, y rechazando sin contador de turnos?"
      },
      {
        "category": "persistence",
        "question": "¿Dónde se guarda y qué compatibilidad tiene: «recommendations» en la entrada del gate (texto de la pregunta y respuesta o «none»), «source: delegated» con «run: <id>» al resolver, sin subir el esquema «idd-state/v1» y legible por un CLI anterior; y una recomendación repetida sustituye a la anterior mientras el gate siga abierto?"
      },
      {
        "category": "copy",
        "question": "¿Cómo se muestran: «next» con la recomendación de cada pregunta en «pending_decision» también en modo interactivo, «status» y «close» con un campo «delegated_answers» que no es un aviso, «change.md» con «delegated, run <id>» en «Request and answers», y el ADR 0013 registrado como «accepted» con estas respuestas?"
      },
