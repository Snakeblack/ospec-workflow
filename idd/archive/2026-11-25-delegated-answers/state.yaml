              {
                "severity": "WARNING",
                "summary": "The only thing that authorizes a delegated answer is OSPEC_AUTO_RUN in the CLI's environment (scripts/ospec.js:403, scripts/lib/idd-record.js:452-453). The user approved that the conductor sets it only on its own CLI calls (the uniqueness fact, answered 'todas las recomendadas'). ADR 0013 Decision (line 17) and REQ-idd-030 (openspec/specs/idd/spec.md:3821-3846) leave that constraint out. The E1.107 declared limit says the opposite: 'la pone el conductor en el entorno de la sesión' (docs/roadmaps/harness-evolution.md:1785). Suppose E1.108 follows that text and starts the host session with OSPEC_AUTO_RUN in its environment. Then every Bash call the model makes inherits it. In any later turn the model can resolve open-facts as delegated, using recommendations it rewrote in that same turn, because a recommendation keeps the gate's opened_turn (scripts/lib/turn-fence.js:108-111). That breaks 'el modelo nunca se aprueba a sí mismo'.",
                "acceptance_criteria": "ADR 0013 and REQ-idd-030 state that OSPEC_AUTO_RUN is set only in the environment of the conductor's own ospec call that records the delegated answer, and never in the environment of the host session where the model runs. The E1.107 'Límite declarado' in docs/roadmaps/harness-evolution.md agrees with that rule and no longer says the run mark goes in the session's environment.",
