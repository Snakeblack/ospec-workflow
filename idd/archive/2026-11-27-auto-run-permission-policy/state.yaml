          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "Gen 2's fix holds in the hook but not in the installed path. With OSPEC_AUTO_SESSION, an advisory-only ask now answers only {\"systemMessage\"} (scripts/hooks/pre-tool-use.js:580; internal/hooks/pretooluse.go:1384-1391). Claude Code runs the hook through scripts/hooks/ospec-hooks-launch.js (hooks/hooks.json). Its PreToolUse check (lines 866-870) rejects any stdout without hookSpecificOutput as \"invalid output\" and answers ask. So a dirty-tree `git commit -am x`, or a read over the token budget, reaches the host as ask \"The safety hook could not inspect this tool call: invalid output\". -p denies that (docs/target-capabilities.md:181) and no request is left. The host's own flow never decides, against the frozen criterion and docs/target-capabilities.md:191. No test runs the policy through the launcher: pre-tool-use-auto.test.js:72 and auto-conductor.test.js:41 spawn the hook directly.",
                "acceptance_criteria": "This goes through the entry point hooks/hooks.json installs (scripts/hooks/ospec-hooks-launch.js), with OSPEC_AUTO_SESSION set. A call whose only objection is an advisory (a dirty-tree `git commit -am x` off the default branch, a read over the token budget) reaches the host with its advisory and with neither ask nor deny. This holds for the native binary and the Node hook alike, and a test that runs the launcher fixes it. Critical asks and denies keep their auto-run answers through the launcher.",
                "location": "scripts/hooks/pre-tool-use.js:580"
              },
              {
                "severity": "WARNING",
                "summary": "For a call with commands, the approval key is `command\\0` plus the command text, \"whatever its tool\" (scripts/lib/auto-permission.js:55-59, internal/hooks/pretooluse.go:1326-1327, pinned by cases.json:4-19). The hook has no matcher, so it guards every tool. An approved key returns allow, which skips the host's review (pre-tool-use.js:584). So approving Bash `{command: \"rm -rf data\"}` also allows, in that turn, an MCP tool that takes `command` with its own host or workdir field. Where Claude Code's sandbox is on, it also allows the same Bash call with dangerouslyDisableSandbox: true. No field besides the commands is bound, not even the one that drew a secret ask. The printed block names only the commands for such a call (auto-permission.js:74, auto-conductor.js:242-245), yet the hook's reason says \"the user approved this exact call\".",
                "acceptance_criteria": "OSPEC_AUTO_SESSION is set and OSPEC_AUTO_ALLOW holds the key of an approved Bash `{command: X}`. The same command through another tool is denied and recorded. So is the same command with `dangerouslyDisableSandbox: true` or a `workdir` field added. This holds in Node and Go, fixed by shared cases in internal/testdata/auto-permission/. A retry that changes only the host's free-text description still runs. The block's printed line names each call's tool.",
                "location": "scripts/lib/auto-permission.js:57"
              },
              {
                "severity": "WARNING",
                "summary": "The session can write the run's directory: OSPEC_AUTO_SESSION is in its environment, and .ospec/auto is not CLI-owned (pre-tool-use.js:285-291). Yet both new writers there follow whatever entry they find. The hook appends with fs.appendFileSync / os.OpenFile(O_APPEND|O_CREATE) (pre-tool-use.js:560-567, pretooluse.go:1352-1371), and the conductor writes permission-block.json with fs.writeFileSync (auto-conductor.js:240-241). Say the session runs `ln -s ~/.bashrc \"$OSPEC_AUTO_SESSION/permission-requests.jsonl\"`, then makes a critical ask with `$(…)` in a side field. The hook appends that JSON to the target, outside the host's review and outside any sandbox around the session's commands. A FIFO there hangs the hook until the launcher kills it at 4 s and answers ask with no request. A FIFO at permission-block.json hangs the conductor. Only the read side checks lstat (auto-run.js:191).",
                "acceptance_criteria": "The session leaves permission-requests.jsonl or permission-block.json in the run's directory as a symlink to a file outside it, or as a FIFO. The hook (Node and Go) neither writes through the link nor blocks, and still denies the critical call. The conductor neither writes through the link nor hangs. The link's target keeps its content. Tests cover both files with a symlink and a FIFO.",
                "location": "scripts/hooks/pre-tool-use.js:563"
              },
              {
                "severity": "SUGGESTION",
                "summary": "The key's canonical form is ambiguous. Paths join keys with an unescaped \".\", and entries join with NUL, which a JSON string may hold (auto-permission.js:35-59, pretooluse.go:1288-1340). `{\"a\":{\"b\":1}}` and `{\"a\":{},\"a.b\":1}` give the same entries. `{\"p\":\"x\",\"q\":\"y\"}` and `{\"p\":\"x\\u0000q\\u0000sy\"}` give the same canonical string. A session can show the user one form and run the other in the next turn. For example, an MCP call approved with `options: {dry_run: true}` can be re-sent as `options: {}` plus a top-level \"options.dry_run\" that the tool ignores. describeCall prints both forms alike. The impact needs a tool that ignores unknown keys or accepts NUL, so this is advisory.",
                "acceptance_criteria": "Each pair above gets a different key in Node and Go, pinned in the keys of internal/testdata/auto-permission/cases.json. REQ-hooks-035 states an encoding in which no key or value can be read as a separator.",
                "location": "scripts/lib/auto-permission.js:59"
              }
            ]
          },
          "operation": null,
          "result_request_id": "auto-run-permission-policy:lens-result:3:1"
