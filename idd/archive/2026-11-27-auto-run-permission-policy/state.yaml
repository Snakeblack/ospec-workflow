          "result": {
            "findings": [
              {
                "severity": "CRITICAL",
                "summary": "Auto turn: an ask that only advises becomes an affirmative allow for the whole call, which skips the host's own review. applyAutoRun returns degradeAsk for any advisory (scripts/hooks/pre-tool-use.js:577, internal/hooks/pretooluse.go:1363-1364). Per OSP-017 the host takes allow as an approval that skips its permission flow (openspec/specs/hooks/spec.md:785). Here that flow is the classifier of Claude's --permission-mode auto (auto-hosts.js:73-81,106). Two triggers: any command matching the unanchored /\\bgit\\s+commit\\b/ on a dirty tree (a run never uses the default branch, auto-conductor.js:520), or any call with a string that names an existing file over the token limit (extractPaths walks every string, and cases.json:271-291 fires this from a side field of a Bash call). So `node -e '…' # git commit` runs with no ospec objection and no host review. Before this change the same call stayed an ask.",
                "acceptance_criteria": "With OSPEC_AUTO_SESSION set, a call whose only objection is an advisory never gets an affirmative allow that covers more than the advised action, so the host's own permission flow still decides it. This holds in both Node and Go. Examples: `node -e 'x' # git commit` on a dirty tree off the default branch, and a Bash call whose only objection is the token advisory, fired by a side field that names an existing large file. Shared cases in internal/testdata/auto-permission/, with those guards on, cover both triggers. The frozen behaviour stays: a plain `git commit -am x` on a dirty tree becomes allow with its advisory.",
                "location": "scripts/hooks/pre-tool-use.js:577"
              },
              {
                "severity": "WARNING",
                "summary": "Left over from gen-1 W3: approving a call without commands still does not bind or show its whole input. callKey hashes only the tool and the input's strings (scripts/lib/auto-permission.js:31-47, internal/hooks/pretooluse.go:1285-1321), so numbers and booleans are dropped. Approving an Edit with replace_all false, or an MCP call with public false, also allows the same strings with true. describeCall cuts each string at 120 characters and shows no non-strings (auto-permission.js:15,60). blockOnPermission deletes the request file and keeps only tool, subject, reason and key (auto-conductor.js:225,235,240). So for a secret-write ask on long Write or Edit content (pre-tool-use.js:676-682), the user approves text they cannot see. The approval is an affirmative allow (pre-tool-use.js:581) that also skips host review. docs/target-capabilities.md:191 tells users the key covers \"toda su entrada\".",
                "acceptance_criteria": "For a call without commands, an approval does not allow a later call that differs in any input value, numbers and booleans included, with shared key cases for Node and Go in internal/testdata/auto-permission/. Before `ospec auto resume --allow`, the user can see every value the key binds in full (for example in a file the block names), not just a 120-character prefix. docs/target-capabilities.md describes accurately what the key binds."
              },
              {
                "severity": "SUGGESTION",
                "summary": "A session can hang the conductor through the files it re-checks. permissionRequests calls fs.readFileSync on .ospec/auto/<run>/permission-requests.jsonl (scripts/lib/auto-run.js:185-191). The session can replace that path, for example with mkfifo, because .ospec/auto is not CLI-owned (pre-tool-use.js:285-291). verifiedRequests also runs the guard on every forged line (auto-conductor.js:218-226). The guard's secret scan reads a declared file_path without checking that it is a regular file (pre-tool-use.js:625,657-674), so a line naming a FIFO blocks too. The conductor then hangs synchronously after the turn and never blocks the run or continues. ospec auto stop only writes a stop file that the hung conductor never reads (auto-conductor.js:595-600), so the user has to kill the process.",
                "acceptance_criteria": "If the session turns permission-requests.jsonl, or a path named in one of its lines, into a FIFO or another non-regular file, the conductor still finishes the step (blocks at permission or continues) and ospec auto stop still stops the run, with a test that covers it."
              }
            ]
          },
          "operation": null,
          "result_request_id": "auto-run-permission-policy:lens-result:2:1"
        },
