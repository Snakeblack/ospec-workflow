        "plan": "run.json sigue en ospec-auto-run/v1: el bloqueo permission solo añade gate, questions, requests (tool, subject, reason, sha256), file y session_id, y un CLI anterior lo lee como un bloqueo de gate, muestra sus preguntas y lo reanuda; un run.json anterior, sin requests, se lee y se reanuda igual, y --allow lo rechaza con invalid-allow. permission-requests.jsonl y permission-block.json son nuevos y locales en .ospec/auto/<run>/; una línea que no es una petición se salta. Para volver atrás basta el CLI anterior: no hay datos que migrar"
