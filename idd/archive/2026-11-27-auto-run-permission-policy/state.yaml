          "evidence": [
            "Tests not run (no shell tool here); evidence is reading the corrected tree. pretooluse.go:1372-1398 creates a missing request file with O_CREATE|O_EXCL, which fails on any link that appears, dangling or not. It writes only when handle.Stat and Lstat name the same regular file with linkCount 1. An existing file swapped for a symlink opens the target but is rejected before any write.",
            "TestPreToolUse_AutoRunRequestLinkSwappedIn (pretooluse_auto_test.go:253-304) swaps a symlink in through SetBeforeAutoRequestOpenForTest (export_test.go:49-53), which runs at pretooluse.go:1386, between the Lstat and the open. It covers missing file with an outside target, missing file with a dangling link, and an existing file. Each asserts deny, the target unchanged, and no dangling target created.",
            "Shared hard-link case cases.json:289-298 runs in Go (pretooluse_auto_test.go:142-145, 207-215) and Node (pre-tool-use-auto.test.js:81, 99-101), asserting deny and outside.txt kept. Node recordAutoRequest (pre-tool-use.js:573-578) keeps O_NOFOLLOW and adds nlink === 1. A fresh file has nlink 1 and the same inode, so cases that expect a request line still pass.",
            "describeCall (auto-permission.js:88-94) puts every non-free-text field in brackets; command plus description still reads `<tool>: <commands>`. auto-conductor.js:245-248 feeds it to block.requests, questions and emitBlock; ospec.js:1783-1786 prints the questions and the block file. auto-conductor.test.js:198-219 and ospec.auto.test.js:82-91 assert these. callKey (auto-permission.js:63-68) is unchanged, so approval keys keep their values."
