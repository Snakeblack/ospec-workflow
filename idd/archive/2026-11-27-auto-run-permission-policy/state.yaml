            "owner": "trust",
            "summary": "pretooluse.go recordAutoRequest opens an existing request file without O_NOFOLLOW. A symlink swapped in after the Lstat is still opened (O_APPEND|O_WRONLY, nothing written) before the post-open check rejects it. Adding syscall.O_NOFOLLOW on POSIX would match the Node hook and avoid side effects from opening a device or FIFO target."
