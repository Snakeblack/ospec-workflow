          "line": 201
        }
      },
      {
        "category": "errors",
        "question": "Un host donde el hook de ospec no corre sin interfaz (Codex con los hooks sin aprobar en /hooks, o el que la verificación encuentre) no aplica ninguna regla: ¿la ejecución se niega a arrancar con un error que dice cómo activarlos, o arranca con un aviso en la primera línea?"
      }
    ]
  },
