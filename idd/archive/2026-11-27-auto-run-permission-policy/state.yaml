      "lenses": {
        "trust": {
          "selected": true,
          "status": "completed",
          "request_id": "auto-run-permission-policy:lens-start:1:0",
          "result_digest": "sha256:52cda066f5db9971218445a79ace98ee693ec4ff468014b6dd7efddcf9b64e55",
          "result": {
            "findings": [
              {
                "severity": "CRITICAL",
                "summary": "Auto turn: an advisory ask ends evaluation before the critical ASK_RULES and becomes allow. Step 5b returns the dirty-tree advisory for any command matching the unanchored /\\bgit\\s+commit\\b/ (pre-tool-use.js:712-726, pretooluse.go:1502-1516) before Step 6 ASK_RULES (pre-tool-use.js:776, pretooluse.go:1528), and applyAutoRun turns it into allow (pre-tool-use.js:589, pretooluse.go:1318). The tree is dirty in almost every turn (the change's idd/ files stay untracked until the conductor commits), so `rm -rf src # git commit` or `npm install evil && git commit -am x` runs with no request and no stop, and the affirmative allow also skips the host's own review (OSP-017, pre-tool-use.js:341-343). The token-budget advisory (every call past 150k tokens in an active openspec change) and Node's spec-drift advisory mask ASK_RULES the same way. The shared cases turn all three advisory guards off, so nothing tests it.",
                "acceptance_criteria": "With OSPEC_AUTO_SESSION set and the git collaboration guard on over a dirty tree, a call that matches an ASK_RULES rule and also triggers an advisory (e.g. `npm install left-pad && git commit -am x`, `rm -rf build # git commit`) is denied with the ospec auto reason and leaves its request, in both the Node and the Go hook. The same holds when the token-budget advisory fires (and, in Node, spec drift). A plain `git commit -am x` on a dirty tree still becomes allow with its advisory. Shared cases in internal/testdata/auto-permission/ with those guards on cover both implementations.",
                "location": "scripts/hooks/pre-tool-use.js:589"
              },
              {
                "severity": "WARNING",
                "summary": "The permission block trusts and prints session output nobody vetted. permissionRequests reads .ospec/auto/<run>/permission-requests.jsonl, which sits inside the work tree and which the session can write itself: it gets the path from OSPEC_AUTO_SESSION, and the guard protects only idd state, archive, receipts and turns (pre-tool-use.js:285-291). It keeps any line with a string subject (auto-run.js:193-201). blockOnPermission prints subject and reason with only newlines collapsed (auto-conductor.js:223, 210; ospec.js:1765, 1784), and --allow hashes the raw subject (auto-conductor.js:566). So a turn can forge a request whose free-text reason reads as ospec's, both to the user and to the supervising agent told to relay the block and run --allow (auto-queue.js:55-57). It can also put CR/ESC sequences in a subject (e.g. `git reset --hard HEAD~20 #\\r  - npm install lodash`) so the terminal shows a different command from the one --allow approves.",
                "acceptance_criteria": "Start/resume output and ospec auto status render each subject and reason of a permission block with CR, ESC, other C0/C1 and bidi control characters shown as visible escapes, so the displayed text matches what --allow approves. A line the session appended to permission-requests.jsonl itself is neither shown as ospec's request nor approved by --allow. That covers a subject the guard would not stop and a reason other than the guard's own. Each case has a test."
              },
              {
                "severity": "WARNING",
                "summary": "For a call without a command, the approved subject is its first top-level path key or else its tool name (pre-tool-use.js:561-568, pretooluse.go:1263-1279). The hash binds neither the tool nor the rest of the input. Yet the ask can come from data outside the subject: every string through extractPaths, nested path keys and content bodies (pre-tool-use.js:621-622, 632, 673-679). So a Grep with glob `.env`, or an MCP send whose `text` holds a token, is recorded and shown only as `Grep` or the tool name. --allow then lets that tool read or send any secret-bearing input in the next turn. Approving a Write to a path also approves another tool, such as an upload, that names the same path. That is broader than the 'approves exactly the pending calls' the user chose (change.md:18) and the 'this exact call' the deny and approve reasons promise (pre-tool-use.js:552, 558).",
                "acceptance_criteria": "A --allow approval covers only a call with the same tool and the same input as the one that was stopped. With an approval from one tool call's request, these are denied and recorded in both hooks: a call of the same tool with a different file, glob or content value, and a call of another tool naming the same path. Each request shown to the user names the file or content that triggered its ask, not just the tool name. Shared cases cover it."
              }
