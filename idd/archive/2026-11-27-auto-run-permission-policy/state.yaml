  "intent": {
    "request": "fusiona y continua (E1.111 auto-run-permission-policy: es importante que no pregunte a cada cosa que hará, y me refiero a ejecuciones de bash, salvo los que tenemos como críticos, y desde luego los deny no, y obviamente los ask sí)",
    "requested_at": "2026-11-27T19:10:01.805Z",
    "kind": "feature",
    "summary": "La ejecución automática aplica la misma política de permisos en todos los hosts: lo denegado nunca corre, lo crítico para la ejecución para el usuario y el resto corre sin preguntar",
    "acceptance": "En cada host verificado de ospec auto, una orden de DENY_RULES se bloquea, una de ASK_RULES o la lectura de un secreto para la ejecución como blocked con la orden y su motivo hasta que el usuario la aprueba o responde, y una orden normal corre sin preguntar; un test de contrato fija cada caso y docs/target-capabilities.md lo dice por host"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Cómo aprueba el usuario la orden que paró la ejecución? Propuesta: ospec auto resume --allow aprueba exactamente las órdenes pendientes; --answer \"<texto>\" sin --allow la rechaza y lleva el texto a la sesión; resume sin nada da por resuelto lo que el usuario hizo en la sesión interactiva"
      },
      {
        "category": "uniqueness",
        "question": "Si en un turno el modelo pide varias órdenes que necesitan aprobación, ¿la ejecución para una vez con la lista sin repetidas y --allow las aprueba todas, o para en la primera?"
      },
      {
        "category": "persistence",
        "question": "¿Cuánto dura una aprobación? Propuesta: solo el turno siguiente de esa sesión, como el sha256 de cada orden en el entorno del proceso del host (OSPEC_AUTO_ALLOW), nunca en disco, para que el modelo no pueda fabricarla; la petición la escribe el hook en .ospec/auto/<run>/ y el bloqueo queda en run.json"
      },
      {
        "category": "copy",
        "question": "¿Qué dice la ejecución al parar? Propuesta: item N/M blocked at permission, cada orden con su motivo, y las líneas approve with: ospec auto resume --allow y or answer with: ospec auto resume --answer; al modelo, el deny le dice que la ejecución pedirá la aprobación al terminar el turno y que termine el turno o siga sin esa orden"
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "scripts/ospec.js",
          "line": 203
        }
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
