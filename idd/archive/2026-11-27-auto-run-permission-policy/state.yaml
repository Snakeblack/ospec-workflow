  "impacts": [
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "La política vive en el hook y en el CLI (applyAutoRun, blockOnPermission, resume --allow), con sus tests; la skill y el how de execution_mode solo dicen que se pregunte al usuario y qué orden lleva su respuesta"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "La ejecución sigue avanzando solo con el close en disco; un bloqueo de permiso para la ejecución sin dar nada por hecho, y una aprobación solo deja correr la orden, que no es evidencia de ninguna obligación"
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Un deny sigue siendo el suelo y nunca se degrada, aprobado o no; con la marca de la ejecución un ask crítico solo se endurece a deny, y una llamada que el hook no puede leer se deniega"
    },
    {
      "kind": "adr",
      "id": "0010",
      "impact": "conforms",
      "reason": "Sin dependencias nuevas: la clave usa node:crypto y crypto/sha256 de la biblioteca estándar, y el hook sigue siendo el binario de Go con el respaldo de Node"
    },
    {
      "kind": "adr",
      "id": "0013",
      "impact": "conforms",
      "reason": "La aprobación de una orden llega solo de la respuesta explícita del usuario con ospec auto resume --allow; la delegación sigue limitada a open-facts y el modelo nunca tiene la aprobación, que vive en el entorno de un solo turno"
    },
    {
      "kind": "scenario",
      "id": "deterministic-resume",
      "impact": "conforms",
      "reason": "El bloqueo vive en run.json y la aprobación no se guarda: reanudar tras una caída vuelve a parar en las mismas órdenes, y --allow solo vale para el turno siguiente"
    },
    {
      "kind": "scenario",
      "id": "guard-fail-closed",
      "impact": "conforms",
      "reason": "Un deny nunca se degrada; con la marca un ask crítico se endurece a deny y una llamada ilegible se deniega; un fichero que no es regular no se lee, pero su nombre sigue clasificándose"
    },
    {
      "kind": "scenario",
      "id": "offline-operation",
      "impact": "conforms",
      "reason": "Sin llamadas de red: el hook lee el entorno y escribe un fichero local, y el conductor lee ese fichero"
    },
    {
