  "intent": {
    "request": "Ítem E4.10 greenfield-foundation-hint del roadmap (docs/roadmaps/harness-evolution.md), el siguiente de la cola, que el usuario pidió continuar. Problema: en E4.5, el router de agy decía que un proyecto sin código empieza con la skill foundation, y Gemini lo ignoró. La CLI no detecta un proyecto vacío: no hay nada en idd-next, idd-record ni idd-signals, así que la regla solo existe como texto. Alcance: cuando no hay código fuente más allá de manifiestos o un README, ni docs/product ni docs/architecture, ospec next y record intent devuelven una sugerencia no bloqueante de foundation. La skill idd se la ofrece al usuario como opción. Hechos abiertos: qué cuenta como código fuente; si la sugerencia se repite tras rechazarla; cómo responde la persona. Hecho cuando: en todo-spa y en el escenario reservado de E4.6, IDD ofrece foundation antes del primer cambio, y el efecto en escapados y tokens se reporta frente al resultado de E4.6. En los seis escenarios con código no aparece la sugerencia.",
    "kind": "feature",
    "summary": "ospec next y record intent sugieren, sin bloquear, la skill foundation en un proyecto sin código fuente ni docs/product ni docs/architecture, y la skill idd se la ofrece al usuario como opción",
    "acceptance": "En un proyecto sin código fuente (solo manifiestos, README u otra documentación) y sin docs/product ni docs/architecture, ospec next y la respuesta de record intent llevan la sugerencia foundation con su reason y su how, en JSON y en texto, y el paso siguiente y el código de salida son los mismos que sin ella; con código o con docs/product o docs/architecture no aparece; sobre los repos de los escenarios del banco aparece en todo-spa y receta-spa y no en los seis con código ni en salas; la skill idd la ofrece como opción"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "\"¿Qué cuenta como código fuente y qué ficheros se miran? Recomendado: los que git ve bajo la raíz del CLI (--root o el directorio actual, como el resto de comandos hasta E4.11), versionados y sin versionar no ignorados, sin idd/ ni .ospec/; es código un fichero que ospec signals ya clasifica como producto o test (.js, .ts, .py, .go, .html, .css, .sh, *.test.js…); no cuentan manifiestos ni lockfiles, la documentación (*.md, docs/) ni el resto (.gitignore, LICENSE, .github/, YAML o JSON de configuración). Un fichero cualquiera bajo docs/product/ o docs/architecture/ apaga la sugerencia. Alternativa: contar como código todo lo que no sea manifiesto, lockfile ni documentación, así que un .gitignore o un .github/ también la apagarían.\""
      },
      {
        "category": "uniqueness",
        "question": "\"¿Dónde aparece y se repite tras rechazarla? Recomendado: sin estado nuevo; sale en ospec next sin cambio abierto (open-change), en la respuesta de record intent y en ospec next de un cambio mientras su paso es resolve-gate o declare-plan, es decir, antes de construir; con el plan declarado ya no sale en ese cambio, y en cuanto hay código desaparece sola. Su how dice ofrecerla una vez y, si el usuario la rechaza, seguir con el cambio sin volver a ofrecerla. ospec status no la muestra. Alternativa: registrar el rechazo con un record nuevo para no repetirla nunca en el proyecto.\""
      },
      {
        "category": "persistence",
        "cite": {
          "kind": "path",
          "path": "openspec/specs/idd/spec.md",
          "line": 485
        }
      },
      {
        "category": "copy",
        "question": "\"¿Qué texto lleva? Recomendado: id foundation, reason «the project has no source code and no docs/product or docs/architecture» y how «offer the user the foundation skill before the first change, as an option: it records the product docs, ADRs and idd/config.yaml and writes no code; if the user declines, go on with the change». En texto sale en su línea «suggestion foundation: …», en inglés como el resto del CLI, y references/architecture.md de la skill idd explica que se ofrece como opción, sin crecer SKILL.md (le quedan 363 B de margen en CRLF).\""
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "request",
          "text": "devuelven una sugerencia no bloqueante de foundation"
        }
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
          "path": "scripts/ospec.js",
          "line": 1122
        }
      },
      {
        "category": "errors",
        "question": "\"¿Qué pasa si no se puede decidir? Recomendado: la detección nunca hace fallar el comando; si git no puede listar los ficheros no hay sugerencia y el resto de la salida es igual; fuera de un work tree next y record intent ya se rechazan con not-a-git-repo. La sugerencia nunca cambia next_step ni el código de salida. Alternativa: devolver un warning cuando la detección falla.\""
      }
    ]
  },
