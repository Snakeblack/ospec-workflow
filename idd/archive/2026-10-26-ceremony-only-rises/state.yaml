      "answer": "B3: Test con líneas añadidas (un fichero de test del diff con al menos una línea añadida; borrar o vaciar un test no cuenta; el check sigue exigiendo tests > 0 o sin recuento). B6: Manifiesto no; código en plan o diff (record intent rechaza citas a manifiestos y lockfiles; la documentación vale siempre; una cita a otro fichero vale al registrarla y check y close exigen que esté en el plan o en el diff, con el how para declararlo; los estados guardados siguen validando). B7: Sí y sí (se abre también en la primera configuración; el gate guarda los checks que aprueba y cambiarlos después abre una entrada nueva, como review-limit). B9 contrato: Docs de contrato (líneas quitadas de contracts.documents y de documentación que declara un contrato con los patrones de public-contract). B9 salida: Re-registrar subiendo kind (docs → refactor, bug o feature; refactor → bug o feature, con resumen, aceptación y hechos; preguntas nuevas abren otra entrada de open-facts; bajar o pasar entre bug y feature sigue siendo intent-conflict). B9 docs: Solo si toca producto (classifyPath product).",
