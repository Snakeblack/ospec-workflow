          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "B3 is bypassable by touching a test before the first check. untestedProduct (scripts/lib/idd-signals.js:221-228, applied at 397-398) derives untested-product only when the diff has no test path, but the new rule (scripts/ospec.js:435-437, scripts/lib/idd-check.js:95-121) counts a test only with a non-blank added line. A feature or bug whose first ospec check already sees a deleted, emptied or empty untracked test path beside product code never gets the signal, so boundary-tests does not exist and the 'adds no line to a test' refusal never runs. ospec.test.js:1990-2013 covers only derive-then-delete. REQ-idd-014 says a deleted or emptied test must not satisfy boundary-tests; here it removes the obligation, so the first audited case (feature without a new test) still reaches ready.",
                "acceptance_criteria": "For a feature or bug whose diff changes product code and whose test paths are only deleted, emptied or empty files, the first ospec check records untested-product (or otherwise leaves boundary-tests pending) with the reason 'the diff adds no line to a test'. A diff that adds a non-blank test line still satisfies it, and the derive-then-delete test at ospec.test.js:1990 stays green."
              },
              {
                "severity": "WARNING",
                "summary": "The invariant 'the agent can raise the ceremony, never lower it' (README.md:50, README.es.md:50, openwiki/idd/flujo-idd.md:100, openspec/specs/idd/spec.md:825) holds only for kind, cites and checks. strict_tdd, impact (exclude, defaults) and contracts of idd/config.yaml are read from the working tree (idd-workspace.js:49-63), idd/ is left out of the diff (idd-workspace.js:207-215), settleChecksChange compares only checks with the base (idd-check.js:135-150), and a Write to idd/config.yaml is allowed (pre-tool-use.test.js:65). Trigger: the model adds impact.exclude for auth paths; security-boundary stops deriving, and a derived one can be retracted because diffConfirmation (ospec.js:300-310) reads the same patterns, so trust-review never runs. The code is older, but this change specifies and documents a guarantee it does not deliver.",
                "acceptance_criteria": "Either the statements name the mechanisms the CLI enforces (kind, cites, checks) instead of an unqualified 'never lower', or a change to strict_tdd, impact or contracts in idd/config.yaml relative to the change's base is refused or put to the user's answer before it can reduce the derived signals or obligations. Whichever is chosen, a test or doc check pins it."
              }
            ]
          },
