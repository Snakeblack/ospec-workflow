                "summary": "B3 can be satisfied against a diff the caller chooses. scripts/ospec.js:120 and 367 accept `ospec check --change <id> --base <ref>` (any commit, or the empty tree 4b825dc6...). check feeds that diff to addedTests() and settleBoundary (ospec.js:452,503; idd-check.js:95-121). With an older base, test files added by earlier commits count as added, so a feature with no new test records tested-check and satisfies boundary-tests once a normal check has derived untested-product. close does not catch it. requireDerived (ospec.js:612-630) re-derives signals and gates against state.base, and idd-close.js:116-138 compares only trees. The evidence `tests` are never re-read against the change's base. kind-mismatch, cite-outside-plan and checks-changed are re-checked at close, so B3 is the one left open. README.md:50 and REQ-idd-014 say boundary-tests needs a test the diff adds. The same override already lets contract-spec-and-test settle from any diff (pre-existing).",
