  "schema": "idd-state/v1",
  "change": "ceremony-only-rises",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "E1.44 (B3, B6, B7, B9): el modelo solo puede subir la ceremonia; boundary-tests exige un test en el diff, las citas de open-facts quedan acotadas, un cambio de checks frente a la base abre el gate checks-changed y check contrasta --kind con el diff",
    "acceptance": "Los cuatro casos de la auditoría (feature sin test nuevo, cita a package.json, checks cambiado a true, kind docs que toca producto y refactor que borra líneas de un contrato) se rechazan con su motivo y su how, y los tests de los cambios legítimos siguen en verde"
  },
  "facts": {
    "open": [
      "B3: ¿qué cuenta como test en el diff para boundary-tests: un fichero de test con al menos una línea añadida (borrar un test no cuenta), o cualquier fichero de test que aparezca en el diff?",
      "B6: ¿dónde puede caer una cita --cite y cuándo se comprueba el plan, dado que record intent va antes que signals?",
      "B7: ¿checks-changed se abre también cuando la base no tenía checks (primera configuración), y un cambio de checks posterior a la aprobación abre una entrada nueva del gate?",
      "B9: ¿qué cuenta como borrar líneas de un contrato en un refactor: líneas quitadas de contracts.documents y de documentación que declara un contrato, o también líneas de código en rutas public_contract?",
      "B9: ¿cómo sale el modelo tras el rechazo: record intent permite volver a registrar la intención del mismo cambio con un kind que sube la ceremonia, o el how manda abrir un cambio nuevo?",
      "B9: ¿un kind docs se rechaza solo si el diff toca código de producto, o también si toca tests, manifiestos u otros ficheros?"
    ]
  },
