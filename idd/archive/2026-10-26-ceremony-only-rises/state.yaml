                "acceptance_criteria": "record intent --kind feature with --cite persistence=package.json/:2, package.json/.:2 and a cite through a symlink whose target is package.json or a lockfile is refused with cite-unresolved naming the manifest, so the decision follows the file actually read (path resolved against the root, symlinks followed), not the literal string. A test pins the trailing-slash and the symlink spellings, and a code cite such as src/store.js:1 still resolves."
