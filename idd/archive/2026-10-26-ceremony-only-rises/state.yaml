            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/lib/idd-workspace.js:368-382 builds addedLines/removedLines from plain `git diff` text keyed by the `a/` and `b/` header prefixes (headerPath 217-219, changedLinesByFile 225-250) and deletes every key not in `paths` (377-381). `diff.mnemonicPrefix` (headers `c/` and `w/`), `diff.srcPrefix`/`diff.dstPrefix`, or a `-diff`/`binary` attribute in .gitattributes (`Binary files differ`, no hunks) leave that map empty for tracked files. Then removedContractLine (idd-signals.js:239-257) never fires: a `refactor` that deletes a contract line passes `check` and `close` without `kind-mismatch`, and addedTests stays empty (B3 over-blocks legitimate work). One `git config` or .gitattributes line, set by the model or by a user-level config, disables the new B9 control. No test sets either.",
                "acceptance_criteria": "With `git config diff.mnemonicPrefix true`, and separately with a .gitattributes line `docs/** -diff` (or `*.md binary`) covering a tracked contract document, `readGitDiff` returns the same addedLines and removedLines as without the setting. `ospec check` and `ospec close` still refuse a `refactor` that removes a line of that document with `kind-mismatch`, and a line added to a tracked test file still counts for boundary-tests. A regression test sets each setting and asserts it."
              },
              {
                "severity": "SUGGESTION",
                "summary": "idd-signals.js:223-225 addedTests counts any test-classified path with one non-blank added line, and classifyPath (142-149, isTestPath 131-140) takes every non-doc file under test/ or tests/ as a test. A comment-only edit, an import reorder or a fixture such as test/data.json therefore satisfies boundary-tests and prevents untested-product from being derived. The accepted regression in ospec.test.js:2008 is a test file whose whole content is `// size=50`. The control exists to reject 'feature without a new test' (REQ-idd-014), and its cheapest bypass is one comment line in any test file, by the model or by accident. Advisory: the user's answer defined the test as a non-blank added line, so this narrows that definition instead of contradicting it.",
                "acceptance_criteria": "A feature or bug whose only addition to a test path is a comment-only line, or a non-source file under test/, leaves boundary-tests pending with the 'adds no line to a test' reason and still derives untested-product. A real added code line in a test file satisfies it, and deleting or blanking a test still does not. Unit tests in idd-signals.test.js and idd-check.test.js cover the comment-only case."
              },
              {
                "severity": "SUGGESTION",
                "summary": "idd-record.js:154-166 raiseIntent opens a new open-facts entry only for a question text not asked before (`asked.has`, line 164) and keeps answered ones. A feature registered fresh always opens the gate (applyFacts 138-141, with idd-facts.js:190-192 requiring one question). But a docs or refactor change that already answered question Q can be raised to a feature whose single --open-fact is Q, and no gate opens, so the user never sees the feature's plan, although E1.44 says the kind may only rise. Also idd-record.js:168-173: a raise replaces intent.request, which every other path refuses to rewrite (`intent-conflict`). Narrow precondition: an earlier answered question must be replayed verbatim.",
                "acceptance_criteria": "Raising a resolved docs or refactor change to a feature leaves an open `open-facts` entry for the feature's questions, even when their text was asked and answered before the raise (or the raise is refused), as a freshly registered feature does. A raise keeps intent.request as recorded unless it was null. Unit tests in idd-record.test.js cover both."
              }
            ]
          },
          "operation": null,
          "result_request_id": "ceremony-only-rises:lens-result:4:1"
