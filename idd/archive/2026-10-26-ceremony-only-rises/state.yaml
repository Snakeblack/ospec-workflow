                "severity": "SUGGESTION",
                "summary": "kindMismatch (scripts/lib/idd-signals.js:264-270) refuses a docs change only when classifyPath(file) is product. classifyPath (idd-signals.js:142-149) returns product only for the PRODUCT_EXT list at line 58 (js, ts, py, go, java, kt, cs, rb, php, rs, html, css, vue, svelte) and only after isDocumentation (127-129) has claimed any path under a nested docs/ directory or ending in .md. A docs-kind change that edits src/main.c, lib/App.swift, scripts/deploy.sh or src/docs/handler.py therefore derives no kind-mismatch, no untested-product and keeps the lower docs floor (floorOf, line 373), although spec.md:635 says product code is a source file. The change.md decision chose classifyPath product, so this is a coverage gap of the shared classifier that B9 now relies on, not a new bypass.",
