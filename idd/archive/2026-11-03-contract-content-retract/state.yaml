  "change": "contract-content-retract",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Una doc que solo cita una ruta o un selector existente (POST /api/…, `#hex`) deriva public-contract por contenido con source diff, y no hay salida honrada: record retract la rechaza con signal-confirmed-by-diff y la retirada con la respuesta del usuario de #416 solo cubre persistent-data (#423, E1.58)",
    "acceptance": "public-contract que solo deriva el contenido de una doc se retira con record retract --answer … --source user, atado a los hits <razón>: <línea> que vio el usuario, y contract-spec-and-test queda withdrawn; una línea de contrato añadida o cambiada después devuelve la señal; sin --answer se sigue rechazando con signal-confirmed-by-diff y su how ofrece la respuesta; si una ruta del diff ya deriva la señal, la respuesta se rechaza con retract-answer-refused; un test por caso"
  },
  "facts": {
    "basis": "El ítem E1.58 del roadmap, con el alcance que fijó el usuario el 2026-10-28 (opción 1 de la auditoría OSP-040), y REQ-idd-006 con la retirada con respuesta de #416 fijan cada comportamiento: qué señal se retira, a qué hits se ata la respuesta, qué la devuelve, cuándo se rechaza y qué fuentes valen"
  },
  "plan": {
    "paths": [
      "docs/roadmaps/harness-evolution.md",
      "openspec/specs/idd/spec.md",
      "scripts/lib/idd-contract.js",
      "scripts/lib/idd-record.js",
