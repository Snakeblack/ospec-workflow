  "intent": {
    "kind": "bug",
    "summary": "El fallo de inspección del lanzador nombra la salida o la señal del hijo, y no EPIPE, cuando el hijo sale sin leer todo el stdin",
    "acceptance": "Un hook que sale con un código distinto de 0 sin leer una entrada mayor que el buffer de la tubería responde con el fallo de inspección nombrando exit N, también tras el reintento con Node; con una señal nombra la señal"
  },
  "facts": {
    "open": [
      "Con EPIPE y una salida distinta de 0 (el hijo cae antes de leer todo el stdin, por ejemplo un hook Node que no carga), ¿el motivo nombra exit N, y con una señal nombra la señal?",
      "Con EPIPE y salida 0 (el hijo termina sin leer toda la entrada; ningún hook de ospec lo hace), ¿sigue siendo un fallo de inspección que falla cerrado con motivo EPIPE, o se acepta su salida?",
      "¿La regla del motivo entra en REQ-hooks-025, que rige todos los fallos de inspección, y el escenario de exit 3 con entrada grande de REQ-hooks-031 pasa a exigir que el motivo nombre exit 3?"
    ]
  },
  "plan": {
    "paths": [
      "openspec/specs/hooks/spec.md",
      "scripts/hooks/ospec-hooks-launch.js",
      "scripts/hooks/ospec-hooks-launch.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "Con EPIPE y una señal o una salida distinta de 0, el fallo de inspección nombra la señal o exit N: EPIPE solo dice que el hijo salió sin leer todo el stdin; vale también para el hijo Node del reintento",
      "EPIPE con salida 0 sigue siendo un fallo de inspección con motivo EPIPE, que falla cerrado: el hijo decidió sin leer la llamada entera (ADR 0008, REQ-hooks-025)",
      "La regla del motivo vive en childFailureDetail y en REQ-hooks-025, que rige todos los fallos de inspección; binaryDidNotStart sigue decidiendo solo el reintento"
    ]
  },
