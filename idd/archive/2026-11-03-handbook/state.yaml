                "acceptance_criteria": "The behavior for a resumed route is either (a) documented as an accepted limit in the handler and spec, with the user-facing text of the INCONCLUSIVE gate saying the check could not be compared because the session changed, or (b) narrowed: a `blocked` return happens before the agent writes, so the handler takes a fresh baseline and copy at each relaunch after a blocked return, and a resume mid-run (success pending) stays INCONCLUSIVE."
