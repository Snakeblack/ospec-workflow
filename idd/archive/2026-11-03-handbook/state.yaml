  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "continuamos con lo siguiente del handbook en la siguiente sesion",
    "kind": "feature",
    "summary": "Sustituir sdd-document por la skill handbook (dos modos como foundation): fuente en handbook/ con manifiesto handbook.json y web Starlight opcional",
    "acceptance": "La skill handbook se instala siempre y se invoca fuera de SDD; SDD delega en el agente handbook; openwiki/ pasa a handbook/; el orden, las etiquetas y la audiencia de los grupos de la web salen de handbook/handbook.json; sdd-document y /sdd-document desaparecen; node scripts/check.js en verde"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "(a) handbook.json: ¿lleva solo grupos (orden, etiqueta, audiencia) más idioma y web sí/no, dejando el orden de páginas en el frontmatter sidebar.order, o también el orden de páginas? (b) ¿El orquestador SDD delega en el agente handbook cuando se pide documentar, sin comando, o con un comando llamado /sdd-handbook? ¿Y hace falta un comando /handbook en los hosts sin skills invocables, o basta la skill como foundation?"
      },
      {
        "category": "uniqueness",
        "question": "Un directorio de handbook/ que el manifiesto no nombra: ¿se añade al final en orden alfabético con nombre humanizado y aviso, o el sync falla?"
      },
      {
        "category": "persistence",
        "question": "Estado de cada ejecución (gitHead, updatedAt, páginas): ¿fichero aparte generado handbook/.state.json, o dentro de handbook.json? Y un openwiki/ existente en otro repo: ¿se migra con git mv, convirtiendo section_labels y el orden del quickstart al manifiesto, tras preguntar una vez?"
      },
      {
        "category": "copy",
        "question": "Bloque de AGENTS.md/CLAUDE.md: ¿pasa de '## OpenWiki' a '## Handbook' y se sigue escribiendo por defecto?"
      },
      {
        "category": "url-state",
        "question": "¿Se mantienen la carpeta web-doc/ y las URL actuales de las páginas (sin redirects nuevos), renombrando solo el script a sync-handbook.mjs?"
      },
      {
        "category": "accessibility",
        "question": "audience: ¿se muestra en la web como badge de texto en cada grupo del sidebar, o solo orienta el tono de la skill sin aparecer en la web?"
      },
      {
        "category": "errors",
        "question": "handbook.json ausente o inválido: ¿el sync avisa y cae al orden alfabético sin romper el build (política actual), o falla el build?"
      }
    ]
  },
