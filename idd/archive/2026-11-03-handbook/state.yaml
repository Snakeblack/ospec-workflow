          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "skills/_shared/route-handbook.md:29-34 (spec openspec/specs/agents/spec.md:428-432). The post-run boundary is computed from `web` in handbook/handbook.json, a file the agent being checked has write access to (skills/handbook/SKILL.md:44-46,118). The old J5 fixed the approved dirs from the launch-time gate (skills/_shared/route-document.md:109-113, 'never by trusting the executor'). A run that sets web:true (or is steered by prompt injection from repo content) widens the boundary to web-doc/**, which holds executable build scripts (predev/prebuild in web-doc/package.json) and passes the check silently. Also, 'ignore paths already changed before the dispatch' (line 31-32) has no step that captures a pre-dispatch `git status --porcelain`, so it cannot be evaluated; pre-existing dirty files either trigger false halts or are not isolated.",
                "acceptance_criteria": "The route handler fixes the boundary before dispatch from a source the agent cannot change during the run (the approval-ledger entry gate: handbook-settings, or handbook.json read and recorded before launch), and a post-run change of `web` from false to true (or any difference from that recorded value) is reported as a boundary event. The handler also instructs capturing the `git status --porcelain` baseline before dispatch and comparing the post-run output against it."
              },
              {
                "severity": "WARNING",
                "summary": "skills/handbook/SKILL.md:48-58 vs :116-121. The openwiki migration orders the agent to `git mv openwiki handbook` and to delete openwiki/.last-update.json, which write (rename/delete) paths under openwiki/, outside the declared boundary (handbook/, web-doc/, AGENTS.md, CLAUDE.md). The same SKILL says a write outside the boundary stops the run, and skills/_shared/route-handbook.md:29-41 will list every `R openwiki/... -> handbook/...` and `D openwiki/...` entry from git status as outside the boundary. Result: either the legitimate migration halts, or every migration ends with the 'accepted risk' gate, which trains users to dismiss it and weakens the guarantee for real violations.",
                "acceptance_criteria": "The migration is covered by an explicit, approved boundary rule (for example, openwiki/ is inside the boundary only for a run whose handbook-settings approval accepted the migration, and only for rename/delete), in both skills/handbook/SKILL.md and skills/_shared/route-handbook.md; a migration run with only those changes does not trigger the outside-boundary gate, and a write to any other path outside the boundary still does."
              },
              {
                "severity": "WARNING",
                "summary": "skills/handbook/assets/web-doc-template/scripts/sync-handbook.mjs:79-85,290 (also copied to web-doc/scripts/sync-handbook.mjs). `git remote get-url origin` is returned unchanged except for the .git suffix, and then written as `${originUrl}/blob/${branch}${target}` into the generated pages. If origin carries credentials (`https://user:TOKEN@host/org/repo.git`, typical of some CI checkouts and token clones), the token is embedded in every rewritten link of the published site, in src/content/docs and in the built dist. The old sync-openwiki.mjs:63,273 does the same, but this file is new and ships to user repos.",
                "acceptance_criteria": "With an origin such as https://user:secret@github.com/o/r.git, no generated page or sidebar file contains `user` or `secret`; the rewritten links start with https://github.com/o/r/blob/<branch>/. A test in scripts/sync-handbook.test.js covers this case."
              },
              {
                "severity": "SUGGESTION",
                "summary": "skills/handbook/SKILL.md:100,169-170. In update mode the agent runs `git diff --name-only <gitHead>..HEAD` with `gitHead` read from handbook/.state.json, a committed file any contributor can edit (the agent has the `execute` tool, agents/handbook.agent.md:4). Nothing says to validate it. A value like `--output=<path>` makes git write the diff to an arbitrary file, and a shell metacharacter can alter the command if it is interpolated. Exposure depends on how the agent builds the command, but the instruction should not leave this to chance.",
                "acceptance_criteria": "SKILL.md requires that `gitHead` match ^[0-9a-f]{7,40}$ and resolve with `git cat-file -e <hash>^{commit}` before it is used in a command; otherwise the run treats the state as an init (as the .state.json recovery rule at lines 112-114 already allows)."
              },
              {
                "severity": "SUGGESTION",
                "summary": "skills/handbook/SKILL.md:24-26,121-123 (compare skills/sdd-document/SKILL.md:3-11 'delegate_only'). The skill is now loadable directly in every install, with write+execute capability (lines 8-12), and in Direct mode the only boundary check is the agent's own ('your own check does not replace it', but there is no other in that mode). The old skill ran only under the orchestrator's J5 check. The Direct-mode write guarantee therefore depends on the agent's self-report and the user reading the diff.",
                "acceptance_criteria": "SKILL.md states what covers the boundary in Direct mode (for example the final step requires `git status --porcelain` before and after the run, listing every path outside the boundary in the user report), or the handbook documents that Direct mode is user-reviewed only."
              }
            ]
          },
