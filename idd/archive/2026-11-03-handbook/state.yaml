                "severity": "WARNING",
                "summary": "skills/_shared/route-handbook.md:51-56 (spec openspec/specs/agents/spec.md:437-439). The fix for the earlier 'agent widens its own boundary' finding stores the trusted values (gates.handbook-boundary.web, baseline, and the handbook-settings approvals) in the route state.yaml, and the check then ignores 'the route's own state.yaml, which only you write'. The agent has write and execute tools and nothing forbids it from editing that file; because the path is excluded from the comparison and the check reads `web` back from it (lines 44-46), an agent that sets `web: true` there (or adds baseline lines or a migration approval) widens the boundary silently. This moves the earlier weakness into the file the check exempts.",
                "acceptance_criteria": "A change to the route state.yaml made during the dispatch cannot widen the boundary: the orchestrator verifies, after the run, that gates.handbook-boundary and the approvals entries still hold the values it wrote (for example by comparing them with the values it kept from before the dispatch, or by checking the diff of that file only touches entries the orchestrator wrote), and treats any difference as a path outside the boundary. Exempting state.yaml from the path comparison no longer exempts those fields."
              },
              {
                "severity": "SUGGESTION",
                "summary": "skills/_shared/route-handbook.md:51-54. A baseline match is by identical `git status --porcelain` line. A file the user had already modified (` M src/app.js`) keeps the same status line if the run edits it further, so a write by the agent to an already-dirty file outside the boundary is not reported. The old design had the same blind spot, but a developer's tree is often dirty and those are the files most at risk.",
                "acceptance_criteria": "For baseline lines whose path is outside the boundary, the route records a content fingerprint before dispatch (for example `git hash-object` of the file or a hash of `git diff` for the path) and compares it after the run; a changed fingerprint counts as a path outside the boundary. Alternatively, the handler documents this limit explicitly as accepted."
              }
            ]
