            "findings": [
              {
                "severity": "WARNING",
                "summary": "skills/_shared/route-handbook.md:14-17,28-32,40-41 (spec openspec/specs/agents/spec.md:426-432). To fix resumed routes, the handler now takes a fresh `gates.handbook-boundary` record (baseline, hashes, `web`, state.yaml hash) before every relaunch, justified by 'a blocked return comes before the agent writes anything'. Nothing checks that. A blocked return carries no write guarantee: the agent has write+execute tools, and skills/handbook/SKILL.md:123-124 itself ends a run that wrote outside the boundary with a report, not necessarily a success. A run that writes outside the boundary (or sets `web: true` in handbook.json, or edits state.yaml) and then returns `blocked` has those writes absorbed into the next baseline, and the next `web` is read from handbook.json, which the agent could write. §2 only runs after `success`, so the check never sees them.",
                "acceptance_criteria": "On every `blocked` return, before it records the fresh baseline, the orchestrator applies the same comparison as §2 steps 1-2 against the previous record (state.yaml hash, status lines/hashes, handbook.json `web` versus its copy); any difference halts with the two-option `question_gate`. After a blocked return the new `web` comes from the user's settings answer or the previous record, never from handbook.json when the agent could have written it. Alternatively the route handler states that a blocked return must not change anything and the comparison proves it."
              }
            ]
          },
