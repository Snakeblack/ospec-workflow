                "summary": "skills/_shared/route-handbook.md:49-54,62-63 (spec openspec/specs/agents/spec.md:430-433,441-442). Step 1 compares only `gates.handbook-boundary` and the `handbook-settings` approvals with the orchestrator's copies; once they match, the whole route state.yaml is exempt from the path check. The agent has write tools, so it can still edit any other part of that file undetected: add or alter approvals for other gates (the Always-true rule says approvals come only from an explicit user answer), flip other gates or phase status, or change `content-qa` before the orchestrator writes it. The earlier tamper path is closed for `web`, baseline and the settings approvals only.",
