{
  "schema": "idd-state/v1",
  "change": "progress-snapshot-v3",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "Encargo S2d, reenviado por otra sesión y aceptado por el usuario como E5.12: `ospec snapshot --schema-version 3` emite el v2 tal cual, más `phases[].release`, opcional y solo en fases `done`: `{\"stage\":\"testing\"}` o `{\"stage\":\"production\",\"version\":\"x.y.z\",\"date\":\"YYYY-MM-DD\"}`; en `production`, la versión es semver x.y.z sin pre-release ni build, de como mucho 64 caracteres, y la fecha es obligatoria. Origen: el CHANGELOG de `delivery.changelog` (idd/config.yaml) de la rama leída; para cada cambio archivado de una fase `done` se busca el elemento de lista que termina en `(<change-id>)`, como lo escribe `ospec close`, que puede ocupar varias líneas sangradas. Una entrada bajo `## [Unreleased]` o bajo una versión pre-release da `testing`; bajo `## [x.y.z] - YYYY-MM-DD` da `production` con esa versión y fecha. Con varios cambios en la fase manda el menos avanzado, y en `production` la versión mayor con su fecha. Un cambio sin entrada no cuenta; una fase `done` sin entradas sale sin `release`, y las fases que no son `done` nunca la llevan. Errores: código 1 con fichero y línea, sin escribir nada, si una entrada aparece bajo dos encabezados, o si un encabezado x.y.z no tiene fecha o la fecha no existe. Sin CHANGELOG, las fases `done` salen sin `release` y sin error. El v1 y el v2 no cambian. Documentación agnóstica, que no nombra al consumidor, y solo bajo demanda. La doc dice que el snapshot solo ve producción cuando el encabezado de la versión llega a la rama que lee. El esquema v3 dice lo mismo que el del consumidor.",
    "kind": "feature",
    "summary": "ospec snapshot --schema-version 3 emite el snapshot de avance v3: el v2 tal cual más la etapa de entrega de cada fase done (en pruebas, o en producción con su versión y su fecha), sacada de las entradas (<change-id>) del changelog que declara delivery.changelog; el v1 y el v2 no cambian",
    "acceptance": "Con --schema-version 3, ospec snapshot emite un JSON que cumple schemas/progress-snapshot/v3.schema.json y las reglas del v2, con release solo en fases done: testing si alguna entrada de sus cambios archivados está bajo [Unreleased] o una pre-release, production con la versión mayor y su fecha si todas están bajo x.y.z con fecha, y sin release si no hay entradas o no hay changelog; una entrada bajo dos encabezados o un encabezado x.y.z sin fecha o con una fecha inexistente termina con código 1, el fichero y la línea, sin escribir nada; el v1 y el v2 salen igual; la documentación es agnóstica, dice que producción solo se ve cuando el encabezado de la versión llega a la rama que lee, y ningún flujo, hook, check ni gate lo ejecuta"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué changelog lee el v3 y qué cambios cuentan? Recomendado: solo el que declara delivery.changelog en idd/config.yaml, como ospec close; sin declararlo, con none o si el fichero no existe, las fases done salen sin release y sin error; sin opción nueva --changelog (alternativa: --changelog <ruta>, solo con el v3, como --roadmap). Cuentan los cambios archivados de la fase en idd/archive y también en openspec/changes/archive, los mismos que ya dan su estado done."
      },
      {
        "category": "uniqueness",
        "question": "¿Cómo se reconocen entradas y encabezados? Recomendado: una entrada es un elemento -, * o + en la primera columna, fuera de bloques de código, con sus líneas sangradas unidas, cuyo texto acaba exactamente en (<change-id>), con solo espacios detrás (ni punto ni varios ids); el id se compara exacto. Encabezados: ## [Unreleased] sin distinguir mayúsculas, y ## [x.y.z] - YYYY-MM-DD o ## [x.y.z-pre] - YYYY-MM-DD, con corchetes y v opcionales, como ya los lee la propuesta de release de close. La versión mayor se elige por precedencia semver, y la misma entrada repetida bajo un mismo encabezado cuenta una vez."
      },
      {
        "category": "persistence",
        "question": "¿Qué pasa con lo que no se puede leer? Recomendado: un idd/config.yaml ilegible termina el v3 con código 1 y su error de configuración (el v1 y el v2 siguen sin leerlo); un changelog declarado que es un directorio cuenta como ausente; BOM y CRLF se aceptan. Alternativa: ignorar la configuración ilegible y emitir sin release."
      },
      {
        "category": "copy",
        "question": "¿Qué informa --out en el v3? Recomendado: lo del v2 con schema_version 3 y además changelog (la ruta leída, o null sin changelog), y en texto «snapshot v3: N phases from <roadmap>, <progress> and <changelog> written to <out>»; los mensajes en inglés, como el resto del CLI."
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "request",
          "text": "emite el v2 tal cual"
        }
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
          "path": "scripts/ospec.js",
          "line": 1377
        }
      },
      {
        "category": "errors",
        "question": "¿Qué se valida y con qué código? Recomendado: changelog-invalid, código 1, fichero:línea del primer problema y sin escribir nada. Solo se valida lo que decide una etapa, las entradas de cambios archivados de fases done y sus encabezados, para que la historia antigua con otro formato no rompa el snapshot (alternativa: validar todos los ## del fichero). Son error: la misma entrada bajo dos encabezados distintos; un encabezado x.y.z sin fecha, con fecha inexistente, con ceros a la izquierda, con +build o marcado [YANKED]; una pre-release con fecha inexistente; y una entrada que cuenta bajo un ## que no es versión ni Unreleased, o antes del primer ##."
      }
    ]
  },
