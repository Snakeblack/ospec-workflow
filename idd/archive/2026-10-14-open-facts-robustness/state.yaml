  "gates": [
    {
      "id": "open-facts",
      "status": "resolved",
      "answer": "Las siete categorías se exigen en toda feature que añade código, sin depender del stack. Una categoría se cierra sin preguntar solo con una ruta:línea que existe en el árbol o con un fragmento literal de la petición del usuario; el resto se rechaza. Los supuestos solo se muestran en la salida de ospec close y no bloquean. Cualquier código de producto añadido o modificado que no sea test, documentación o manifiesto exige tests, y cero tests no es evidencia. localStorage, IndexedDB y escrituras a disco activan persistent-data; un contrato de selectores o de API en documentación activa public-contract; se pueden retractar, y un fixture comprueba que una mención en un comentario no dispara. El escenario reservado lo escribe y congela otra sesión; esta solo registra el digest y no lee los hechos ocultos.",
      "source": "user"
    }
  ],
