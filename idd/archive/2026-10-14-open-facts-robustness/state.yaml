{
  "schema": "idd-state/v1",
  "change": "open-facts-robustness",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "El gate open-facts, la evidencia de tests y las señales de persistencia y contrato dejan de depender de que el modelo detecte los huecos.",
    "acceptance": "Con tres repeticiones y el desglose por tipo de check, idd-agy-4 frente a gentle-ai-agy-4 deja en todo-spa una media de escapados de IDD de 2 o menos, y en el escenario reservado menos escapados que gentle-ai, sin perder acceptance ni regression ni bajar la calidad. Repetir los seis escenarios con Claude frente a idd-4 no aumenta los mensajes con preguntas en más de uno por escenario ni los tokens en más de un 20 %."
  },
  "facts": {
    "open": [
      "¿Las siete categorías (entradas y límites, unicidad y normalización, persistencia y datos corruptos, textos visibles, estado en la URL, accesibilidad y errores) se exigen en toda feature que añade código, sea cual sea el stack?",
      "¿Qué cita cierra una categoría sin preguntar: una ruta:línea que existe en el árbol, un fragmento literal de la petición del usuario, o basta con que el texto tenga forma de cita?",
      "¿Los supuestos que el agente declara solo se muestran en la salida de ospec close, o bloquean el cierre hasta que el usuario los acepte?",
      "¿Qué diff de una feature o un bug exige tests: cualquier código de producto añadido o modificado que no sea test, documentación o manifiesto, o solo a partir de un número de líneas?",
      "¿Qué texto del diff activa persistent-data y public-contract, y hace falta un fixture que demuestre que una mención en un comentario no dispara la señal?",
      "¿Quién escribe y congela el escenario reservado antes de tocar el CLI, para que quien ajuste IDD no consulte sus hechos ocultos?"
    ]
  },
