  "changelog_line": "**El guard de ospec bloquea y pregunta en GitHub Copilot CLI** (copilot-pretooluse-guard). ospec registraba el guard como `preToolUse`, y Copilot manda ese evento con `toolName` y `toolArgs`, que el guard no lee: cualquier orden pasaba, también un `git push --force` o un `git reset --hard`, en interactivo y sin interfaz. Ahora lo registra con el nombre de Claude Code, `PreToolUse`, para el que Copilot manda `tool_name` y `tool_input`: una orden de las reglas `deny` se bloquea, una de las `ask` pregunta, o sin usuario se deniega, y el resto corre sin preguntar; verificado en vivo con Copilot 1.0.116. Hay que reinstalar ospec en Copilot (`npm run setup:copilot`).",
  "closed_at": "2026-11-27T18:26:39.388Z"
