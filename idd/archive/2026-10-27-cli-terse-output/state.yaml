{
  "schema": "idd-state/v1",
  "change": "cli-terse-output",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "continua",
    "kind": "feature",
    "summary": "El CLI ahorra tokens al abrir y al cerrar: el next de un cambio nuevo imprime la plantilla de categorías según el perfil del proyecto, el CLI escribe Plan y Decisions del living-doc desde --path y --decision \"<texto>\", y cada orden que escribe imprime una línea de estado y otra de next, con --json sin campos vacíos",
    "acceptance": "Los rechazos de record intent reproducidos de idd-7 reciben la plantilla antes de fallar, y los de url-state y accessibility en proyectos sin UI dejan de fallar; un cambio con decisión cierra sin editar change.md a mano; los techos de bytes de las salidas quedan fijados en tests"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Cómo decide el CLI que un proyecto no recibe url-state ni accessibility? Recomendado: ningún fichero de UI versionado (.html, .htm, .css, .scss, .sass, .less, .jsx, .tsx, .vue, .svelte, .astro) en un proyecto que ya tiene código; sin código (greenfield) recibe las 7, un --path de UI en el plan del record intent las devuelve, y si se cubren igualmente se aceptan. Alternativas: el profile del knowledge map, o una clave nueva en idd/config.yaml."
      },
      {
        "category": "uniqueness",
        "question": "¿Un mismo texto de --decision declarado dos veces, en la misma llamada o en otra, se guarda una sola vez, comparando el texto exacto tras recortar los espacios de los extremos y en el orden en que se declaró? Recomendado: sí."
      },
      {
        "category": "persistence",
        "question": "¿El CLI escribe Plan y Decisions de change.md entre marcadores propios, como Evidence, regenerados desde state.yaml en cada declaración y sin tocar el texto escrito a mano fuera de ellos, y guarda los textos de --decision en plan.decisions de state.yaml? Y un change de varias unidades sin decisión: ¿close deja de exigir Decisions no vacía? Recomendado: sí a las dos; los estados con decision: true siguen valiendo y su Decisions se escribe a mano como hasta ahora."
      },
      {
        "category": "copy",
        "question": "Salida en texto de las órdenes que escriben (record, signals, run, check, review, close): ¿una línea de estado y otra de next con el comando literal, más solo lo que ese paso necesita (preguntas del gate, cola de un check o run que falla, avisos, sugerencias, petición de review y, en close, registros y release), y salen team, delivery con sus reglas, refs y la lista pending, que siguen en ospec next? Recomendado: sí."
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "docs/product/brief.md",
          "line": 10
        }
      },
      {
        "category": "accessibility",
        "question": "Con --json, la salida que leen los agentes: ¿se omiten null, [] y {} en todos los niveles, conservando false y 0, y el next anidado de las órdenes que escriben deja de repetir el intent, que sigue en ospec next --json? Recomendado: sí a las dos; team y delivery se quedan."
      },
      {
        "category": "errors",
        "question": "--decision sin texto, la forma de hoy: ¿error de uso (exit 2) que pide --decision \"<texto>\", o se sigue aceptando y entonces Decisions se escribe a mano? Recomendado: error de uso; --decision pasa a llevar texto y se puede repetir."
      }
    ]
  },
