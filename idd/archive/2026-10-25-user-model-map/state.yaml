  "intent": {
    "request": "merge y release luegobpasamos con lo siguiente del roadmap",
    "kind": "feature",
    "summary": "E4.12: ospec deja de mantener nombres de modelo. Los tiers cheap/default/premium siguen siendo la única etiqueta de las reglas; Claude usa solo alias (haiku, sonnet, opus); en Codex, Copilot/VS Code, OpenCode y Cursor el usuario asigna sus modelos a cada tier y la asignación se guarda; un tier sin asignar hace que el agente herede el modelo de la sesión",
    "acceptance": "Una instalación nueva en Codex, OpenCode y Cursor no escribe ningún nombre de modelo que no haya elegido el usuario, en Claude usa solo alias, y un tier sin asignar degrada a heredar sin error (también en Cursor, cuyo model es opcional con inherit por defecto). Un test lo comprueba por host"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué asigna el usuario y cuándo: un modelo por tier y host (cheap/default/premium) en el instalador (TUI y modo no interactivo), en el primer uso que lo necesite (E4.13), o en los dos? ¿Se mantiene además la elección por agente que hoy ofrece el TUI, y en Codex el reasoning effort por tier?"
      },
      {
        "category": "uniqueness",
        "question": "¿El nombre se guarda tal cual lo escribe el usuario, sin validarlo contra un catálogo? ¿El catálogo de models.yaml desaparece o queda como sugerencia con la fecha en que se comprobó? ¿Entra fable como alias de algún tier en Claude?"
      },
      {
        "category": "persistence",
        "question": "¿Dónde vive la asignación: configuración global del usuario (p. ej. ~/.config/ospec/models.yaml, para todos sus proyectos) o idd/config.yaml de cada proyecto? ¿Y qué pasa con las instalaciones que ya tienen modelos fijados al reinstalar: se migran como asignación del usuario, pasan a heredar, o se avisa?"
      },
