      "answer": "1) Por tier, al instalar: un modelo por tier y host en el TUI y con flag no interactivo; desaparece la elección por agente; en Codex el reasoning effort por tier se queda en ospec; el primer uso queda para E4.13. 2) Texto libre, sin catálogo: el nombre se guarda tal cual, sin validar; el catálogo de models.yaml desaparece; en Claude los tiers usan haiku/sonnet/opus por defecto y el usuario puede cambiar cualquiera a otro alias (fable incluido). 3) Global, corrupta = heredar: ~/.config/ospec/models.yaml (o %APPDATA%\\ospec en Windows); un fichero corrupto o con tier/host desconocido se ignora con aviso visible y el agente hereda. 4) Heredar y avisar: los nombres que escribió ospec no se migran; los agentes pasan a heredar y el instalador avisa de qué tiers puede asignar.",
