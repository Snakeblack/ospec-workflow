  "intent": {
    "kind": "bug",
    "summary": "E1.45 (B5): el CLI se invoca con una sola palabra en los 7 targets (shim bin/ospec y bin/ospec.cmd junto al runtime, que la skill nombra por su ruta absoluta), cada next_step trae su command literal (con el comando real del último rojo en lugar de <test>), un error de uso imprime solo la línea de su subcomando y cada rechazo dice cómo salir (how) o lleva la marca by-design",
    "acceptance": "En los siete builds la skill nombra una ruta de una sola palabra que existe y se ejecuta en bash, zsh, fish, PowerShell y cmd, también con una ruta con espacios; cada next_step tiene command; un error de uso imprime solo la línea del subcomando; y el test que recorre los rechazos pasa sin baseline"
  },
  "facts": {
    "open": [
      "¿Todo E1.45 va en un solo cambio (shim, command, uso y rechazos) o se parte?",
      "En Windows, ¿qué shim nombra la skill de cada target: bin/ospec.cmd, que el instalador renderiza en win32, o siempre bin/ospec?",
      "¿La skill nombra la ruta del shim sin comillas (una sola palabra, se rompe con espacios) o entre comillas (aguanta espacios, pero PowerShell necesita &)?",
      "¿next_step.command empieza por la palabra ospec que define la skill o por la ruta absoluta del shim?",
      "¿Cómo se cita en command el comando del último rojo cuando lleva comillas, $, backticks o barras invertidas?",
      "¿Qué command llevan las acciones none (cambio cerrado), configure-checks, open-change y choose-change?",
      "Con un error de uso, ¿qué se imprime si el subcomando es desconocido, y la línea de uso viaja también en --json?",
      "¿Dónde vive el how de cada rechazo (en cada sitio que lanza, o en una tabla por código con override por sitio) y qué rechazos pueden llevar by-design?",
      "¿Un shell que falta en la máquina (zsh o fish en el ubuntu de CI) se salta con aviso o se instala en CI?",
      "¿La skill foundation y las llamadas de SDD (node <pluginInstallRoot>/scripts/ospec.js team) pasan también al shim?",
      "¿ospec doctor da error si falta el shim o no es ejecutable?"
    ]
  },
