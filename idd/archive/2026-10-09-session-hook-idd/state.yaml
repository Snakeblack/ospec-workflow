          "owner": "trust",
          "severity": "WARNING",
          "summary": "idd-session.js:40 calls validateState without a try/catch. A parseable state.yaml whose arrays hold null elements (e.g. \"gates\":[null] or \"runs\":[null]) makes validateState throw a TypeError (idd-contract.js:370/:183). That rejects readIddSession, which stop.js:153 and pre-compact.js:528 await before any write. Neither latest.md nor any SDD or IDD session-summary.md is written; the hook only returns a systemMessage. This is the same failure class as the predecessor finding (§4.7: a malformed state MUST be skipped so the SDD trace is still written), reached through malformed content instead of EISDIR. The Go port skips such states, so Node and Go diverge.",
          "acceptance_criteria": "With an active SDD change and an extra idd/<id>/state.yaml that is valid JSON but has a null element in gates, signals, obligations, evidence or runs, Node Stop still writes .ospec/session/latest.md naming the SDD change, and Node PreCompact still writes that change's session-summary.md, both without a systemMessage. The malformed IDD change is absent from both files. Go produces the same result for the same workspace, and a test in idd-session.test.js (and/or the Go golden test) covers this case.",
          "blocking": false,
          "resolution": "advisory"
        },
        {
          "id": "F-7215c4949b0ed452",
          "owner": "trust",
          "severity": "SUGGESTION",
          "summary": "iddsession.go:154-170 (readOpenState) checks only schema, mode, change, status and intent presence, not the full idd-state/v1 validation that the Node port applies at idd-session.js:40 and spec §4.7 requires. An open state with an uncatalogued obligation or gate id is accepted by Go and rendered verbatim by DescribeStep (:282-286, :288-289) into latest.md's next recommended action (stop.go writeLatestWithIdd) and into session-summary.md. Node skips the same state as invalid. Impact: Node/Go byte divergence, and in Go only, attacker-chosen text in the next-step line, a line that is otherwise fully constrained.",
          "acceptance_criteria": "Take a workspace whose only idd/<id>/state.yaml is open but invalid under validateState (e.g. a pending obligation or open gate with an id outside the catalog, or an obligation with an unknown status). Go Stop and PreCompact then write exactly the bytes Node writes for that workspace, with the invalid change absent from latest.md and with no .ospec/session/<id>/session-summary.md. A Go or golden test covers the case.",
          "blocking": false,
          "resolution": "advisory"
        }
      ],
