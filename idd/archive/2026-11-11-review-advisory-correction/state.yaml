        "question": "¿Qué avisos cubre la corrección de una revisión aprobada? (A) Los que el agente declare con --finding, por defecto todos, y pasa solo si el validador da por resueltos todos los declarados y no detecta regresión. (B) Siempre todos los avisos de la revisión. (C) Basta con que no haya regresión, sin mirar si los avisos quedan resueltos."
