  "changelog_line": "**`ospec auto` en Codex** (auto-host-codex, E1.110, tramo 3). `ospec auto start --host codex` conduce `codex exec --json --approve-for-me`, verificado en vivo con una cuenta gratuita de ChatGPT: delega `open-facts`, reanuda la sesión con `codex exec resume` y cierra el cambio con su commit. Codex da los tokens de cada turno y ningún coste, así que admite `--max-tokens`. `codex exec` solo ejecuta los hooks aprobados en `/hooks`, así que el conductor cuenta cada fin de turno y la respuesta delegada funciona aunque los hooks de ospec estén sin aprobar; aprobarlos una vez hace que corran también sus guards. El motivo de un turno fallido lleva el mensaje del API, sin los registros que Codex escribe en stderr. REQ-idd-031 lo fija.",
  "closed_at": "2026-11-26T20:39:52.877Z"
