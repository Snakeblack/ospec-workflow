{
  "schema": "idd-state/v1",
  "change": "opencode-plugin-v2-live-bridge",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "El shim opencode emitido no ejecuta el bridge en la instalación real: llama al binario sin plugin_root y sin el cwd de la sesión, así que session-start falla (no SKILL.md files found en la raíz de skills) y el guard de git queda fail-open; continuación del cambio E1.25 opencode-plugin-v2-api.",
    "acceptance": "En la instalación global real de OpenCode v2, session-start regenera el registro de skills desde la raíz del bundle (plugin_root) con el cwd de la sesión, y pre-tool-use aplica deny/ask con el estado real del repositorio; el generador emite plugin_root y el cwd de sesión y el validador los exige, con tests que fallan sin el arreglo."
  },
  "facts": {
    "basis": "Reutiliza las respuestas del gate open-facts de E1.25 (forma dual, id ospec) ya verificadas en vivo; el arreglo vive en el generador y su validador y no introduce preguntas de comportamiento nuevas."
  },
  "plan": {
