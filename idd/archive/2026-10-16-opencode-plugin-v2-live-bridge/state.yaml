      "reason": "El cambio modifica el generador del shim opencode que implementa la política deny/ask de pre-tool-use (frontera de seguridad del bridge): la verificación en vivo demostró que un shim roto deja el guard fail-open.",
      "source": "declaration"
    }
  ],
  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "El arreglo se emite solo desde la fuente canónica del target opencode (scripts/lib/target-profiles/opencode-plugin.js): el golden se regenera y el artefacto se reinstala, sin editar árboles generados a mano; el contrato plugin_root/cwd lo hace cumplir el validador."
    },
    {
      "kind": "adr",
      "id": "0010",
      "impact": "conforms",
      "reason": "El shim arreglado sigue usando solo la biblioteca estándar de Node (child_process, fs, url, path) y el binario del layout gestionado; no añade dependencias ni descargas al instalar."
    },
    {
      "kind": "scenario",
      "id": "offline-operation",
      "impact": "conforms",
      "reason": "La generación, la validación y el puente en vivo corren sin red: el shim llama por spawnSync al binario local y los tests corren con node --test; nada consulta la red."
    },
    {
      "kind": "scenario",
      "id": "target-parity",
      "impact": "conforms",
      "reason": "El arreglo restaura en OpenCode la paridad del bridge de los demás targets (session-start y pre-tool-use) y el validador exige el contrato emitido para que la degradación no pase por omisión."
    }
  ],
