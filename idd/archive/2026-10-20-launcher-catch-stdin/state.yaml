{
  "schema": "idd-state/v1",
  "change": "launcher-catch-stdin",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Si launch() lanza una excepción, el catch de main() decide el host sin stdin y no le pasa el stdin a launcherFailure: un CURSOR_* heredado da el formato de Cursor a Claude Code y el PostToolUse no censura (follow-up de OSP-031, F-b68390e985c50014)",
    "acceptance": "Cuando launch() lanza tras leer el stdin, con CURSOR_AGENT heredado y un payload de Claude, pre-tool-use emite hookSpecificOutput.permissionDecision ask y post-tool-use emite updatedToolOutput censurado; un payload de Cursor sigue recibiendo el formato de Cursor"
  },
  "facts": {
    "basis": "El hallazgo de la revisión trust fija el criterio y launcherFailure ya implementa la salida correcta cuando recibe el host y el stdin: basta con que main() le pase el stdin que launch() ya leyó"
  },
