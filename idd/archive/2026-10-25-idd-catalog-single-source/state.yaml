{
  "schema": "idd-state/v1",
  "change": "idd-catalog-single-source",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "E1.42: los hooks Go leen el catálogo IDD (señales, obligaciones, evidencias, gates, orden de trabajo y how) de un JSON que emite el CLI y embeben, en vez de listas propias; Stop y PreCompact ya no descartan un cambio con untested-product, boundary-tests o review-limit",
    "acceptance": "Un cambio con untested-product y review-limit abierto, otro con boundary-tests pendiente y otro con adr-impact-declaration pendiente dan en Stop y PreCompact el mismo paso en Go y en JS, fijado por el golden de internal/testdata/idd-session; añadir una señal, obligación o gate en JS sin regenerar internal/iddsession/catalog.json rompe un test; Go deja de mantener sus propias listas del catálogo"
  },
  "facts": {
    "basis": "El paso lo fija la spec de hooks §4.7: el que da ospec next (nextForChange), y lo que no esté en el catálogo de idd-state/v1 se sigue descartando. El mecanismo lo fijan E1.42 del roadmap y la opción (b) de B1 en la auditoría del 2026-10-25: un JSON único que emite el CLI y Go embebe, como internal/rules/rules.json, con un test que falla si no está al día."
  },
