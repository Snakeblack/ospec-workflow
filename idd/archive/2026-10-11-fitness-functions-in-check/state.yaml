{
  "schema": "idd-state/v1",
  "change": "fitness-functions-in-check",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "E3.3: los ADR y los escenarios de calidad declaran comprobaciones ejecutables (fitness functions) que ospec check ejecuta como evidencia; las no ejecutables quedan como checklist con evidencia manual",
    "acceptance": "Un cambio que toca un componente gobernado por un ADR cuya fitness function ejecutable falla no puede cerrarse, y el motivo de ospec check y de ospec close cita el id del ADR"
  },
  "facts": {
    "open": [
      "Forma de la comprobación ejecutable: orden de shell arbitraria con veredicto por código de salida, o regla de dependencias integrada que el CLI evalúa leyendo imports",
      "Sintaxis de la declaración en el ADR dentro de la sección Fitness function",
      "Dónde declaran los escenarios de calidad su comprobación: knowledge-map v2, campo aditivo en v1, o heredada de los ADR que los citan como driver",
      "Qué fitness functions corre un cambio: solo las de sus referencias en impacts o todas las de todos los ADR; y si se exime un ADR que el cambio amends/supersedes/contradicts con el gate resuelto",
      "Desde qué versión se lee la comprobación: la base del cambio (no puede debilitarla) o el árbol de trabajo",
      "Qué obligación lleva el veredicto: adr-impact-declaration ampliada, una obligación nueva, o checks-pass",
      "Comprobaciones no ejecutables: checklist que bloquea el cierre (confirmado por el agente o por el usuario) o checklist visible que no bloquea",
      "Dogfooding: convertir ya las fitness functions de los ADR de ospec a comprobaciones ejecutables y añadir una regla de frontera real, o solo el mecanismo con fixtures"
    ]
  },
