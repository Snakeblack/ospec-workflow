  "intent": {
    "request": "continua",
    "requested_at": "2026-11-26T16:17:27.563Z",
    "kind": "feature",
    "summary": "Elección del modo de ejecución (E1.109): con una cola de dos o más ítems pendientes en el roadmap, ospec next sin cambio abierto y ospec close devuelven un bloque execution_mode que ofrece interactivo (por defecto) o automático con la orden de ospec auto start, y las skills idd y foundation lo preguntan",
    "acceptance": "Con un docs/roadmap.md de varias fases pendientes, ospec next sin cambio y ospec close devuelven execution_mode con la cola y la orden ospec auto start; con menos de dos pendientes, sin roadmap reconocido, con un cambio abierto, con mode: sdd o con una ejecución de ospec auto activa no lo devuelven; un roadmap inválido da un aviso sin romper next ni close; y las skills idd y foundation preguntan interactivo o automático y tratan una respuesta vacía como interactivo"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿De dónde sale la cola y cuándo hay una? Propuesta: de docs/roadmap.md (el que escribe foundation y lee por defecto ospec snapshot), con el mismo lector: filas `<ID>. <título>` y estado por el nombre de los cambios; cuentan solo las fases pending, en su orden; hay cola con 2 o más, y la opción automática lleva las 20 primeras (el tope de ospec auto). Sin ese fichero, con uno que el lector no reconoce (como docs/roadmaps/harness-evolution.md de este repositorio) o con menos de 2 pendientes, no hay pregunta y todo queda como hoy; uno inválido da un aviso con fichero y línea, sin pregunta, y ni next ni close fallan por él."
      },
      {
        "category": "uniqueness",
        "question": "¿Cuándo aparece la pregunta y cómo se nombra cada ítem? Propuesta: la devuelven ospec next sin cambio abierto (la skill lo llama al empezar a trabajar el roadmap, nunca en un cambio suelto) y ospec close (con la fase recién cerrada ya contada como hecha); foundation escribe sus hitos como tabla de fases `<ID>. <título>` y, tras su commit, hace la misma pregunta con ospec next. No aparece con un cambio abierto, con mode: sdd ni mientras haya una ejecución de ospec auto activa (running, blocked o paused), que es el caso de toda sesión del conductor. Cada ítem de la orden es `Roadmap item <ID> of docs/roadmap.md: <título>` y pide nombrar el cambio `<clave>-<slug>` (la clave es el id sin puntos y en minúsculas) para que el roadmap lo cuente hecho."
      },
      {
        "category": "persistence",
        "question": "¿Qué se guarda? Propuesta: nada nuevo. La elección no se recuerda (decisión del 2026-11-24); next y close solo leen el roadmap y .ospec/auto/ (una ejecución ilegible se ignora, como ya hace ospec auto); la ejecución queda en su run.json de E1.108; y REQ-idd-026 se enmienda para decir que next y close leen el roadmap con ese lector sin emitir ningún snapshot."
      },
      {
        "category": "copy",
        "question": "¿Qué dicen el CLI y la pregunta? Propuesta: el CLI añade el bloque execution_mode al JSON y, en texto, `queue: <n> pending items in docs/roadmap.md: <ID> <título>, …`, `mode: ask the user: interactive (default) or automatic` y `automatic: ospec auto start --item \"…\" …`. La sesión pregunta en el idioma del usuario, por ejemplo: «Quedan N ítems en el roadmap. ¿Interactivo (por defecto: el siguiente en una sesión nueva, como hoy) o automático (los N en orden, una sesión sin interfaz por cambio, 30 turnos por ítem y 25 USD en total, un commit por cambio en esta rama o en una nueva si estás en la por defecto, sin push)?». La respuesta puede acotar los ítems o cambiar los topes."
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "docs/roadmaps/harness-evolution.md",
          "line": 1822
        }
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
          "path": "docs/roadmaps/harness-evolution.md",
          "line": 1823
        }
      },
      {
        "category": "errors",
        "question": "¿Qué pasa con cada respuesta y cada final? Propuesta: una respuesta vacía, saltada o que no elige es interactivo y nada arranca. Al elegir automático: en close la pregunta va tras la entrega que pida el usuario, porque la ejecución exige árbol limpio; en la rama por defecto la sesión crea antes `<tipo>/<nombre>`; en Claude Code lanza ospec auto start en segundo plano y, al terminar, resume con una línea por cambio cerrado; ante un bloqueo traslada sus preguntas al usuario y lleva su respuesta con ospec auto resume --answer, que la sesión del conductor registra como user; un fallo (checks en rojo, topes, sin progreso) se cuenta con su motivo y la orden para seguir; en los demás hosts la sesión da la orden para una terminal."
      }
    ]
