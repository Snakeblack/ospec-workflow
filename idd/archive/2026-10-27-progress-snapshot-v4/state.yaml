  "intent": {
    "request": "Encargo de otra sesión, aceptado por el usuario como E5.13 por delante de E4.3: con --schema-version 4, ospec snapshot exporta el v3 de hoy (mismas fases, tramos, textos, peticiones y etapa de entrega) más la documentación del proyecto, en seis campos opcionales de la raíz: problem, objectives (title y measure), includes, excludes (title y reason), deliverables (title y phase, summary y url opcionales) y decisions (number, title, date, status accepted o superseded y reason; supersededBy y phases opcionales). El v1, el v2 y el v3 no cambian. Los textos siguen la regla del v2, una lista vacía no se publica y el límite sigue en 64 KiB. Las decisiones salen de los ADRs de docs/architecture/decisions/NNNN-<título>.md con la plantilla de foundation; solo se publican los accepted y los superseded. supersededBy solo si la sustituta se publica. title: el título para el cliente del fichero de avance o, sin él, el del ADR. reason: el motivo para el cliente, obligatorio salvo que el ADR se marque interno. phases: las fases del roadmap cuya columna ADRs nombra ese ADR. Otras líneas de la cabecera, como Amends, no cambian nada. El título, el motivo y la marca de interno van en docs/progress.md o el --progress que se pase; los ADRs no se tocan. Sin docs/architecture/decisions/ no hay decisiones ni error. Errores con código 1, el fichero y la línea, sin escribir nada: un ADR publicado sin motivo ni marca de interno; un texto para un ADR que no existe o no se publica; un superseded by con una sustituta que no existe o no es mayor; la columna ADRs con un ADR que no existe; un entregable con una fase que el roadmap no tiene; un texto o lista fuera de los límites del contrato. La documentación queda agnóstica.",
    "kind": "feature",
    "summary": "ospec snapshot --schema-version 4 emite el snapshot de avance v4: el v3 tal cual más la documentación del proyecto (problema, objetivos, alcance, entregables y decisiones), con las decisiones sacadas de los ADRs aceptados o sustituidos de docs/architecture/decisions/ y de la columna ADRs del roadmap, y los textos para el cliente del fichero de avance; el v1, el v2 y el v3 no cambian",
    "acceptance": "Con --schema-version 4, ospec snapshot emite un JSON que cumple schemas/progress-snapshot/v4.schema.json y las reglas del v3, con problem, objectives, includes, excludes, deliverables y decisions solo cuando el fichero de avance o los ADRs los dan; un ADR accepted o superseded sin motivo ni marca internal, un texto del fichero de avance para un ADR que no existe o no se publica, un superseded by que nombra una sustituta inexistente o no mayor, una columna ADRs que nombra un ADR inexistente, un entregable con una fase que el roadmap no tiene o un texto o lista fuera de los límites terminan con código 1, el fichero y la línea, sin escribir nada; sin docs/architecture/decisions/ no hay decisiones ni error; el v1, el v2 y el v3 salen igual; la documentación es agnóstica y ningún flujo, hook, check ni gate lo ejecuta"
  },
