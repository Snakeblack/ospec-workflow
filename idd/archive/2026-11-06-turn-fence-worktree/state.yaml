{
  "schema": "idd-state/v1",
  "change": "turn-fence-worktree",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "En un git worktree fuera del directorio del proyecto, la respuesta a un gate queda user-unverified: el hook de fin de turno cuenta en .ospec/turns del repositorio del cwd de la sesión y el CLI lee la cuenta del worktree, que no existe",
    "acceptance": "Una respuesta --source user registrada en un worktree tras un fin de turno contado en el repositorio principal queda user; una registrada antes de que acabe el turno sigue user-unverified"
  },
  "facts": {
    "open": [
      "Alcance: ¿el CLI lee también la cuenta del repositorio principal (resuelto con el commondir del worktree, sin tocar los hooks Node ni Go), o el hook de fin de turno cuenta en cada worktree con un cambio abierto?",
      "Combinación: ¿la cuenta que usa el CLI en un worktree es la suma de la propia y la del principal, o la propia cuando existe y si no la del principal?",
      "Otros worktrees: ¿cuentan también los fines de turno de sesiones cuyo cwd está en un worktree hermano, o solo los del propio worktree y el principal?"
    ]
  },
  "plan": {
    "paths": [
      "docs/roadmaps/harness-evolution.md",
      "handbook/idd/flujo-idd.md",
      "openspec/specs/hooks/spec.md",
      "openspec/specs/idd/spec.md",
      "scripts/lib/idd-store.js",
      "scripts/lib/turn-fence.js",
      "scripts/lib/turn-fence.test.js",
      "scripts/ospec.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "En un worktree enlazado, el CLI cuenta los fines de turno como la suma de .ospec/turns del propio worktree y la del repositorio principal, que localiza siguiendo .git, gitdir y commondir sin lanzar git; los hooks de Node y Go no cambian",
      "Solo cuentan el propio worktree y el principal, no los worktrees hermanos; un repositorio principal desnudo no aporta cuenta"
    ]
  },
