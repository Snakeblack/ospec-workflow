    "kind": "bug",
    "summary": "Optimizar el CI: quitar el doble run por PR, acelerar Windows con medidas que demuestren ganancia y arreglar el flake startBrowser",
    "acceptance": "Validate y Build ospec-hooks corren una vez por PR (pull_request) y en push solo en main; el job de Windows baja de forma medida frente a la base de 9 min 46 s; el test startBrowser hang no depende de que Node arranque en 500 ms"
  },
  "facts": {
    "basis": "El usuario decidió el disparo (push solo main + PR), medir antes de aplicar aceleraciones de Windows, causa + reintento acotado solo para Chromium en Windows, y la memoización de la generación aparte"
  },
