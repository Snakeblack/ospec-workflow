{
  "schema": "idd-state/v1",
  "change": "counterproof-isolated-dependencies",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Issue #518: mountCounterproof (scripts/lib/idd-workspace.js) enlaza en el worktree temporal de la base los DEPENDENCY_DIRS reales del proyecto (node_modules, .venv, vendor…) con un symlink o junction escribible. Si el comando de la contraprueba o de su control reinstala dependencias en la base (pnpm 12 ante un lockfile que no casa), escribe a través del enlace en el directorio real: en retama-landing quedaron 24 symlinks de node_modules apuntando al árbol temporal borrado, con versiones de la base",
    "acceptance": "Una contraprueba o un control cuyo comando escribe en el directorio de dependencias del árbol temporal deja el del proyecto como estaba (mismo contenido y mismos enlaces); un test lo reproduce con un comando que escribe en ese directorio; la contraprueba sigue encontrando las dependencias instaladas, sin reinstalar"
  },
  "facts": {
    "open": [
      "Cómo se aísla el directorio de dependencias del proyecto en el árbol temporal: copia por montaje, copia solo cuando el diff toca manifiestos o lockfiles, enlace con detección de cambios, o árbol de hardlinks",
      "Dónde vive la copia: en os.tmpdir() como hoy (tmpfs en RAM en muchas distros Linux) o en el sistema de ficheros del proyecto",
      "Si la contraprueba y su control llevan una copia cada uno o comparten una por llamada",
      "Qué se hace con las rutas absolutas que algunos ecosistemas guardan dentro del directorio (shebangs de .venv/bin, .pth de instalaciones editables, enlaces absolutos al proyecto): dejarlas y documentar el límite, reescribirlas, o vigilar el directorio real tras la contraprueba",
      "Si guardar en .ospec/runs la salida de la contraprueba que falla (tercera idea de la issue) entra en este cambio"
    ]
  },
  "plan": {
    "paths": [
      "handbook/idd/evidencia.md",
      "scripts/lib/idd-workspace.js",
      "scripts/lib/idd-workspace.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "La contraprueba copia en su árbol temporal los directorios de dependencias ignorados del proyecto y de la raíz del repositorio en vez de enlazarlos (#518): lo que corre en él nunca escribe en los del proyecto. Los ficheros se clonan donde el sistema de ficheros lo admite (COPYFILE_FICLONE) y se copian donde no",
      "Una copia por montaje, en os.tmpdir() como el resto del árbol; si no cabe, el montaje falla con counterproof-unmounted y la contraprueba se omite con aviso",
      "Las rutas absolutas que un ecosistema guarda dentro de los ficheros de esos directorios (shebangs de .venv/bin, .pth de instalaciones editables) se copian tal cual; el límite queda en handbook/idd/evidencia.md. Guardar la salida de la contraprueba que falla va en una issue aparte",
      "Un enlace de la copia cuyo destino absoluto cae dentro del repositorio apunta a la misma ruta del árbol temporal, en todas las plataformas; en Windows un enlace a un directorio se recrea como junction, que no pide privilegios. Motivo: pnpm (symlink-dir) crea en Windows junctions, siempre absolutos, al .pnpm real. Los enlaces que salen del repositorio se copian tal cual (decisión del usuario, opción A)"
    ]
  },
