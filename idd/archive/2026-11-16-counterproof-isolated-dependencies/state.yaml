      "answer": "todas las recomendadas: 1) copia por montaje con fs.cpSync (enlaces tal cual, clon CoW donde el FS lo admite); 2) la copia vive en os.tmpdir(), y si no cabe la contraprueba se omite con aviso; 3) una copia por montaje; 4) las rutas absolutas se dejan y el límite se documenta en handbook/idd/evidencia.md; 5) guardar la salida de la contraprueba va en una issue aparte. Entrega: una PR desde fix/counterproof-isolated-dependencies",
