{
  "schema": "idd-state/v1",
  "change": "move-change-base",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "`ospec close` no puede cerrar un cambio cuya base guardada es anterior a commits de otro cambio ya archivado. Ideas, sin imponer el diseño: que close acepte la base con la que el último check dejó lista la evidencia (guardada en ella), o un comando que adelante `state.base` a un descendiente cuando los commits de en medio solo pertenecen a cambios archivados (o a otros `chore(idd)`), con su motivo en el estado. Lo que decidas, con la protección de B2 intacta.",
    "kind": "feature",
    "summary": "ospec record base adelanta la base de un cambio abierto a un commit descendiente, con la aprobación del usuario en un gate, para que check y close midan solo su trabajo cuando otro cambio ya archivado entró detrás de su apertura",
    "acceptance": "Un cambio docs abierto en main antes de que entren los commits de otro cambio ya archivado: ospec close lo rechaza con kind-mismatch; tras ospec record base --to main, la aprobación del gate y un ospec check, ospec close lo cierra; una base que no desciende de la actual se rechaza y, sin la respuesta al gate, la base no se mueve y close sigue rechazando"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "Qué base nueva se acepta: (A) cualquier revisión (--to main, un sha) que resuelva a un commit descendiente de la base actual y antecesor o igual de HEAD; el estado guarda el sha completo; una base null (cambio abierto antes del primer commit) no se mueve. (B) También un commit que no descienda de la base (historia reescrita), siempre con la aprobación del gate."
      },
      {
        "category": "uniqueness",
        "question": "Quién garantiza que los commits que salen del diff no son trabajo del propio cambio: (A) un gate nuevo, base-moved: el comando no mueve nada, abre el gate con la base nueva, los commits y las rutas que dejan el diff y los cambios archivados en ese tramo, y la base se mueve solo al resolverlo el usuario. (B) Sin gate: se mueve si es descendiente y el tramo archiva algún cambio; es una heurística, porque el archivo no guarda las rutas ni el contenido de su diff y un commit propio en el tramo saldría del diff sin que nadie lo vea. (C) Que close acepte la base del último check --base: descartada salvo que la pidas, porque un check --base HEAD cerraría con un diff vacío (B2, B3)."
      },
      {
        "category": "persistence",
        "question": "Qué queda en el estado tras mover la base: (A) base con el sha nuevo y un historial base_moves (from, to, reason, moved_at), y la evidencia ligada al árbol queda obsoleta: close exige un ospec check nuevo, sin --base, contra la base nueva; las señales que solo derivaba el diff viejo se retiran con record retract, como hoy. (B) Igual, pero checks-pass se conserva si el árbol no cambió desde el último check."
      },
      {
        "category": "copy",
        "question": "Nombre y texto: (A) ospec record base --change <id> --to <rev> --reason \"<why>\", gate base-moved con la pregunta: The change's base moves from <old> to <new>: <n> commits and these paths leave its diff: <paths>. Do they all belong to other changes? (B) Otro nombre, por ejemplo ospec rebase."
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "openspec/specs/idd/spec.md",
          "line": 120
        }
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
          "path": "openspec/specs/idd/spec.md",
          "line": 2018
        }
      },
      {
        "category": "errors",
        "question": "Rechazos y marcha atrás: (A) base-not-descendant si la revisión no desciende de la base o no es antecesora de HEAD, unknown-base si no existe, sin cambios si ya es la base; con el gate abierto check y close se niegan como con cualquier gate; si el usuario dice que no, ospec record base --cancel retira el gate y la base queda como estaba; una vez movida no hay vuelta atrás. (B) Además, rechazar el movimiento si alguna ruta que sale del diff la toca también el propio cambio después de la base nueva."
      }
    ]
  },
