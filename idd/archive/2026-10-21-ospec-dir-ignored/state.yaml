{
  "schema": "idd-state/v1",
  "change": "ospec-dir-ignored",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Los datos de sesión de .ospec/ quedan ignorados por git en cualquier proyecto, y el banco no los versiona en el commit setup",
    "acceptance": "En un repositorio sin .ospec/ en .gitignore, tras el hook Stop git status queda limpio y git check-ignore .ospec/session/latest.md da 0; en el banco el commit setup no contiene .ospec/ y un cambio IDD cerrado y commiteado cuenta como entrega sin tocar .gitignore"
  },
  "facts": {
    "open": [
      "¿Mecanismo: un .ospec/.gitignore con '*' que ospec crea dentro de su carpeta (no toca ficheros del usuario) o añadir '.ospec/' al .gitignore raíz con el helper existente ensureOspecGitignore (cambio visible en el repo del usuario)?",
      "¿Quién lo garantiza: solo el hook Stop (el que reescribe latest.md en cada turno) o todo escritor de .ospec/ (artifact-store, pre-tool-use, recibos de review, archive-tx) a través de un helper común?",
      "¿Qué pasa con un .ospec/ ya versionado en el repo del usuario (ignorar no lo saca del índice): no hacer nada más, o que ospec doctor lo detecte y proponga git rm --cached?",
      "¿Si ya existe un .ospec/.gitignore con otro contenido, se deja intacto o se reescribe?",
      "¿En el banco: excluir .ospec/ con .git/info/exclude en prepareWorkspace para todos los brazos, o fiarse del arreglo del producto y solo añadir un test de que el commit setup no contiene .ospec/?"
    ]
  },
