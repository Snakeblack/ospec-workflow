  "intent": {
    "kind": "bug",
    "summary": "E1.53: strict_tdd, impact y contracts de idd/config.yaml se contrastan con la base del cambio como checks, y se cierran los residuos de E1.44 (contract-spec-and-test con --base antiguo, classifyPath, readGitDiff con prefijos o -diff, boundary-tests con un comentario o un fixture, subida a feature)",
    "acceptance": "Un impact.exclude nuevo sobre rutas de security_boundary y strict_tdd: false frente a una base con true no dejan cerrar sin la respuesta del usuario; un cambio sin diferencias de configuración cierra igual que hoy; cada residuo se reproduce en un test que falla antes y pasa después"
  },
  "facts": {
    "open": [
      "¿Qué gate pide la respuesta cuando cambian strict_tdd, impact o contracts: checks-changed ampliado a toda la configuración de ceremonia, o un gate propio?",
