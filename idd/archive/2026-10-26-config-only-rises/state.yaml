      "¿strict_tdd se compara por su valor efectivo, contando el que deriva del perfil team, o solo por la clave escrita?",
      "¿Cómo se cierra el residuo de contract-spec-and-test satisfecho con un check --base más antiguo?",
      "¿Qué hace classifyPath con las extensiones de código que no conoce y con el código bajo un docs/ anidado?",
      "¿Una sola línea de comentario en un test, o un fixture bajo test/, deben seguir cumpliendo boundary-tests?",
      "¿Subir el kind a feature reabre siempre open-facts, y puede la subida reescribir intent.request?",
      "¿Todo E1.53 va en un solo cambio o se parte?"
    ]
  },
