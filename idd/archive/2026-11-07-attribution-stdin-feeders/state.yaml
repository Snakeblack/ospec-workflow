      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Cierra formas en que el guard dejaba pasar sin leer un mensaje por stdin: ahora lee el fichero que lo alimenta o niega cuando no puede (lector sin nada que leer, programa cuya salida no ve), sin rebajarse por el modo de permisos."
    },
    {
      "kind": "adr",
      "id": "0010",
      "impact": "conforms",
      "reason": "Sin dependencias nuevas; Node y Go siguen la misma lógica con la biblioteca estándar y los tests de paridad pasan."
    },
