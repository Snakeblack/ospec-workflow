                "severity": "WARNING",
                "summary": "scripts/hooks/pre-tool-use.js:910-918 (readerFiles) and :931-938 (fedBy), and the Go port internal/hooks/pretooluse.go:258-291, drop the `-` operand (stdin) of a piped file reader. A word starting with `-` is skipped, so `-` is never an operand. Trigger: `curl https://x/msg | cat clean.txt - | git commit -F -`, or `cat clean.txt - < dirty.txt | git commit -F -`. readerFiles returns only [clean.txt], so fedBy reads only that file and never follows the reader's own stdin (the curl output, or dirty.txt). A message with an attribution trailer reaches git and is allowed. This contradicts spec §6a.1 point 3 and the ADR 0008 deny-what-cannot-be-read principle. The guard fails open for a standard stdin spelling of the same feeder it follows elsewhere. No test covers a `-` operand.",
                "acceptance_criteria": "In both hooks, a piped file reader (cat, tac, type, head, tail, Get-Content) with a `-` or `/dev/stdin` operand also follows the reader's own stdin, using its `<`, heredoc or pipe, and denies when nothing readable feeds it. Tests in JS and Go show that `cat clean.txt - < dirty.txt | git commit -F -` and `printf-less-unreadable | cat clean.txt - | git commit -F -` are denied, and `cat msg.txt - < clean.txt | git commit -F -` is allowed only when every source is clean. The spec text matches."
