          "request_id": "attribution-stdin-feeders:lens-start:1:0",
          "result_digest": "sha256:2dcd54c8d0f7f1c6e438df063f42123a0faee0cb5163d9316a483e1b0a0a3a41",
          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "A piped feeder behind a wrapper is not followed, so the guard fails open. `env cat f | git commit -F -` (also `sudo`, `nice`, `time`, `command`, `timeout`, `xargs cat`) gives simpleCommand a null result (pre-tool-use.js:867-875; pretooluse.go:293-310). The wrapper loop skips every word until a git, gh or shell word, and none follows. In checkCommitAttribution, `previous` is then null (pre-tool-use.js:1056; pretooluse.go:608), so the commit's `feeder` is null. stdinOf returns null (pre-tool-use.js:910-914), nothing is read or denied, and an attributed file passes. This contradicts spec §6a.1 point 3 (spec.md:1422-1424), which says any other piped program MUST be denied. A middle link (`cat f | env tee | git commit -F -`) opens the same hole. No test covers a wrapped feeder.",
                "acceptance_criteria": "In both the JS and Go guards, `env cat msg.txt | git commit -F -`, `nice cat msg.txt | git commit -F -` and `cat msg.txt | env tee | git commit -F -` (msg.txt holding a Co-Authored-By trailer) are denied. They are denied either with the attribution reason (the wrapped reader's file is read) or with the unreadable-stdin reason naming the program. A clean file behind a wrapped reader does not get the attribution denial. A piped segment whose program cannot be determined yields a deny, never a null feeder. The change is covered by a JS and a Go test."
              },
              {
                "severity": "SUGGESTION",
                "summary": "The redirection parser misattributes the real stdin source in two forms. (a) A digit-prefixed `<` of another descriptor, as in `cat f | git commit -F - 3< g`, is treated as stdin. `inputs` holds g, which wins in stdinOf, so f is never read although the pipe still feeds fd 0. (b) The clobber redirection `>|` is split into `>` and a `|` separator, as in `git commit -F - >| out < f`. The `< f` attaches to the new `out` segment, so the commit has no input and no deny (commandSegments, pre-tool-use.js:808-846; pretooluse.go:166-213). The fd digit is dropped without recording it (JS 825; Go 184-186).",
                "acceptance_criteria": "In both ports, `cat msg.txt | git commit -F - 3< clean.txt` and `git commit -F - >| out.txt < msg.txt` (msg.txt with an attribution trailer) are denied. Either the real stdin source is read, or the command is denied as unreadable. Existing `2>&1 < f` and `&> log < f` behavior is unchanged, and both ports are tested."
              }
            ]
          },
          "operation": null,
          "result_request_id": "attribution-stdin-feeders:lens-result:1:1"
