{
  "schema": "idd-state/v1",
  "change": "review-limit-oversized-correction",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Con las revisiones de confianza agotadas y la última en correction-required, una corrección que no cabe en una corrección acotada deja el cambio en bucle: ospec check pide review correct, review correct pide review start, review start responde review-limit y el gate review-limit no se abre nunca.",
    "acceptance": "En ese estado, ospec check termina la revisión como escalated, abre el gate review-limit y next pide resolverlo; resuelto el gate, ospec review start abre la revisión sucesora con los hallazgos bloqueantes sin resolver como predecessor_findings."
  },
  "facts": {
    "basis": "Decisión del usuario (1A, 2026-11-11): la CLI debe abrir review-limit en este caso; REQ-idd-016 ya fija que ospec check abre el gate cuando las revisiones se agotan y que una corrección fuera de presupuesto no deja el cambio sin salida."
  },
  "plan": {
    "paths": [
      "openspec/specs/idd/spec.md",
      "scripts/lib/idd-review.js",
      "scripts/lib/idd-review.test.js",
      "scripts/ospec.js",
      "scripts/ospec.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "El gate se abre en ospec check y no en ospec review start: un rechazo de start no persiste estado, y REQ-idd-016 ya dice que check abre review-limit. check termina la revisión como escalated a la vez, para que el gate solo exista con la revisión actual terminal."
    ]
  },
