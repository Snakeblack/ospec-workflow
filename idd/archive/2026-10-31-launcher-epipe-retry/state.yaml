  "schema": "idd-state/v1",
  "change": "launcher-epipe-retry",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "El lanzador reintenta con el hook Node cuando el binario ospec-hooks no arranca aunque spawnSync devuelva EPIPE junto con la salida 126/127 del /bin/sh de respaldo",
    "acceptance": "Con un ELF de otra arquitectura y un stdin mayor que el buffer de la tubería, un pre-tool-use responde con la decisión del hook Node y stderr nombra exit 126 o exit 127; un binario que arranca y sale con otro código sigue sin reintentarse"
  },
  "facts": {
    "open": [
      "¿EPIPE cuenta como binario que no arrancó solo cuando llega con salida 126/127 y sin señal, y con cualquier otro código o señal sigue sin reintentarse?",
      "¿Qué motivo nombra el aviso [ospec warn] en ese caso: la salida del shell (exit 126/127) o EPIPE?",
      "¿REQ-hooks-031 gana un escenario con stdin mayor que el buffer de la tubería, que fija la carrera EPIPE?",
      "Un binario que arranca y sale sin leer todo el stdin (con código 0 u otro) da EPIPE como motivo del ask en vez de exit N; ¿se deja fuera de este cambio?"
    ]
  },
  "plan": {
    "paths": [
      "openspec/specs/hooks/spec.md",
      "scripts/hooks/ospec-hooks-launch.js",
      "scripts/hooks/ospec-hooks-launch.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "EPIPE cuenta como binario que no arrancó solo cuando llega con salida 126/127 y sin señal: es la carrera del /bin/sh de respaldo, que sale sin leer un stdin mayor que el buffer de la tubería; con otro código o con señal el binario pudo correr y no se reintenta",
      "El aviso [ospec warn] nombra exit 126/127 también con EPIPE, porque la salida del shell es la causa y EPIPE solo el síntoma",
      "Queda fuera el binario que arranca y sale sin leer todo el stdin (EPIPE en el motivo del ask en vez de exit N): ospec-hooks lee el stdin entero con io.ReadAll antes de hacer nada"
    ]
  },
