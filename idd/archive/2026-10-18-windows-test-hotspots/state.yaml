  "intent": {
    "kind": "refactor",
    "summary": "Recortar los cuatro puntos calientes de la suite en Windows (preflight de rutas del instalador Codex, mkdir redundante, go build en frío del test de agy y arranques de Windows PowerShell 5.1) sin cambiar el comportamiento observable",
    "acceptance": "La suma de duraciones TAP de los shards de Windows baja frente al run base 39165680389 (480 s y 675 s), con codex-smoke, codex-hook-shell, hosts/agy e install-codex-env-isolation más rápidos, y toda la suite en verde en las tres plataformas"
  },
  "facts": {
    "open": [
      "¿Se acepta memoizar dentro de una misma pasada de preflight el realpath de la raíz aprobada y el de cada directorio padre en assertManagedPathSafe (install-codex.js), manteniendo por entrada el lstat que detecta enlaces simbólicos?",
      "¿Se aplica también al motor compartido (install-engine.js assertPathSafe, que hace 2 lstat y 2 realpath por fichero dos veces por fichero) o solo a Codex?",
      "Para el go build en frío del test de agy: ¿caché de Go en CI (actions/setup-go con cache), compilar antes en CI, o que el test no compile?",
      "Windows PowerShell 5.1 tarda ~16 s por arranque en el runner: ¿medir la causa en un experimento de CI y corregirla en el entorno del test, reducir sus invocaciones, o dejarlo?",
      "¿Queda fuera ospec.test.js (130 s en Windows, repartido en ~100 tests que lanzan procesos)?",
      "¿Se puede subir una rama y usar el CI del PR (y un workflow de experimento temporal si hace falta) para medir el después?"
    ]
  },
