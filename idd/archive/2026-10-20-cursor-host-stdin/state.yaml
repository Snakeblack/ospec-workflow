    "kind": "bug",
    "summary": "El launcher trata a Claude Code como Cursor si hereda CURSOR_AGENT/CURSOR_SESSION_ID/CURSOR_HOOK: pierde ask/deny y la censura de E1.27 (OSP-031, #368)",
    "acceptance": "Con CURSOR_AGENT=1 heredado y un stdin con forma de Claude (session_id y evento PascalCase), pre-tool-use emite hookSpecificOutput.permissionDecision (ask/deny) y post-tool-use emite updatedToolOutput censurado; un stdin de Cursor (cursor_version o conversation_id) sigue detectándose como Cursor"
  },
  "facts": {
    "basis": "Medido con cursor-agent 2026.10.16: los hooks third-party reciben el payload nativo de Cursor (evento camelCase, cursor_version, conversation_id) sin variables CURSOR_AGENT/SESSION_ID/HOOK; Claude Code envía session_id con evento PascalCase. El stdin identifica al host; las variables solo deciden cuando el stdin no lo hace"
  },
