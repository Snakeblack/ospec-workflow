  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "En Windows, setup:claude antepone bash a los hooks .sh del plugin Engram para que Claude no los abra con el editor asociado.",
    "acceptance": "Con Engram configurado para Claude en Windows, cada comando .sh de hooks.json del plugin instalado arranca con bash; un comando que ya usa bash o que no es .sh no cambia; una segunda ejecucion no reescribe el fichero; un JSON ilegible se deja igual; en otros sistemas o con --no-engram no se toca."
  },
  "facts": {
    "basis": "El instalador ya aplica el arreglo de Windows cuando Engram esta configurado para Claude, aunque no repita engram setup. El hooks.json instalado muestra el defecto en cada comando .sh entre comillas y la forma valida en SessionEnd (bash mas el script). El parche cubre todo ejecutable .sh sin lanzador bash o sh, no depende de la sonda de fork, no reescribe JSON ilegible y no falla el instalador. La ruta sale de installed_plugins.json para engram@engram."
  },
