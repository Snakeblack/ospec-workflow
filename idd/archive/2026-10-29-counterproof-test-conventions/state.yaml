  "impacts": [
    {
      "kind": "adr",
      "id": "0003",
      "impact": "conforms",
      "reason": "La regla de qué es un test y la omisión de la contraprueba para tests inline viven en el CLI (idd-signals.js y ospec.js) con sus tests en idd-signals.test.js y ospec.test.js; la skill no describe la regla"
    },
    {
      "kind": "adr",
      "id": "0004",
      "impact": "conforms",
      "reason": "No añade señales ni obligaciones: amplía qué cuenta como test para untested-product, boundary-tests y las parejas, que ya derivan del impacto"
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "conforms",
      "reason": "La evidencia sigue saliendo de runs que el CLI observa; una contraprueba omitida por un test inline queda marcada con counterproof_skipped y avisada, nunca afirmada"
    },
    {
      "kind": "adr",
      "id": "0011",
      "impact": "conforms",
      "reason": "Solo toca IDD: la clasificación de rutas, la contraprueba y su contrato; SDD y openspec/changes no cambian"
    },
    {
      "kind": "scenario",
      "id": "deterministic-resume",
      "impact": "conforms",
      "reason": "Qué es un test sale de la ruta y del contenido del fichero en disco, sin estado de sesión; next da el mismo paso al reanudar"
    },
    {
      "kind": "adr",
      "id": "0010",
      "impact": "conforms",
      "reason": "Solo expresiones regulares y la biblioteca estándar de Node; ninguna dependencia nueva"
    },
    {
      "kind": "scenario",
      "id": "offline-operation",
      "impact": "conforms",
      "reason": "Clasificar rutas y leer el fichero .rs no usa red; la omisión de la contraprueba evita incluso montar el worktree"
    }
  ],
  "attestations": [
