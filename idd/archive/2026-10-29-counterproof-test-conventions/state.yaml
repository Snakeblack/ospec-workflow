{
  "schema": "idd-state/v1",
  "change": "counterproof-test-conventions",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Límite 2 de E1.48: isTestPath no reconoce spec/, *_spec.rb, *_test.py ni los tests inline de Rust, así que en esos proyectos repro-test, tdd-red-green y boundary-tests ya no pueden cerrar",
    "acceptance": "Un repro cuyo test está en spec/models/user_spec.rb o en app/pages_test.py cierra la pareja con su contraprueba, classifyPath los tiene por test y addedTests los cuenta; los tests inline de Rust siguen la regla que decida el usuario"
  },
  "facts": {
    "open": [
      "Tests inline de Rust (#[cfg(test)] en src/*.rs): ¿se reconocen como test añadido y la contraprueba se omite con marca visible (comparten fichero con el producto), se exige moverlos a tests/, o se monta solo la parte de test del fichero?",
      "Alcance de las convenciones: ¿solo spec/, *_spec.rb y *_test.py, o spec/ en cualquier nivel más el sufijo _test/_spec con cualquier extensión de código (_test.rb, _test.exs, _test.cc, _spec.lua...)?"
    ]
  },
  "plan": {
    "paths": [
      "openspec/specs/idd/spec.md",
      "openwiki/testing-quality/verification.md",
      "scripts/lib/idd-signals.js",
      "scripts/lib/idd-signals.test.js",
      "scripts/ospec.js",
      "scripts/ospec.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "Los tests inline de Rust se reconocen por contenido, sin posiciones: una línea añadida a un .rs cuenta como test si solo aparece dentro de un módulo bajo #[cfg(test)], desde el atributo hasta la llave que cierra el mod a su sangría (como lo deja rustfmt); si la misma línea aparece también fuera, no cuenta",
      "Si el diff añade código a un test inline de Rust, la contraprueba se omite entera con counterproof_skipped, aunque haya también tests en ficheros aparte"
    ]
  },
