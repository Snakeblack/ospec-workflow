  "changelog_line": "**El hook de fin de turno cuenta el `agentStop` de GitHub Copilot CLI** (copilot-stop-timestamp). Copilot manda en ese evento el `timestamp` como milisegundos, y el binario `ospec-hooks` lo esperaba como texto: el hook salía sin contar el turno en `.ospec/turns` ni escribir la traza, así que en Copilot toda respuesta a un gate quedaba `user-unverified`. Ahora, como el hook de Node, usa el `timestamp` solo si es texto y si no la hora actual; verificado en vivo con Copilot 1.0.116, también sin interfaz. Hay que reinstalar ospec en Copilot (`npm run setup:copilot`) para que llegue el binario corregido. REQ-hooks-030 lo fija.",
  "closed_at": "2026-11-26T21:33:51.953Z"
