  "intent": {
    "request": "Arreglar el hueco del CLI: una corrección fuera de presupuesto escale la línea y permita la sucesora",
    "kind": "bug",
    "summary": "Una corrección de trust-review que supera el presupuesto de líneas o sale de las rutas congeladas deja el cambio IDD sin salida: review correct la rechaza y review start no abre sucesora porque la generación sigue en correction-required",
    "acceptance": "Con una generación en correction-required y cambios desde el candidato revisado que superan el presupuesto o salen de las rutas congeladas, ospec review start termina esa generación como escalated con el motivo y abre la sucesora (contando para el límite de 3); si los cambios caben, start devuelve la revisión en curso como hoy; el rechazo de review correct nombra ese camino; spec REQ-idd-016 y tests actualizados"
  },
  "facts": {
    "open": [
      "¿El paso a sucesora lo dispara ospec review start de forma automática cuando los cambios no caben en una corrección acotada, o exige un flag explícito como --supersede?",
