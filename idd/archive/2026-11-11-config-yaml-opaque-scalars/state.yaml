          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/lib/yaml-lite.js:100 (readYamlScalar, used by the hooks launcher for artifact_store.backend) and :135 (ENTRY_LINE, used by scanLines/opaqueScalarLines) still backtrack quadratically on a line with a run of whitespace right after the key's colon, then a non-space character, then a lone CR. Lines split on /\\r?\\n/, so a lone CR stays in the line. JS `.` does not match CR, so `(.*)$` fails after `\\s+` or `[ \\t]+` took the whole run, and the engine retries every shorter split. Example: `backend:` + 100,000 spaces + `b` + CR + `c`. REQ-lifecycle-kernel-034 and the tests claim linear time on any line, but no test input has a CR. A cloned repo's openspec/config.yaml is untrusted; the launcher parses it in-process with no timeout (ospec-hooks-launch.js:526-531), so a crafted config can stall session-start, pre-compact and stop until the host kills the hook. Conditional availability risk, not run.",
                "acceptance_criteria": "readYamlScalar, opaqueScalarLines and the readers built on them finish in well under a second on a line made of `key:` + 100,000 spaces + `b` + a lone CR + `c`, in both a value and a flow mapping, with a test that covers a lone CR. Results for ordinary input (LF and CRLF, with or without trailing comments) stay unchanged. Node and Go still read the same lines as opaque."
              }
            ]
          },
