      "detail": {
        "run": "run-54",
        "tree": "sha256:0adcbe797271262ee3e518ef24f39dc98bafe32274d817d01270198010eba751",
        "plan": "Los formatos de openspec/config.yaml e idd/config.yaml no cambian y no hay migración: los lectores de openspec/config.yaml solo dejan de leer las líneas de un valor (continuaciones de un escalar o de una colección flow multilínea y el valor en la línea siguiente) y el backend y los valores por defecto de ruta pasan a ser el hijo directo de su sección, así que una configuración sin ellos se lee igual; los 16 config.yaml versionados (el del repo y los fixtures) dan lecturas idénticas en main y en la rama, y lo prueban sin tocar fixtures las suites completas de los lectores, sus llamadores (session-start, artifact-store, validate-phase) y yamllite, store y hooks de Go. Cambios visibles: idd/config.yaml rechaza con config-invalid un escalar de bloque, un valor multilínea y un escalar entrecomillado o flow sin cerrar (antes un check podía valer | o leer el bloque como más checks); un override de atribución con un valor multilínea queda inválido; Node lee una línea con un CR suelto o un U+2028 como ya la leía Go. Vuelta atrás: revertir el commit, sin datos que deshacer."
      }
