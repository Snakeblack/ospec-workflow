          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The inline-comment stripper /(?<!\\s)\\s+#.*$/ backtracks quadratically when a lone CR or U+2028 follows a run of ' #' pairs. It is in idd-config.js:28, route-dispatcher.js:76, route-dispatch-run.js:158 (extractAttributionOverride) and ospec-state.js:57 (readBaselineState). Trigger: a value 'a' + ' #'.repeat(50000) + '\\rb'. `.` stops at the CR and `$` matches only at the string end, so each ' #' start (the lookbehind passes after '#') scans to the CR and backtracks: O(n^2). The line passes opaqueScalarLines as a plain scalar. REQ-lifecycle-kernel-034 (spec.md:171, 179) requires linear time with a lone CR. The tests (e.g. idd-config.test.js:194-204) only use space runs. Impact: a crafted config.yaml can hang the CLI or hooks.",
                "acceptance_criteria": "A value or list item holding 'a' + ' #'.repeat(50000) + one of ('\\rb', '\\u2028b'), written to openspec/config.yaml or idd/config.yaml, is read by parseIddConfig (mode, a check, an impact list item), parseRoutingTable, extractAttributionOverride and readBaselineState (status) in well under a second. Its comment is still stripped as before on lines without CR or U+2028, and the outputs match Go on a CR line. A regression test covers the ' #' repetition with each tail for these readers."
              }
            ]
          },
