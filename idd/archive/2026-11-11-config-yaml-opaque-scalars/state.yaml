{
  "schema": "idd-state/v1",
  "change": "config-yaml-opaque-scalars",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Los lectores línea a línea de openspec/config.yaml e idd/config.yaml leen claves dentro de un escalar de bloque o multilínea, extractConfigDefaults hace backtracking exponencial y readFlowScalar es cuadrático",
    "acceptance": "Ningún lector de config.yaml lee una clave dentro de las líneas de continuación de un valor: un backend: workspace-federated dentro de notes: | bajo artifact_store no cambia el backend (Node ni lanzador), un scope dentro de un justification: | no cambia el override de atribución, un name: cmd dentro de un bloque de checks no se ejecuta como check, una línea de bloque no corta una capacidad ni añade fases, dominios o claves de team; extractConfigDefaults y readFlowScalar terminan en tiempo lineal (una sección project: de 30 líneas sin status y 80.000 espacios en un mapa flow tardan mucho menos de un segundo); y Go ReadBaselineState lee igual que Node"
  },
  "facts": {
    "open": [
      "quality_review.attribution_override con un valor que sigue en más líneas (justification: | con el texto debajo): ¿el override pasa a inválido (fail-closed), se lee el contenido del bloque como justificación, o se lee solo la línea de la clave (justification = \"|\")?",
      "idd/config.yaml con un valor que sigue en más líneas (test: | con el comando debajo, o un escalar entrecomillado multilínea): ¿se rechaza con config-invalid nombrando la línea, o se ignoran las continuaciones y se lee la línea de la clave (check test = \"|\")?",
      "extractConfigDefaults (condiciones de ruta project.status, baseline.status, artifact_store.backend): ¿se lee con readYamlScalar, solo el hijo directo de la sección de primer nivel (un status más anidado o bajo un project: anidado o subproject: deja de contar), o se conserva la semántica actual con una regex lineal?",
      "openspec/config.yaml malformado (un escalar entrecomillado o una colección flow que nunca cierra): ¿los lectores leen como hoy las líneas que siguen al error (como los lectores de state.yaml que no son el gate), o toman todo el fichero como ausente y usan sus valores por defecto?"
    ]
  },
