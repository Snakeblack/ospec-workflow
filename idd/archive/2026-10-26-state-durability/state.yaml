{
  "schema": "idd-state/v1",
  "change": "state-durability",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "E1.46: el estado en disco sobrevive a un corte y a la concurrencia. La escritura atómica usa un temporal único y hace fsync del fichero y del directorio (JS y Go); el lock lleva un token de dueño (pid y nonce) que se comprueba antes de soltarlo y un heartbeat del mtime mientras dura la operación (JS y Go); un estado ilegible tiene salida apartándolo como *.corrupt con lista blanca. Residuos de E1.43: el guard de PreToolUse deniega también las MCP de copia, anexado o guardado, y REQ-hooks-029 y los docs dicen que close solo revalida el estado de un cambio abierto y que idd/archive/** y .ospec/review-receipts/** solo los protege el hook previo.",
    "acceptance": "Un test con dos procesos concurrentes no pierde ninguna escritura del estado; un lock reclamado no lo borra su dueño anterior; un estado corrupto se aparta y el cambio se reanuda; un copy_file, append_file o save_file sobre idd/<cambio>/state.yaml se deniega en JS y Go; la spec y los docs ya no presentan la revalidación de close como garantía del archivo y los recibos"
  },
  "facts": {
    "open": [
      "REQ-idd-019 dice que ospec doctor no escribe nada: ¿quién aparta un estado ilegible: doctor con un flag explícito (--repair), doctor siempre, o un comando nuevo?",
      "¿Qué aparta la lista blanca: solo idd/<id>/state.yaml de un cambio abierto que doctor ya da como error (JSON ilegible, esquema inválido, change distinto), solo el JSON ilegible, o también el state.yaml de SDD?",
      "¿Cómo se nombra lo apartado (state.yaml.corrupt fijo o con marca de tiempo, sin sobrescribir) y desde dónde se reanuda el cambio: .bak, record intent con el mismo id conservando change.md, o restaurar desde git?",
      "Si el dueño de un lock descubre que se lo reclamaron, ¿falla sin escribir (lock-lost) o escribe igual y solo no borra el lock ajeno?",
      "¿El fsync se aplica a toda escritura atómica (estado IDD y SDD, resúmenes de sesión, recibos) o solo al estado de cambio, y qué pasa si el fsync del directorio falla o no existe (Windows)?",
      "Con un temporal único, un proceso que muere deja su .tmp: ¿quién lo limpia: la siguiente escritura del mismo fichero, doctor, o nadie?",
      "¿Qué verbos añade el guard (copy, append, save, upload…) y, en una copia, cuentan origen y destino como en move o solo el destino?"
    ]
  },
