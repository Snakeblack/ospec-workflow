      "id": "open-facts",
      "status": "resolved",
      "answer": "todas las recomendadas: 1a ospec doctor --repair aparta (sin flag sigue de solo lectura y su action nombra --repair); 2a solo idd/<id>/state.yaml de un cambio abierto que doctor da como error (JSON ilegible, esquema inválido, change distinto), nunca idd/archive/ ni symlinks; 3a se renombra a state.yaml.corrupt-<fecha> sin sobrescribir, se reanuda desde .bak si existe o con record intent del mismo id conservando change.md, doctor no toca git y su action menciona git checkout; 4a el dueño comprueba su token antes de escribir y falla con lock-lost sin escribir, nunca borra un lock ajeno; 5a fsync en toda escritura atómica (JS writeFileAtomic y los dos atomicWriteFile de Go), error si falla el del fichero, el del directorio se omite en Windows y se ignora en POSIX si el FS no lo admite; 6a la siguiente escritura del mismo fichero borra los temporales hermanos de más de 5 s; 7a el guard añade copy, append, save y upload, y en una copia cuentan origen y destino como en move",
      "source": "user"
    }
