      "lenses": {
        "trust": {
          "selected": true,
          "status": "completed",
          "request_id": "turn-fence-hosts:lens-start:1:0",
          "result_digest": "sha256:dba0d97850893ed8a84c9a3ea4dfff0d20b118a03cb568cd655d1c4ab775f7f5",
          "result": {
            "findings": [
              {
                "severity": "SUGGESTION",
                "summary": "renderGlobalHooks (install-global-copilot.js:90) rewrites only double-quoted \"scripts/...\" tokens and never checks that nothing relative is left. If a future hook command takes another form (unquoted, a different prefix, a new shell key), the global ~/.copilot/hooks/hooks.json silently keeps a path relative to the user's repository. Copilot then runs that repository's scripts/hooks/ospec-hooks-launch.js as a personal hook, so a cloned malicious repository gets code execution. This change exists to close that exposure, and the Codex counterpart already throws on a leftover marker (install-codex.js:1130). Today all four events in dist/github-copilot/.github/hooks/hooks.json match, so this is a guard against regression, not a current exposure.",
                "acceptance_criteria": "After rendering, the Copilot global install fails (or refuses to sync hooks/hooks.json) when any bash or powershell command still names a relative scripts/ path. A test with an unrecognised relative command form shows the install failing instead of writing it.",
                "location": "scripts/configure/install-global-copilot.js:90"
              },
              {
                "severity": "SUGGESTION",
                "summary": "The PowerShell quoting (install-global-copilot.js:77) doubles only the ASCII apostrophe. PowerShell also treats the typographic single quotes U+2018, U+2019, U+201A and U+201B as single-quote delimiters. A Windows profile or --dest path containing one (for example C:/Users/O’Neil/.copilot) ends the quoted path early. The hook command then fails to parse, or the rest of the path is read as PowerShell syntax. The bash quoting ('\\'' escape) is correct. The path comes from the installing user's own home or --dest, not from an attacker, so the effect is a broken hook, which includes the preToolUse guard.",
                "acceptance_criteria": "For a destination path containing U+2018, U+2019, U+201A or U+201B, the rendered powershell command either runs node with the exact installed path or the install refuses with a clear error. It never emits a command that PowerShell parses differently from the intended path.",
                "location": "scripts/configure/install-global-copilot.js:77"
              },
              {
                "severity": "SUGGESTION",
                "summary": "adaptCursorHookInput accepts a cwd candidate with fs.existsSync (ospec-hooks-launch.js:389), so an existing non-directory path (a file) is accepted. The child is then spawned with cwd set to that path (line 622), spawnSync fails with ENOTDIR, and launch() returns launcherFailure (lines 624-628). On Cursor, normalizeCursorHookOutput turns the resulting 'ask' into permission:allow with an advisory (lines 449-456), so the PreToolUse guard is skipped for that call. Before this change the child always ran in a valid directory (~/.cursor), so the guard still evaluated the payload. The payload fields come from Cursor, which reports the real shell directory, so reaching this needs Cursor to pass a non-directory cwd. I did not find that it does, so this is a hardening gap, not a demonstrated bypass.",
                "acceptance_criteria": "A Cursor pre-tool-use payload whose cwd exists but is not a directory (and a workspace_roots entry that is a file) does not cause a spawn failure. The launcher falls back to the next valid directory, or to its own directory, and the guard still evaluates the call. A unit test with an injected exists/isDirectory check covers it.",
                "location": "scripts/hooks/ospec-hooks-launch.js:389"
              },
              {
                "severity": "SUGGESTION",
                "summary": "The committed <repo>/.codex/hooks.json (install-codex.js:1124-1126) holds a fixed node -e one-liner that, from the git root, require()s the repository-tracked .codex/ospec-workflow/scripts/hooks/ospec-codex-hook.js and the runtime it loads. This adds no new capability: a repository can already ship any hooks.json, and Codex loads it only for a trusted project after /hooks approval. But the approved command text never changes while the code it runs is tracked content that changes with each pull. Assuming approval is bound to the command text (I could not verify Codex's rule), a hook approved once keeps running updated runtime code without a new prompt. The docs describe the approval as if it covered the hooks. Install-time guards are sound: preflightRepoInstall rejects a symlinked .codex/hooks.json or an escaping .codex symlink (install-codex.js:895-912, 1174).",
                "acceptance_criteria": "The Codex local-install docs (EN and ES) state that approving the hooks in /hooks covers only the command, not the files under .codex/ospec-workflow/, and recommend reviewing changes to that directory after pulling from a repository you do not control.",
                "location": "scripts/configure/install-codex.js:1124"
              }
            ]
          },
          "operation": null,
          "result_request_id": "turn-fence-hosts:lens-result:1:1"
        },
