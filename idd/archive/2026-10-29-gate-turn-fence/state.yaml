  "intent": {
    "request": "continua",
    "kind": "feature",
    "summary": "Un gate resuelto con --source user sin un fin de turno posterior a su apertura queda user-unverified: el hook de fin de turno de cada host incrementa un contador local en .ospec/, el gate guarda el turno en que se abrió y close muestra las respuestas no verificadas",
    "acceptance": "En cada target con fin de turno cableado, un gate resuelto con --source user en el mismo turno en que se abrió queda user-unverified con aviso en record y en close, y uno resuelto después de un fin de turno queda user; ningún caso bloquea"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "Las respuestas de la herramienta de pregunta del host (AskUserQuestion, askQuestions, ask_user, ask_question, question) llegan dentro del mismo turno, sin Stop: ¿la skill pide los gates terminando el turno y una respuesta dentro del turno queda user-unverified, cuenta el PostToolUse de esa herramienta como fin de turno, o se aceptan como user-unverified sin cambiar la skill?"
      },
      {
        "category": "uniqueness",
        "question": "¿La valla cubre los seis gates (ambiguous-intent incluido, vía record intent) y deja fuera record retract --answer, que no abre gate; y un checks-changed reabierto con otros checks reinicia su turno de apertura?"
      },
      {
        "category": "persistence",
        "question": "¿El contador vive en .ospec/turns, compartido por workspace y no por sesión, protegido de las herramientas de escritura como los recibos de review, y un gate abierto antes de E1.49 (sin turno guardado) conserva la fuente declarada?"
      },
      {
        "category": "copy",
        "question": "¿record gate avisa al degradar (warning que nombra el gate y el motivo), y close lista todos los gates user-unverified, declarados o degradados, con el motivo de los degradados, o solo los degradados?"
      },
