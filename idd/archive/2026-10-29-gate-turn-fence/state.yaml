              {
                "severity": "WARNING",
                "summary": "scripts/lib/idd-check.js:180-183 (checksApproved) counts any resolved checks-changed entry as approval, whatever its source. An entry the fence recorded user-unverified (same-turn self-answer) still lets the next `ospec check` run commands from idd/config.yaml (scripts/ospec.js:767-776). Trigger: an unapproved command sits in config.yaml; `ospec check` opens the gate; the agent resolves it with --source user in the same turn; the fence downgrades it with a warning but does not block; the next check runs the command. The warning comes after the run. Spec.md:1211-1212 says such a command runs only after the user's answer, which the fence does not enforce. Counterevidence: nothing blocks by design, the CLI never verifies who answered (spec.md:350-353), and an agent with a shell can run commands directly. So the exposure is an honest or prompt-injected agent, not a new capability.",
                "acceptance_criteria": "Either (a) a checks-changed entry recorded user-unverified by the fence (declared_source present) does not make `ospec check` run the commands or settings it lists, shown by a test where a same-turn self-answer leaves the command unrun; or (b) spec, approvals.md and checks.md state that a fenced or relayed checks-changed answer still approves and that the guarantee holds only for an honest agent, and a test pins that behavior."
              }
            ]
          },
