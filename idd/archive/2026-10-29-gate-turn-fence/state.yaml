        "plan": "Campos opcionales y aditivos en idd-state/v1 (opened_turn, resolved_turn, declared_source, unverified_reason): un state.yaml anterior a E1.49 sigue validando y un gate sin opened_turn conserva la fuente con que se responde; el CLI anterior no rechaza los campos nuevos. .ospec/turns nace con el primer fin de turno y una cuenta ilegible empieza de nuevo, lo que solo puede dejar más respuestas user-unverified. Vuelta atrás: revertir el commit; los estados con turnos siguen siendo JSON válido para el CLI anterior."
      }
