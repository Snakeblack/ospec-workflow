            "findings": [
              {
                "severity": "WARNING",
                "summary": "The hook writes the receipt into the working tree at .ospec/review-receipts/. IDD's snapshotTree stages everything except idd/ (scripts/lib/idd-workspace.js:355). In a project that does not ignore .ospec/, the receipt shows up as a changed path outside the frozen paths and can make ospec review correct refuse.",
                "acceptance_criteria": "In an IDD project whose .gitignore does not cover .ospec/, a receipt written after ospec review start does not appear in the correction's changed paths or line budget. ospec review correct either succeeds for an in-scope fix or the receipt is kept out of the snapshot or the ignore is ensured. A test covers this.",
                "location": "scripts/hooks/subagent-stop.js:1290"
              },
              {
                "severity": "SUGGESTION",
                "summary": "The receipt is overwritten on every review-trust or review-correction stop with the same request_digest, and the digest has no nonce. A re-dispatched reviewer's result replaces the first and is still attested as subagent-stop, so the run-once rule is not visible in the evidence.",
                "acceptance_criteria": "A second reviewer stop for a request_digest that already has a receipt either does not replace it or records that a replacement happened (for example a run count or first-recorded time). The evidence or a warning shows more than one run. A test covers the second stop.",
