      "lenses": {
        "trust": {
          "selected": true,
          "status": "completed",
          "request_id": "close-revalidates-state:lens-start:2:0",
          "result_digest": "sha256:3e2add1fc400c0e555e5da99eb92a457fd24ce64f30c8246afbfd73e16c3e9af",
          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/ospec.js:649-660 and scripts/lib/idd-close.js:139-153. Hand-editing state.yaml from open to `status: closed` plus a valid `closed_at` sends close down the resume branch. There requireResumable checks only pending obligations, open gates and signal gaps. requireFreshEvidence (tree-bound evidence of another tree) and requireDerived (signals, gates and references the diff derives) never run, so a two-field edit skips the revalidation this change adds. scripts/ospec.test.js:498-505 shows such a hand-written closed state is archived with exit 0. The comment at idd-close.js:139-143 ('a hand edit to status: closed never skips the revalidation') overstates the guarantee. Impact: code changed after the last passing check can be archived as closed with evidence bound to another tree. Counterevidence: change.md records the tradeoff, since an interrupted close can legitimately find the tree changed by the changelog write. The residual is not stated as a limit.",
                "acceptance_criteria": "A state hand-edited from open to closed (with closed_at) is refused by close, with nothing moved, when a satisfied tree-bound obligation's last evidence names another tree or when the diff derives a signal the state lacks. A close that ospec itself interrupted after the changelog write still resumes. Alternatively, if the residual is accepted, the requireResumable comment and REQ-idd-009 state that resume does not recheck tree freshness or derivation."
              },
              {
                "severity": "SUGGESTION",
                "summary": "scripts/ospec.js:643-657. requireFreshEvidence, closeChange and requireDerived validate the `state` snapshot read at line 643, under the close lock and not the state lock. mutateChange then re-reads `stored` and re-runs only closeChange, which does not check freshness or derivation. requireDerived runs git and closeDelivery writes the changelog between the snapshot and the write, a window that can last seconds in a large repo. A state.yaml edited in that window (a parallel tool call or background shell) is archived without the freshness and derivation checks. This is conditional on an interleaving writer; the sequential flow is unaffected.",
                "acceptance_criteria": "A state.yaml replaced between the first readChange and mutateChange in close is refused (or the validated snapshot is shown unchanged under the state lock) before the state is marked closed. A test replaces the state in that window and asserts the refusal. The changelog-untouched-on-refusal rule still holds, for example by comparing the stored state to the validated snapshot rather than re-running git."
              },
              {
                "severity": "SUGGESTION",
                "summary": "scripts/hooks/pre-tool-use.js:266-297 and internal/hooks/pretooluse.go:301-382. A write-named tool is denied only when a value under file_path, filePath, path, target_file, notebook_path, source or destination, or a patch header matching `*** Add|Update|Delete File: ` or `Move to: `, resolves to an owned file. Not covered: (1) a write tool carrying the path under another key, e.g. an MCP `relative_path` or `filename`, although change.md says MCP writes are covered; (2) a patch header with leading whitespace, if the host patch parser trims lines (Codex's does, unverified here); (3) the directory itself: isCliOwnedPath needs 2+ segments after idd/archive or .ospec/review-receipts and matches only idd/<change>/state.yaml, so a move or delete naming idd/<change> or idd/archive passes, and a forged tree could be moved into place with write-only tools. Impact: the hard deny can be sidestepped without the shell; the close revalidation remains the backstop.",
                "acceptance_criteria": "In both the Node hook and the Go binary, covered by a shared parity fixture, a write-named tool is denied in each of these cases: a move or delete naming idd/<change>, idd/archive or .ospec/review-receipts; a patch header with leading whitespace; an owned path under a key outside the declared set. The existing passing cases still yield no decision: Read, change.md, idd/config.yaml, docs/idd/archive.md and shell cat."
              },
              {
                "severity": "SUGGESTION",
                "summary": "openspec/specs/hooks/spec.md:1813, docs/harness-runtime.md:136 and scripts/configure/validate-cursor.js:33-34,241 declare that Cursor runs pre-tool-use only on beforeShellExecution and beforeReadFile, and that the validator fails otherwise. scripts/configure/install-cursor.js:207-211,294 mirrors those commands onto `preToolUse` and `subagentStart` in the installed ~/.cursor/hooks.json. validateInstalledHooks (validate-cursor.js:248-314) never applies PRE_TOOL_USE_EVENTS; only validateHooks on the pre-install tree does. So the declared invariant is false for every real install, and the stale-declaration check cannot see it. The guard does run on Cursor's generic preToolUse, where a Write may reach the new deny, yet no test feeds a Cursor payload to it. Impact: the 'revalidation-only' coverage is mis-stated in one direction or the other and cannot be relied on.",
                "acceptance_criteria": "The Cursor declaration in the spec, the doc and CLI_OWNED_STATE_GUARD matches what install-cursor.js writes. Either validateInstalled applies the same check and fails on the mirrored events, or the declaration states that Cursor's preToolUse runs the guard. In the second case a test feeds a Cursor preToolUse Write payload for idd/<change>/state.yaml and asserts the deny, or records why it passes."
              }
            ]
          },
          "operation": null,
          "result_request_id": "close-revalidates-state:lens-result:2:1"
        },
