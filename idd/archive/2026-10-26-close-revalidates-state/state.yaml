          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/ospec.js:649-660: close() runs its revalidation (requireFreshEvidence, closeChange signalGaps/canClose, requireDerived) only when state.status === 'open'. A state.yaml hand-edited to status closed plus any closed_at string passes validateState (idd-contract.js:165) and goes straight to archiveChange. A change with pending obligations, open gates or stale evidence is then archived and reported closed. That violates REQ-idd-009, and docs/harness-runtime.md:135 overclaims. The new PreToolUse deny does not stop a shell edit. closed_at is also unvalidated and feeds archiveName (idd-close.js:139-141): '../../../x' makes the destination leave the repo root, and rename moves idd/<id> there. Pre-existing, but it is the two-field shortcut around the control this change adds.",
                "acceptance_criteria": "ospec close on an unarchived change whose state is status closed with a pending obligation, an open gate or a signalGaps entry is refused with close-refused and moves nothing. A state the CLI itself closed and left unarchived still resumes and archives. A closed_at that is not an ISO timestamp (e.g. '../../../x') is refused before archiveName/rename, and nothing outside idd/archive is touched. Each case has a test in scripts/ospec.test.js.",
                "location": "scripts/ospec.js:649"
              },
              {
                "severity": "SUGGESTION",
                "summary": "The CLI-owned write guard (pre-tool-use.js:251-292, pretooluse.go:282-373) recognises less than the CLI treats as its state. (1) idd/<c>/state.yaml.bak is not owned, yet readChange calls recoverOrphanBak (idd-store.js:60, atomic-write.js:10-23), which renames it to state.yaml when state.yaml is absent. A Write of a forged .bak for a new change id therefore becomes a state the CLI reads, closes and archives. (2) WRITE_TOOL_RE names move and rename, but DECLARED_PATH_KEYS has no source/destination. An MCP filesystem move_file whose destination is idd/<c>/state.yaml is not denied, so the move/rename verbs protect nothing. Exposure is low: it needs a new change id or a missing state.yaml, or an MCP move tool. Shell is out of scope by design.",
                "acceptance_criteria": "In both the Node hook and the Go binary, a write tool targeting idd/<change>/state.yaml.bak, and a move/rename tool whose destination key (e.g. destination, new_path, dest) is a CLI-owned path, are denied in default and bypassPermissions. Reads of those paths and writes to idd/<change>/change.md still produce no decision. The JS tests, Go tests and parity fixture cover both cases, and REQ-hooks-029 lists the extra keys and the .bak name.",
                "location": "scripts/hooks/pre-tool-use.js:275"
              }
            ]
          },
