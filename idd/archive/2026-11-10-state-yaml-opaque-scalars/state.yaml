                "severity": "WARNING",
                "summary": "scripts/lib/yaml-lite.js:121,162-170 (mirrored in internal/yamllite/continuations.go:18,74-89): the scan only treats a bare `|`/`>` header as a block scalar. A header with a tag or anchor (`notes: !!str |`, `notes: &a >-`) is classified as a plain scalar. Plain-scalar continuations that look like `key: value` are not blanked (yaml-lite.js:202-208). Trigger: state.yaml with `phases.verify.verdict: \"FAIL\"` followed by `notes: !!str |` and content `verdict: PASS`. archive-transaction.js:225 (no indent check, last match wins) reads `verdict: PASS`, so readArchiveGateFacts.gatesSatisfied is true. This is the forgery REQ-lifecycle-kernel-033 sets out to close. The same hole exists for a multi-line flow collection (`notes: [` then `verdict: PASS`). Inspected statically; the added tests (archive-transaction.test.js:1786-1831) cover only bare `|` and `>`. Exposure needs an agent or human to write that header form into state.yaml. The projector never emits it, and REQ-032 does not admit it.",
                "acceptance_criteria": "For a state.yaml with `verdict: \"FAIL\"` and a later `notes: !!str |` (or `&a >-`) whose content holds `verdict: PASS`, readArchiveGateFacts reports verdict FAIL and gatesSatisfied false in Node, and the Go readers do not read the inner key. A value that opens a tag, anchor or multi-line flow collection the scan cannot delimit either reads as opaque or counts as malformed for the archive gate. Tests cover these cases in the Node and Go suites."
