        "plan": "El formato de state.yaml no cambia y no hay migración: los lectores solo dejan de leer las líneas de un valor (continuaciones de un escalar o de una colección flow multilínea y el valor en la línea siguiente a su clave), así que un state.yaml sin ellos se lee igual que antes; lo prueban, sin tocar sus fixtures, las suites completas del gate de archivado, el proyector, el dispatcher, los hooks JS, yaml-lite y el yamllite, store y hooks de Go. Cambios visibles: una colección flow que nunca cierra (YAML inválido, que el proyector nunca escribe) pasa a malformed-state, como un escalar entrecomillado sin cerrar; el gate de archivado solo cuenta un verdict a cuatro espacios bajo phases.verify, donde lo escribe el proyector. Vuelta atrás: revertir el commit, sin datos que deshacer."
      }
    },
