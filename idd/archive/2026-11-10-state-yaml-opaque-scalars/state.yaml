          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The archive gate still reads a verdict inside a scalar that starts on the line after its key, so REQ-lifecycle-kernel-033 (a key inside a scalar MUST read as absent) is not met for that shape. scripts/lib/yaml-lite.js:185-208 and internal/yamllite/continuations.go:101-140 open a scalar owner only from a `key: value` or `- value` line. Trigger under phases.verify: `verdict: \"FAIL\"`, then `notes:`, then a line `      |`, then `      verdict: PASS`. The empty `notes:` opens no owner, the bare `|` matches no MAPPING_LINE, so the next line stays a real key. readArchiveGateFacts (archive-transaction.js:225-227) keeps the last verdict, reads PASS, and gatesSatisfied is true (:284, used at :977-980). `- - |` and a double-quoted scalar on the next line behave the same. The projector rejects this file (ospec-state.js:785-786) but the gate never runs that validation. REQ-032 calls the form unsupported, yet the gate does not fail closed on it.",
