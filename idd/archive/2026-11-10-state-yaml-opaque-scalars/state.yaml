          "result": {
            "findings": [
              {
                "severity": "CRITICAL",
                "summary": "scripts/lib/yaml-lite.js:198 (Go: internal/yamllite/continuations.go:122). lineScalarValue checks for a leading [ or { only in the '- ' branch (line 194). A flow mapping that starts on the line after its key, and whose first line looks like an entry, is read as a mapping entry, so its inner lines stay visible. Example: 'approvals:\\n  - gate: other\\n    reason:\\n      {x: 1,\\n       gate: quality-gates\\n       ,\\n       decision: override\\n      }'. The line '{x: 1,' matches ENTRY_LINE with key '{x', so the following lines are not blanked. readArchiveGateFacts then reads gate=quality-gates and decision=override, sets overridePresent, and lifts failed quality gates. 'notes:\\n  {x: 1,\\n   classification: trivial\\n  }' also forges the dispatcher classification. This is valid YAML, and it breaks REQ-033, which says a value on the next line is opaque. The tests cover only '[one,' and '|', '>' and quoted values.",
                "acceptance_criteria": "A value starting on the line after its key with '{' or '[' (also after tags or anchors), including a first line shaped like 'k: v', blanks its continuation lines in Node and Go. For the approvals example above, readArchiveGateFacts reports overridePresent=false and gatesSatisfied=false. For the classification example, extractStateRouteInfo does not read the inner classification. Regression tests in yaml-lite.test.js and yamllite_test.go use a '{k: v,' next-line value, and Node and Go agree.",
                "location": "scripts/lib/yaml-lite.js:198"
              },
