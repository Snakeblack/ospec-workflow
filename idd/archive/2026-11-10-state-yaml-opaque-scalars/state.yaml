          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The scanner ends a plain scalar's opacity on any line matching MAPPING_LINE (scripts/lib/yaml-lite.js:127 and :257, internal/yamllite/continuations.go:23 and :199), which accepts a colon NOT followed by a space. In YAML, `verdict:PASS` is plain text and a valid continuation of a multi-line plain scalar. Trigger: `phases.verify.verdict: FAIL` then `notes: text` with continuation line `  verdict:PASS`. The scanner treats it as a key and leaves it visible, so readArchiveGateFacts (archive-transaction.js:225, startsWith('verdict:')) reads PASS and satisfies the archive gate. The dispatcher regexes read `classification:trivial` the same way. A quoted key containing a colon followed by a block scalar (`\"a: b\": |`) fails likewise: it parses as key `\"a` with a plain value, so the block's lines stay visible. This is the exposure REQ-lifecycle-kernel-033 says is closed, via an unhandled valid form. Needs crafted state.yaml text.",
                "acceptance_criteria": "In Node and Go, with `verdict: FAIL` before a `notes: text` whose continuation line is `verdict:PASS` (also `classification:trivial` and `status:active`), the readers read FAIL / the real value and readArchiveGateFacts.gatesSatisfied is false. A `\"a: b\": |` key followed by an indented `verdict: PASS` line reads that line as absent. Tests in both runtimes cover these inputs and keep the existing REQ-033 cases passing."
              },
              {
                "severity": "WARNING",
                "summary": "A value consisting only of tag/anchor properties (`notes: !!str` or `notes: &a`) becomes a plain owner in scalarOwner (yaml-lite.js:200-211, continuations.go:127-147), because withoutProperties returns the original text when nothing remains. YAML allows the block scalar header or an opening quote on the NEXT line after the properties. Trigger: `verdict: FAIL`, then `notes: !!str`, then `  |`, then `    verdict: PASS`. The `|` line is blanked as a plain continuation, but the following `verdict: PASS` line matches MAPPING_LINE and ends the plain owner, so it is read as a key. The gate and the Node and Go readers then read PASS. The same happens with `notes: &a` then `  \"open` then `  verdict: PASS\"`. The properties-then-next-line form is in neither spec scenario nor tests (yamllite_test.go:480-554 covers `g: !!str` followed by plain text only). It sits between the two forms REQ-033 says are opaque (tag before a value, value on the next line). Needs crafted state.yaml text.",
                "acceptance_criteria": "In Node and Go, `verdict: FAIL` followed by `notes: !!str` / `notes: &a` with `|`, `>-` or an opening double quote on the next line and `verdict: PASS` inside it reads FAIL, and readArchiveGateFacts.gatesSatisfied is false. A properties-only value followed by plain text or a nested mapping keeps its current behaviour. Tests in both runtimes cover these inputs."
              }
            ]
          },
