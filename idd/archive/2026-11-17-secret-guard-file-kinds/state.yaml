{
  "schema": "idd-state/v1",
  "change": "secret-guard-file-kinds",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Los guards de secretos dejan tres límites documentados por E1.92: no ven una contraseña sin comillas o solo de letras en un fichero de configuración, no deniegan por nombre una clave privada bajo .ssh que no se llama id_* ni *.key, y deniegan un directorio cuyo nombre empieza por id_ como si fuera una clave",
    "acceptance": "El corpus compartido fija los tres casos en Node y Go: en un fichero de configuración la censura de salida y el pre-commit ven password: valor sin comillas y una contraseña solo de letras; un lector sobre una clave bajo .ssh con otro nombre da deny, y config, known_hosts y *.pub no; rg TODO id_service/ y una herramienta de lectura sobre un directorio id_* no se deniegan; el handbook retira esos límites"
  },
  "facts": {
    "open": [
      "¿Qué ficheros entran en el modo de fichero de configuración? Propuesta: por extensión .yml, .yaml, .ini, .properties, .toml, .conf y .cfg; por nombre appsettings*.json, local.settings.json, config.json, config.<entorno>.json y settings.json; el resto de los JSON queda fuera, porque ahí viven las etiquetas de traducción",
      "Bajo un directorio .ssh, ¿se deniega todo fichero salvo una lista de nombres que no son claves (config, known_hosts, known_hosts.old, authorized_keys, authorized_keys2, *.pub, environment, rc, allowed_signers, revoked_keys), o solo los nombres con forma de clave (*.pem, *.ppk, *key*)?"
    ]
  },
