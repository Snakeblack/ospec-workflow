  "intent": {
    "request": "si y si, soluciona todo con lo recomendado",
    "kind": "bug",
    "summary": "ospec run dice por qué una ejecución en verde no grabó evidencia, y un check o un run fallido guarda su salida completa en un fichero local y lo nombra junto a la cola.",
    "acceptance": "Un ospec run de un par que no graba evidencia imprime el motivo que da ospec check; un check o run fallido nombra un fichero bajo .ospec/ con su salida completa, cuyo hash casa con el grabado; una ejecución en verde no escribe nada y state.yaml no cambia de forma."
  },
  "facts": {
    "open": [
      "¿La salida completa de una ejecución fallida se guarda en .ospec/runs/<cambio>/<run>.log (local, sin versionar, fuera de idd/)?",
      "¿Se guarda solo para los checks y los ospec run fallidos, o también para las contrapruebas sobre la base y los fitness checks de los ADR?",
      "¿Cuándo se borran esos ficheros: al cerrar el cambio con ospec close, o se dejan hasta que el usuario limpie .ospec/?",
      "La salida completa puede contener secretos que hoy no salen del módulo (solo hash y 20 líneas): ¿vale guardarla tal cual porque .ospec/ es local y se ignora a sí mismo, o hay que limitarla?"
    ]
  },
  "plan": {
    "paths": [
      "docs/roadmaps/harness-evolution.md",
