{
  "schema": "idd-state/v1",
  "change": "opencode-plugin-native-ask",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "no, no debemos hacer parches y obviamente hay que solucionar el problema de raiz; lo haremos en la siguiente sesion (E1.26: ask nativo via permission.assert)",
    "kind": "bug",
    "summary": "El bridge del shim opencode colapsa el veredicto ask del guard a bloqueo duro: el agente no puede ejecutar operaciones que el guard solo quiere confirmar (p. ej. un commit con arbol sucio o en la rama por defecto). En OpenCode v2 (>= 2.0.29) el bridge debe pedir permiso nativo con ctx.permission.assert (hook permission.evaluate que escala la accion propia a ask y publica el aviso del guard como message) manteniendo deny como throw; en v1 y en runtimes sin assert se conserva el bloqueo duro.",
    "acceptance": "En OpenCode v2 con el plugin reemitido, un commit del agente con arbol sucio muestra el prompt nativo de permiso con el aviso del guard; al aprobar (once) el commit se ejecuta y al rechazar la llamada falla con el motivo. Un veredicto deny (p. ej. un push forzado) sigue bloqueando sin prompt, y en v1 o runtimes sin permission.assert un ask sigue bloqueando en duro. El validador exige el contrato emitido, con tests que fallan sin el arreglo, y el golden se regenera."
  },
  "facts": {
    "open": [
      "En una runtime OpenCode v2 anterior a 2.0.29 (sin ctx.permission.assert), que debe hacer el bridge ante un ask del guard: mantener el bloqueo duro de hoy (fail-closed, ADR 0008) o degradar a permitir con aviso?",
      "El hook evaluate re-escalara la accion ospec a ask en cada operacion (la politica base del host resuelve allow), asi que la opcion 'permitir siempre' del prompt no silenciara el guard: se pregunta cada vez (paridad v1). Se acepta esa semantica o el plugin debe recordar las aprobaciones 'always' de la sesion?",
      "Que resources deben viajar al assert y al prompt: solo la herramienta (p. ej. bash) o herramienta mas detalle del input (p. ej. el comando)?"
    ]
  },
