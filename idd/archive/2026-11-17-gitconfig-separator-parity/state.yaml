    "kind": "bug",
    "summary": "En Windows, la clasificación de Node no reconoce .git/config escrito con barras normales: compara con path.join('.git','config'), que allí lleva barra invertida, y Go sí lo reconoce con ToSlash. Seis casos del corpus compartido fallan en el CI de Windows",
