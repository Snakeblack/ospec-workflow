{
  "schema": "idd-state/v1",
  "change": "agy-workspace-fallback",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "En agy, pre-tool-use usa el primer workspace absoluto que exista (o un Cwd absoluto existente) y, si no hay ninguno, va por el fallo de inspección en vez de inspeccionar ~/.gemini/config",
    "acceptance": "Con workspacePaths [inexistente, existente] el hijo corre en el existente; sin workspace válido y Cwd absoluto existente corre en el Cwd; sin ningún directorio válido la respuesta es {decision: ask} con el motivo de inspección y el hijo no se lanza"
  },
  "facts": {
    "basis": "El usuario eligió el comportamiento al responder sobre T5 (primer workspace que exista; si no hay ninguno, ask por fallo de inspección), y el código fija el resto: el camino unreadable del adaptador y launcherFailure"
  },
  "plan": {
    "paths": [
      "openspec/specs/hooks/spec.md",
