{
  "schema": "idd-state/v1",
  "change": "cli-dropped-arguments",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "El CLI ospec descarta sin avisar los argumentos que no asigna: --path a b c guarda solo a, y un flag de un solo valor repetido se queda con el último; la skill idd, el next_step de declare-plan y el resumen de sesión enseñan --path <file>...",
    "acceptance": "Una palabra que ningún subcomando toma y un flag de un solo valor repetido son un error de uso (código 2) que nombra el argumento y pide un flag por valor, y no escriben nada; las pistas y la documentación escriben [--path <file>]..., como el uso del CLI"
  },
  "facts": {
    "basis": "El usuario eligió rechazar los argumentos sobrantes (opción A) y los flags de un solo valor repetidos (A1); REQ-idd-011 fija el código 2 y la ayuda del subcomando de un error de uso, y el texto de uso del CLI ya escribe [--path <file>]..."
  },
  "plan": {
    "paths": [
      "internal/iddsession/iddsession.go",
      "internal/testdata/idd-session/many/expected/session/b-docs/session-summary.md",
      "internal/testdata/idd-session/many/expected/session/latest.md",
      "openspec/specs/idd/spec.md",
      "openwiki/idd/flujo-idd.md",
      "scripts/fixtures/context-baseline.json",
      "scripts/lib/idd-next.js",
      "scripts/lib/idd-next.test.js",
      "scripts/ospec.js",
      "scripts/ospec.test.js",
      "skills/idd/SKILL.md"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "El CLI rechaza como error de uso una palabra que ningún subcomando toma y un flag de un solo valor repetido; cuántas palabras toma cada comando sale de sus líneas de uso (record, review y foundation llevan subcomando)",
      "Un flag booleano repetido no se rechaza: no pierde nada",
      "Las pistas del CLI, el resumen de sesión y la documentación escriben un flag por valor, como el uso: [--path <file>]..."
    ]
  },
