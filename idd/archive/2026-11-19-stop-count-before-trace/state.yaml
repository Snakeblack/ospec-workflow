    "kind": "bug",
    "summary": "El Stop vuelve a contar el fin de turno antes de cargar la traza y lo descuenta cuando pide al agente que siga",
    "acceptance": "Un Stop que el plazo del lanzador corta mientras carga la traza ya ha contado el turno; uno que responde decision block deja el contador como estaba, en Node y en Go; node scripts/check.js pasa"
  },
  "facts": {
    "basis": "Lo fijan dos decisiones ya tomadas: el arreglo de v2.168.9 (copilot-stop-deadline) cuenta antes de la traza para que el plazo de Copilot no deje el turno sin contar, y retract-answer-offer exige que un Stop que bloquea no cuente; contar primero y descontar al bloquear cumple las dos"
  },
