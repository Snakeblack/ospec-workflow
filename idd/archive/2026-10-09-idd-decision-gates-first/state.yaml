  "intent": {
    "kind": "bug",
    "summary": "ospec next and the session hooks send the agent to build while an adr-amend-or-contradict or irreversible-operation gate is open, and the IDD protocol never says how to open the ADR gate, so resolving it fails with gate-not-open",
    "acceptance": "With any gate open, next_step is resolve-gate for it (gate order) before the plan and every obligation, in the CLI and in both hook runtimes; the IDD protocol says how to open adr-amend-or-contradict and that a pending_decision is asked first; signals reports a recorded plan"
  },
  "facts": {
    "basis": "REQ-idd-008 makes every gate a user decision taken before the operation, and the destructive-migration fixture's own acceptance says the data loss is approved before it runs; reproduced in a scratch repo (gate-not-open, satisfy-obligation with the ADR gate open)"
