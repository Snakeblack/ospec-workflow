  "change": "idd-evidence-integrity",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Incluye la configuración efectiva de checks en la identidad de evidencia IDD para que close rechace checks obsoletos",
    "acceptance": "Cambiar la lista efectiva de checks después de un ospec check exitoso hace que close rechace la evidencia antigua; volver a ejecutar los checks satisfactorios permite cerrar. Cambiar secciones ajenas a checks o escribir estado legítimo del CLI bajo idd/<cambio>/ no altera la huella. No se añade un guard de estado sin una falsificación válida reproducida."
  },
  "facts": {
    "basis": "OSP-018 documenta una reproducción real donde solo cambia el comando smoke de checks de exit 0 a exit 7, la huella actual permanece igual y close acepta la evidencia vieja. El código define checks ejecutados por nombre/comando/orden en parseIddConfig; comparar esa lista semántica cubre el cambio de verificador sin hacer que campos ajenos de idd/config.yaml ni los archivos de estado bajo idd/ cambien la identidad. El análisis afirma que no se demostró falsificación válida de state.yaml; el guard queda fuera de alcance."
  },
