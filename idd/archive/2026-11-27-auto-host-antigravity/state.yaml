  "changelog_line": "**`ospec auto` en Antigravity** (auto-host-antigravity, E1.110, tramo 5). `ospec auto start --host antigravity` conduce `agy --print=<prompt> --output-format stream-json --mode auto` y reanuda la conversación con `--conversation`, verificado en vivo: delega `open-facts` y cierra el cambio con su commit. Antigravity da los tokens de cada turno y ningún coste, así que admite `--max-tokens`, y el hook `Stop` de ospec cuenta cada fin de turno. Donde la cuenta no tiene `--mode auto`, agy sigue en su modo por defecto, que sin interfaz ejecuta todo lo que su configuración no deniega, y la primera línea de la ejecución lo avisa. Con este tramo, `ospec auto` conduce los seis hosts con modo sin interfaz; VS Code queda `unavailable`. REQ-idd-031 lo fija, y E1.111 entra en el roadmap para que lo denegado nunca corra y lo crítico pare la ejecución en todos los hosts.",
  "closed_at": "2026-11-27T18:19:39.283Z"
