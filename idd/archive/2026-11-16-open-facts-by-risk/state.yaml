        "question": "Cuando una señal de riesgo llega después de abrir una feature que no preguntó nada (por ospec signals, record signal o el diff en check): (A) check la registra y corre como siempre, next se para con un paso \"ask-open-facts\" que pide repetir record intent con al menos un --open-fact, lo que abre open-facts, y close se niega mientras tanto; (B) check y signals se niegan antes de correr nada, como kind-mismatch de E1.44, hasta que el intent pregunte; o (C) el CLI abre ya una entrada open-facts sin preguntas que no se resuelve hasta registrar una. ¿Cuál?"
