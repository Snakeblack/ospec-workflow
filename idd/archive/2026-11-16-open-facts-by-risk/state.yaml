    "summary": "Una feature solo tiene que preguntar al menos una categoría de open-facts cuando el cambio tiene public-contract, persistent-data o security-boundary; sin esas señales basta la cobertura con --cite y --quote, y una de ellas que llegue después vuelve a exigir la pregunta (E1.75).",
    "acceptance": "Una feature sin señales de riesgo se abre y cierra con todas sus categorías citadas; una con public-contract en el plan sigue rechazada sin pregunta; una cuyo diff deriva persistent-data vuelve a exigir una pregunta y abre open-facts antes de poder cerrar."
