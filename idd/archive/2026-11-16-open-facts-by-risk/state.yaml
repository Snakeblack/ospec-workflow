  "changelog_line": "**Una feature solo tiene que preguntar una categoría de open-facts cuando el cambio tiene riesgo** (open-facts-by-risk, E1.75). Con `public-contract`, `persistent-data` o `security-boundary` en el plan, `record intent` sigue exigiendo al menos un `--open-fact`; sin ellas basta la cobertura con `--cite` y `--quote`. Si una de esas señales llega después (`ospec signals`, `record signal` o el diff en `ospec check`), `next` devuelve `ask-open-facts`, `check` pide la decisión sobre `open-facts` y `close` se niega con `facts-unasked` hasta que el `record intent` repetido convierte una cita en pregunta.",
  "closed_at": "2026-11-16T22:45:09.497Z"
}
