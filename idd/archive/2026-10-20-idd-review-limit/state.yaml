  "intent": {
    "kind": "bug",
    "summary": "Tras 3 trust reviews un cambio IDD no tiene salida: la spec dice que la persona decide (REQ-idd-016) pero el CLI no ofrece ningún comando, y volver al candidato aprobado no recupera la aprobación",
    "acceptance": "Con 3 de 3 reviews usadas, una decisión explícita del usuario registrada con el CLI permite seguir y cerrar; un árbol que vuelve al último candidato aprobado deja trust-review satisfecha otra vez"
  },
  "facts": {
    "open": [
      "¿Qué permite la decisión de la persona: aceptar el diff actual sin otra review, autorizar una review sucesora más, o ambas?",
      "¿Se registra como un quinto gate (record gate, enmienda REQ-idd-008 'solo cuatro gates') o como una opción explícita de ospec review start?",
      "¿Volver al árbol del último candidato aprobado debe restaurar trust-review como satisfecha sin decisión del usuario?"
    ]
  },
