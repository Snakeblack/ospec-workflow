          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/lib/claude-router.js:269-279 (withoutCredentials), used by marketplaceSource at :264, is the only guard keeping credentials out of the committed .claude/settings.json (comment at :33). It strips userinfo only for http(s) URLs. A copied `url` from the user's known_marketplaces.json passes through unchanged when its protocol is not http(s) (for example `ssh://user:token@host/repo.git`) or when the secret is in the query string (for example `https://host/repo.git?access_token=...`). installProject then writes it to the repository and prints it from the CLI. The only test (claude-router.test.js:187) covers https userinfo, so these cases are unprotected. Conditional: it needs a user marketplace entry of that shape.",
                "acceptance_criteria": "With a user known_marketplaces.json whose ospec-tools git/url source has (a) a non-http(s) URL with a password in the userinfo, or (b) an http(s) URL with a credential-bearing query parameter, `ospec router install --scope project` writes no secret to .claude/settings.json or to its output. Either the secret part is removed, or the source falls back to PUBLIC_MARKETPLACE. Tests cover both cases, and the existing https userinfo case still passes."
              }
            ]
          },
          "operation": null,
          "result_request_id": "claude-router:lens-result:1:1"
        },
