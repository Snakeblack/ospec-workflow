  "change": "claude-router",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "actualmente si alguien instala el plugin desde \"claude plugin marketplace add https://github.com/snakeblack/ospec-workflow.git#release\" como podria obtener un CLAUDE.md o AGENTS.md actualizado? / lo recomendado / continua",
    "kind": "feature",
    "summary": "Router de Claude Code para quien instala desde el marketplace: fichero ~/.claude/rules/ospec-workflow.md, CLI ospec router, aviso en SessionStart y refresco tras actualizar el plugin",
    "acceptance": "Con el plugin instalado desde el marketplace y sin router, el primer arranque muestra un aviso; ospec router install escribe ~/.claude/rules/ospec-workflow.md (o .claude/rules/ con --scope project), off/remove lo quitan, status lo informa; tras subir la versión del plugin el hook refresca el fichero que escribió ospec; setup:claude migra el bloque de ~/.claude/CLAUDE.md; ospec doctor apunta a ospec router; node scripts/check.js en verde"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "ospec router install --scope project escribe el marketplace ospec-tools en .claude/settings.json: ¿qué source? Recomiendo copiar el registrado en known_marketplaces.json si es remoto (github, git o url) y, si es local (directory o file, instalación desde un checkout), escribir el público {source: git, url: https://github.com/snakeblack/ospec-workflow.git, ref: release}; un settings.json que no sea JSON válido hace fallar el comando sin tocar nada"
      },
      {
        "category": "uniqueness",
        "question": "Con el bloque antiguo en ~/.claude/CLAUDE.md, recomiendo que ospec router install y setup:claude escriban ~/.claude/rules/ospec-workflow.md y quiten el bloque (migración), y que el hook nunca migre y cuente el bloque como router presente (sin aviso); el aviso router-duplicate del doctor pasa a mirar también el fichero de reglas"
      },
      {
        "category": "persistence",
        "question": "(a) Recomiendo que off quite el router y guarde el no (lo que hoy hace --no-router) y que remove lo quite y borre el estado (para antes de desinstalar; el aviso volvería); el estado vive en <config>/plugins/data/ospec-workflow-ospec-tools/router.json y el CLI, que no recibe CLAUDE_PLUGIN_DATA, lo calcula desde el directorio de configuración. (b) Hoy ospec doctor mira siempre ~/.claude aunque CLAUDE_CONFIG_DIR apunte a otro sitio; recomiendo que todas sus comprobaciones de Claude usen el mismo resolvedor que el router, para que no discrepen. ¿De acuerdo con ambas?"
      },
      {
        "category": "copy",
        "question": "(a) Recomiendo una línea en inglés, como los demás mensajes de hooks y del CLI, en cada arranque (source startup) mientras falte el router y no se haya dicho no, nada en resume, clear ni compact: 'ospec-workflow: the router is not installed, so IDD is not the default flow. Run ! ospec router install, or ! ospec router off to stop this notice.' (b) Recomiendo quitar del plan la skill router, porque ! ospec ya funciona en la sesión (Fase 0, S5) y Claude puede ejecutar ospec router por Bash si se lo pide el usuario, mientras que una skill solo de Claude exige un mecanismo nuevo para excluirla de los otros seis destinos. ¿Valen ambas?"
      },
      {
