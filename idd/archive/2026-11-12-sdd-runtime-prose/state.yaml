  "intent": {
    "kind": "bug",
    "summary": "PR4c de la review general: la prosa SDD nombra el runtime instalado y no rutas relativas al proyecto; apply-resume distingue ids con varios niveles; el runner de recheck se distribuye; la fase handbook es enrutable y la tabla de fases del orquestador está completa",
    "acceptance": "En el árbol generado de cada host ninguna instrucción SDD manda ejecutar node scripts/..., require('./scripts/...') ni <pluginInstallRoot>, sino el directorio del runtime instalado (${CLAUDE_PLUGIN_ROOT} en Claude, el marcador que renderiza el instalador en el resto); resolveRemainingTasks trata 1.2.1 y 1.2.2 como tareas distintas y devuelve aparte las casillas cuyo id no reconoce; verify-lineage-recheck.js llega al runtime distribuido y sdd-apply/sdd-verify lo citan por ruta; una ruta con la fase handbook pasa validateRouteTable y la tabla de fases del orquestador lista todas las fases que delega"
  },
  "facts": {
    "open": [
      "Hallazgo 4: ¿el CLI fino ospec sdd <op> (las ~20 funciones del runtime que la prosa manda llamar sin CLI) entra en esta PR, o esta PR arregla las rutas y el CLI va en una PR propia justo detrás (4c2)?",
      "Hallazgo 12: ¿handbook pasa a ser fase de enrutado como foundation (KNOWN_PHASES, señal --handbook en route-dispatch-run, ruta handbook en la tabla) o queda fuera del enrutado como delegación directa, igual que sdd-onboard y sdd-reconcile?",
      "Hallazgo 8: ¿solo cuentan los ids numéricos con puntos que genera sdd-tasks (1.2.1) y cualquier otra casilla (T-3, sin id) se devuelve como no reconocida, o también se aceptan ids alfanuméricos como T-3?"
    ]
  },
