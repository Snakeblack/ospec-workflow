{
  "schema": "idd-state/v1",
  "change": "knowledge-memory-loop",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "ADR, TSR, DC y aprendizajes se reflejan en la memoria entre sesiones con procedencia y revisión; al empezar un cambio se recuperan las decisiones previas relacionadas, sin que la memoria sea autoridad ni su caída bloquee (E3.5)",
    "acceptance": "Un cambio nuevo cita una decisión previa relevante encontrada en memoria y la contrasta con el disco; sin memoria, IDD, SDD y foundation se comportan igual"
  },
  "facts": {
    "open": [
      "¿Dónde vive el algoritmo de qué reflejar: lo deriva la CLI desde el disco (ospec close --json devuelve los registros con procedencia y el agente solo los guarda) o lo redacta el agente en prosa?",
      "¿Qué registros se reflejan y con qué granularidad (una entrada por DC, por impacto declarado, por ADR/TSR nuevo) y de dónde salen los aprendizajes sin añadir una sección nueva al documento vivo?",
      "¿Qué procedencia lleva cada registro (ruta en disco, change, fecha, commit) y qué significa revisión: clave de tema estable con upsert y re-guardado al detectar divergencia?",
      "¿Cuándo y con qué consulta se recupera la memoria al empezar un cambio: antes de listar los open facts, con las palabras de la petición y los ADR o componentes del código que toca?",
      "¿Dónde queda la cita y el contraste de una decisión recuperada: en Decisions del documento vivo o en state.yaml mediante una orden nueva?",
      "¿Qué se hace cuando lo recordado contradice el disco o la ruta ya no existe: avisar, gana el disco y se re-guarda o se marca obsoleto?",
      "¿Qué modos cubre: IDD, SDD (addendum de memoria del orquestador) y foundation (ADR y TSR que escribe), o solo IDD?",
      "¿Cómo se hace sitio en la skill idd (11 909 de 12 288 bytes): referencia aparte cargada bajo demanda o recorte del texto actual?",
      "¿Versión minor y un único PR?"
    ]
  },
