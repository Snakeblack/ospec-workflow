        "question": "Si la huella no se puede calcular (git falla, no hay repositorio, se agota el plazo del hook) o el estado de un cambio no se lee, propuesta: Stop no pide seguir, devuelve continue con un systemMessage que dice por qué, y SessionStart inyecta lo que pudo leer. ¿Y un interruptor que apague la petición y la inyección, DISABLE_IDD_NUDGE=true en el entorno como DISABLE_GIT_COLLABORATION_GUARD, o ninguno?"
      }
