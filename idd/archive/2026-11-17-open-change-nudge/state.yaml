  "intent": {
    "request": "continua",
    "kind": "feature",
    "summary": "El Stop de cada host pide al agente que siga, una sola vez por cambio y huella, cuando un cambio IDD abierto que la sesión tocó tiene trabajo pendiente y ningún gate abierto; SessionStart inyecta al modelo el paso de cada cambio IDD abierto, también sin openspec/config.yaml (E1.51).",
    "acceptance": "Con un cambio IDD abierto con obligaciones pendientes, sin gates abiertos y el árbol cambiado en la sesión, el Stop de cada uno de los 7 targets devuelve la petición de seguir en el formato de su host, y un segundo Stop con la misma huella devuelve continue; con un gate abierto, sin cambios en la sesión o con la marca de continuación del host no pide nada; SessionStart en un proyecto con idd/ y sin openspec/config.yaml entrega al modelo el paso de cada cambio abierto; los validadores de los targets fijan la matriz y Node y Go dan la misma salida."
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué pasos de ospec next piden seguir al terminar el turno? Propuesta: satisfy-obligation, declare-plan y también close (todo satisfecho pero sin cerrar, justo el caso que la sesión siguiente no ve); no piden seguir resolve-gate (parada legítima) ni configure-checks (espera que el usuario apruebe el comando de checks). Con varios cambios abiertos, una sola petición que nombra cada cambio con uno de esos pasos."
      },
      {
        "category": "uniqueness",
        "question": "¿Qué cuenta como el mismo árbol y como que el árbol cambió en la sesión? Propuesta: la huella de readTreeFingerprint (HEAD, diff y no rastreados, sin idd/) más el estado de cada cambio abierto, así que resolver un gate o registrar evidencia y parar también cuenta; la línea base es la huella que guarda el inicio de la sesión (SessionStart, o el primer beforeSubmitPrompt en Cursor) y, si falta, la del primer Stop de esa sesión, que entonces no pide nada. Una huella ya pedida no vuelve a pedir nunca, en ninguna sesión."
      },
      {
        "category": "persistence",
        "question": "La línea base de cada sesión y las huellas ya pedidas se guardan en un fichero de .ospec/ (fuera de git), recortado a las sesiones más recientes. Si falta o está corrupto, ¿se empieza de cero como .ospec/turns (como mucho una petición repetida una vez) o Stop calla hasta que la sesión vuelva a tener línea base?"
      },
      {
        "category": "copy",
        "question": "La petición de seguir va en inglés, como el resto del texto para el modelo: cada cambio con su paso (la línea de describeStep) y dos salidas, si paraste para esperar una respuesta del usuario dilo y vuelve a terminar el turno, y si el cambio está sustituido o descartado pregunta al usuario por ospec abandon. Al inicio de la sesión, ¿el paso va solo al modelo o también una línea visible para el usuario (systemMessage, como los avisos de seguridad y de git) en los hosts que la muestran?"
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "docs/roadmaps/harness-evolution.md",
          "line": 1093
        }
      },
