            "findings": [
              {
                "severity": "WARNING",
                "summary": "The narrower commit scanner now lets through credentials that the previous pre-commit blocked. scripts/hooks/lib/secret-scan.js:72-84,132-139,177 (mirrored in internal/hooks/secretscan.go:86-122,155) gives machine names (token, a qualified key) the redaction's isStrictSecret check. That check rejects any `:` and treats a dotted identifier as a placeholder. A key after a word that is not a qualifier is no longer sensitive at all. detectSecret (secret-redact.js:276-278) uses the same rules, so these lines now pass the pre-commit and no longer trigger the PreToolUse write/read ask: `bot_token = \"<digits>:<35 chars>\"` (Telegram format), `DISCORD_TOKEN = \"<b64>.<b64>.<b64>\"` without `-`, `azure_openai_key = \"<32 hex>\"`, `algolia_admin_key = \"<opaque>\"`. The 2.179.1 scanner blocked all of them, and the handbook limits do not say they are now missed.",
                "acceptance_criteria": "internal/testdata/secret-guards/cases.json pins, for Node and Go, the answer for three lines: a Telegram-format `bot_token = \"<digits>:<35 alnum>\"`, a Discord-format value `<b64>.<b64>.<b64>` without `-` under a token name, and a `<vendor>_key = \"<32 hex>\"` whose prefix is not a qualifier. Either the pre-commit blocks each of those lines (false positives can still be cleared with ospec:allow-secret) and the cache_key/sortKey hash cases keep passing, or every shape deliberately left undetected is named as not detected in handbook/proteccion/guardrails.md \"Qué no cubren\" and in openspec/specs/agent-shield-security/spec.md.",
                "location": "scripts/hooks/lib/secret-scan.js:177"
              },
              {
                "severity": "WARNING",
                "summary": "The shell deny ignores code that runs inside a word. scripts/hooks/lib/shell-file-access.js:168,177-179,187 (mirrored in internal/hooks/shellfileaccess.go:303,317-324,344) drops every word of a NAME_ONLY command and every word with blanks. It treats interpreter code as code only after an exact -c, -e, --eval, -p or -r. So `echo $(cat ~/.ssh/id_rsa)`, `` echo `cat ~/.ssh/id_rsa` ``, `printf '%s\\n' $(cat ~/.ssh/id_rsa)`, `KEY=\"$(cat ~/.ssh/id_rsa)\" env` (the quoted form of the corpus case that denies) and `node -pe \"require('fs').readFileSync('.npmrc', 'utf8')\"` all get deny=false and run without objection, also in bypassPermissions. For the unquoted echo/printf forms the redaction fallback fails too: word splitting removes the line break after the PEM header that PRIVATE_KEY_BLOCK (secret-redact.js:58) needs, so the key body reaches the model. On hosts without output rewriting, every form listed here leaks.",
                "acceptance_criteria": "The shared corpus holds `echo $(cat ~/.ssh/id_rsa)`, `` echo `cat ~/.ssh/id_rsa` ``, `printf '%s\\n' $(cat ~/.ssh/id_rsa)`, `KEY=\"$(cat ~/.ssh/id_rsa)\" env` and `node -pe \"require('fs').readFileSync('.npmrc', 'utf8')\"` with deny: true. These cases pass in Node and Go and produce a PreToolUse deny in both default and bypassPermissions. The existing allow cases (`echo \"*.key\" >> .gitignore`, the commit message naming .npmrc and id_rsa, `rsync -e \"ssh -i ~/.ssh/id_deploy\"`, `ssh -i`, `chmod 600`) keep deny: false.",
                "location": "scripts/hooks/lib/shell-file-access.js:179"
              },
              {
                "severity": "SUGGESTION",
                "summary": "PostToolUse switches to sensitive-file mode only for the file operands of READERS commands (scripts/hooks/post-tool-use.js:28-30, internal/hooks/posttooluse.go:36-38). A command that prints an ask-class file through code (`python3 -c \"print(open('.env').read())\"`, `node -pe \"require('fs').readFileSync('.env', 'utf8')\"`, `perl -pe 1 .env`) gets no PreToolUse ask, because the named-file recognizer only feeds the deny. Its output is redacted in normal mode, so a .env line whose name normal mode does not classify (`MAILGUN_KEY=key-<32 alnum>`, `ALGOLIA_ADMIN_KEY=<hex>`) reaches the model unredacted. `cat .env` redacts the same line through isOpaqueValue.",
                "acceptance_criteria": "In Node and Go, a Bash PostToolUse whose command prints a .env through `python3 -c`, `node -pe` or `perl -pe` redacts a `MAILGUN_KEY=key-<32 alnum>` line exactly as `cat .env` does. A command that does not name an ask-class file keeps normal mode.",
                "location": "scripts/hooks/post-tool-use.js:29"
              }
            ]
