          "acceptance_criteria": "In Node and Go, with entries in internal/testdata/secret-guards/cases.json: `(cd ~ && cat .npmrc)`, `(cat server.key)`, `cd repo && (cat .git/config)` and `diff <(cat .npmrc) /dev/null` give deny. `(cat .env)` and `(cd app && cat secrets.json)` list the file among the files read, so PreToolUse asks and PostToolUse redacts in sensitive-file mode. `(cd sub && npm test)` and `(ls -la ~/.ssh)` make no objection.",
          "location": "scripts/hooks/lib/shell-file-access.js:292",
          "blocking": true,
          "resolution": "unresolved"
        },
        {
          "id": "F-cdbbb0486f7309ed",
          "owner": "trust",
          "severity": "WARNING",
          "summary": "A glob under ~/.ssh whose name is not itself an `id_` name reads every private key with no deny, in Node and Go alike. Examples: `cat ~/.ssh/*`, `head -n 99 ~/.ssh/id*`, `grep -h . ~/.ssh/i*`. The basename of the reader operand (`*`, `id*`) does not start with `id_`, so classifySensitiveFile returns null (secret-scan.js:219-223, secretscan.go:195-199). namesSshKey requires that classification before it checks the `.ssh` directory, so it returns false too (shell-file-access.js:399-404, shellfileaccess.go:718-730). Only `id_*` is covered (cases.json:70). The handbook says a key under `.ssh/` is blocked as an argument of any command and with a wildcard (guardrails.md:61-62). On VS Code, Copilot, Cursor and Antigravity nothing redacts the output.",
          "acceptance_criteria": "In Node and Go, with entries in the shared corpus: `cat ~/.ssh/*`, `head ~/.ssh/id*` and `sort $HOME/.ssh/i*` give deny. `cat ~/.ssh/*.pub`, `cat ~/.ssh/config`, `ls ~/.ssh/*` and `chmod 600 ~/.ssh/*` make no objection.",
          "location": "scripts/hooks/lib/shell-file-access.js:400",
          "blocking": false,
          "resolution": "advisory"
        },
        {
          "id": "F-da88e6c3de0bddf9",
          "owner": "trust",
          "severity": "WARNING",
          "summary": "The `id_` name rule treats any path that exists as a private key, directories included. Ordinary commands get a hard deny, which bypassPermissions cannot lower. For an `id_` word with no extension, namesSshKey returns `exists(file)` (shell-file-access.js:403-404). fileExistsIn uses fs.existsSync (:428), which is true for a directory, and Go uses os.Stat (shellfileaccess.go:770-775), which behaves the same. In a workspace with an `id_service/` directory, `cd id_service && npm test`, `go test ./id_service`, `git add id_service` and `pytest id_service` are denied as reading a private key. classifyNamedFile (:381-391) does the same for inline code that names the directory. The spec says such a name counts only when it 'existe como fichero' (spec.md:33, :35).",
          "acceptance_criteria": "With an `id_service/` directory in the workspace, `cd id_service && npm test`, `go test ./id_service` and `git add id_service` make no objection in Node and Go. With a regular file `id_deploy`, `openssl rsa -in id_deploy -text` is still denied (spec.md:62).",
          "location": "scripts/hooks/lib/shell-file-access.js:428",
          "blocking": false,
          "resolution": "advisory"
        },
        {
          "id": "F-e4ab1e61e04bdd93",
          "owner": "trust",
          "severity": "WARNING",
          "summary": "Neither guard sees the most common YAML and INI form, a lowercase name with an unquoted value, and the handbook does not list it as a limit. Examples: a staged `config/application.yml` line `  password: S3cr3tP4ss!`, or a `settings.ini` line `aws_secret_access_key = wJalr…`. The scanner needs a quoted value (secret-scan.js:181). UPPER_COLON_ASSIGN and DOTENV_ASSIGN need an uppercase name (secret-redact.js:67-68). CONNECTION_PAIR needs `=` with no blanks (:77). SENSITIVE_FILE_ASSIGN runs only for files the pre-commit already rejects by name. So detectSecret (:286-288) lets the commit through, and PostToolUse shows the value (post-tool-use.test.js:51-56 asserts this). The 'Qué no cubren' section of guardrails.md (:80-87) names letters-only passwords and secrets without a keyword, but not this case, although the acceptance asks the handbook to describe the limits of the guards.",
          "acceptance_criteria": "Either: the pre-commit blocks a staged unquoted line `  password: <secret-shaped value>` (YAML) and `secret_key = <opaque value>` (INI), with corpus entries in internal/testdata/secret-guards/cases.json that Node and Go both pass, and `  password: required` still passes. Or: the 'Qué no cubren' section of guardrails.md and the spec state that a lowercase name with an unquoted value, outside a file classified by name, is neither blocked at commit nor redacted in the output.",
          "location": "scripts/hooks/lib/secret-redact.js:287",
          "blocking": false,
          "resolution": "advisory"
        },
        {
          "id": "F-d3122cfbb5965ae1",
          "owner": "trust",
          "severity": "SUGGESTION",
          "summary": "The rule that denies an SSH key named by any word now gives a hard deny, also in bypassPermissions, to ordinary commands that use a private key without printing it but are not in the closed NAME_ONLY list (shell-file-access.js:32, shellfileaccess.go:174). Examples: `ssh-copy-id -i ~/.ssh/id_ed25519 user@host` (ssh-copy-id reads only the matching .pub), `ansible-playbook --private-key ~/.ssh/id_deploy site.yml` and `ansible all -m ping --private-key=~/.ssh/id_rsa`. None of them was denied before this change, since they are not readers.",
          "acceptance_criteria": "`ssh-copy-id -i ~/.ssh/id_ed25519 user@host` and `ansible-playbook --private-key ~/.ssh/id_deploy site.yml` make no objection in Node and Go, with corpus entries. The spec and handbook lists of commands that use a key without printing it name them. `cat ~/.ssh/id_ed25519` is still denied.",
          "location": "scripts/hooks/lib/shell-file-access.js:32",
          "blocking": false,
          "resolution": "advisory"
        }
