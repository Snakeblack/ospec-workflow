          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "Gen-1 finding 1 is fixed for only one way of writing the line. A `key` with an unknown prefix (`azure_openai_key`) is class `unqualified` (secret-scan.js:89-94). Only the scanner acts on that class, and its regex needs an unquoted name and a quoted value (secret-scan.js:181). The redaction half of detectSecret (secret-redact.js:277-279) skips the class by design (secret-redact.js:86-102; secretredact.go:80-110). So these added lines give detectSecret null and commit: `\"azure_openai_key\": \"<32 hex>\"` (JSON), `ENV AZURE_OPENAI_KEY=<32 hex>` (Dockerfile, compose or export) and `AZURE_OPENAI_KEY: <32 hex>` (workflow YAML). The corpus fixes only the `name = \"…\"` form (secret-guards/cases.json:15-16), and guardrails.md:83 says such a key «se bloquea en el commit».",
                "acceptance_criteria": "Take an added line that assigns an opaque token (16+ alphanumerics with a letter and a digit) to an `unqualified` name. findAddedSecret returns a finding for it in three forms: a quoted JSON key, `NAME=value` (Dockerfile ENV, compose, export) and `NAME: value` YAML. Shared corpus cases cover all three. Normal-mode redaction of those lines stays empty, so PostToolUse behaviour does not change. Hash-valued `cache_key` and `sort_key` lines still pass. Alternatively, guardrails.md and the agent-shield spec say exactly which forms of an unqualified key the commit blocks.",
                "location": "scripts/hooks/lib/secret-redact.js:277"
              },
              {
                "severity": "SUGGESTION",
                "summary": "The substitution walk that fixes gen-1 finding 2 tracks quotes on its own. Unlike shellTokens, it does not know about comments, heredoc bodies or `$'…'` (shell-file-access.js:139-165; shellfileaccess.go:242-302). An apostrophe earlier in the command opens a false single quote that hides every later `$(…)` or backtick. Example: `# it's the key\\necho $(cat ~/.ssh/id_rsa)`. No substitution is found, the words belong to `echo` (NAME_ONLY), and echo is not a reader. So namesDeniedFile is false, and the hook neither denies nor asks. Unquoted echo puts the key on one line, so PRIVATE_KEY_BLOCK (secret-redact.js:59) does not redact it and the model receives the private key. The same happens after `Don't` in a heredoc body or after `$'it\\'s'`. The spec (spec.md:32,42) and guardrails.md:61 promise the deny.",
                "acceptance_criteria": "namesDeniedFile is true in Node and Go, with cases in secret-guards/cases.json, for: `# it's the key\\necho $(cat ~/.ssh/id_rsa)`; a quoted-delimiter heredoc whose body has an apostrophe, followed after the delimiter by `echo $(cat ~/.ssh/id_rsa)`; and `echo $'it\\'s' $(cat ~/.ssh/id_rsa)`. `cat <<EOF\\n$(cat ~/.ssh/id_rsa)\\nEOF` stays denied (unquoted delimiter, so bash runs the substitution). `echo '$(cat id_rsa)'` and the existing heredoc-is-data cases keep deny false.",
                "location": "scripts/hooks/lib/shell-file-access.js:139"
              }
            ]
          },
