      "answer": "te pongo un ejemplo, en un appsettings, hay cosas que estaria bien que el modelo lea, por el cual no quiero denegar su lectura, sin embargo quiero censurar secrets, keys, connection strings, passwords, etc, este mensaje lo fui escribiendo antes de las preguntas, y las preguntas las respondo con las recomendadas. [Las recomendadas eran la opción A de cada una: 1) key y token en cualquier nombre y pass a secas exigen forma de secreto; password, passwd, secret, contraseña y *_pass siguen con 6+ caracteres. 2) marcador en la propia línea que solo respeta el pre-commit, y el mensaje de bloqueo da el número de línea. 3) deny en cualquier comando salvo una lista fija que usa el fichero sin imprimirlo, mirando también el código en línea de los intérpretes. 4) más lectores para los ficheros que piden confirmación; source y los intérpretes quedan como límite documentado.]",
