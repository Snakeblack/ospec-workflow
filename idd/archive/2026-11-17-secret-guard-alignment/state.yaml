          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "A standalone `(` or `{` before the first command hides a reader, in both Node and Go. walkCommands calls commandName('(') or commandName('{'). ungroup turns both into '' (shell-file-access.js:133-150), so the command name becomes ' ' (line 191) and `cat` is treated as an ordinary word. The '{' entry in WRAPPERS (line 34, shellfileaccess.go:176) can never match. As a result `( cat .npmrc )`, `{ cat server.key; }` and `cd app && ( cat .git/config )` get no deny. `( cat .env )` and `{ cat .env; echo; }` get no ask and no sensitive-file redaction (post-tool-use.js:21-35), so `.npmrc` lines such as `_auth=...` or a legacy UUID `_authToken=...` reach the model unredacted. spec.md:31-32 says a reader inside a subshell between parentheses is covered. Only `(cat ...)` written against the parenthesis and `(cd ... && cat ...)` work today.",
                "acceptance_criteria": "In Node and Go, namesDeniedFile gives deny for `( cat .npmrc )`, `{ cat server.key; }` and `cd app && ( cat .git/config )`. shellReadFiles returns `.env` for `( cat .env )` and `{ cat .env; echo; }`, so PreToolUse asks and PostToolUse uses sensitive-file mode. `( cd sub && npm test )` and `{ npm test; }` stay allowed. These cases are in internal/testdata/secret-guards/cases.json and pass in both corpus tests.",
                "location": "scripts/hooks/lib/shell-file-access.js:191"
              },
              {
                "severity": "WARNING",
                "summary": "The content scan of a file that a shell command reads never runs when the operand starts with `~/`. pre-tool-use.js:557 resolves each shellReadFiles path with path.resolve(workspace, file), and pretooluse.go:1260-1266 uses filepath.Abs. Neither expands `~`, so `~/.git-credentials` becomes `<workspace>/~/.git-credentials`. scanFileForSecrets (pre-tool-use.js:599, pretooluse.go:1325) cannot stat that path, and the ask that spec.md:28-31 requires for a read file holding API-key patterns is skipped. fileExistsIn (shell-file-access.js:456-465) and shellFileExists (shellfileaccess.go:826-840) already expand `~`. Example: `cat ~/.ssh/aws-prod.pem` (PEM header) or `cat ~/.config/gh/hosts.yml` (a gho_ token) gets no deny and no ask, while the same file by absolute path asks (pretooluse_test.go:127-145). On VS Code, Copilot, Cursor and Antigravity (guardrails.md:88) that ask is the only guard.",
                "acceptance_criteria": "With HOME set to a temp directory that holds a file with a known token (for example `sk-` plus 48 characters), running `cat ~/notes.txt` as a Bash command gives ask in Node and Go, just as `cat /abs/notes.txt` already does. `cat ~/.ssh/id_rsa` still gives deny. An operand with `$HOME/` may keep its by-name-only behaviour.",
                "location": "scripts/hooks/pre-tool-use.js:557"
              },
              {
                "severity": "SUGGESTION",
                "summary": "A private key under `~/.ssh` whose name is neither `id_*` nor `*.key` is not treated as an SSH key. Examples: `~/.ssh/aws-prod.pem` (the usual place for an AWS EC2 key) or `~/.ssh/deploy_key`. classifySensitiveFile (secret-scan.js:219-223, secretscan.go:195-199) only knows those two name patterns, and namesSshKey returns false before it checks the `.ssh` directory (shell-file-access.js:432-434, shellfileaccess.go:783-789). So `openssl rsa -in ~/.ssh/aws-prod.pem -text` and `cat ~/.ssh/aws-prod.pem` get no deny. The handbook says an SSH key under `.ssh/` is blocked as an argument of any command (guardrails.md:62), and the spec mentions a file under a .ssh directory (spec.md:33).",
                "acceptance_criteria": "Either: `cat ~/.ssh/aws-prod.pem` and `openssl rsa -in ~/.ssh/aws-prod.pem -text` give deny in Node and Go, `cat ~/.ssh/config`, `cat ~/.ssh/known_hosts` and `cat ~/.ssh/*.pub` stay allowed, and all of these are shared corpus cases. Or: guardrails.md and spec.md say that only `id_*` and `*.key` names count as SSH keys, and list a key with any other name under the documented limits."
              },
              {
                "severity": "SUGGESTION",
                "summary": "A reader operand that is a directory whose name starts with `id_` gets a hard deny. The reader path classifies operands with classifySensitiveFile (shell-file-access.js:452, shellfileaccess.go:813-815), which treats any extensionless `id_` name as a private key, even with a trailing slash. So `rg TODO id_service/`, `grep -rn TODO id_service` and `diff -r id_v1 id_v2` are denied, also in bypassPermissions. The spec says a directory `id_service/` is not a key (spec.md:33, 55), and the any-word path already requires a regular file (shell-file-access.js:399-409, 430-437). rg and diff are readers added by this change. The handbook limits the existence check to non-readers (guardrails.md:64), so this is a design gap, not a contradiction.",
                "acceptance_criteria": "With a directory `id_service/` in the workspace, `rg TODO id_service/` and `grep -rn TODO id_service` are not denied in Node or Go, while `cat id_deploy` (a regular file), `cat id_rsa` and `cat ~/.ssh/id_*` still give deny."
              },
              {
                "severity": "SUGGESTION",
                "summary": "Node and Go classify a file named exactly `.key` differently. In Node, path.extname('.key') is '' (secret-scan.js:217), so the ext === '.key' test fails and the file is not classified. In Go, filepath.Ext('.key') is '.key' (secretscan.go:193), so it is a private key. `cat .key` is therefore denied by the Go hook and allowed by the Node fallback. The shared corpus does not cover this case, although spec.md:181 and docs/harness-go-js-parity.md:32-45 require the two to agree.",
                "acceptance_criteria": "classifySensitiveFile('.key') returns the same result in Node and Go, and a `cat .key` case in internal/testdata/secret-guards/cases.json passes in both corpus tests."
              }
            ]
          },
