      "Pre-commit: con la unión de escáner y censura, ¿cómo pasa un ejemplo legítimo que alguno marca (fixture de test, URL de base de datos local en un workflow)? Solo con DISABLE_AGENT_SHIELD, como hoy, o con un marcador en la propia línea",
      "Shell: un fichero denegado por nombre (clave privada, .npmrc, .git/config) como operando de cualquier comando, ¿admite excepciones para los comandos que lo usan sin imprimirlo (ssh -i, ssh-add, ssh-keygen, chmod, ls, rm) o se deniega siempre?",
