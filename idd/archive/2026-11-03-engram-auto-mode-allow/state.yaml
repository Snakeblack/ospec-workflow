      "id": "0001",
      "impact": "none",
      "reason": "El cambio toca el paso Engram del instalador de Claude, que configura una herramienta de terceros después de instalar, y el doctor; no cambia la fuente canónica, ninguna transformación por target ni ningún árbol generado ni golden."
    },
    {
      "kind": "adr",
      "id": "0010",
      "impact": "conforms",
      "reason": "El módulo nuevo del runtime, scripts/lib/engram-claude-allow.js, no requiere nada, ni siquiera la biblioteca estándar, y el paso del instalador y el doctor solo usan node:path y los helpers que ya existían; no se añade ninguna dependencia ni se toca el binario de los hooks."
    },
    {
      "kind": "scenario",
      "id": "offline-operation",
      "impact": "conforms",
      "reason": "No añade llamadas de red: el paso del instalador lee y escribe el settings.json local y el doctor solo lo lee. El CLI, los hooks y las skills del flujo IDD no cambian, así que next, check y close dan lo mismo sin red ni memoria."
    },
    {
      "kind": "scenario",
      "id": "target-parity",
      "impact": "none",
      "reason": "No cambia ninguna skill, agente ni hook de la fuente canónica ni ningún árbol generado: el paso de Engram del instalador y el doctor no forman parte de la salida del generador, y cli.test.js sigue pasando dentro de node scripts/check.js."
    }
  ],
