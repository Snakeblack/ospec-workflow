  "intent": {
    "kind": "feature",
    "summary": "El paso Engram de los instaladores avisa cuando hay una versión de engram más nueva que la instalada, sin descargar ni actualizar nada",
    "acceptance": "Con engram 3.3.2 instalado y 3.4.0 publicada, npm run setup:<target> imprime en la fase Engram una línea con ambas versiones y el comando para actualizar; sin red, con la versión al día o desactivado, el instalador termina igual que hoy"
  },
  "facts": {
    "open": [
      "¿De dónde sale la última versión: la API de releases de GitHub (la misma que usa engram), brew outdated u otra fuente?",
      "¿Qué timeout tiene la consulta y qué se muestra si falla (sin red, rate limit, respuesta ilegible): nada, o una nota solo con --verbose?",
      "¿Qué comando de actualización se sugiere: según dónde está el binario (Homebrew, go install, otro) o siempre el enlace a la release?",
      "¿Cómo se desactiva: ENGRAM_NO_UPDATE_CHECK de upstream, --no-engram, un flag nuevo o varios?",
      "¿Se muestra algo cuando engram está al día o la instalada es más nueva que la publicada?",
      "¿Aparece en los siete targets y también en ospec doctor, o solo en los instaladores?"
    ]
  },
