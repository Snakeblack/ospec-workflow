                "summary": "At lines 207-233, a pre-tool-use call whose workspace is missing, not a string, or not an existing directory is still sent to the policy. `adapted.cwd` is then undefined, so spawnSync inherits agy's cwd, the hooks.json directory. Relative operands are resolved against the wrong directory, and the call is not asked about.",
