          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The adapter maps only path keys. It does not map agy's content argument (CodeContent), so the secret and redaction-marker body checks never run on agy file writes.",
                "acceptance_criteria": "A PreToolUse payload `{toolCall:{name:'write_to_file',args:{TargetFile:<new file>,CodeContent:<text with a known token>}}}` through the antigravity launcher yields `{decision:'ask'}`. `CodeContent` carrying a redaction marker over a file with real secrets yields `{decision:'deny'}`. A test fixes both."
              },
              {
                "severity": "WARNING",
                "summary": "An unrecognized agy PreToolUse payload is passed through with no `tool_input`, and the policy then stays silent. This is a fail-open path, which ADR 0008 forbids for security guards.",
                "acceptance_criteria": "For subcommand pre-tool-use on agy, a payload with no `toolCall`, a non-object `toolCall`, or non-object `args` produces the inspection-failure `ask`, with a stderr diagnostic, instead of `{}`. A launcher test covers these three shapes."
              },
              {
                "severity": "WARNING",
                "summary": "On agy the inspection-failure fallback emits `ask`, but the change's own live evidence shows agy auto-approves `ask` under `toolPermission: always-proceed`. A hook crash, timeout or invalid output therefore lets the call through, including reads that would have been denied.",
                "acceptance_criteria": "Either the spec and docs state that, in always-proceed mode, an agy inspection failure is equivalent to an allow, or the antigravity pre-tool-use failure path emits `{decision:'deny'}` (or another verified blocking signal) with the inspection reason. A launcher test fixes the chosen behavior for child timeout and invalid child output."
              }
            ]
          },
          "operation": null,
          "result_request_id": "agy-hooks-adapter:lens-result:1:1"
        },
