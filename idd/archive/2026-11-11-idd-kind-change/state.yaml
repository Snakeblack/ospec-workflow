  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Un cambio IDD no puede pasar de bug a feature ni al revés: KIND_RANK les da el mismo rango y record intent lo rechaza con intent-conflict, así que un cambio abierto con el kind equivocado queda atascado sin poder abandonarse (#491)",
    "acceptance": "feature → bug se acepta como subida; bug → feature reemplaza el intent, quita bug-fix, retira repro-test pendiente y abre la puerta kind-change, que solo el usuario resuelve y que bloquea close; volver a bug restaura bug-fix y reabre repro-test; record gate --open rechaza kind-change; un kind menor sigue rechazado; el catálogo de Go incluye la puerta; node scripts/check.js y el gate de Go pasan"
  },
  "facts": {
    "basis": "El issue #491, aprobado por el mantenedor, fija el comportamiento: feature → bug libre, bug → feature con la puerta kind-change abierta por record intent, en el orden detrás de ambiguous-intent, y repro-test satisfecha se conserva"
  },
  "plan": {
    "paths": [
      "README.es.md",
