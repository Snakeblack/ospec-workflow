          "result": {
            "findings": [
              {
                "severity": "SUGGESTION",
                "summary": "internal/rules/testdata/unicode-corpus.json:24-25 label git push<U+00A0>--force and git push<U+FEFF>--force as proving that JS whitespace is kept as whitespace. They don't prove it. In rules.json the force-push rule matches those inputs through [^\\r\\n;&|]*, and that class accepts the U+FFFD placeholder too. So the cases still pass if asciiView (internal/rules/rules.go:72) wrongly turned NBSP, BOM, U+2028 or U+3000 into U+FFFD. Nothing in either suite covers the whitespace-preserving branch for the patterns that need \\s: git\\s+push, \\s-f, \\s\\/, rm \\s-rf, [^\\S\\r\\n] and the format chain. The reachable result is that such a regression becomes a silent Go-only deny bypass. For example, 'git\\u00a0push -f' or 'git push\\u00a0-f' would be allowed in Go but denied in JS.",
                "acceptance_criteria": "The shared corpus (checked by both the Go and JS suites) has at least one case per whitespace form whose decision depends on \\s or [^\\S\\r\\n] matching a non-ASCII whitespace character. Cover U+00A0, U+FEFF and one of U+2028 / U+3000, using inputs such as 'git\\u00a0push -f', 'git push\\u00a0-f', 'rm\\u00a0-rf /' and 'sudo\\u3000format D:'. Each case's expected decision differs from what the input would get if that character were replaced by U+FFFD. Both suites pass."
              }
            ]
          },
