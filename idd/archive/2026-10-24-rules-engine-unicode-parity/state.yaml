    "kind": "bug",
    "summary": "Los motores JS y Go de las 19 reglas DENY/ASK deciden distinto con caracteres no ASCII: regexp2 trata \\w, \\d, \\s y \\b como Unicode y pliega K (U+212A) e İ (U+0130) a ASCII con IgnoreCase",
    "acceptance": "Un corpus compartido con caracteres no ASCII da la misma decisión en JS y en Go para las 19 reglas, comprobado por las dos suites, y la fila de la regla de disco del spec de hooks deja de nombrar la divergencia del motor Go"
  },
  "facts": {
    "open": [
      "¿Qué semántica es la de referencia para la paridad: la ASCII de JS (Go la adopta y deja de denegar el usuario runas CORP\\Zoë o un dispositivo nvme con dígitos arábigos) o una Unicode en los dos motores?",
      "¿Debe la regla de disco reconocer nombres con letras no ASCII (/user:CORP\\Zoë, Zoë=1, $vär=) y denegarlos en los dos motores, o basta con que ambos los dejen pasar y la fila lo documente como límite común?",
      "¿Se acepta que el plegado de mayúsculas de Go deje de denegar órdenes escritas con İ (U+0130) o K Kelvin (U+212A) en lugar de i/k, que JS ya deja pasar porque sin el flag u no pliega no ASCII sobre ASCII?"
    ]
  },
