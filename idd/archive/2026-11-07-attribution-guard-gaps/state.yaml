      "lenses": {
        "trust": {
          "selected": true,
          "status": "completed",
          "request_id": "attribution-guard-gaps:lens-start:2:0",
          "result_digest": "sha256:4acc93b20c29ccfa06d2c419bb114169d40855bf7aaec2add7603d61060a19b0",
          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/hooks/lib/shell-file-access.js:51-53 (y internal/hooks/shellfileaccess.go:85-91): el tokenizador conserva el backslash sin comillas y convierte `\\`+salto de línea en un \"\\n\" dentro de la palabra, mientras bash lo descarta. `git commit \\<nl>-F msg.txt` produce la palabra \"\\n-F\" y la opción no se reconoce. `git add . && \\<nl>  git commit -F msg.txt` hace que el programa sea \"\\n\" y no se reconoce el comando. `\\git commit -F msg.txt` queda como programa `\\git`. En los tres casos el fichero de mensaje no se lee y no hay deny (el texto de la orden sí se escanea, el fichero no). `Cl\\aude` sin comillas tampoco coincide con la regex.",
                "acceptance_criteria": "En el hook Node y en el binario Go, con un msg.txt o pr.md que contiene `Co-Authored-By: Claude …`, estas órdenes reciben deny: `git commit \\<nl>-F msg.txt`; `git add . && \\<nl>  git commit -F msg.txt`; `gh pr create --title x \\<nl>--body-file pr.md`; `\\git commit -F msg.txt`; `git commit -m Co-authored-by:\\ Cl\\aude`. Con un fichero limpio las mismas órdenes pasan. Hay pruebas en ambos puertos."
              },
              {
                "severity": "SUGGESTION",
                "summary": "scripts/hooks/lib/shell-file-access.js:21-23,41-46,59-70 (y shellfileaccess.go:26-29,68-77,97-116): cualquier palabra tras un `<<` activa la omisión de heredoc, también un desplazamiento aritmético. `echo $((1<<2))\\ngit commit -F msg.txt` fija el delimitador \"2))\" y, al no encontrarlo, descarta el resto de la orden sin tokenizar. `git commit` no llega a ser objetivo, así que el fichero no se lee y no hay deny. El resultado es fail-open, no el deny por fichero ilegible del ADR 0008.",
                "acceptance_criteria": "Con un msg.txt con atribución, `echo $((1<<2))\\ngit commit -F msg.txt` recibe deny en Node y en Go, o la orden se trata como no analizable y se deniega o pide confirmación. Un heredoc real con terminador (`cat <<'EOF' … EOF`) sigue omitiendo su cuerpo, y un heredoc sin terminador no oculta una orden `git commit -F` posterior."
              },
              {
                "severity": "SUGGESTION",
                "summary": "scripts/hooks/pre-tool-use.js:38-39 (y pretooluse.go:32-34): la regex exige `-by:`, pero `git commit --trailer \"Co-authored-by=Claude <noreply@anthropic.com>\"` también produce un trailer (git acepta `token=valor` en --trailer, cf. interpret-trailers). El texto no contiene `-by:` y no coincide. `$'…Cl\\x61ude'` tampoco coincide: el tokenizador deja los escapes ANSI-C \\xNN, \\NNN y \\uNNNN sin decodificar (shell-file-access.js:33).",
                "acceptance_criteria": "`git commit -m x --trailer 'Co-authored-by=Claude <noreply@anthropic.com>'` y `git commit -m $'x\\n\\nCo-authored-by: Cl\\x61ude'` reciben deny en Node y en Go, y un `--trailer 'Reviewed-by=Ana Pérez'` pasa. Si los dos casos se dejan fuera a propósito, la spec 6a.1 los lista entre los límites."
              },
              {
                "severity": "SUGGESTION",
                "summary": "scripts/hooks/pre-tool-use.js:783: MESSAGE_COMMAND_MENTION_RE usa `[\\s\\S]*?` encadenados. En V8 es cuadrática con muchos `git` sin commit|merge y cúbica con muchos `gh`/`pr` sin create|new|edit|comment|review|merge. El puerto Go usa RE2 (lineal), así que solo afecta al hook Node. El resto del fichero declara expresiones lineales (DISK_FORMAT_RE).",
                "acceptance_criteria": "Una orden de cientos de KB que repite `gh pr ` sin subcomando, o `git ` sin commit|merge, se evalúa en tiempo lineal (medido sobre una entrada de peor caso, con un tope acordado) y las decisiones de las pruebas de mención siguen iguales."
              }
            ]
          },
          "operation": null,
          "result_request_id": "attribution-guard-gaps:lens-result:2:1"
