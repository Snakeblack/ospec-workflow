{
  "schema": "idd-state/v1",
  "change": "attribution-guard-gaps",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "El guard PreToolUse de atribución (JS y Go) deja pasar git commit -F/--file (fichero o heredoc por stdin), gh pr --body-file/-F, gh pr comment/review/merge, git merge -m, git -C/-c antes de commit, gh pr -R antes del subcomando y un -m \"$(cat <<EOF…)\" con comillas dentro; y el hook commit-msg solo se instala a mano, con setup-git-hooks.js fallando en worktrees (ENOTDIR) e instalando donde git no mira con core.hooksPath, mientras el doctor se salta los worktrees (hallazgo 4 de PR3b).",
    "acceptance": "Un commit o una PR con atribución por cualquiera de esas formas recibe deny en el hook Node y en el binario Go con el mismo resultado; los mensajes limpios y los que solo nombran un agente siguen pasando; setup-git-hooks instala pre-commit y commit-msg en la carpeta de hooks que git usa (también desde un worktree) y el doctor la comprueba allí; CONTRIBUTING.md explica cómo quedan instalados."
  },
  "facts": {
    "open": [
      "Alcance del escaneo: en un git commit o gh pr, ¿el guard mira el texto entero del comando (cubre heredoc de -F -, printf | git commit -F -, here-string, -m \"$(cat <<EOF…)\" con comillas dentro y un fichero que la propia orden escribe) o solo los argumentos de mensaje más los cuerpos heredoc? Con texto entero, una orden compuesta que nombre la atribución en otra parte (p. ej. sed '/🤖/d') también se niega.",
      "Órdenes cubiertas: hoy git commit y gh pr create|edit. ¿Se añaden git merge (-m/-F), gh pr comment, gh pr review y gh pr merge (--subject/--body/--body-file), dejando fuera gh api y gh issue?",
      "Fichero ilegible: con -F/--file de git o --body-file/-F de gh, si el fichero no existe, no se puede leer, supera 1 MiB o usa una variable ($F), ¿el guard deja pasar (siguen el escaneo del texto, commit-msg y CI), pregunta o niega?",
      "core.hooksPath definido: ¿setup-git-hooks instala en esa carpeta (git la lee; si es global y compartida rompería los commits de otros repos, y husky la regenera), no escribe y explica qué líneas añadir (el doctor avisa igual), o instala solo si la carpeta está dentro del repositorio?",
      "Instalación automática: ¿script prepare en package.json (cada npm install/npm ci instala los hooks, también en CI; un fallo avisa sin romper npm install) más CONTRIBUTING.md, o solo CONTRIBUTING.md y el aviso que ya da el doctor?"
    ]
  },
