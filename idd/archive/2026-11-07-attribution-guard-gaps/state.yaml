          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/hooks/pre-tool-use.js:1013 and internal/hooks/pretooluse.go:514-518: for a message read from stdin (-F - / --body-file -), the guard reads every file that extractShellReadPaths finds anywhere in the command, not only the source that feeds the message command. That recognizer also reports non-file operands such as grep patterns, sed/awk scripts and cp targets (shell-file-access.js:103-106; its test expects 'grep API_KEY .env' -> ['API_KEY','.env']). Trigger: `git log --oneline | grep -v wip; git commit -F - <<'EOF'\\nfix: x\\nEOF` gives ['wip']. readMessageFile returns null and the hook denies it as unreadable (ADR 0008), although the message is clean and was passed the way the denial text recommends. An unrelated file read earlier in the line that quotes a model name also denies. The paths are resolved against the git -C base (target.cwd), not against the directory where the reader ran. The deny holds in every permission mode and has no bypass variable.",
                "acceptance_criteria": "In both the Node and Go hooks, a clean `-F -` or `--body-file -` heredoc commit or PR in a command line that also runs a reader with a non-file operand (`grep -v wip`, `sed -n 1p f`) is not denied. `cat missing.txt | git commit -F -` is still denied as unreadable. `cat msg.txt | git commit -F -` and `git commit -F - < msg.txt` still read and check the fed file. A test in each runtime covers a non-file operand next to a clean `-F -` heredoc."
              },
              {
                "severity": "SUGGESTION",
                "summary": "The PR-text surface is enumerated as gh pr create|new|edit|comment|review|merge (pre-tool-use.js:778, mentionsMessageCommand at 809-817; pretooluse.go:92-101, 60). `gh pr close <n> -c \"🤖 Generated with Claude Code\"` and `gh pr reopen <n> -c ...` also post a PR comment, but they match none of the six subcommands. The mention heuristic needs a whole word create|new|edit|comment|review|merge, so the long `--comment` form is scanned only by accident and the short `-c` form is not scanned at all. The hook returns null and the text is not checked. §6a.1 does not list this among the deliberate limits, and CI checks PR commits, title and body, not comments, so nothing else catches it.",
                "acceptance_criteria": "`gh pr close 12 -c \"🤖 Generated with Claude Code\"` and the same with `reopen` are denied in both the Node and Go hooks. A clean `gh pr close 12 -c \"superseded by #13\"` passes. Alternatively, §6a.1 names close/reopen comments as a deliberate limit. Parity tests cover the chosen behavior."
              }
            ]
          },
          "operation": null,
