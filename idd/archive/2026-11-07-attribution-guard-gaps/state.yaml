          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The PreToolUse attribution deny is skipped when the commit is not at the start of a simple command, or when the tokenizer misreads the quotes. In pre-tool-use.js, messageCommand (793-809) skips only the wrapper words (env, sudo, time…), never their options. So `env -i git commit …`, `sudo -u root gh pr create …` and `timeout 60 git commit …` are not recognised. `bash -c '…'`, `if …; then git commit …`, `{ git commit …; }`, `(git commit …)` and `$(git …)` are not recognised either. Separately, shellTokens (shell-file-access.js:28-67) treats `$'\\''` as an opened quote. In `echo $'\\'' ; git commit -m \"Co-Authored-By: Claude\"` the commit is then read as quoted text and the last word is dropped. In all these cases targets is empty and checkCommitAttribution returns null (line 867) before the whole-text scan at 876. The Go port (pretooluse.go:110-151, shellfileaccess.go) behaves the same way.",
                "acceptance_criteria": "With the same input, the hook and the Go binary deny each of these commands when it carries `Co-Authored-By: Claude …`: `env -i git commit -m \"…\"`, `sudo -u root gh pr create -b \"…\"`, `timeout 60 git commit -m \"…\"`, `bash -c 'git commit -m \"…\"'`, `if true; then git commit -m \"…\"; fi`, `{ git commit -m \"…\"; }`, `(git commit -m \"…\")`, and `echo $'\\'' ; git commit -m \"…\"`. Clean commands and a grep pattern or commit message that only cites `git commit` still pass. Any limit that remains is listed in hooks/spec.md and harness-runtime.md instead of the absolute-block claim."
              },
              {
                "severity": "WARNING",
                "summary": "Message-file lookup can read a different file from the one git reads, or skip the file altogether. readMessageFile (pre-tool-use.js:835-846) and the Go readMessageFile (pretooluse.go:206-230) resolve a relative -F, --file or --body-file path against the hook's workspace. Git resolves it after `git -C <dir>`, `--work-tree` or an earlier `cd <dir> &&`. A clean decoy `msg.txt` in the workspace lets `git -C other commit -F msg.txt` pass while other/msg.txt carries the trailer. Without a decoy the commit is denied as unreadable. messageFiles (812-831) also compares option names exactly. Git accepts unique abbreviations such as `--fil msg.txt`, and `gh pr create -T/--template` is not in GH_PR_MESSAGE (768). In those cases no file is read and nothing fails closed.",
                "acceptance_criteria": "With the same input, the hook and the Go binary behave as follows. `git -C <dir> commit -F msg.txt` and `cd <dir> && git commit -F msg.txt` read <dir>/msg.txt, or deny when they cannot tell which directory applies, and never read workspace/msg.txt in their place. `git commit --fil msg.txt` and `gh pr create --template t.md` with attribution in the file are denied, or denied as unreadable. Clean files still pass."
              }
            ]
          },
          "operation": null,
          "result_request_id": "attribution-guard-gaps:lens-result:1:1"
