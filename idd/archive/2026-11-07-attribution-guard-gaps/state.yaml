              {
                "severity": "WARNING",
                "summary": "pre-tool-use.js:806-837 (commandSegments) and 1057-1071, mirrored in internal/hooks/pretooluse.go:157-194 and 599-613: the file behind a message read from stdin (-F - / --body-file -) is found only when a bare `|` joins a reader with a file operand, or the command has its own `<`. Triggers that read and deny nothing: `cat msg.txt |<newline>git commit -F -` (between \"|\\n\", piped=false); `cat msg.txt |& git commit -F -`; `cat < msg.txt | git commit -F -` and `cat a | cat | git commit -F -` (reader with no operands; its `<` is not kept); `git commit -F - 2>&1 < msg.txt` (the `&` of `>&` splits the segment). A msg.txt with `Co-Authored-By: Claude …` passes in JS and Go; no test covers these. Impact: breaks hooks spec §6a.1 point 3 (other programs piped in MUST be denied) and ADR 0008 fail-closed; commit-msg hook and CI still catch it.",
                "acceptance_criteria": "With a msg.txt holding an AI attribution trailer, `cat msg.txt |<newline>git commit -F -`, `cat msg.txt |& git commit -F -`, `cat < msg.txt | git commit -F -`, `cat a | cat | git commit -F -` and `git commit -F - 2>&1 < msg.txt` are each denied in the JS hook and the Go hook, either with the attribution reason (file read) or the unreadable-stdin reason (feeder not resolvable); none passes unread. Clean cases still pass: `cat clean.txt | git commit -F -`, `printf '…' | git commit -F -`, and heredocs. Tests for these forms exist in pre-tool-use.test.js and attribution_test.go."
              }
            ]
          },
