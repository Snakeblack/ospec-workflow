  "gates": [
    {
      "id": "open-facts",
      "status": "resolved",
      "answer": "Launcher: forma exec (command = ruta absoluta de bash.exe, args = script y argumentos), no PowerShell: upstream no trae ports de session-start.sh y los demás scripts. Sin Git Bash: usar la ruta absoluta del bash.exe del PATH si no es el lanzador de WSL (System32 o WindowsApps); si es WSL o no hay bash, no parchear y avisar de que hace falta Git Bash. sh pelado: reescribir al sh.exe hermano si existe; si no, dejarlo. Chequeo de ospec doctor: seguimiento en otro cambio.",
      "source": "user"
    },
    {
      "id": "adr-amend-or-contradict",
      "status": "resolved",
      "reason": "adr-20261003-001: la viñeta de Claude/Windows prefija bash pelado a los .sh y deja intactos los que ya empiezan con bash o sh; el cambio los lanza en forma exec con la ruta absoluta de Git Bash (o del bash.exe del PATH que no sea WSL), migra los bash/sh pelados y no parchea si solo hay el bash de WSL. Se registraría un ADR nuevo que enmienda esa viñeta, sin reescribir el aceptado.",
      "answer": "Sí, registrar el ADR nuevo que enmienda la viñeta (adr-20261015-001), sin reescribir el aceptado.",
      "source": "user"
    }
