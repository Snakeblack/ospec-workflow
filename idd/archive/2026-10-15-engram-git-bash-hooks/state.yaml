  "change": "engram-git-bash-hooks",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "En Windows, los hooks .sh de engram@engram arrancan con la ruta absoluta de Git Bash que encuentra findGitBash (la misma que usa la sonda de modo seguro), migrando también los comandos que ya empiezan con bash pelado; sin Git Bash no se antepone el bash de WSL",
    "acceptance": "Con Git Bash en <git>/bin/bash.exe, cada hook .sh pelado y cada comando que empieza por bash pelado quedan con la ruta absoluta entrecomillada con barras normales, y una segunda ejecución no reescribe; sin Git Bash y con bash del PATH en System32 o WindowsApps no se escribe prefijo bash y se avisa"
  },
  "facts": {
    "open": [
      "Sin Git Bash pero con un bash del PATH que no es el lanzador de WSL (p. ej. MSYS2), ¿se mantiene el prefijo bash pelado actual o no se parchea nada?",
      "Los comandos que empiezan con sh pelado, ¿se reescriben a Git Bash (bash.exe o el sh.exe hermano) o se dejan como están?",
      "¿El chequeo opcional de ospec doctor (health de engram serve y hooks con bash pelado) entra en este cambio o queda como seguimiento?"
    ]
  },
