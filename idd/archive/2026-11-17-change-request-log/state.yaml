{
  "schema": "idd-state/v1",
  "change": "change-request-log",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "continua",
    "kind": "feature",
    "summary": "El CLI escribe en change.md, en una sección propia entre marcadores, la petición literal del usuario y cada respuesta suya a un gate, con su fecha y su fuente, para que revisores y verificadores lean sus palabras y no un resumen (E1.77, R9)",
    "acceptance": "Un cambio con gates resueltos tiene en change.md la petición literal y cada respuesta numerada con su fecha y su fuente, esa sección coincide con state.yaml al cerrar, y los tests del CLI lo fijan"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué entra en el log? Propuesta: la petición (--request) y cada respuesta del usuario que guarda el CLI: las de los nueve gates (también base-moved, review-limit, checks-changed y abandon) y las de una retracción con --answer (#416), por orden de llegada; sin --request el log empieza por las respuestas, el CLI no hace obligatorio --request (romper record intent) y la regla 2 de la skill de IDD pide --request con las palabras del usuario. ¿O solo las respuestas a los gates?"
      },
      {
        "category": "uniqueness",
        "question": "¿Qué encargos citan el log por referencia? Propuesta: los que prepara el CLI para los agentes de solo lectura (el de review-trust en ospec review start y los de review-correction) ganan un campo que nombra idd/<cambio>/change.md, la sección y el número de entradas, solo cuando hay alguna, y next sigue nombrando change.md en knowledge_refs; los encargos de agent.spawn quedan para E1.87. ¿O ningún encargo cambia en este ítem y solo se deja el log citable?"
      },
      {
        "category": "persistence",
        "question": "Un cambio sin documento vivo (sin --decision ni --work-units, sin living-doc), ¿escribe change.md por el log? Propuesta: no; el log solo se escribe en un change.md que ya existe, y en un cambio trivial la petición y las respuestas siguen solo en state.yaml, como hoy (REQ-idd-002 no cambia); casi todo cambio con una respuesta del usuario declara una decisión y ya tiene change.md. Alternativa: un change.md con solo el título y el log, que close comprueba aparte y que la plantilla completa si después aparece living-doc (un segundo formato del documento)"
      },
      {
        "category": "copy",
        "question": "Formato. Propuesta: una sección ## Request and answers entre Intent and acceptance y Plan, escrita solo por el CLI entre <!-- ospec:log:start --> y <!-- ospec:log:end -->; la petición como «Request (fecha)» y cada respuesta como «Answer N — <gate>, <fuente>, <fecha>», numeradas desde 1 sin renumerar nunca, para citar «change.md, answer 2»; el texto del usuario va literal, cada línea como cita (> ), de modo que ninguna respuesta abre una sección ni cierra los marcadores. ¿Te vale o prefieres los rótulos en español?"
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "handbook/idd/estado.md",
          "line": 45
        }
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
          "path": "handbook/idd/estado.md",
          "line": 49
        }
      },
      {
        "category": "errors",
        "question": "state.yaml no guarda hoy la fecha de una respuesta (un gate solo lleva su número de turno). Propuesta: desde este cambio el CLI guarda resolved_at (ISO 8601 UTC) en cada respuesta a un gate y en cada retracción con --answer, y requested_at al registrar la petición; una respuesta de un cambio abierto antes sale en el log como «sin fecha», sin inventarla. ¿O el log omite la fecha cuando falta?"
      }
    ]
  },
