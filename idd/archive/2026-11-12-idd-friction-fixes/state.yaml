  "intent": {
    "kind": "bug",
    "summary": "Corregir en un solo cambio las fricciones de IDD de proyectos reales que son arreglos acotados: E1.64 idd-config-in-diff (#483), E1.65 counterproof-declared-docs (#500), E1.66 first-gate-turn-fence (#494), E1.68 build-scripts-declared (#501) y E1.69 impact-raise (#502)",
    "acceptance": "Se cumple el «Hecho cuando» de cada ítem en docs/roadmaps/harness-evolution.md: un arreglo solo en idd/config.yaml cierra su par y su contraprueba corre en la base; un .md declarado en impact o contracts.documents cuenta como producto para la contraprueba; el primer gate de un repositorio sin .ospec/turns, respondido tras un fin de turno, queda source user; impact.build_scripts evita persistent-data sin quitar las demás señales; y un impacto conforms se sube a amends abriendo adr-amend-or-contradict"
  },
  "facts": {
    "open": [
      "Alcance: ¿van en este cambio E1.64, E1.65, E1.66, E1.68 y E1.69 (los cinco arreglos acotados), dejando E1.67 (feature) y E1.70 (fitness sobre la base y skill foundation) para después, o prefieres otro grupo?",
      "E1.66: ¿la cuenta ausente al abrir un gate se guarda como opened_turn 0 (salida 1 de #494), o el CLI crea .ospec/turns con 0 antes del primer gate (salida 2)?",
      "E1.66: un gate ya abierto con opened_turn null en un state.yaml existente, ¿se verifica también al responderlo con cuenta (pasando su opened_turn a 0) o sigue quedando user-unverified?",
      "E1.69: ¿subir un impacto de none a conforms también se acepta, o solo la subida a amends, supersedes o contradicts?",
      "E1.69: si adr-amend-or-contradict ya está resuelto cuando un impacto sube a amends, supersedes o contradicts, ¿la puerta se abre otra vez o la subida se rechaza con gate-resolved, como hoy una enmienda nueva?"
    ]
  },
