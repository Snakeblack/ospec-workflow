        "plan": "El esquema idd-state/v1 sigue leyendo todo lo anterior y no hay migración: un impacto sin previous, un gate con opened_turn null y una sola entrada de adr-amend-or-contradict siguen siendo válidos (tests de idd-contract y turn-fence), así que los cambios abiertos y los archivados se leen igual. Lo nuevo es aditivo: previous es un campo opcional de un impacto que solo se escribe al subirlo, opened_turn pasa a 0 en los gates que se abren sin cuenta (valor que el esquema ya admitía) y una subida tras la respuesta añade otra entrada de la puerta, como ya hacen review-limit y checks-changed. idd/config.yaml no cambia de formato: impact.build_scripts es una clave opcional. Vuelta atrás: una CLI anterior rechaza por campo desconocido un cambio abierto cuyo impacto ya lleve previous, y rechaza impact.build_scripts como clave desconocida; antes de volver a ella se cierran esos cambios y se quita la clave, o se sigue con la versión nueva."
      }
