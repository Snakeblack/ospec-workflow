  "intent": {
    "kind": "bug",
    "summary": "Un renombre puro deriva señales de contenido: readGitDiff lee el diff con --no-renames, así que el fichero movido llega como borrado más añadido completo y todo su contenido cuenta como líneas añadidas (public-contract por un `#hex` en un Markdown archivado, persistent-data por un módulo movido que ya escribe)",
    "acceptance": "Un renombre que conserva el contenido (R100), preparado o commiteado, no deriva public-contract, persistent-data ni ninguna otra señal de contenido; un renombre que además cambia líneas solo aporta esas líneas; el fichero sigue contando por sus dos rutas para las señales de ruta; un test lo cubre, también con diff.renames=false"
  },
  "facts": {
    "open": [
