    "summary": "Contraprueba en la base (E1.48): el verde de repro-test y tdd-red-green, y boundary-tests, solo se cumplen si el mismo comando falla con el producto de la base y los tests del candidato",
    "acceptance": "Un repro-test hecho con test -f marker y una feature cuyo test nuevo ya pasa con el producto de la base no cierran; un test real cierra con un run extra de purpose counterproof que falló sobre la base; en un repositorio sin commits la contraprueba se omite con un aviso"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "1) ¿Qué se monta en el worktree de la base: el árbol de la base con todo lo que el diff cambia salvo los ficheros que classifyPath tiene por producto (tests, fixtures, manifiestos, config y otros como en el candidato), o solo las rutas de test del diff copiadas sobre la base? 2) ¿Qué timeout lleva (fijo, proporcional al verde o configurable en idd/config.yaml), y un timeout sobre la base cuenta como rojo válido o como contraprueba no concluyente?"
      },
      {
        "category": "uniqueness",
        "question": "¿Cuándo corre la contraprueba: en cada verde que cierre una pareja y en cada check que satisfaría boundary-tests, o se reutiliza mientras no cambien la base, el comando y el contenido de lo que se monta?"
      },
      {
        "category": "persistence",
        "question": "Un cambio abierto antes de E1.48 con la pareja o boundary-tests ya satisfechos: ¿su evidencia sigue valiendo, o close exige también la contraprueba?"
      },
      {
        "category": "copy",
        "question": "¿Qué dice el CLI cuando la contraprueba pasa en la base (la obligación queda pendiente con un motivo y un siguiente paso) y cuando se omite (aviso en run, check y close)?"
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
