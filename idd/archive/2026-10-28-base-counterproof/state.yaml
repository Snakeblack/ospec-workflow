          "line": 480
        }
      },
      {
        "category": "errors",
        "question": "1) Los ignorados (node_modules, .venv, target, dist) no están en un worktree nuevo y su falta haría fallar el comando por import, un rojo vacío: ¿se enlaza en el worktree una lista fija de directorios de dependencias que existan (node_modules, .venv, venv, vendor), todos los ignorados de primer nivel, o ninguno? 2) Si no se puede montar el worktree (git falla, disco lleno, base ilegible): ¿se omite con una marca visible en la evidencia y en close, o la obligación queda pendiente?"
      }
    ]
  },
