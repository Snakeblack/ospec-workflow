    "acceptance": "skills/sdd-apply no conserva líneas de 30 o más caracteres idénticas a ninguna versión del historial git de gentle-ai, salvo los literales que fijan los tests; los tests de contrato de sdd-apply y de la evidencia de Strict TDD siguen pasando; NOTICE y metadata.author nombran a gentle-ai exactamente donde queda su texto; node scripts/check.js pasa"
  },
  "facts": {
    "open": [
      "Medido contra todo el historial git de gentle-ai (su árbol actual ya retiró SDD, por eso E1.78 no lo vio), además de sdd-apply conservan texto suyo: issue-creation 95 %, sdd-onboard 90 %, sdd-explore 90 %, sdd-verify/strict-tdd-verify.md 71 %, sdd-spec 67 %, sdd-tasks 65 %, sdd-propose 64 %, skill-registry 61 %, branch-pr 58 %, sdd-design 56 %, sdd-init/references/init-details.md 52 % y, por debajo del 40 %, report-format de sdd-verify, sdd-init, openspec-convention, sdd-orchestrator.agent y otras. NOTICE solo lista sdd-apply y sus metadata.author solo nombran al autor del repositorio. ¿E1.101 se queda en sdd-apply y corrige en este cambio la lista de NOTICE y los autores (la sección de gentle-ai se queda), con filas nuevas del roadmap para el resto, o crece a todas esas skills?",
      "skills/sdd-apply/strict-tdd.md, módulo de sdd-apply, conserva el 81 % de sus líneas largas contra el historial. ¿Entra en E1.101? Su formato de evidencia (tabla TDD Cycle Evidence y bloque json:strict-tdd-evidence) lo leen strict-tdd-evidence-remediation.js y strict-tdd-verify.md, así que se conservaría tal cual.",
      "¿Se añade al repositorio la herramienta de medida (un script de desarrollo que compara las líneas de 30 o más caracteres contra todas las versiones del historial git de la fuente; no corre en CI porque necesita el clon) para E1.99 y las filas que salgan, o se queda solo descrita en el roadmap?"
    ]
  },
