  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "Añade al roadmap de ospec-workflow, como siguiente punto, una exportación bajo demanda `ospec snapshot` y entrégala como cambio IDD de este repo. Un comando de la CLI que lee los artefactos ospec de un proyecto (roadmap, cambios IDD activos y archivados, cambios SDD si los hay) y escribe un JSON de avance llamado snapshot de avance, versión 1. Solo se ejecuta bajo demanda desde la CLI. No es un paso obligatorio de IDD ni de SDD, ni un check, ni un hook, ni un gate. La publicación queda fuera de ospec. La documentación, los comentarios, los tests, el changelog y los commits deben ser agnósticos.",
    "kind": "feature",
    "summary": "Comando ospec snapshot, bajo demanda, que lee el roadmap y los cambios IDD y SDD de un proyecto y escribe el snapshot de avance v1: un JSON con schemaVersion 1 y la lista ordenada de fases con su id, su título y su estado",
    "acceptance": "En un proyecto con un roadmap reconocible, ospec snapshot emite un snapshot v1 que cumple el esquema y sus reglas (ids únicos, título recortado en NFC sin caracteres de control, 64 KiB como máximo, orden del roadmap), con cada fase done si su cambio está archivado, in-progress si tiene uno activo y pending en el resto; un roadmap ausente o no reconocible, o un snapshot que rompería las reglas, termina con código distinto de cero, un mensaje legible y sin escribir nada; ningún flujo IDD o SDD, hook, check, gate ni doctor lo ejecuta, y la documentación es agnóstica"
  },
