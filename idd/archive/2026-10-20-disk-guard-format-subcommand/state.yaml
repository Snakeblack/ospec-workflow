                "severity": "WARNING",
                "summary": "scripts/hooks/pre-tool-use.js:87 (copy at rules.json:47): the lookbehind only checks that a listed tool name (dotnet, npm, bun, ...) sits before `format`. A real format.com invocation after cmd.exe `if` syntax now passes. Example: `cmd /c \"if not exist dotnet format C: /q /y\"`. In cmd, `dotnet` there is only the file name tested by `if exist`, and `format C:` is the command that runs. Before this change the rule denied it.",
                "acceptance_criteria": "`cmd /c \"if not exist dotnet format C: /q /y\"` and `if defined npm format D:` are denied by both the JS hook and the Go rules. `dotnet format C:\\repo\\app.sln`, `ruff format D:/proj`, `npm run format -- C:\\src` and the other listed-tool cases in the existing tests stay allowed. The JS and Go test suites each gain an evasion case."
