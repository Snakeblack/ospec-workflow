          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The new lookbehind uses \\s+ (and (?:run\\s+)?), which also matches \\r and \\n. A format.com on a new line after a line ending in a bare tool name (dotnet, npm, bun...) passes. pre-tool-use.js:87 and rules.json:47. Before this change it was denied.",
                "acceptance_criteria": "\"dotnet\\nformat C:\", \"npm\\r\\nformat D: /q\" and \"bun run\\nformat E:\" are denied by both the JS rule and the Go rule. \"dotnet format C:\\\\repo\\\\app.sln\" and \"npm run format -- C:\\\\src\" are still allowed. Tests for the newline cases exist on both sides."
              },
              {
                "severity": "SUGGESTION",
                "summary": "In the disk rule, the variable-length lookbehind `(?<!\\b(?:tools)\\s+(?:run\\s+)?)` comes before `\\bformat`, so it is evaluated at every position. In a long run of whitespace each position rescans the run backwards, which is quadratic in the length of the run. I only read the pattern and did not measure it.",
                "acceptance_criteria": "Measured on a command containing 100k consecutive spaces, evaluating the disk rule in node and in Go stays within the same order of magnitude as a command of ordinary length. If the measured cost is acceptable, the pattern may stay as it is."
              }
            ]
          },
