      "id": "open-facts",
      "status": "resolved",
      "answer": "1) Lista cerrada: se permite format solo tras herramientas conocidas (dotnet, ruff, biome, buf, swift, taplo y los scripts de npm/pnpm/yarn/bun); el resto sigue denegado. 2) Sí, criterio estrecho: se permite format( seguido directamente de un identificador sin comillas y dos puntos (una firma); format('D:') y Start-Process format -ArgumentList ('D:') siguen denegados. 3) Las evasiones format $drive: y format\"D:\" siguen fuera. 4) Se mantiene la denegación de los nombres de cmdlet aunque aparezcan como texto.",
      "source": "user"
