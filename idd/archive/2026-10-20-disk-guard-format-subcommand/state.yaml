{
  "schema": "idd-state/v1",
  "change": "disk-guard-format-subcommand",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "La regla deny de formateo de disco bloquea subcomandos format de otras herramientas (dotnet format C:\\repo\\app.sln, ruff format D:/proj) y código con anotaciones de tipo (function format(a: string))",
    "acceptance": "Esos comandos dejan de denegarse y format C:, format.com D:, cmd /c format E:, Start-Process format -ArgumentList ('D:') y format C:\\mnt\\data siguen denegados en los tests JS y Go"
  },
  "facts": {
    "open": [
      "¿Qué criterio excluye los subcomandos format: lista cerrada de herramientas permitidas (dotnet, ruff, biome...) o exigir que format esté en posición de orden (inicio, tras separador o tras envoltorio conocido como cmd /c o Start-Process)?",
      "¿Se excluye el código con anotaciones de tipo (function format(a: string), def format(s: str), métodos format(value: Date)) y con qué criterio?",
      "¿Entran en este cambio las evasiones format $drive: y format\"D:\", que hoy no se deniegan?",
      "¿Se mantiene la denegación del nombre del cmdlet de formateo de volumen o de Clear-Disk cuando solo aparece como texto (por ejemplo dentro de un patrón de rg o grep)?"
    ]
  },
