  "change": "decision-gap-engine",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "ospec foundation next ranks knowledge-map gaps into a deterministic round and foundation record persists answers and assumptions",
    "acceptance": "The same engine returns distinct deterministic rounds for a local CLI, a small SaaS and a regulated product, and a resumed map does not repeat a slot that already has an answer"
  },
  "facts": {
    "open": [
      "The catalog has no numeric impact, uncertainty, irreversibility or profile weight. How does foundation next score a slot? Proposed rule: impact is the number of that slot's catalog decisions that still have an unanswered feeding slot; uncertainty is 1 when the slot is unknown or missing and 0 when it already has another state; irreversibility is 1 for every decision; profile weight is 2 when the slot is mandatory for the profile and 1 when it is optional; equal scores keep catalog order.",
      "A round has at most four questions grouped by theme. Is the theme the slot dimension, and does the round take only the highest-priority dimension (shorter if that dimension has fewer gaps), or the four highest slots overall and then group them by dimension?",
      "A map whose mandatory slots are still unknown fails the finished-map validator. Should foundation next and foundation record read and write that draft at docs/architecture/knowledge-map.yaml without the mandatory-cannot-be-unknown rule, leaving validateKnowledgeMap unchanged? If the file is missing, should foundation next --profile compute the first round as if every catalog slot were unknown and write nothing, while record refuses until the file exists?",
      "The done criterion names a local CLI, a small SaaS and a regulated product. Which catalog profiles are those three cases: prototype, product and regulated, or public-library, product and regulated?"
    ]
  },
