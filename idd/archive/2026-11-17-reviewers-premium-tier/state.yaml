  "intent": {
    "request": "los reviewers deben ser opus minimo; sí, cámbialas a opus en un cambio aparte",
    "kind": "feature",
    "summary": "Los cinco revisores que models.yaml deja en default (review-trust, review-correction, review-runtime, review-evolution, review-efficiency) pasan al tier premium, como review-change",
    "acceptance": "Con el models.yaml del producto, cada target genera los seis agentes revisores con el tier premium (model: opus en Claude; en los demás hosts, el modelo que el usuario asignó a premium o el de la sesión), y el handbook y la spec del generador lo dicen"
  },
