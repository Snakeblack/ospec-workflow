        "category": "errors",
        "question": "Si alguien edita models.yaml y deja un revisor por debajo de premium, ¿el validador debe rechazarlo (suelo en código: la generación aborta con un error nuevo, lo que enmienda REQ-generator-005 y el ADR-005, que hoy solo permiten invariantes estructurales) o basta con cambiar el valor en models.yaml y dejar el validador como está (cualquier tier conocido sigue siendo válido)?"
      }
