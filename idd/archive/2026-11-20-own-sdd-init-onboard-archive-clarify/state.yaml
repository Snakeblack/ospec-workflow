      "La fase 9 de sdd-onboard ejecuta el archivado por su cuenta y anuncia el cambio archivado, pero sdd-archive solo emite archive-plan.json y el cambio queda archivado solo cuando el orquestador pasa su guarda de archivado y archive-transaction-run.js devuelve el recibo, algo que gate-archive-quality.md solo dispara tras una vuelta de sdd-archive. ¿El onboarding termina en verify y devuelve next_recommended: sdd-archive para que el orquestador archive como en cualquier cambio, emite él el plan como sdd-archive (y el orquestador debe completar el archivado tras sdd-onboard), o se deja como hoy?"
