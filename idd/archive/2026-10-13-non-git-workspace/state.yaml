{
  "schema": "idd-state/v1",
  "change": "non-git-workspace",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "feature",
    "summary": "IDD solo dentro de un proyecto: un work tree git cuyo toplevel no es $HOME ni /. Fuera, el router manda trabajo directo; pedir un proyecto sin git lleva a montar el repositorio (git init -b main aquí o en <nombre>/, commit base con aprobación para código existente). La CLI se detiene en record intent y next fuera de git (not-a-git-repo, git-not-found).",
    "acceptance": "El router de los 7 targets dice que fuera de un proyecto se trabaja directo y que pedir un proyecto lleva a montar el repositorio; en un directorio sin git, record intent y next terminan con not-a-git-repo y el siguiente paso sin crear nada en idd/; sin git instalado, git-not-found; un git init -b main sin commits llega hasta close; dentro de un repositorio nada cambia; el always-on sigue por debajo de 4096 bytes."
  },
  "facts": {
    "open": [
      "¿La CLI también rechaza un work tree cuyo toplevel es $HOME o /, o esa regla queda solo en el router?",
      "Fuera de git, ¿next se niega siempre (aunque haya cambios abiertos en idd/) y status sigue funcionando para inspeccionarlos?",
      "¿Solo record intent y next se detienen fuera de git, y el resto (record gate/signal/…, signals, foundation, team, doctor) queda igual?",
      "¿El error JSON de not-a-git-repo y git-not-found añade un campo how con el siguiente paso (y el texto lo imprime)?",
      "¿El detalle del montaje del repositorio va en una referencia bajo demanda (skills/idd/references/repository.md) con una línea en la skill y un router compacto, en vez de en el router?",
      "¿Se suben los techos always_on_bytes del fixture de contexto en lo que crezca el router, sin pasar de 4096?"
    ]
  },
