  "intent": {
    "request": "continua (PR2b del plan de la review general del 2026-10-29: hallazgos 5-11 de #1482 y pendiente (f) de PR1c)",
    "kind": "bug",
    "summary": "Cerrar la fricción del CLI de IDD: flags aceptados y descartados, bucle del intent ambiguo, isTestPath que toma producto por test, signals registradas sin listado de solo lectura, review sin candidateCommand, CHANGELOG escrito antes de guardar el estado en close, salida obsoleta de idd-next y configure-checks, y el arreglo que solo toca tests sin kind que le encaje",
    "acceptance": "Cada caso de los hallazgos 5-11 de la review (engram #1482) y del pendiente (f) de PR1c tiene un test que fallaba en la base y pasa: un flag que el comando no toma da exit 2; --ambiguous con campos de resolución da exit 2 y la skill remite al record intent de next; Latest.java, Contest.java, Contests.cs y src/spec/openapi.js son producto; las signals registradas se listan sin escribir; review propone el candidateCommand; un close cuyo estado no se guarda deja el CHANGELOG intacto; next imprime la forma vigente de --open-fact; un bug que solo toca tests puede cerrar"
  },
  "facts": {
    "open": [
      "Hallazgo 5: ¿se rechaza con exit 2 todo flag que las líneas de uso del comando o subcomando no nombran (globales --root, --json, --help), y además record gate --open con --answer/--source, --resolve con --reason, y record intent con --answer/--source sin intent ambiguo que resolver?",
      "Hallazgo 6: ¿--ambiguous junto a --kind, --summary, --acceptance, --answer, --source o la declaración de open facts es error de uso (exit 2), y la regla 3 de la skill pasa a decir que se resuelve con el record intent que imprime next?",
      "Hallazgo 7: ¿Test.java, Tests.java y Tests.cs pasan a distinguir mayúsculas (y se añade Tests.java, la convención de Spring hoy tomada por producto), y spec/ cuenta como test solo en la raíz para cualquier fichero y a cualquier profundidad para .rb?",
      "Hallazgo 8: signals --change <id> --json sin flags ya lista las registradas pero pasa por el lock de escritura; ¿status (texto y JSON) lista las signals de cada cambio y el remedio de signal-not-recorded remite a ospec status --change <id>?",
      "Hallazgo 10: si close cierra el estado pero falla al escribir el CHANGELOG, ¿el close siguiente (reanudación) escribe la entrada que falta antes de archivar?",
      "Hallazgo 11: ¿configure-checks deja de traer command (ospec check), como dice references/checks.md, en vez de mantenerlo como el paso que sigue a escribir la configuración?",
      "Pendiente (f): ¿un bug cuyo diff no cambia código de producto (solo tests, datos de test o documentación) omite la contraprueba con aviso, en vez de permitir bajar el kind con la respuesta del usuario o solo documentar que se declara docs? Abandonar un cambio sigue en E1.57",
      "Entrega: ¿una sola PR (fix/idd-cli-friction, release patch 2.168.7) o partir PR2b en 2b y 2c si pasa de ~400 líneas?"
    ]
  },
