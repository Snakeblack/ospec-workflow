  "changelog_line": "**`ospec auto` en OpenCode** (auto-host-opencode, E1.110, tramo 2). `ospec auto start --host opencode` conduce `opencode run --standalone --format json --auto`, verificado en vivo: cierra un cambio, delega `open-facts` y reanuda la sesión con `--session`. OpenCode no tiene un modo que revise cada acción, así que la primera línea de la ejecución avisa de que aprueba todo lo que su configuración no deniega. Sus eventos no traen el coste del último paso, así que el conductor lee el de la sesión con `opencode session export` y admite `--max-cost-usd`; con modelos gratuitos o de suscripción ese coste es 0. `--standalone` le da su propio servidor, de modo que `ospec auto stop` corta el agente. Un turno que termina con su error solo en los eventos, como la cuota gratuita agotada, ya no deja `exit 1: (…)` en el motivo de la pausa. REQ-idd-031 y REQ-idd-032 lo fijan.",
  "closed_at": "2026-11-26T20:13:07.598Z"
