{
  "schema": "idd-state/v1",
  "change": "counterproof-control",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Límite 1 de E1.48: un test de relleno junto a test -f marker cierra la pareja, porque la contraprueba falla al faltar marker en la base y no porque el test detecte el cambio",
    "acceptance": "Con test -f marker y un test de relleno en test/, la pareja no cierra y el motivo nombra la contraprueba y su control, que falló igual sobre la base sin los tests del diff; un repro en un fichero nuevo lanzado por su ruta y un check que corre el test nuevo siguen cerrando"
  },
  "facts": {
    "basis": "El usuario eligió en esta sesión «Control, bloquea si igual»: el mismo comando corre sobre la base pura, sin los tests del diff; si falla con el mismo exit y la misma salida que la contraprueba, el rojo no viene de los tests y la pareja no cierra, con el motivo; el control se reutiliza mientras no cambien la base ni el comando"
  },
  "plan": {
    "paths": [
      "CHANGELOG.md",
      "openspec/specs/idd/spec.md",
      "openwiki/testing-quality/verification.md",
      "scripts/lib/idd-check.js",
      "scripts/lib/idd-check.test.js",
      "scripts/lib/idd-contract.js",
      "scripts/lib/idd-exec.js",
      "scripts/lib/idd-exec.test.js",
      "scripts/lib/idd-workspace.js",
      "scripts/lib/idd-workspace.test.js",
      "scripts/ospec.js",
      "scripts/ospec.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "El control corre en un worktree aparte de la base pura, montado solo cuando una contraprueba falla y no hay control previo del mismo comando sobre la misma base; la ruta del worktree se enmascara como <worktree> en la salida de los dos, para que la comparación no dependa de dónde se montó",
      "El control es un run counterproof con control: true y el mount de nada; la evidencia lo nombra junto a la contraprueba, y vale la contraprueba que falló si su control pasó, o falló con otro exit o con otra salida",
      "Para boundary-tests, una contraprueba que falla igual que su control no corta: siguen los checks declarados hasta uno cuyo rojo venga de los tests"
    ]
  },
