  "intent": {
    "kind": "bug",
    "summary": "En Antigravity el hook PreToolUse de ospec responde {} cuando no tiene objeción, y agy 1.4.2 lee esa decisión vacía como denegación: todas las herramientas fallan con 'tool call denied by pre-tool hook:'.",
    "acceptance": "Con OSPEC_TARGET=antigravity, un PreToolUse que ospec permite no escribe nada en stdout (agy ejecuta la herramienta); ask y deny siguen saliendo como { decision, reason }."
  },
  "facts": {
    "basis": "Medido con agy -p 1.4.2 y un hook fijo: stdout vacío ejecuta, {} deniega, ask y allow ejecutan; SessionStart y Stop con {} no afectaron a esas ejecuciones. REQ-hooks-026 ya prohíbe emitir otra decisión que deny o ask."
  },
