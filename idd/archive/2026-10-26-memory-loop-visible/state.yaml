  "intent": {
    "kind": "bug",
    "summary": "E1.47 (B8): el bucle de memoria se ve en la salida de texto. ospec close en texto lista topic | title de cada registro de conocimiento en vez de solo su número; record intent devuelve memory_query, una pista que no bloquea con las palabras de la petición más los componentes y ADR que el CLI ya calcula; references/memory-loop.md dice que durante un cambio IDD los registros de close sustituyen al guardado genérico. El CLI sigue sin leer la memoria.",
    "acceptance": "Un close en texto muestra el topic y el título de cada registro y un test lo fija; record intent devuelve memory_query en JSON y en texto y un test lo fija; memory-loop.md dice cuándo usar la consulta y que los records de close sustituyen al guardado genérico; sin memoria el flujo no cambia y memory-boundary.test.js sigue en verde"
  },
  "facts": {
    "open": [
      "Orden del recall: hoy la memoria se consulta antes de listar los hechos abiertos, pero esos hechos se declaran en el mismo record intent que devolvería memory_query y después no se pueden cambiar. ¿El recall pasa a ir justo después de record intent y antes de preguntar el gate open-facts (una decisión previa confirmada en disco entra como contexto o recomendación de la pregunta, nunca la resuelve), se queda antes de los hechos con las palabras del agente y memory_query solo como recordatorio, o se añade un comando previo?",
      "Forma y contenido de memory_query: ¿una cadena lista para buscar o un objeto con términos, componentes y ADR? ¿De dónde salen las palabras (--request si existe, si no --summary; ¿también --acceptance?), cómo se normalizan (minúsculas, sin repetir, 4 o más caracteres, una lista corta de palabras vacías en español e inglés) y con qué tope de términos? Los componentes y ADR salen de las rutas que el CLI ya conoce al abrir (plan, diff y cites de una feature), que suelen estar vacías: ¿basta eso o se buscan también por nombre en la petición?",
      "¿Cuándo se devuelve memory_query: en cada record intent que deja una intención resuelta (también repetido sin cambios o al subir de kind) y nunca en uno ambiguo? ¿Se muestra también en la salida de texto como una línea propia, ya que los agentes no usan --json?",
      "Salida de texto de close: ¿una línea topic | title por registro bajo una cabecera con el número y el comando literal que da resumen y procedencia (ospec close --change <id> --json), o también source o summary en cada línea? La línea actual N knowledge record(s) ... (see --json) desaparece sin mantenerse; el JSON de close no cambia.",
      "Alcance de los records de close sustituyen al guardado genérico en memory-loop.md: ¿mientras un cambio IDD está abierto no se guardan sus decisiones sobre la marcha y solo se guardan los records de close, y fuera de un cambio (traspaso del roadmap, resúmenes de sesión) sigue el protocolo del host? ¿Se toca también la addenda SDD de rules/engram-session-memory.instructions.md o queda fuera?"
    ]
  },
