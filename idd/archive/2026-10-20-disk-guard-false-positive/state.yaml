  "intent": {
    "kind": "bug",
    "summary": "La regla de borrado de disco del guard PreToolUse bloquea comandos con --output-format o --pretty=format: cuando la línea tiene cualquier letra seguida de dos puntos",
    "acceptance": "cursor-agent -p --output-format text y git log --format con dos puntos no reciben deny; las órdenes reales de borrado de disco (unidad de Windows y Clear-Disk -Number) siguen denegadas, igual en JS y en Go"
  },
  "facts": {
    "open": [
      "¿Basta con excluir format cuando forma parte de una opción (precedido de -, = o .) o debe exigirse que format esté en posición de comando?",
      "¿La letra de unidad debe ser un token propio (C:, C:\\) en lugar de cualquier letra seguida de dos puntos?",
      "¿Se amplía la regla a Format-Volume y a Clear-Disk sin -Number, que hoy no se bloquean, o queda como follow-up?"
    ]
  },
