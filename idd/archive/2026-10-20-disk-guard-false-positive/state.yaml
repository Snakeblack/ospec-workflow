          "summary": "scripts/hooks/pre-tool-use.js:87 and internal/rules/rules.json:47. Old rule: any `x:` after `format` triggered the deny. New rule: a whitespace-preceded, standalone drive token is required. `format /fs:ntfs \\\\?\\Volume{GUID}\\` and `format /fs:ntfs /q <mount-point>` were denied (accidentally, via the 'fs:' switch) and now pass. `format $drive:` and `format\"D:\"` (no space before the quote) also pass. Impact: some real Windows format invocations that do not name a drive letter lose coverage.",
