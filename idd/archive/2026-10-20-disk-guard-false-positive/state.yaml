          "acceptance_criteria": "`$null=Clear-Disk -Number 0`, `$x=Format-Volume -DriveLetter D` and `$x=format D:` return deny in both the JS hook and the Go rules engine. `--output-format text`, `--pretty=format:'%h: %s'` and `git log --format=...` stay allowed. The JS and Go corpora include these cases.",
