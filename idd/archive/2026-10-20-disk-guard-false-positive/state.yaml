                "summary": "scripts/hooks/pre-tool-use.js:87 and internal/rules/rules.json:47. The lookbehind (?<![-=.]) guards the whole alternation, so it also applies to clear-disk and format-volume. `$null=Clear-Disk -Number 0`, `$r=Format-Volume -DriveLetter D` and `$r=format D:` were denied by the old rule (\\b sat between '=' and the word). They now pass, because '=' directly precedes the word. Impact: a destructive disk wipe that was blocked is allowed.",
                "acceptance_criteria": "`$null=Clear-Disk -Number 0`, `$x=Format-Volume -DriveLetter D` and `$x=format D:` return deny in both the JS hook and the Go rules engine. `--output-format text`, `--pretty=format:'%h: %s'` and `git log --format=...` stay allowed. The JS and Go corpora include these cases."
              },
              {
                "severity": "SUGGESTION",
                "summary": "scripts/hooks/pre-tool-use.js:87 and internal/rules/rules.json:47. Old rule: any `x:` after `format` triggered the deny. New rule: a whitespace-preceded, standalone drive token is required. `format /fs:ntfs \\\\?\\Volume{GUID}\\` and `format /fs:ntfs /q <mount-point>` were denied (accidentally, via the 'fs:' switch) and now pass. `format $drive:` and `format\"D:\"` (no space before the quote) also pass. Impact: some real Windows format invocations that do not name a drive letter lose coverage.",
                "acceptance_criteria": "Either `format ... \\\\?\\Volume{...}` is denied while `--output-format` and `--pretty=format:` stay allowed, or the maintainers record in the spec that volume-GUID and mount-point targets are intentionally out of scope. A decision is recorded either way, with a test for the chosen behaviour."
              }
