                "severity": "WARNING",
                "summary": "The new drive lookahead `(?=$|[\\s\"'/\\\\])` in the Format DENY rule (pre-tool-use.js:87, rules.json:47) lets a drive letter followed directly by a shell metacharacter through. Examples are `format D:;`, `format D:&&`, `format D:|`, `format D:)` and `echo y|format D:>nul`. The old rule `[a-z]:` anywhere after `format` denied all of these, so this is a regression in a guard that must fail closed (ADR 0008). The damage is limited to cases where the host permission prompt does not catch the command.",
                "acceptance_criteria": "In both the JS and Go (regexp2) rules, `format D:;`, `format D:&&echo x`, `echo y|format D:>nul`, `(format D:)` and `cmd /c \"format D:&echo\"` return deny. `--output-format text \"Responde: hola\"`, `git log --format='%h: %s'`, `--pretty=format:'%h %an: %s'` and `echo \"the format is: ok\"` still return no decision (allow in Go). The JS and Go test corpora include these cases and the JS and Go patterns stay identical."
