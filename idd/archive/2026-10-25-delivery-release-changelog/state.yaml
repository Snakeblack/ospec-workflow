  "gates": [
    {
      "id": "open-facts",
      "status": "resolved",
      "answer": "Opción: changelog + release (Recomendado) — delivery.changelog: <ruta>|none y delivery.release: per-change|batched|none; solo → CHANGELOG.md + per-change, small y multi-team → CHANGELOG.md + batched; el perfil solo recomienda y close no escribe hasta que se declare; este repo declara CHANGELOG.md + per-change. Escritura: close la escribe (Recomendado) — bajo ## [Unreleased], una vez, crea el fichero o la sección si faltan. Entrada: Todos, con id (Recomendado) — feature → Added, bug → Fixed, refactor y docs → Changed; línea '- <summary> (<change id>)'. Release: Versión, tag y notas (Recomendado) — última versión subida por tipos (feature → minor, si no patch; major nunca automático; sin versión previa null), tag v<versión>, notas de [Unreleased]; con batched no propone; solo con OK del usuario.",
      "source": "user"
    }
