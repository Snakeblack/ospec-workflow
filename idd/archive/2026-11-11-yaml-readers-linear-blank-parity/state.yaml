{
  "schema": "idd-state/v1",
  "change": "yaml-readers-linear-blank-parity",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Los lectores de state.yaml con capturas \\s*(.+)$ o \\s+#.*$ tardan de forma cuadrática ante un tramo de espacios seguido de un CR suelto o U+2028 (readStatus, el parser y el escritor del proyector, extractStateRouteInfo, parsePersistedRouteSection, el lector YAML-lite de pre-compact), y el escáner de escalares de Node (trim) y el de Go (TrimSpace) deciden distinto si una línea de solo U+0085 o U+FEFF está en blanco.",
    "acceptance": "Con 100.000 espacios seguidos de b, CR y c (o U+2028, o b espacio c) en cualquier valor de state.yaml, cada lector termina muy por debajo de un segundo y Node lee la línea como Go; el escáner de Node y el de Go dejan las mismas líneas opacas sobre un corpus compartido que pasan los dos, con líneas de solo U+0085 o U+FEFF tras un escalar de bloque."
  },
  "facts": {
    "open": [
      "Recorte del escáner: con solo espacio y tabulador (lo decidido), una línea que acaba en un CR suelto (fichero con CR CR LF) deja de leerse igual que hoy en Node y en Go: 'notes:<CR>' ya no es una clave y '\"abc\"<CR>' da malformed-state. ¿Recortar espacio, tabulador y CR (el CR es salto de línea en YAML, nunca contenido) o solo espacio y tabulador?",
      "Alcance de la paridad de blancos: hoy, tras un bloque, una línea de solo U+0085 hace que el validador del proyector de Node rechace el fichero y el de Go lo acepte, y con U+FEFF al revés. Si solo cambia el escáner, esa divergencia sigue y el lado que acepta leería la clave siguiente. ¿Cambiar solo el escáner, o también los validadores, parsers y dropRewrittenContinuations del proyector en Node y en Go, que deciden la línea en blanco después del escáner?",
      "extractPhaseStatuses de pre-compact (Node) no usa el escáner: un 'status: done' dentro de un 'notes: |' bajo phases cuenta para la fase anterior y adelanta la fase actual (probado: proposal pasa a tasks). ¿Entra en esta PR, al ser un lector de state.yaml de REQ-lifecycle-kernel-033 que ya toco por su patrón status:\\s*(.+)$, o va en PR5, que portará esa función a Go?"
    ]
  },
