          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "The generation-1 fix aligned the validator, parser and dropRewrittenContinuations, but the projector's write-side lookups still trim with Unicode TrimSpace/trim() and \\s, so they disagree with the parser and with each other. Go: replaceOrInsertTopLevel (reducer.go:686), applyBlockingQuestions (703), applyPhaseProjection (736-802). Node: applyStateProjectionToYaml (ospec-state.js:953-1129). Trigger: both runtimes accept \"\\u00a0status: x\" before the real \"status:\", and the parser reads it as key \"\\u00a0status\". Go trims it to \"status\" (indent 0) and rewrites the decoy, so the real status, revision or phase field stays stale. Node skips it, because its \\s indent is 1. Likewise \"\\u00a0phases:\", \"  \\u00a0design:\" and \"    \\u00a0status:\" retarget Go. Node deletes \"\\u00a0foo: bar\" after blocking_questions, which Go keeps. The corpus compares only outcome, so none of this is caught.",
                "acceptance_criteria": "For top-level \"\\u00a0status:\", \"\\u00a0revision:\" and \"\\u00a0phases:\" placed before the real key, and for \"  \\u00a0design:\" and \"    \\u00a0status:\" before the real phase key, a projection MUST change the real key and leave the decoy bytes alone, in Node and in Go. A \"\\u00a0foo: bar\" line after blocking_questions MUST survive in both. Add cases to internal/testdata/state-projection/cases.json that compare the projected bytes (an \"output\" field), not only the outcome, and are read by both test suites."
              },
              {
                "severity": "SUGGESTION",
                "summary": "Pre-existing divergence that the new shared corpus does not cover: for \"phases: # comment\" the Node validator accepts it (ospec-state.js:794-796 takes a value that starts with \"#\"), while Go parsePhaseCompletionState rejects it (reducer.go:625-628). Go's yamlScalar only strips \" #\", so \"# comment\" stays non-empty and gives \"non-mapping phases value\". Node projects the file and Go returns malformed-state, which contradicts REQ-lifecycle-kernel-035's claim that both reach the same outcome. The direction is fail-closed in Go, but the runtimes disagree on the same state.yaml.",
                "acceptance_criteria": "A corpus case with input \"change: x\\nstatus: planning\\nphases: # c\\n  design:\\n    status: pending\\n\" gives the same outcome in Node and in Go. Accepting or rejecting it is a maintainer decision, but both runtimes must agree."
              }
            ]
