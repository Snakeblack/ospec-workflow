          "result_digest": "sha256:b2e677e7ea051d4ad50382926bc26a5a35c31611560c79d5e0417993a0fd2c57",
          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "El arreglo de la generación 3 dejó el sangrado distinto entre proyectores. Node cuenta solo espacios (lineIndent, scripts/lib/ospec-state.js:997,1025,1046,1120,1126), pero Go sigue contando espacios y tabuladores (lineIndentation, internal/hooks/phase-completion-reducer.go:999-1001, usada en 725,736,754,783,794). Un comentario con tabulador al inicio (`<TAB># nota`) pasa el validador de los dos runtimes, porque el comentario se salta antes de la comprobación del tabulador. Con ese comentario dentro de blocking_questions, Node termina la sección ahí y deja huérfano el `  - \"r\"` siguiente tras `blocking_questions: []`; Go lo borra. Con él entre `phases:` y la fase destino, Node cierra phases, no halla la cabecera e inserta un bloque duplicado; Go reescribe la fase real. Antes Node usaba \\s y coincidía con Go. Ningún caso del corpus lo cubre.",
                "acceptance_criteria": "Dado un state.yaml con un comentario que empieza por tabulador (`<TAB># c`, y `  <TAB># c`) dentro de blocking_questions y entre `phases:` y la fase proyectada, Node y Go escriben los mismos bytes o ambos devuelven malformed-state. El caso entra en internal/testdata/state-projection/cases.json y pasa en ambos tests. Un escritor que cuente tabuladores y otro que no ya no coexisten, y el spec REQ-035 dice lo mismo que hace el código."
              },
              {
                "severity": "WARNING",
                "summary": "Los lectores de puerta no recibieron el recorte nuevo de los proyectores. Node readStatus (scripts/lib/ospec-state.js:60-95) usa trim() y \\s como sangrado. Go ReadStatus (internal/yamllite/yamllite.go:41-54,75-111) usa TrimSpace y cuenta solo espacios y tabuladores. Una línea `<U+00A0>status: archived` (o con U+0085) antes del `status: planning` real es sangrada para Node, que lee `planning`. Go la recorta, la lee como clave de nivel 0 y devuelve `archived` por ser la primera coincidencia. Ahora el proyector trata esa línea como texto y reescribe la línea real. Antes Go reescribía el señuelo y lector y escritor coincidían. Con el arreglo, el estado que lee el Go (FindActiveChanges, estado activo de PreToolUse) deja de seguir al que escribe el proyector. Pre-compact repite el patrón (scripts/hooks/pre-compact.js:75-82,140-142,232-234).",
                "acceptance_criteria": "Con `change: x`, `<U+00A0>status: archived` y `status: planning`, readStatus de Node, store.ReadStatus de Go y el proyector eligen la misma línea como status, y un caso compartido lo comprueba en ambos runtimes. Se unifica el recorte y el sangrado de los lectores (extractScalarAtPath, readStatus, pre-compact) con el de los proyectores, o se rechaza esa línea en el validador. Tras proyectar, el estado que lee cada runtime es el que se escribió."
              },
              {
                "severity": "WARNING",
                "summary": "`phases: \"\"` y `phases: ''` (la rama hermana del `phases: # c` de la generación 2) siguen sin acuerdo. Go acepta: parsePhaseCompletionState usa `yamlScalar(value) != \"\"` (internal/hooks/phase-completion-reducer.go:625-628) y yamlScalar devuelve \"\" para un escalar entre comillas vacío. Node rechaza con `if (value) return false` (scripts/lib/ospec-state.js:797-798). En Go, applyPhaseProjection solo reconoce la línea `phases:` exacta (739), no la halla y añade una segunda clave `phases:` al final, con claves duplicadas en el archivo escrito. Node devuelve malformed-state con la misma entrada. Ningún caso del corpus la cubre.",
                "acceptance_criteria": "Dada una entrada con `phases: \"\"` o `phases: ''`, Node y Go devuelven el mismo resultado (malformed-state y bytes intactos, de preferencia, porque el escritor solo reconoce `phases:` sola). El caso entra en internal/testdata/state-projection/cases.json y pasa en ambos tests. Go ya no escribe dos claves phases."
              },
              {
                "severity": "SUGGESTION",
                "summary": "Divergencias previas, ajenas a los espacios. (a) Go yamlScalar (internal/hooks/phase-completion-reducer.go:972-984) desescapa JSON en un escalar entre comillas dobles y projectedScalar de Node (scripts/lib/ospec-state.js:738-743) no, así que `status: \"d\\u006fne\"` es `done` en Go y texto crudo en Node. (b) El validador de revision acepta `+5` o `-0` en Go (strconv.Atoi, línea 620) y los rechaza en Node (/^\\d+$/, línea 796). Node acepta más dígitos que un int64, que Go rechaza. (c) Go toma como fase cualquier línea de nivel 2 que acabe en `:` (línea 635, por ejemplo `  note: x:`) y Node exige [\\w-]+ (línea 901). (d) Con claves repetidas, los lectores toman la última y el escritor reescribe la primera.",
                "acceptance_criteria": "Cada divergencia se resuelve o se documenta como excepción en REQ-035, con un caso del corpus compartido que Node y Go lean y que da igual resultado: escalar con escape JSON, revision `+5` y de más de 19 dígitos, `  note: x:` bajo phases, y status repetido."
              }
            ]
          },
