                "severity": "WARNING",
                "summary": "The change trims a line only of space, tab and CR (trimYamlSpace / yamllite.TrimSpace), but the validators still disagree on the line's first character. scripts/lib/ospec-state.js:765 matches the trimmed line with MAPPING_LINE (yaml-lite.js:138), whose `[^:\\s]` rejects a leading U+00A0, U+FEFF, VT or U+2028, because Node `\\s` includes them. Go's validatePhaseCompletionYAML (phase-completion-reducer.go:935) uses yamlKeyValue, which accepts any line holding a colon, and dropRewrittenContinuations uses MappingLine, whose Go `\\s` is ASCII-only. Trigger: a top-level line `\\u00a0foo: bar`, or a state.yaml that starts with a BOM. Before the change, trim() removed these characters in both runtimes. Now Node validateProjectableState returns false (malformed-state, so the projector refuses) and Go accepts and projects. `status: \\ufeff` is also empty in Node (`:\\s*`) and non-empty in Go. No test covers this: the corpus only compares opaque lines for lines made only of such a character.",
                "acceptance_criteria": "For top-level lines `\\u00a0foo: bar`, `\\ufeffchange: x` and `\\u000bfoo: bar`, and for `status: \\ufeff`, validateProjectableState (Node), validatePhaseCompletionYAML and parsePhaseCompletionState (Go) and dropRewrittenContinuations (Node and Go) give the same verdict: all accept or all reject, and they agree on which key a line names. A test shared by the Node and Go suites, in the style of cases.json, pins that verdict."
