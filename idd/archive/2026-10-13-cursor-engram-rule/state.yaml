  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "La regla no entra en el árbol generado. El paso de instalación copia el protocolo que ya escribe engram setup, así que la fuente canónica y los fixtures golden no cambian."
    },
    {
      "kind": "adr",
      "id": "0010",
      "impact": "conforms",
      "reason": "La proyección solo lee y escribe un fichero local con la biblioteca estándar. No añade dependencias ni descargas."
    },
    {
      "kind": "scenario",
      "id": "offline-operation",
      "impact": "conforms",
      "reason": "La proyección no abre red. Si el protocolo no está, no se escribe la regla y el instalador sigue."
    },
    {
      "kind": "scenario",
      "id": "target-parity",
      "impact": "conforms",
      "reason": "No cambia una skill, un agente ni un hook de la fuente canónica. Cursor recibe el protocolo con su mecanismo nativo, una regla .mdc, sin tocar el generador."
    },
    {
      "kind": "adr",
      "id": "0003",
      "impact": "none",
      "reason": "scripts/lib/idd-workspace.test.js entra en el diff por el cambio cerrado dangling-symlink-rm. Este cambio no mueve decisiones de proceso."
    },
    {
      "kind": "adr",
      "id": "0004",
      "impact": "none",
      "reason": "El test del symlink no añade señales de impacto a la regla de Engram."
    },
    {
      "kind": "adr",
      "id": "0005",
      "impact": "none",
      "reason": "El cierre de este cambio sigue apoyado en ospec run y ospec check. El test no cambia esa regla."
    },
    {
      "kind": "adr",
      "id": "0011",
      "impact": "none",
      "reason": "No se mezcla el estado SDD con el de IDD. El test vive en scripts/lib."
    },
    {
