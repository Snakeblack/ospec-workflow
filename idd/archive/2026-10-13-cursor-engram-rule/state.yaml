{
  "schema": "idd-state/v1",
  "change": "cursor-engram-rule",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "setup:cursor proyecta el protocolo de Engram a una regla global alwaysApply y deja de pedir pegarlo a mano",
    "acceptance": "Con Engram configurado, el paso escribe ~/.cursor/rules/engram-memory-protocol.mdc con description corta, alwaysApply true y el cuerpo del protocolo, no imprime el aviso de User Rules, y la documentación describe esa regla."
  },
  "facts": {
    "basis": "El usuario confirmó en /rule que Cursor carga ~/.cursor/rules/*.mdc válidos (ospec-router y no-model-attribution, alwaysApply true) y pidió la misma forma para Engram, global, quitando el pegado manual. El texto sigue saliendo de ~/.cursor/engram-memory-protocol.md, que REQ-install-028 usa como pieza de detección y se conserva. La regla es una proyección fail-open de ese fichero. Si el protocolo está vacío o no se puede leer, no se escribe la regla y se avisa, sin cambiar el código de salida del instalador."
  },
  "plan": {
    "paths": [
      "README.es.md",
      "README.md",
      "docs/plugin-installation.es.md",
      "docs/plugin-installation.md",
      "openspec/specs/install/spec.md",
      "scripts/configure/engram-setup.js",
      "scripts/configure/engram-setup.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": []
  },
