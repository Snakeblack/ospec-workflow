{
  "schema": "idd-state/v1",
  "change": "check-path-scope",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "continua",
    "kind": "feature",
    "summary": "Un check de idd/config.yaml puede declarar sus rutas, y ospec check no lo ejecuta si el diff del cambio no toca ninguna (E1.67, #499)",
    "acceptance": "Con un check acotado a src/**, un cambio que solo toca docs/** cierra sin ejecutarlo y el estado registra que se omitió y por qué; si después toca src/**, el siguiente ospec check lo ejecuta; añadir, quitar o cambiar las rutas de un check abre checks-changed; un idd/config.yaml sin rutas en ningún check se comporta como hoy"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "Forma y límites de las rutas de un check en idd/config.yaml: (A) anidada, como en el issue: e2e: con run: y paths: debajo; paths admite lista en línea, en bloque o una sola ruta; una lista vacía, una ruta absoluta o con .., o cualquier otra clave bajo el check dan config-invalid. (B) Una sección aparte, check_paths: con e2e: [src/**], que no amplía el subconjunto YAML de REQ-idd-013."
      },
      {
        "category": "uniqueness",
        "question": "Qué cuenta como tocar una ruta: (A) cualquier ruta del diff del cambio contra su base (añadida, cambiada, borrada, los dos lados de un renombre y los ficheros sin seguimiento), casada con la sintaxis glob de impact (sin distinguir mayúsculas, ** y {a,b}) y relativa a la raíz del proyecto. (B) Solo las rutas cambiadas desde el último ospec check."
      },
      {
        "category": "persistence",
        "question": "Dónde queda la omisión: (A) en la evidencia check-run de checks-pass, como skipped con el nombre y el motivo de cada check omitido, en la salida de ospec check y en los avisos de ospec close. (B) Además, un run por check omitido en runs."
      },
      {
        "category": "copy",
        "question": "Texto del motivo: (A) check e2e did not run: no path of the diff matches its paths (src/**, tests/e2e/**), en inglés como el resto de la CLI. (B) Otro texto que prefieras."
      },
      {
        "category": "url-state",
        "cite": {
          "kind": "path",
          "path": "docs/roadmaps/harness-evolution.md",
          "line": 1248
        }
      },
      {
        "category": "accessibility",
        "cite": {
          "kind": "path",
          "path": "openspec/specs/idd/spec.md",
          "line": 1298
        }
      },
      {
        "category": "errors",
        "question": "Dos casos límite: 1) si todos los checks declaran rutas, (A) config-invalid al leer la configuración, porque un cambio que no toque ninguna no podría cerrar nunca, o (B) como dice el issue, checks-pass queda pendiente cuando no corre ninguno; 2) un check que el cambio añade o cambia respecto a la base (comando o rutas), (A) corre aunque el diff no toque sus rutas, para que el comando aprobado se ejecute al menos una vez, o (B) sigue sus rutas como los demás."
      }
    ]
  },
