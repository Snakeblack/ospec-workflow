        "plan": "El esquema idd-state/v1 sigue leyendo todo lo anterior y no hay migración: un checks-changed cuyos checks tienen solo name y command y una evidencia check-run sin skipped siguen siendo válidos (tests de idd-contract e idd-check), y un check sin paths conserva la forma {name, command} en el estado y en la huella del árbol de checks, así que la evidencia y las aprobaciones de los cambios abiertos antes de E1.67 siguen valiendo. Lo nuevo es aditivo: paths en un check de checks-changed y skipped en la evidencia check-run solo aparecen con un check acotado. idd/config.yaml sin checks acotados se lee igual (tests de idd-config). Vuelta atrás: una CLI anterior rechaza como línea ilegible un check anidado con run y paths, y como checks-changed inválido un gate que apruebe paths; antes de volver a ella se quitan los checks acotados de idd/config.yaml y se cierran los cambios cuyo checks-changed los aprobó, o se sigue con la versión nueva."
