                "severity": "CRITICAL",
                "summary": "Regression against main: the Ruby %x rule at scripts/lib/idd-sinks.js:131 stops matching lines that main matched. After the opening delimiter, its character class now rejects |, ] and ! as well as ) and }. So any pipe, bracket or bang before the first #{ ends the match. On main, the rule at old-sinks.js:87 (%x[({][^)}]*#{...}) labelled `out = %x(ps aux | grep #{name})` and `out = %x{ls | wc -l #{dir}}` as composed shell command (CWE-78). I traced every .rb rule of the new catalog: sinkOf returns null for both lines. A Ruby change that adds such a line outside security paths derives no security-boundary and skips its trust review. This breaks the acceptance in idd/own-sink-catalog/change.md (no losses against the previous catalog) and makes the claim at docs/roadmaps/harness-evolution.md:1651 untrue. KNOWN only has `%x(ls #{dir})` (idd-sinks.test.js:132), so the suite stays green.",
                "acceptance_criteria": "sinkOf('app/jobs/run.rb', 'out = %x(ps aux | grep #{name})') and sinkOf('app/jobs/run.rb', 'out = %x{ls | wc -l #{dir}}') return 'composed shell command (CWE-78)', and corpus cases cover both. Every line the main %x alternative matched (any characters other than ) or } between the delimiter and #{...}) returns the same label. The ADDED case `out = %x[ls #{dir}]` keeps passing.",
                "location": "scripts/lib/idd-sinks.js:131"
              },
              {
                "severity": "WARNING",
                "summary": "Lines main detected now get a different label. The widened PHP shell rule (idd-sinks.js:130 adds the double-quoted-$var and the 'literal' . forms) and the new Ruby call rule (line 131, system|exec|spawn followed by a double-quoted #{) also match the database exec methods. composed shell command comes before composed SQL in WEAKNESSES. So `$pdo->exec('DELETE FROM t WHERE id = ' . $id);`, `$pdo->exec(\"DELETE FROM sessions WHERE token = '$token'\");` (PDO and SQLite3 exec) and `conn.exec(\"SELECT * FROM users WHERE id = #{id}\")` (pg gem) move from 'composed SQL (CWE-89)' on main to 'composed shell command (CWE-78)'. The signal still derives, but the retraction key changes, so an answered retraction stops covering the line and the signal comes back. The reason also sends the trust reviewer to command injection for what is an SQL injection. This contradicts the acceptance (same label) and docs/roadmaps/harness-evolution.md:1651.",
                "acceptance_criteria": "sinkOf returns 'composed SQL (CWE-89)' for web/repo.php `$pdo->exec('DELETE FROM t WHERE id = ' . $id);`, for web/repo.php `$pdo->exec(\"DELETE FROM sessions WHERE token = '$token'\");` and for app/repo.rb `conn.exec(\"SELECT * FROM users WHERE id = #{id}\")`, and corpus cases cover them. The ADDED lines for PHP exec and popen and for Ruby system keep 'composed shell command (CWE-78)'. `$pdo->exec($sql);` keeps the label it had on main.",
                "location": "scripts/lib/idd-sinks.js:130"
