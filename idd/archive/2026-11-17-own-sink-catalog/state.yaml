                "summary": "Missed sink in a newly widened form. The comment at scripts/lib/idd-sinks.js:89 says curl's -k may come bundled with other short options. But the bundle alternative on line 90 needs at least one letter before k, and the plain alternative needs whitespace right after -k. So `curl -kL https://internal/api`, `curl -ksS https://internal/api` and `curl -kfsSL https://internal/api` (k first in the bundle, a common idiom) derive nothing. A shell script that adds one of them outside security paths skips its trust review. This is not a regression (main missed these too). It is a gap in coverage that this change claims to add, and the corpus only tests `curl -sSk` (idd-sinks.test.js:168).",
