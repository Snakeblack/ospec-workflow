    "acceptance": "scripts/lib/idd-sinks.js no adapta el catálogo de gentle-ai ni lleva su aviso MIT; cada línea que el catálogo anterior detectaba sigue derivando security-boundary con la misma etiqueta (el corpus actual de idd-sinks.test.js pasa sin cambios y una comparación contra el catálogo anterior no encuentra pérdidas); la spec de IDD y el handbook dejan de decir que está adaptado; node scripts/check.js pasa"
  },
  "facts": {
    "coverage": [
      {
        "category": "inputs",
        "question": "¿Qué cubre el catálogo propio? (a) solo lo que detecta hoy, reescrito; (b) además las formas que hoy se escapan dentro de las mismas once debilidades (por ejemplo cfg.InsecureSkipVerify = true, ssh.InsecureIgnoreHostKey(), os.MkdirAll(dir, 0777), fs.chmodSync(f, 0o777), spawn(cmd, { shell: true }), Runtime.getRuntime().exec compuesto, wget --no-check-certificate); (c) además dos debilidades nuevas: salida HTML sin escapar (CWE-79: dangerouslySetInnerHTML, innerHTML compuesto, bypassSecurityTrustHtml, v-html, mark_safe, template.HTML, Html.Raw) y cifrado débil (CWE-327: DES, RC4 y modo ECB)"
      },
