  "intent": {
    "kind": "bug",
    "summary": "La regla de disco del PreToolUse deniega format solo cuando es la orden (inicio de orden o tras un envoltorio que ejecuta su operando), no cuando es una palabra suelta; paridad JS/Go (#407, OSP-033)",
    "acceptance": "Los cinco ejemplos de #407 y un heredoc que los cite no reciben decisión; formatear una unidad como orden (directa, con cmd /c, asignada), Format-Volume y Clear-Disk siguen denegados con los casos actuales; la paridad JS/Go pasa"
  },
  "facts": {
    "open": [
      "Texto entre comillas: ¿un separador (; & |) dentro de comillas sigue partiendo órdenes (conservador) o se ignora salvo en el operando de cmd /c, powershell -c, etc.?",
      "Heredocs: ¿una línea del cuerpo que empieza por format seguido de una unidad sigue contando como orden?",
      "cmd /c dotnet format C:\\repo\\app.sln hoy se deniega por test; con format como orden pasaría: ¿se acepta el cambio?",
      "¿Qué envoltorios ejecutan su operando como orden: solo los de #407 y los ya probados, o también powershell/pwsh -c, bash/sh -c, iex, env, exec, nohup, doas y time?",
      "¿Clear-Disk y Format-Volume siguen denegándose como palabra en cualquier posición o pasan también a exigir posición de orden?"
    ]
  },
