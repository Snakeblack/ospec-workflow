                "summary": "pre-tool-use.js:99 (TOKEN; same pattern at rules.json:47): the same token run can be parsed two ways that end at the same position, and neither engine memoizes, so a failing match costs 2^n. (a) A valued-flag value or env assignment (`WORD*`, lines 73 and 91) may contain quotes, while a token may also end at `(?=[\"'])` and the next token start at that quote. `sudo -u a\"sudo -u a\"…` has 2 ways per repetition. `pwsh -ep x\"pwsh …` and `env A=b\"env A=b\"…` behave the same. (b) The quoted PATH (line 77) spans spaces, so `\"/sudo /sudo\" ` can end its path at either slash: 2 ways per chunk. About 35 repetitions (~500 chars) should outlast the 5 s hook timeout in JS and in Go regexp2 (no MatchTimeout). The hook then returns no decision. The claim 'one reading per flag' and the spec's 'stays linear' do not hold for these inputs.",
                "acceptance_criteria": "In JS and Go, `'sudo -u a\"'.repeat(40)`, `'pwsh -ep x\"'.repeat(40)`, `'env A=b\"'.repeat(40)` and `'\"/sudo /sudo\" '.repeat(40)` are evaluated by the disk rule in milliseconds with no deny. The same strings followed by `; format D:` are denied just as fast. The linear tests in pre-tool-use.test.js and rules_test.go include these inputs (or equivalents with n >= 30), and they fail against the current pattern.",
                "location": "scripts/hooks/pre-tool-use.js:99"
              },
