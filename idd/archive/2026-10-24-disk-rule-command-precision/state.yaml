            "evidence": [
              "Static trace only; no test was executed. Case (a): WORD (pre-tool-use.js:67) now excludes quotes, so a valued-flag value (line 75) or env assignment (line 90) stops at the quote. Only SEP (?=[\"']) plus the next token's leading quote can follow, so 'sudo -u a\"', 'pwsh -ep x\"' and 'env A=b\"' each have one parse per repetition.",
              "Case (b): PATH (line 102) excludes whitespace and quotes, and OPERAND (line 106) rejects '/sudo' as a slash flag. '\"/sudo /sudo\" ' therefore splits as '\"/sudo ' + '/sudo\" ' with one reading. The spaced quoted path survives only in QUOTED_PROGRAM at command start (line 100), so it adds at most 2 readings per segment, not per repetition.",
              "Tests: pre-tool-use.test.js:449-452 and rules_test.go:299-302 add the four reviewer inputs at n=5000 (>=30). Each is asserted not denied, and denied once '; format D:' is appended (js:463, go:317-318). The Go test also caps the run at 1s. The old pattern is 2^n on these inputs, so these tests cannot pass against it.",
              "Parity: rules.json:47 matches DISK_FORMAT_RE segment by segment (QUOTED_PROGRAM, TOKEN, SEP, ARGLIST, FORMAT, slash-flag name list) after the '\\/' normalization. Read, not run. This lineage has one slice and no named passed slice, so there is no cross-slice regression to report."
