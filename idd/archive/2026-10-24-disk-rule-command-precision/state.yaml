                "severity": "WARNING",
                "summary": "pre-tool-use.js:98-99: inside a `Start-Process` `-ArgumentList` string, a token is recognised only as a wrapper, a slash flag, a number or `-ArgumentList`. `Start-Process powershell -Verb RunAs -ArgumentList \"-NoProfile -Command format D:\"` and `Start-Process cmd -ArgumentList '/c','format D:'` are not denied, although the previous word-based rule denied both and the spec lists `Start-Process` and its `-ArgumentList` string as supported.",
                "acceptance_criteria": "In JS and Go, `Start-Process powershell -Verb RunAs -ArgumentList \"-NoProfile -Command format D:\"` and `Start-Process cmd -ArgumentList '/c','format D:'` are denied. `Start-Process dotnet -ArgumentList \"format C:\\repo\"` and the existing allowed corpus stay allowed. Both engines have a test for each denied form."
              }
