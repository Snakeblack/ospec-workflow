  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "Encargo S2c, reenviado por otra sesión y aceptado por el usuario como E5.11: una opción de `ospec snapshot` que emita el snapshot de avance v2 (p. ej. `--schema-version 2`); el v1 sigue disponible. Fuentes: el roadmap como en el v1 (fases, orden y estado); groups = encabezados `##` del roadmap que contienen tablas de fases, en orden, y cada fase lleva el group de su tramo; el encabezado puede ser `<ID>. <título>` o no (id derivado). Un fichero de avance opcional, por defecto `docs/progress.md` y otro con `--progress <ruta>`, en Markdown para el cliente y en el idioma del proyecto: por tramo, título y resumen; por fase (mismo `<ID>.` que el roadmap), título para el cliente, nombre corto, fechas de inicio y fin, descripción, tareas como `- [x]`/`- [ ]` con un id estable escrito a mano, outcomes y URL de la versión de prueba; y una lista de peticiones al cliente (id, fase opcional, título, cuerpo opcional, fecha límite opcional). Sin fichero de avance, el v2 sale solo con tramos y fases. Todas las fases del roadmap salen en el snapshot. Errores: código 1, fichero y línea, sin recortar ni escribir nada, con una fase o un tramo del fichero de avance que no está en el roadmap, una fase done con alguna tarea sin marcar, o un texto, lista o fecha fuera del formato. El esquema v2 dice lo mismo que el del consumidor. Documentación agnóstica, sin nombrar al consumidor. Solo bajo demanda.",
    "kind": "feature",
    "summary": "ospec snapshot --schema-version 2 emite el snapshot de avance v2: las fases del roadmap con su tramo (los encabezados ## con tablas de fases) y, desde un fichero de avance opcional en Markdown (docs/progress.md o --progress), los textos para el cliente de cada tramo y fase, sus tareas, fechas, resultados y versión de prueba, y las peticiones al cliente; el v1 sigue siendo el de por defecto",
    "acceptance": "Con --schema-version 2, ospec snapshot emite un JSON que cumple schemas/progress-snapshot/v2.schema.json y sus reglas (ids únicos, tramos seguidos y no vacíos, fechas reales con start <= end, fase done con todas sus tareas hechas, textos limpios, 64 KiB), con todas las fases del roadmap; sin fichero de avance sale solo con tramos y fases; un fichero de avance con una fase o un tramo que no está en el roadmap, una fase done con una tarea sin marcar o un texto, lista, fecha o URL fuera del formato termina con código 1, el fichero y la línea, y sin escribir nada; sin la opción, el v1 sale igual que hoy; la documentación es agnóstica y ningún flujo, hook, check ni gate lo ejecuta"
  },
