        "plan": "idd-state/v1 gana campos opcionales: recorded_turn en las señales y, en una retirada con respuesta, recorded_turn, resolved_turn, declared_source y unverified_reason. Un estado escrito antes sigue siendo válido: sus señales no tienen recorded_turn y su retirada conserva la fuente con que se responde. La versión anterior del CLI y los hooks en Go leen un estado nuevo porque no rechazan claves que no conocen. Vuelta atrás: volver a la versión anterior, que ignora esos campos; ningún estado se reescribe."
      }
