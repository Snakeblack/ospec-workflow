                "summary": "scripts/lib/turn-fence.js:183 treats any count other than the signal's recorded_turn as a user turn, but Stop counts the turn end before it blocks with the E1.51 nudge (scripts/hooks/stop.js:317-318, internal/hooks/stop.go:57,154), so the agent continues with the count moved and no user reply. Gates are shielded: no nudge while a gate is open (idd-nudge.js:224, iddnudge.go:349). A retraction offer is no gate: the nudge fires on its satisfy-obligation step and its reason now names the retraction (idd-session.js:110-122, iddsession.go:470-491). Trigger: check records security-boundary at count c, the agent ends its turn, Stop counts c+1 and blocks; in that continuation record retract --answer ... --source user stays user, trust-review is withdrawn and close warns nothing, though approvals.md:52-56 says it is fenced as a gate is. Fix: count only a Stop that ends the turn, or give no nudge while such a signal holds the current count.",
                "acceptance_criteria": "With a signal recorded at count c, a Stop that answers decision block (Node and Go) followed, before any Stop that lets the turn end, by record retract --answer ... --source user records answer_source user-unverified with declared_source user, and record retract and close warn naming the signal and its obligation; or no Stop nudge is returned in that state. A retraction recorded after a Stop that let the turn end keeps user, gate fencing is unchanged, and a test covers the nudge-continuation path.",
