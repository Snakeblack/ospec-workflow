{
  "schema": "idd-state/v1",
  "change": "hooks-binary-fallback",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "El binario ospec-hooks desfasado o que no se puede ejecutar deja de ensombrecer al hook Node: el instalador no copia un binario anterior al código Go si no puede recompilarlo, y el lanzador reintenta con el hook Node cuando el binario no arranca (EACCES, ENOEXEC, 126)",
    "acceptance": "Sin Go y con release/dist/ospec-hooks-<os>-<arch> más viejo que cmd/ e internal/, copyBinaryToTree no lo copia al árbol de un target con fallback Node y avisa; con un binario sin +x o de otra arquitectura, ospec-hooks-launch.js ejecuta <sub>.js y devuelve su salida en vez de ask/[ospec error]"
  },
  "facts": {
    "open": [
      "OpenCode no tiene fallback Node: con un binario desfasado y sin Go, ¿la instalación falla como cuando falta el binario, o lo copia con aviso como hoy?",
      "¿Qué fallos del binario reintentan con Node: EACCES, ENOEXEC, ENOENT y salida 126/127 (el /bin/sh de respaldo de libuv ante ENOEXEC), y el reintento deja un aviso en stderr?",
      "¿Se embebe la versión en el binario (-ldflags y --version) y dónde se compara (doctor o lanzador), o el desfase sigue detectándose solo por mtime?",
      "Si el instalador no copia el binario, ¿borra el ospec-hooks que dejó una instalación anterior en el destino (install-target fusiona el árbol en el repo y lo conservaría)?"
    ]
  },
  "plan": {
    "paths": [
      "docs/harness-go-js-parity.md",
      "openspec/specs/hooks/spec.md",
      "openspec/specs/install/spec.md",
      "openwiki/hooks-runtime/go-implementation.md",
      "openwiki/hooks-runtime/lifecycle.md",
      "scripts/configure/install-target.js",
      "scripts/configure/install-target.test.js",
      "scripts/hooks/ospec-hooks-launch.js",
      "scripts/hooks/ospec-hooks-launch.test.js"
    ],
    "work_units": 1,
    "decision": true,
    "operations": [],
    "decisions": [
      "ensureRuntimeBinary devuelve null ante un binario desfasado sin Go, salvo con allowStale; copyBinaryToTree lo pide solo para opencode, cuyo plugin no tiene fallback Node",
      "Un binario desfasado descartado no aborta aunque el target lo marque required (Cursor, Copilot global): sus hooks pasan por el lanzador y corren en Node; un binario ausente sigue abortando como antes",
      "install-target borra el binario genérico de una instalación anterior dentro de syncEntriesTransactional (parámetro removals), que también hace snapshot de su entrada, así que un rollback lo restaura; los instaladores globales ya lo podan con su manifiesto",
      "El lanzador reintenta con Node solo ante EACCES, ENOEXEC, ENOENT y salida 126/127, dentro del mismo plazo de 4 s, con un aviso [ospec warn] en stderr; timeout, señal u otro código no se reintentan",
      "No se embebe la versión en el binario: el desfase sigue detectándose por mtime (E1.22), porque la versión solo cambia en los commits de release"
    ]
  },
