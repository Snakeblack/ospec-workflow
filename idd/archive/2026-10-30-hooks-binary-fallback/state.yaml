  "impacts": [
    {
      "kind": "adr",
      "id": "0001",
      "impact": "conforms",
      "reason": "Los árboles siguen saliendo de la generación; un binario desfasado que no se puede recompilar se queda fuera del árbol y el target degrada de forma declarada a sus hooks Node"
    },
    {
      "kind": "adr",
      "id": "0008",
      "impact": "conforms",
      "reason": "Un binario que no arranca da paso al hook Node equivalente, que también falla cerrado; un binario que arrancó y falló sigue devolviendo ask, y un timeout o una señal no se reintentan"
    },
    {
      "kind": "adr",
      "id": "0010",
      "impact": "conforms",
      "reason": "Extiende la regla de la ADR: sin un binario utilizable para la plataforma (ausente, desfasado sin Go o que no arranca) corre el hook interpretado equivalente; no añade dependencias ni descargas"
    },
    {
      "kind": "scenario",
      "id": "guard-fail-closed",
      "impact": "conforms",
      "reason": "El guard corre en Node cuando el binario no arranca en lugar de pedir permiso por un fallo de lanzamiento; cualquier otro fallo del hijo sigue en ask"
    },
    {
      "kind": "scenario",
      "id": "offline-operation",
      "impact": "conforms",
      "reason": "El instalador y el lanzador no añaden llamadas de red; sin Go el binario desfasado se descarta en local"
    },
    {
      "kind": "scenario",
      "id": "target-parity",
      "impact": "conforms",
      "reason": "No cambia ninguna transformación ni fixture golden; el binario se copia aparte del árbol generado"
    }
