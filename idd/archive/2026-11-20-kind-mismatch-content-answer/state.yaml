  "change": "kind-mismatch-content-answer",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "request": "la recomendada (arreglar en el CLI el falso positivo de B9: una línea quitada de documentación que no es documento de contrato declarado y que solo casa por contenido se puede retirar con la respuesta del usuario, como E1.58 con public-contract)",
    "requested_at": "2026-11-20T01:17:29.442Z",
    "kind": "bug",
    "summary": "Un refactor que quita de la documentación una línea que solo parece un contrato puede conservar su kind con la respuesta del usuario",
    "acceptance": "ospec check rechaza con kind-mismatch un refactor que quita una línea de documentación que casa con un patrón de contrato (API o selector) fuera de los documentos de contrato, y su how ofrece ospec record retract --signal public-contract con la respuesta del usuario; con esa respuesta, que cubre exactamente las líneas quitadas, check y close aceptan el refactor; una línea quitada nueva devuelve el rechazo; una línea quitada de un documento de contrato sigue sin salida salvo subir el kind y la respuesta se rechaza nombrándolo"
  },
  "facts": {
    "basis": "La respuesta del usuario elige la opción 1, que fija el comportamiento: el rechazo se mantiene y se levanta solo con su respuesta, sobre las líneas quitadas que solo casan por contenido fuera de los documentos de contrato; la forma de la respuesta (record retract de public-contract con --answer y --source, sus hits por línea y su confirmación) es la de E1.58 en REQ-idd-006, y las líneas de un documento de contrato siguen como en REQ-idd-015"
  },
