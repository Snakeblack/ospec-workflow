  "intent": {
    "kind": "bug",
    "summary": "La regla y los hooks de atribución bloquean solo construcciones de atribución (trailers *-by con IA, frases generated/written/made with|by <IA> y equivalentes en español, 🤖), no menciones de agentes; Co-Authored-By humano permitido. Además: el validador de Cursor ignora hooks ajenos en ~/.cursor/hooks.json y el test de directorio opaco de bench.test.js deja de fallar al azar.",
    "acceptance": "fix(claude): ..., feat(antigravity): ... y un Co-Authored-By humano pasan commit-msg y PreToolUse (JS y Go); Co-Authored-By: Claude <noreply@anthropic.com>, 'Generated with Gemini CLI', 'Generado con Codex' y 🤖 siguen bloqueados; la regla no crece; setup:cursor instala con hooks de Orca presentes y los conserva; bench.test.js:367 no depende del sufijo aleatorio"
  },
  "facts": {
    "open": [
      "Trailers: ¿se bloquea cualquier trailer '<Algo>-by:' (Co-authored-by, Generated-by, Assisted-by, Signed-off-by...) cuyo valor nombre una IA o un correo noreply de proveedor, o solo Co-Authored-By?",
      "Frases: ¿qué verbos cuentan? Propuesta: generated/written/created/made/built/authored/assisted/powered/produced + with/by/using, y generado/escrito/creado/hecho/asistido/producido + con/por, con el nombre de la IA en la misma línea.",
      "Lista de IA: ¿se amplía con antigravity, agy, cursor, windsurf, kiro, opencode, qwen, deepseek, grok, devin, aider, cline, junie, amp? Con el contexto exigido no hay falsos positivos por palabras comunes.",
      "'Generated by <algo que no es IA>' (p. ej. 'generated by the build script') hoy se bloquea; con el cambio pasaría. ¿De acuerdo?",
      "PRs: hoy ningún hook mira gh pr create/edit. ¿Se extiende el DENY de PreToolUse (JS y Go) a --title/--body de gh pr create|edit, o se deja solo la regla en texto?",
      "Cursor: ¿el validador ignora en silencio los eventos y entradas ajenas de hooks.json, o avisa de ellos sin fallar?"
    ]
