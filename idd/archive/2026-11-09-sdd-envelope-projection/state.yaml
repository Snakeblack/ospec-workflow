  "change": "sdd-envelope-projection",
  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "PR4b de la review 2026-10-29: la fase SDD no se proyecta en state.yaml sin SubagentStop (Cursor, Antigravity, OpenCode, VS Code), así que el archivado nunca ve phases.verify.verdict y la prosa común se contradice; en Claude Code SubagentStop lee el transcript de la sesión principal y proyecta el envelope del subagente anterior; y state.yaml con escalares de bloque o texto multilínea se rechaza como malformed-state",
    "acceptance": "Un host sin SubagentStop proyecta cada fase por una vía del runtime (el mismo PhaseCompletionReducer) y el archivado ve el veredicto de verify; la prosa común deja de contradecirse; SubagentStop (JS y Go) toma el envelope de last_assistant_message y nunca del transcript principal si existe el del agente; state.yaml con escalares de bloque o multilínea se proyecta sin corromperse en JS y Go"
  },
  "facts": {
    "open": [
      "Hallazgo 1: ¿cómo se proyecta la fase sin SubagentStop: (a) un runner del runtime que el orquestador ejecuta con el envelope tras cada fase, (b) el gate de archivado deriva el veredicto de verify-report.md, o (c) ambos?",
      "Hallazgo 1, si (a): ¿el orquestador ejecuta el runner en todos los hosts (noop por el hash de replay donde SubagentStop ya proyectó) o solo en los que no tienen SubagentStop?",
      "Hallazgo 6: si last_assistant_message existe pero no trae envelope, ¿no se proyecta nada (como los recibos de review, REQ-hooks-027) o se cae al transcript del agente?",
      "Hallazgo 6: ¿la prioridad del transcript del agente sobre el principal se aplica a todos los lectores del dispatch (envelope, estado del coste, skill_resolution, enlace de host, tokens de Codex y telemetría de Claude) o solo al envelope y al estado del coste?",
      "Hallazgo 7: ¿qué YAML se tolera: escalares de bloque (| y > con indicadores) y continuaciones multilínea de escalares planos y entrecomillados, o solo escalares de bloque?",
      "Hallazgo 7: si una clave que el proyector reescribe (status, phases.<fase>.summary…) viene como escalar de bloque, ¿se reemplaza por su forma de una línea borrando la continuación, o se rechaza la proyección?",
      "Hallazgo 7: cuando la proyección se rechaza igualmente, ¿basta con el error del runner ante el orquestador y el log de stderr del hook, o SubagentStop debe avisar además al agente principal?"
    ]
  },
