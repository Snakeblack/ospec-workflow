                "severity": "CRITICAL",
                "summary": "ensureOspecGitignore (scripts/lib/ospec-gitignore.js:19-25) escribe repoRoot/.gitignore con existsSync, readFileSync y writeFileSync, que siguen el enlace, sin lstat ni assertManagedPathSafe. Lo llaman la instalación de Codex en un repositorio (scripts/configure/install-codex.js, tras preflightRepoInstall, que no incluye .gitignore) y scripts/setup-git-hooks.js. El mismo instalador rechaza un symlink en AGENTS.md, skills y runtime (assertManagedPathSafe, install-codex.js:885-895). Si .gitignore es un enlace, resuelto o colgado, y el destino no tiene ya una línea exacta .ospec, .ospec/, .ospec/**, /.ospec, /.ospec/ o /.ospec/**, esa escritura crea o reescribe el fichero apuntado (texto previo más una línea .ospec/, o solo esa línea si el enlace estaba colgado). El rollback de la transacción restaura el enlace y no deshace el fichero externo. Traza leída en el código; no ejecutada.",
                "acceptance_criteria": "Si .gitignore del repositorio destino es un enlace simbólico, la instalación de Codex en ese repositorio y setup:git-hooks no crean ni modifican el fichero apuntado. Si .gitignore es un fichero regular que aún no ignora .ospec/, ambas vías añaden una sola línea .ospec/ y una segunda ejecución no vuelve a cambiar el fichero."
              }
            ]
          },
