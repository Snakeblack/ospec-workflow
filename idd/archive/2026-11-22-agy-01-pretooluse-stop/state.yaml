  "mode": "idd",
  "status": "closed",
  "intent": {
    "kind": "bug",
    "summary": "Cerrar bypass de PreToolUse en write_file/edit_file/read_file (AGY 1.5.14), respetar cwd nativo y evitar reanudacion en Stop cancelado o no ocioso, aislado al adaptador de Antigravity",
    "acceptance": "En OSPEC_TARGET=antigravity, adaptAntigravityHookInput mapea Path/Content/Replacement de agy 1.5.14 para bloquear escrituras a ficheros del CLI y escanear secretos/marcadores [REDACTED:...] en Node y Go, prioriza parsed.cwd sobre workspacePaths, suprime stopNudge cuando fullyIdle es false o terminationReason difiere de NO_TOOL_CALL, y los demas targets permanecen sin cambios"
  },
  "facts": {
    "open": [
      "En edit_file de Antigravity, escanear solo los cuerpos escritos (Content y Replacement, como hoy ignora TargetContent) o tambien Target (como old_string en Claude)?",
      "En fallos de inspeccion PreToolUse de Antigravity, emitir decision force_ask en todos los fallos de launcherFailure (unreadable, timeout, crash, salida invalida), solo en payload unreadable, o mantener ask?"
    ]
  },
  "plan": {
    "paths": [
      "openspec/specs/hooks/spec.md",
