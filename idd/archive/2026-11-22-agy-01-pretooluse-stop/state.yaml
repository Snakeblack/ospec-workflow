          "result": {
            "findings": [
              {
                "severity": "WARNING",
                "summary": "scripts/hooks/ospec-hooks-launch.js:294-305 maps only the first non-empty entry of [args.Path, args.AbsolutePath, args.TargetFile] to file_path and overwrites args.file_path, args.content (even with '' when Content/Replacement is empty), and args.command. Downstream writesCliOwnedFile and [REDACTED:...] guards (pre-tool-use.js:296,575; pretooluse.go:1035,1298) check only lowercase OWNED_PATH_KEYS/DECLARED_PATH_KEYS. Conditionally—on MCP tools with lowercase keys and default additionalProperties (REQ-hooks-029), or if agy forwards extra args on legacy write_to_file/replace_file_content—a benign sibling Path/Content/CommandLine shadows or erases the real argument and bypasses deny/ask checks. Preserve all distinct paths, bodies, and commands without overwriting existing keys.",
                "acceptance_criteria": "Under OSPEC_TARGET=antigravity in both Node and Go PreToolUse hooks: (1) write_to_file with both benign Path and CLI-owned TargetFile (e.g. idd/demo/state.yaml) or [REDACTED:...] targeting a secret file still returns decision 'deny'; (2) a write/edit tool with lowercase file_path pointing to idd/demo/state.yaml plus benign Path still returns 'deny'; (3) a tool with lowercase content holding a secret or [REDACTED:...] plus empty Content:'' still triggers 'ask'/'deny'; and (4) a tool with lowercase command matching a DENY rule plus empty CommandLine:'' still returns 'deny'.",
                "location": "scripts/hooks/ospec-hooks-launch.js:294"
              },
              {
                "severity": "WARNING",
                "summary": "scripts/hooks/ospec-hooks-launch.js:146-153 emits force_ask for launcherFailure on PreToolUse, but child-caught inspection failures exit 0 with permissionDecision 'ask' ('The safety hook could not inspect this tool call: ...' in pre-tool-use.js:743-752 and pretooluse.go:1230-1234) and are emitted as plain 'ask' at line 351, which cached Always Allow rules can auto-approve. On the Go binary, adaptAntigravityHookInput (lines 300-305) spreads raw ...args into tool_input, so any MCP or extra-arg call with non-string command (absent CommandLine) or non-array commands fails pretooluse.go's typed json.Unmarshal before h.run()—skipping all deny guards—and exits 0 as plain 'ask'. Avoid passing type-mismatched top-level command/commands from args and escalate child inspection-failure 'ask' envelopes to 'force_ask'.",
                "acceptance_criteria": "Under OSPEC_TARGET=antigravity: (1) normalizeAntigravityHookOutput('pre-tool-use', ...) returns decision 'force_ask' when a child emits permissionDecision 'ask' with an inspection-failure reason ('The safety hook could not inspect this tool call: ...'), while keeping policy advisories as 'ask'; and (2) a PreToolUse call with a non-string args.command (without CommandLine) or non-array args.commands alongside a denied target (e.g. write_file on idd/demo/state.yaml) still evaluates to 'deny' on the Go binary rather than failing unmarshal into 'ask'.",
                "location": "scripts/hooks/ospec-hooks-launch.js:351"
              },
              {
                "severity": "WARNING",
                "summary": "scripts/hooks/ospec-hooks-launch.js:285-288 prioritizes parsed.cwd over workspacePaths using isDir, which accepts filesystem/volume roots ('/', 'C:\\'). If Antigravity sends a root parsed.cwd alongside a valid project in workspacePaths, adapted.cwd becomes that root and launch() (line 755) spawns the child there. Child hooks reject root input.cwd via validatePath (scripts/lib/pathsafe.js:41-46; internal/hooks/common.go:33-38) to prevent .ospec/ write-steering to the filesystem root, but fall back to process.cwd()—which is already that root—defeating the guard and steering Stop/SessionStart away from the workspace (and resolving relative PreToolUse args.Cwd from '/'). Reject filesystem roots when validating parsed.cwd and workspacePaths so a valid workspacePaths entry still wins.",
                "acceptance_criteria": "When an Antigravity hook payload has parsed.cwd set to a filesystem root (e.g. '/' on POSIX or 'C:\\' on Windows) and workspacePaths holds an existing project directory, adaptAntigravityHookInput ignores the root cwd and resolves cwd to the workspace directory; when both parsed.cwd and workspacePaths contain only filesystem roots (and no valid non-root args.Cwd is provided), PreToolUse treats the call as unreadable ('force_ask') and Stop/SessionStart do not spawn the child with cwd set to the filesystem root.",
                "location": "scripts/hooks/ospec-hooks-launch.js:285"
              }
            ]
          },
