# IDD configuration of this project (openspec/specs/idd/spec.md, REQ-idd-013).
# openspec/ holds only SDD configuration and state; IDD reads this file.

# Team profile (REQ-idd-023): one maintainer with agents, per docs/product/brief.md.
# It decides delivery, review, Strict TDD and mentorship (`ospec team`).
team:
  size: solo
  experience: senior

# How changes reach main (REQ-idd-023): one pull request in flight, since every
# PR touches the version files; AGENTS.md holds the delivery order. ospec close
# writes each change's entry under [Unreleased] of CHANGELOG.md and proposes
# its release, cut right after the merge (REQ-idd-025).
delivery:
  branching: serial
  changelog: CHANGELOG.md
  release: per-change

# The checks `ospec check` runs, in order (REQ-idd-014).
checks:
  test: node scripts/check.js

# Contract documents of this project: its behavioral specs (REQ-idd-015).
contracts:
  documents:
    - openspec/specs/**

# Impact patterns for IDD signals (REQ-idd-012). Each list adds to the base and
# stack defaults; exclude removes paths.
impact:
  public_contract:
    - scripts/ospec.js
    - scripts/lib/idd-config.js
    - scripts/configure/cli.js
    - hooks/hooks.json
    - .claude-plugin/**
    - .plugin.json
  persistent_data:
    - scripts/lib/idd-store.js
    - scripts/lib/ospec-state.js
    - scripts/lib/archive-*.js
  security_boundary:
    - scripts/hooks/**
  exclude:
    - scripts/configure/__fixtures__/**
