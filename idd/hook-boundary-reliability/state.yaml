                "severity": "CRITICAL",
                "summary": "scripts/hooks/lib/shell-file-access.js:7,72 e internal/hooks/shellfileaccess.go:114-115 consideran -n una opción con valor para todos los lectores. En cat -n id_rsa, -n solo activa la numeración, pero el reconocedor consume id_rsa como su valor y omite la denegación del archivo privado.",
                "acceptance_criteria": "JS y Go extraen id_rsa de cat -n id_rsa y less -n id_rsa, y PreToolUse devuelve deny en default y bypassPermissions. cat -n .env conserva ASK normal y allow con aviso en bypass. head -n 2 .env sigue ignorando 2 como valor de opción. Resolver la aridad según el lector, sin exigir un parser general."
              },
              {
                "severity": "CRITICAL",
                "summary": "scripts/hooks/lib/shell-file-access.js:15,36-42 e internal/hooks/shellfileaccess.go:20-21,57-65 registran -EOF como delimitador de cat <<-EOF. El shell termina ese heredoc con EOF; el reconocedor no encuentra su delimitador y descarta los comandos posteriores, incluido un cat id_rsa literal.",
                "acceptance_criteria": "JS y Go reconocen el final de heredocs <<-EOF, con y sin tabuladores iniciales, y siguen inspeccionando los comandos posteriores. cat <<-EOF\\nsafe\\nEOF\\ncat id_rsa devuelve deny en default y bypassPermissions; un cat id_rsa contenido únicamente dentro del heredoc permanece inerte."
              },
              {
                "severity": "WARNING",
                "summary": "scripts/hooks/ospec-hooks-launch.js:47-53 degrada el error a allow antes de aplicar los adaptadores. Con permission_mode=bypassPermissions, un timeout o fallo del hijo produce {} en Codex y solo permission:allow en Cursor, perdiendo el aviso de inspección que exige REQ-hooks-025.",
                "acceptance_criteria": "Ante spawn failure, timeout, salida no cero o respuesta inválida con bypassPermissions, Codex conserva additionalContext con el fallo y Cursor devuelve allow con user_message y agent_message de aviso. Se mantiene el stderr seguro, se descarta stdout parcial y las respuestas neutrales exitosas conservan su formato actual."
              }
            ]
