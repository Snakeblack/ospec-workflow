approvals:
  - id: intent-briefing-001
    gate: intent-briefing
    decision: accepted
    source: claude-code/AskUserQuestion
    accepted_at: "2026-10-01T22:35:33Z"
    applies_to:
      - change-classification
    synthesis: >
      Integrar Engram en ospec-workflow como memoria de sesión común a todos
      los hosts, opcional y no autoritativa. Primero Claude Code: servidor MCP
      registrado solo si el binario existe, protocolo de memoria slim, hooks
      SessionStart/PreCompact/Stop que recuperan y guardan resúmenes, punteros
      de fase SDD con topic_key, detección/health probe en el instalador y
      corrección de la documentación que hoy afirma una integración inexistente.
    scope: >
      Dentro: target Claude Code (.mcp.json condicional, hooks, protocolo slim
      en global-instructions, punteros de fase SDD, detección en instalador,
      deriva documental en project-memory spec, sdd-phase-common y
      comparacion-arneses). Fuera: targets Copilot/opencode/Codex/Cursor
      (fases posteriores), descarga obligatoria del binario, Engram Cloud, y
      cualquier uso de Engram como autoridad de permisos, policy, verdict o
      aprobación (OpenSpec y Authority Store siguen siendo la fuente de verdad;
      caída de Engram no bloquea).
