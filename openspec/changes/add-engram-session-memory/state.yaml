assumptions:
  - id: sdd-propose-001
    phase: sdd-propose
    statement: "setup:claude solo muestra la guía de Engram por defecto; ejecutar engram setup claude-code o instalar el plugin exige opt-in explícito."
    reversibility: high
    basis: "Modificar la configuración global del usuario sin consentimiento contradice el modelo fail-open y opcional de intent-briefing-001; la forma exacta del opt-in queda para design."
    recorded_at: "2026-10-01T22:42:22Z"
    status: unresolved
  - id: sdd-propose-002
    phase: sdd-propose
    statement: "El addendum Engram vive en un archivo de rules/ propio, excluido de los perfiles no-Claude, en vez de en skills compartidas."
    reversibility: high
    basis: "rules/*.instructions.md se pliega en todos los targets y los perfiles ya usan listas drop para confinar contenido por target."
    recorded_at: "2026-10-01T22:42:22Z"
    status: unresolved
  - id: sdd-design-001
    phase: sdd-design
    statement: "El marketplace upstream de Engram se llama 'engram' (fuente Gentleman-Programming/engram) y los servidores MCP de plugin aparecen en 'claude mcp list' como 'plugin:engram:engram'."
    reversibility: high
    basis: "Matcher del PreToolUse upstream mcp__plugin_engram_engram__; nombre de marketplace verificado por el orquestador en .claude-plugin/marketplace.json; formato de claude mcp list pendiente de verificar en apply."
    recorded_at: "2026-10-01T22:55:47Z"
    status: unresolved
  - id: sdd-design-002
    phase: sdd-design
    statement: "Con opt-in se instala primero el plugin y 'engram setup claude-code' solo corre si tras recomprobar no hay servidor MCP engram visible."
    reversibility: high
    basis: "Evita conjuntos duplicados de herramientas mem_*; detección por capacidad (REQ-install-028/030)."
    recorded_at: "2026-10-01T22:55:47Z"
    status: unresolved
  - id: sdd-design-003
    phase: sdd-design
    statement: "La fila Session memory y el Purpose de openspec/specs/project-memory/spec.md los edita sdd-archive, no sdd-apply."
    reversibility: high
    basis: "baseline_fingerprints.project-memory registrado; editar en apply dispara stale-baseline."
    recorded_at: "2026-10-01T22:55:47Z"
    status: unresolved
