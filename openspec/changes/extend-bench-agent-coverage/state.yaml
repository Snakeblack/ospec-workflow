gate: intent-briefing
decision: accepted
accepted_at: "2026-09-05T00:00:00Z"
synthesis: >-
  Extender el mecanismo de benchmark/coverabilidad de agentes (scripts/evals,
  incluida la validación CX0) para que reconozca a TODOS los agentes propios
  del harness ospec-workflow, no solo a los que empiezan por sdd-. Hoy el bench
  exige igualdad estricta agent === `sdd-${phase}`, de modo que (a) otros
  agentes del harness quedan fuera, y (b) los propios sdd-* fallan cuando el
  nombre registrado lleva prefijo del host/plugin.
scope: >-
  scripts/evals (benchmark, live-driver), validación CX0, y el punto donde se
  registra row.agent en phase-costs; énfasis en diseño de arquitectura e
  ingeniería elegante (resolución de identidad de agente como concepto de
  primer orden) sin sobreingeniería.
