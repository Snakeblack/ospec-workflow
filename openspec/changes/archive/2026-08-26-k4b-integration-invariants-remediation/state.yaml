      - "Option A: EffectiveShadowBase ∩ capsule_inputs; WorkOrder v2 requires concrete capsule_inputs"
      - "CandidateId binds lineage only; N records keyed by internal fingerprint, no fifth identity"
      - "Comparator projections use topological node_id for steps; DAG conflicts only among incomparable predecessors"
