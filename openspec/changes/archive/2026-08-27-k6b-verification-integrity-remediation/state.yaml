    synthesis: "Remediación focal k6b-verification-integrity-remediation sobre el verifier y el Assurance Graph de K6b, sin reabrir el macro-slice ni tocar K6c/K6d/K7/K8. Un PASS exigirá evidencia admisible para cada obligación MUST del Execution Graph; el binding EvidenceId ↔ role ↔ obligation_id ↔ node_id ↔ policy será persistible y versionado (sin mutar evidence/v2 in-place); la provenance fuerte saldrá del collector/canal, no del payload; la proyección fallará cerrada y su fingerprint ligará los inputs canónicos. El roadmap marcará K6b revise y K6c bloqueado hasta ese cierre."
    scope: "In: cobertura de obligaciones MUST del Execution Graph; binding persistible EvidenceId↔role↔obligation↔node↔policy (contrato versionado aditivo); provenance fuerte derivada del collector; fingerprint canónico del Assurance Graph; fail-closed si falla la proyección; tests adversariales; actualización de roadmap K6b revise / K6c blocked-by-remediation. Out: K6c challenges, K7 review, K8 attestation, PKI/criptografía de provenance, mutación in-place de evidence/v2 o contratos K1."
