assumptions:
  - id: sdd-spec-001
    phase: sdd-spec
    statement: "La lista exacta de claves allowlist de executeWorkOrder queda para diseño; el spec solo prohíbe sobrescribir autoridad."
    reversibility: high
    basis: "El proposal exige limitar opciones seguras sin enumerar claves; las specs describen WHAT, no HOW."
    recorded_at: "2026-08-25T18:00:00Z"
    status: resolved
    resolution: "executorOptionsByNode solo admite commands, command, args, signal y declaredTargets; cualquier otra clave falla antes del despacho."
    resolved_by: "openspec/changes/k4b-correctness-remediation/design.md"
  - id: sdd-apply-001
    phase: sdd-apply
    statement: "orchestrateRepairShadow persiste repair-shadow-execution/v1 solo cuando options.store está presente."
    reversibility: high
    basis: "Los tests unitarios del orquestador no inyectan store; el E2E y el adaptador de producción sí lo hacen. Sin store no hay promoción."
    recorded_at: "2026-08-25T19:30:00Z"
    status: corrected
    resolution_decision: correct
    resolution: "Fail-closed mandatory store: after freeze+lineage, persist repair-shadow-execution/v1 is required. Missing options.store returns MISSING_EXECUTION_STORE without promotion; persist failure also fail-closed. No silent filesystem-store factory — design validates PolicySnapshot/store and does not specify an internal default."
    resolved_by: "scripts/lib/repair-shadow/orchestrator.js"
