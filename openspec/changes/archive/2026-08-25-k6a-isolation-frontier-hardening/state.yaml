ProbeEvidence returns true when containment is missing; executor re-checks PASS/BLOCKED/BLOCKED.","acceptance_criteria":"Either require containment in the probe predicate or document why it is optional and keep a single authority for the triple.","blocking":false,"resolution":"advisory"},{"id":"F-59bf1c394018a548","owner":"readability","severity":"WARNING","summary":"JSDoc still says puerto WorkerIsolation while the call site passes WorkerTransport.","acceptance_criteria":"Correct JSDoc so WorkerIsolation is a capability on WorkerTransport, not a sixth port.","blocking":false,"resolution":"advisory"},{"id":"F-f1212234c3ba4b00","owner":"readability","severity":"SUGGESTION","summary":"WorkerTransport handler fallback order between primitives.worker and workerIsolation is uncommented.","acceptance_criteria":"Comment the fallback so probe and command share the executing transport fingerprint.","blocking":false,"resolution":"advisory"}],"findings_digest":"sha256:461e0d82563bdd46e7e4c3389757765e31d69ade874fc756c336581ae99b74c8","correction_budget":{"limit_lines":200,"used_lines":0,"failed_attempts":0,"max_failed_attempts":3},"correction_history":[],"validation_history":[],"follow_ups":[],"pending_operation":null,"pending_correction":null,"terminal_reason":"all-remediation-slices-passed","remediation_schema_version":2,"remediation_migration":{"source_digest":"sha256:3f04a2519827ce99cfe60a6938ad942a383f4c7dec00c76f33215f8821f53f82","manifest_digest":"sha256:ac342e4386c2d3e9f20035fc0a7133fbe29bc72b42b54836ab8e2bf4d69758eb","legacy_used_lines":0,"legacy_failed_attempts":0,"migrated_at":"deterministic"},"slice_order":["S-2331116459080264"],"active_slice_id":null,"correction_slices":{"S-2331116459080264":{"slice_id":"S-2331116459080264","root_cause_key":"F-a93a0811da865770","finding_ids":["F-a93a0811da865770"],"evidence_digests":["sha256:be9678c537a09ec13addf49c9ed17ff8ee5fbacab32c5a6bfb722ea3f1641c29"],"permitted_paths":["scripts/k6a-e2e-worker-isolation.test.js","scripts/lib/