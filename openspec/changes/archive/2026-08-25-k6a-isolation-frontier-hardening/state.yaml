assumptions:
  - id: sdd-propose-001
    phase: sdd-propose
    statement: "Transport binding is specified as a live-identity extension of capability-proof REQ-005 (port_id/fingerprint) rather than freezing a new required CapabilityProof schema field in this proposal."
    reversibility: high
    basis: "architecture-001 and user intent already require WorkerIsolation bound to the executing WorkerTransport; REQ-005 already owns live identity/probe binding, so field shape is a spec-phase schema detail."
    recorded_at: "2026-08-25T09:50:00Z"
    status: confirmed
  - id: sdd-spec-001
    phase: sdd-spec
    statement: "WorkerIsolation transport binding is live-identity only: verifyCapabilityProof expected inputs for WorkerIsolation MUST include the executing WorkerTransport port_id and fingerprint; CapabilityProof document schema gains no new required field."
    reversibility: high
    basis: "Confirms unresolved sdd-propose-001; REQ-005 already owns live identity/probe binding; architecture-001 forbids a sixth host port."
    recorded_at: "2026-08-25T10:00:00Z"
    status: confirmed
  - id: sdd-design-001
    phase: sdd-design
    statement: "WorkerIsolation semantic evidence carries transport.port_id and transport.fingerprint so identity is hashed into the existing evidence_digest without a new proof-document field."
    reversibility: high
    basis: "sdd-spec-001 forbids a new required CapabilityProof field; evidence is already a verifyCapabilityProof input hashed by createEvidenceDigest."
    recorded_at: "2026-08-25T10:15:00Z"
    status: confirmed
  - id: sdd-design-002
    phase: sdd-design
    statement: "WorkerTransport.fingerprint is sha256Fingerprint of adapter_id, port_id, and the WorkerTransport live probe_digest under domain worker-transport-live-identity/v1."
    reversibility: high
    basis: "Spec requires a fingerprint distinct from port_id; existing ports already stamp probe_digest after live probe."
    recorded_at: "2026-08-25T10:15:00Z"
    status: confirmed
