              -
                severity: "CRITICAL"
                summary: "`scripts/lib/execution-identities/index.js`: `freezeCandidate()` solo usa `isFrozenCandidateV2()` para `predecessorCandidate`, que valida el JSON Schema pero no la coherencia canónica del linaje. El esquema permite `relation: \"ambiguous\"`; un predecesor derivado mediante `{ ...root, relation: \"ambiguous\" }` es schema-válido y `freezeCandidate(..., predecessorCandidate)` lo acepta, creando un sucesor `changed`. Falta el caso negativo en `scripts/lib/execution-identities/index.test.js` que exija rechazar un predecesor schema-válido con `relation: \"ambiguous\"` (y, análogamente, `unknown` o un linaje persistido incoherente)."
                acceptance_criteria: "Antes de derivar `predecessor_id`, `freezeCandidate()` rechaza predecesores que no sean un Candidate v2 canónico y coherente; las pruebas cubren que los predecesores `ambiguous`, `unknown` y `changed` con metadatos de linaje inconsistentes no pueden generar sucesores."
          operation: null
