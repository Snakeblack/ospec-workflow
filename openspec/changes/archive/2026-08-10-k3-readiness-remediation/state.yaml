assumptions:
  - id: sdd-design-001
    phase: sdd-design
    statement: "Concurrent publications to the same destination are rejected by an exclusive sibling lock; stale locks require explicit cleanup rather than automatic recovery."
    reversibility: high
    basis: "Node core provides no portable directory lock that can safely distinguish an active process from a stale lock."
    recorded_at: 2026-08-09T10:44:36Z
    status: confirmed
    resolution:
      action: confirm
      note: "Confirmed by the maintainer before post-transaction verification."
      resolved_at: 2026-08-09T10:59:41Z
  - id: sdd-design-002
    phase: sdd-design
    statement: "La representación generacional usa un contenedor sibling con orden canónico, colección por id y puntero activo, manteniendo el lineage singular como semilla legado inmutable."
    reversibility: low
    basis: "Es la única alternativa evaluada que preserva compatibilidad fail-closed, bytes legado, determinismo multigeneración y escritura atómica sin dividir el estado OpenSpec."
    recorded_at: 2026-08-09T14:47:55Z
    status: confirmed
    resolution:
      action: confirm
      note: "Confirmado por el mantenedor (opción 1: aprobar contenedor sibling lineages)."
      resolved_at: 2026-08-10T14:00:00Z
