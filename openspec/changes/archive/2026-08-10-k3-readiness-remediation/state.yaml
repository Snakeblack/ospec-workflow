    summary: "Deltas cover Candidate K3 contracts, transactional publication, ledger-resolved successor authority, and additive generational 4R lineage persistence."
    key_decisions:
      - "Candidate.v2.relation remains the persisted four-value K3 vocabulary; no second relation schema is introduced."
      - "predecessor_id is lineage metadata; frozen payloads derive relation and a changed successor cannot be exact."
      - "Historical archive evidence stays byte-identical; only evidence-supported metadata may be reconciled."
      - "4R successor approval is resolved by exact ledger entry and scope, while lineages persist as an additive predecessor-linked chain."
  clarify:
    status: skipped
    summary: "Skipped after validated successor-authority and lineage-persistence deltas reported no residual ambiguity or missing criteria."
  design:
    status: done
    artifact: openspec/changes/k3-readiness-remediation/design.md
    summary: "Adds ledger-resolved successor authority and an additive active-pointer lineage store while preserving the terminal legacy lineage."
    key_decisions:
      - "Generic approval ids resolve by exact unique ledger entry, valid source/decision/scope, allowlisted authority, and chain-wide non-reuse."
      - "The singular lineage remains immutable; a sibling lineages container owns ordered generations and one active pointer."
      - "Store mutations use locked compare-and-swap plus atomic read-merge-write; pending or unknown work blocks dispatch until exact reconciliation."
  tasks:
    status: done
    artifact: openspec/changes/k3-readiness-remediation/tasks.md
    summary: "Backlog marks 9.2-9.4 partially verified and adds Phase 10 for permanent stale-schema pruning, managed-tree safety, source-to-active parity, authenticated evidence, and full final verification."
    key_decisions:
      - "Estimated 1,350-1,950 total lines, including 450-650 incremental transactional remediation; exception-ok resolves apply guard with size-exception strategy."
      - "Every MUST requirement maps to concrete RED/GREEN/TRIANGULATE/REFACTOR tasks and REQ tags."
      - "Verification findings are preserved verbatim in Phase 7 task intent; Claude validator unavailability is environment-only and cannot be replaced with synthetic evidence."
      - "Phase 8 requires cleanup-operation fault injection itself, best-effort sequencing with exact recovery reporting, artifact inventory, and fresh focal plus parallel/serial verification."
      - "Phase 9 addresses the active Codex installer omission: generated dist/codex/schemas closure must be installed and validated through a permanent isolated-home test; active harness restart is required."
      - "Phase 10 limits pruning to the managed ~/.codex/ospec-workflow/schemas tree, preserves broad Codex-home paths, and requires stale removal plus exact inventory/byte proofs."
