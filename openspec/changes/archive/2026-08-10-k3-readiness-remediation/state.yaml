  proposal:
    status: done
    artifact: openspec/changes/k3-readiness-remediation/proposal.md
    summary: "K3 remediation proposal aligns relation/successor contract, fixtures, dist proof, archive state, and planning references before K4a."
    key_decisions:
      - "The normative relation vocabulary is exact, changed, ambiguous, and unknown across spec, schema, and runtime."
