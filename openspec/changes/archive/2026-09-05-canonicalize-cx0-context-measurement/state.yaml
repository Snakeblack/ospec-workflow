gate: intent-briefing
decision: accepted
accepted_at: "2026-09-05T09:45:12Z"
synthesis: >-
  Extender la resolución canónica de identidad de agente (agent-identity) a
  persistContextMeasurement (JS) y persistResultEnvelope (JS y Go). Con ello,
  dispatches con prefijo de host registrarán debidamente mediciones de contexto
  CX0 y resúmenes de envelope, resolviendo el follow-up F-c1cf060d0008ff4f bajo el
  baseline recién consolidado.
scope: >-
  scripts/hooks/subagent-stop.js (persistContextMeasurement, persistResultEnvelope),
  internal/hooks/subagentstop.go (persistResultEnvelope), tests unitarios y de integración
  asociados para validar dispatches prefijados en CX0 y envelope summaries sin regresiones.
