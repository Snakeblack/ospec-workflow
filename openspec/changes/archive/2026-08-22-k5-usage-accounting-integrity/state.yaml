    summary: "Accounting K5 exactamente-una-vez en success/failure/CAS retry, journal completed monotónico y zero-delta de repair estéril."
    key_decisions:
      - "Separar usage ejecutado en la invocación de resultados históricos reconciliados."
      - "ExecutionUsage ausente falla cerrado; nunca se estima desde args."
      - "completed es monotónico y repair sin progreso de efecto conserva zero-delta."
