    key_decisions:
      - "Usage de ejecución física se aplica al CAS ganador o se conserva una sola vez como carry-over runtime-owned."
      - "La falta de ExecutionUsage falla cerrado sin fallback a args; resultados históricos no generan consumo."
      - "Repair sin effectProgress conserva la penalización dual zero-delta aunque avance el lifecycle."
