    summary: "Remediación de pre-commit diferencial: lectura de Git index, fallback a ALL_TARGETS y tests completos, y tests de integración con repo Git temporal."
    key_decisions:
      - "Leer blobs del Git index vía git show :<path> en vez de fs.readFileSync para sintaxis y secretos."
      - "Fallback a ALL_TARGETS al cambiar generadores compartidos, perfiles, transformador o models.yaml."
      - "Fallback a suite completa de tests de Node al cambiar infraestructura central o scripts/lib/."
