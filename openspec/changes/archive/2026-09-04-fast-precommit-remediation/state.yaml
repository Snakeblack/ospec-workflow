    summary: "Deltas para git-precommit-hook y agent-shield-security: lectura de Git index, fallbacks seguros y tests de integración Git."
    key_decisions:
      - "Validación sintáctica y escaneo de secretos inspeccionan blobs de Git index vía git show :<path>."
      - "findAffectedTargets recurre a ALL_TARGETS ante cambios en generadores compartidos o perfiles."
      - "findAffectedTests ejecuta suite completa de Node ante cambios en scripts/lib/ o check.js."
