assumptions:
  - id: sdd-propose-001
    phase: sdd-propose
    statement: "La paridad JS/Go del roadmap se resuelve como no aplicable para este change y no se crea un espejo Go del runtime transaccional."
    reversibility: high
    basis: "El único consumidor Go es cmd/ospec-hooks (hooks de sesión/tool), sin responsabilidad de archive; el roadmap acota la paridad a 'donde corresponda' y un espejo puede añadirse después sin romper el contrato del plan."
    recorded_at: 2026-07-25T21:58:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-propose-002
    phase: sdd-propose
    statement: "El trabajo se divide en dos capabilities nuevas (`archive-plan-contract` y `archive-transaction-runtime`) en lugar de una sola."
    reversibility: high
    basis: "Refleja los dos planos que define docs/architecture/harness-evolution.md §9 (contrato semántico vs. ejecución determinista) y da a sdd-spec una frontera limpia; fusionarlas más tarde es una edición de specs change-local antes del archive."
    recorded_at: 2026-07-25T21:58:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-propose-003
    phase: sdd-propose
    statement: "Se incluye como bullet mínimo de In Scope la sincronización documental del roadmap (O4.2 done / O6A en progreso), sin cambio de comportamiento."
    reversibility: high
    basis: "Nota de contexto del orquestador que autoriza explícitamente esa sincronización puntual; es una edición de una sola sección de docs/roadmaps/harness-evolution.md, trivial de revertir."
    recorded_at: 2026-07-25T21:58:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-spec-001
    phase: sdd-spec
    statement: "La verificación de baseline fingerprint en archive se traslada al preflight del runtime; skills modifica Baseline Fingerprint además de Plan-and-Report/ADR/Cost."
    reversibility: high
    basis: "Arquitectura §9.1 asigna fingerprints al plano determinista; dejar el re-hash en el agente conflictuaría con 'no blind-merge' y plan emission."
    recorded_at: 2026-07-25T22:05:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-spec-002
    phase: sdd-spec
    statement: "Los códigos de rechazo allowlisted v1 se fijan en spec como invalid-schema, invalid-rollback-strategy, missing-reference, hash-mismatch, inventory-mismatch, change-name-mismatch."
    reversibility: high
    basis: "La proposal exige códigos allowlisted sin enumerarlos; sdd-spec debe cerrar el contrato testeable; design puede renombrar antes de apply si hace falta."
    recorded_at: 2026-07-25T22:05:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-spec-003
    phase: sdd-spec
    statement: "Cost de autoridad de cierre vive en el receipt del runtime; archive-report.md MAY conservar ## Cost solo como vista humana."
    reversibility: high
    basis: "Proposal: Cost via plan/receipt; arquitectura §9.1: runtime genera coste y receipt."
    recorded_at: 2026-07-25T22:05:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-design-001
    phase: sdd-design
    statement: "El staging, el journal y el receipt viven en .ospec/archive-tx/{change-name}/ en lugar de dentro de la carpeta de origen, del destino de archive o de un tmpdir del sistema."
    reversibility: high
    basis: "`.ospec/` ya es la raíz gitignored de derivados efímeros del repo y comparte volumen con openspec/, requisito para que rename sea atómico."
    recorded_at: 2026-07-25T22:15:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-design-002
    phase: sdd-design
    statement: "Las causas de fallo del runtime se exponen en failure_reason (gate-not-satisfied, baseline-stale, compare-mismatch, commit-failed, journal-plan-conflict, io-error) separado del allowlist de rechazo del plan."
    reversibility: low
    basis: "REQ-archive-plan-contract-003 hace del allowlist la identidad autoritativa del rechazo del plan; mezclar causas de I/O rompería esa regla."
    recorded_at: 2026-07-25T22:15:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-design-003
    phase: sdd-design
    statement: "El fallback de rename Windows se expone como export aditivo renameWithFallback en atomic-write.js, dejando writeFileAtomic intacto."
    reversibility: high
    basis: "Evita duplicar lógica sutil sin cambiar callers actuales."
    recorded_at: 2026-07-25T22:15:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-design-004
    phase: sdd-design
    statement: "El receipt se persiste solo en .ospec/archive-tx/{change}/receipt.json y stdout; no se copia dentro de la carpeta archivada."
    reversibility: high
    basis: "La spec no exige persistirlo en el audit trail; escribir post-commit rozaría no reescribir historia archivada."
    recorded_at: 2026-07-25T22:15:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-design-005
    phase: sdd-design
    statement: "El punto de entrada invocable es scripts/archive-transaction-run.js (CLI delgado)."
    reversibility: high
    basis: "Precede validate-phase.js / hooks CLI que el orquestador ya invoca con node."
    recorded_at: 2026-07-25T22:15:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-design-006
    phase: sdd-design
    statement: "Reinvocación post-commit completa devuelve success con already_complete:true; resumed-success queda para reanudaciones no terminales."
    reversibility: high
    basis: "La spec admite no-op success o already-complete; el flag distingue ambos."
    recorded_at: 2026-07-25T22:15:00Z
    status: confirmed
    resolved_at: 2026-07-26T02:10:00Z
    resolution:
      action: confirm
      note: "Remediation R3 made resumed-success reachable from a mid-flight journal; code and ADR-006 now agree. Verified by FS fixture and CLI case."
      resolved_at: 2026-07-26T02:10:00Z
  - id: sdd-tasks-001
    phase: sdd-tasks
    statement: "Con exception-ok aprobado, el apply por defecto es un PR único size-exception aunque Chained PRs recommended sea Yes por carga cognitiva."
    reversibility: high
    basis: "delivery_strategy exception-ok en state.yaml approvals; skill sdd-tasks fija Decision needed before apply: No para exception-ok."
    recorded_at: 2026-07-25T22:25:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-tasks-002
    phase: sdd-tasks
    statement: "Las cuatro work units del forecast son opcionales y sirven solo si el equipo prefiere dividir cognitivamente pese al exception-ok."
    reversibility: high
    basis: "Design sugiere slices plan-contract/runtime/agent-prose/docs+dist; proposal ya documenta exception-ok para el presupuesto total."
    recorded_at: 2026-07-25T22:25:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-apply-001
    phase: sdd-apply
    statement: "archive-plan.json se excluye de source_fingerprint e inventory-mismatch para evitar un hash auto-referencial; el runtime igual lo copia al staging/archive."
    reversibility: high
    basis: "Incluir el plan en el fingerprint invalida el digest al escribir el plan; exclusión es el patrón práctico sin cambiar el schema v1."
    recorded_at: 2026-07-26T01:10:00Z
    status: confirmed
    resolved_at: 2026-07-25T23:30:00Z
    resolution: confirm
  - id: sdd-apply-002
    phase: sdd-apply
    statement: "aggregateCost se ejecuta antes de borrar el origin para poder leer gates.*.questions_asked desde state.yaml del change."
    reversibility: high
    basis: "REQ-skills Cost Summary Block exige sumar questions_asked del state; borrar origin primero dejaba el sumatorio siempre en 0."
    recorded_at: 2026-07-26T01:45:00Z
    status: confirmed
    resolved_at: 2026-07-26T02:10:00Z
    resolution:
      action: confirm
      note: "Ordering verified at runtime: aggregateCost runs before fsx.rm(origin); fixture asserts total_questions_asked 5 from gates.*."
      resolved_at: 2026-07-26T02:10:00Z
