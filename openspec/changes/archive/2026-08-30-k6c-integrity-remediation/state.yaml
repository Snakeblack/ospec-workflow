    synthesis: >-
      Endurecer K6c sin rediseñarlo: ligar canónicamente cada plan y resultado al
      Candidate, nodo, estrategia y policy; validar identidad, schemas y duplicados;
      hacer obligatoria su materialización cuando corresponda; ejecutar fail-closed
      con timeout real, scope derivado del diff, aislamiento verificable, proyección
      en Assurance Graph y pruebas adversariales antes de permitir K6d.
