    gate: intent-briefing
    decision: accepted
    source: vscode/askQuestions
    accepted_at: "2026-08-28T14:39:00Z"
    synthesis: "Cerrar en replay, y solo ahí, los dos blockers de v2.54.0. Los records runner-receipt/v1 se persisten en el CAS de K2.1; tras un restart el runtime confiable los rehidrata, recomputa receipt_id y reemite un canal opaco nuevo para un replay byte-identical. En replay, normalizeRole(assessment.role) debe coincidir con el del receipt; si no, GRAPH_DIVERGENCE aunque se haya recalculado assessment_id. El verifier de ejecución, la cronología y el MUST-walk no se tocan. K6b sigue revise y K6c bloqueado hasta el archive."
    scope: "In: persistencia durable de runner-receipt/v1 en CAS/Authority Store de K2.1; rehidratación post-restart y reemisión de capability efímera; binding assessment.role ↔ RunnerReceipt.role en replay; adversariales restart/same graph_id, receipt ausente → GRAPH_DIVERGENCE, role tampered con assessment_id recomputado → GRAPH_DIVERGENCE; wording de spec (channel no es persistable). Out: serializar WeakMap, PKI, mezclar con OperationReceipt de lifecycle, remodelar verifyCandidate/strategy/MUST-walk, arrancar K6c."
    applies_to:
      - change-classification
