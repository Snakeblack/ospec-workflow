intent_gate:
  status: archived
  revision: 2
  last_updated: "2026-09-18T00:00:00Z"
  gate: intent-briefing
  decision: accepted
  synthesis: >
    FU1 quality-review-kernel-contract-attribution-gap: un change que endurece el
    contrato público kernel y verifica limpio no genera hechos atribuibles; la
    clasificación determinística marca public-kernel-contract-unattributed, el
    router residual confirma ambiguous, y el gate termina en
    quality-review-ambiguity-unresolved sin ruta de cierre. Se ataca el contrato
    de resolución de ambigüedad (atribución mínima por capability_scopes de
    contrato público y/o override acotado tipo quality_gates), más la deuda
    adjunta de CX1 (createSuccessor solo genera linajes v1; reducer de fases
    registra reviewers como fases; journal failed del archive-transaction
    bloquea re-runs), con propagación al build multi-target (claude, vscode,
    copilot, opencode) y sus mapeos de tools nativos.
  scope: >
    scripts/lib/review-lineage.js, review-gate-state.js, route-dispatcher.js,
    archive-transaction, skills/_shared/gate-4r-review.md, rules/, build
    multi-target.
  accepted_at: 2026-09-17T16:10:00Z
  applies_to: [high-risk]
