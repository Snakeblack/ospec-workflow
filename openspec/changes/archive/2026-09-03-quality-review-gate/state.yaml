execution_mode: auto
gate: intent-briefing
decision: accepted
synthesis: "Sustituir el gate 4R (risk/reliability/resilience/readability + generalista premium obligatorio) por un Quality Review Gate de cuatro dominios — Trust, Runtime, Evolution, Efficiency — con dueño único por atributo, matriz evidencia→señal→dominio, selección por unión (sin overflow 3→4) y ambigüedad ejecutable. review-change solo entra si el clasificador marca insufficient, y solo con residuo; high-risk va directo a full review. Migración contractual atómica; linaje 4R histórico inmutable; éxito medido con router_delta_rate y tokens por gate."
scope: "In: Quality Review Gate, dominios Trust/Runtime/Evolution/Efficiency, dueños únicos, señales nuevas, union selection, ambigüedad determinista, residual-only semantic fallback, migración atómica de lineage/agents/skills/targets/hooks. Out: SDD de routing previo conservando IDs 4R, review-operations, dueños compartidos, cambiar el papel de review-correction."
