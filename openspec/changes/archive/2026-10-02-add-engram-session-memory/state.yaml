pts/operative-memory-contract.test.js","scripts/session-memory-contract.test.js","scripts/target-drop-contract.test.js","skills/_shared/sdd-phase-common.md"],"diff_hash":"sha256:4dfc974794ad24828555e6c5f610f3a64073289ca2cd6405569ceb220a5fe80e","paths_digest":"sha256:b27a475e6ea6bba77e4f59b9daa953fa031e521e896aefbf5940f21571d16940","authored_lines":853,"original_changed_lines":853},"lenses":{"trust":{"selected":true,"status":"completed","request_id":"start-trust-add-engram-session-memory","result_digest":"sha256:ca5de002feec831bb3bafe686bdd9abc5f3cfad6ec45c347bcfedf27b651ad30","result":{"findings":[{"severity":"WARNING","summary":"Cadena de suministro y consentimiento. Con `--with-engram`, engram-setup.js:112-115 ejecuta `claude plugin marketplace add Gentleman-Programming/engram` y `claude plugin install engram@engram`. Ambos usan una fuente de terceros sin pin de ref/commit ni verificación. Eso instala hooks bash que corren en cada sesión, y el mismo flujo puede ejecutar `engram setup claude-code` (engram-setup.js:115, 181). El único consentimiento es el flag. El texto solo dice 'Configuring Engram...' (línea 169) y cada comando se imprime después de ejecutarse (línea 186), no antes. La guía (líneas 119-139) no avisa de que se añade un marketplace de terceros que ejecuta hooks. Alcance: acción opt-in en la máquina del usuario, no explotable sin el flag.","acceptance_criteria":"Antes de ejecutar las acciones de `--with-engram`, el instalador imprime la lista exacta de comandos y declara que añade un marketplace de terceros no pineado cuyos hooks ejecutan código local. Alternativa: documentarlo en README/guía y, si el upstream lo permite, fijar un ref. Un test fija que el aviso aparece antes del primer spawn mutante."},{"severity":"SUGGESTION","summary":"El probe de marketplace es laxo. `MARKETPLACE_RE=/\bengram\b/i` (engram-setup.js:28) coincide con cualquier marketplace cuyo listado contenga 'engram', por ejemplo uno de terceros o un fork. Entonces el plan omite `marketplace add` (línea 111) y ejecuta `plugin install engram@engram` (línea 114) contra un marketplace no verificado con ese nombre. El mismo patrón de regex sobre salida de texto vale para PLUGIN_RE (línea 23), que acepta cualquier `engram@<mkt>`.","acceptance_criteria":"El probe de marketplace compara el nombre exacto `engram`, y su source `Gentleman-Programming/engram` cuando la salida lo expone. PLUGIN_RE se ancla a `engram@engram`. Hay un test con un listado `engram-fork` o `engram@other` que no cuenta como registrado."},{"severity":"SUGGESTION","summary":"El contract test no cubre todos los caminos de decisión. SCAN_TARGETS (session-memory-contract.test.js:15-27) solo escanea scripts/lib, scripts/hooks, internal, cmd, schemas/kernel, hooks/hooks.json, .mcp.json, agents, commands, skills y rules. Quedan fuera los scripts de primer nivel en scripts/*.js, scripts/configure (salvo engram-setup, que es intencional), .claude-plugin y .plugin.json. Una lectura de Engram o `mem_*` añadida ahí no la detectaría. Además, ALLOWLIST_PREFIXES exime todo scripts/lib/target-profiles/ (línea 34), y no se comprueba que esas menciones sean solo entradas `drop`.","acceptance_criteria":"SCAN_TARGETS incluye scripts/*.js y .claude-plugin, o recorre scripts/ completo con allowlist explícita para engram-setup.js y su test. La exención de target-profiles se restringe a verificar que las apariciones están solo en arrays `drop`."}]},"operation":null,"result_request_id":"result-trust-add-engram-session-memory"},"runtime":{"selected":true,"status":"completed","request_id":"start-runtime-add-engram-session-memory","result_digest":"sha256:6debd3153d37dd21c5ce630d249bbf685e3d0a020f7028789c84eb130015554d","result":{"findings":[{"severity":"WARNING","summary":"Falla parcial sin cortocircuito: en scripts/configure/engram-setup.js:170-188, si `plugin-marketplace-add` falla, el bucle sigue con `plugin install`. Esa acción falla por marketplace inexistente, y luego se re-sondea (174-175) y se ejecuta `engram setup claude-code` (descarga e instala vía jq/curl). Una sola falla de red o de marketplace dispara tres acciones mutantes, cada una con hasta 120 s de timeout, en vez de abortar la cadena. Además, los regex de detección son laxos: PLUGIN_RE (línea 23) `\\bengram@[\\w.-]+` también coincide con `my-engram@x`, y MARKETPLACE_RE (línea 28) `\\bengram\\b` coincide con cualquier línea que mencione engram. Un falso positivo hace que se omita la instalación sin avisar.","acceptance_criteria":"Si `plugin-marketplace-add` falla, el runner no ejecuta `plugin-install`. Ante un fallo de `plugin-install` solo procede el fallback `setup-claude-code`, y eso queda documentado y cubierto por un test con spawn simulado. PLUGIN_RE y MARKETPLACE_RE se anclan al inicio de línea o a espacios (p. ej. `(^|\\s)engram@engram\\b`), con un test negativo para `my-engram@x`."},{"severity":"SUGGESTION","summary":"engram-setup.js:145-153 ejecuta detectEngram (hasta 5 spawns, con 10 s cada uno en el peor caso, incluido `engram doctor --json`) en cada `setup:claude`, incluso sin `--with-engram`. Solo se usa para imprimir una guía, así que un doctor lento o colgado añade hasta unos 50 s de latencia al instalador por defecto.","acceptance_criteria":"Sin `--with-engram`, el paso hace como máximo la sonda barata del binario, o no sondea. `engram doctor` solo se ejecuta con opt-in, o con un timeout menor y acotado."}]},"operation":null,"result_request_id":"result-runtime-add-engram-session-memory"},"evolution":{"selected":true,"status":"completed","request_id":"start-evolution-add-engram-session-memory","result_digest":"sha256:2c3ce2d743fcc3e14ae54b78f7e1b1b2b4403614c980fc7a17238bc0e5fbd542","result":{"findings":[{"severity":"SUGGESTION","summary":"El mismo literal \"rules/engram-session-memory.instructions.md\" está repetido en 6 perfiles: antigravity.js:42, codex.js:81, cursor.js:79, github-copilot.js:69, vscode.js:15 y opencode.js:93. Si se renombra el addendum, hay que editar 6 sitios más el test de contrato (session-memory-contract.test.js:29). Un perfil nuevo que olvide la entrada solo lo detecta engram-scope.test.js, no una constante compartida. Hoy no rompe nada.","acceptance_criteria":"Una constante compartida (p. ej. CLAUDE_ONLY_RULES en un módulo de target-profiles) se importa en los perfiles no-Claude, o un test afirma que todo perfil no-Claude incluye el path en `drop`. Renombrar el addendum toca un único sitio."},{"severity":"SUGGESTION","summary":"session-memory-contract.test.js:34 excluye todo el prefijo `scripts/lib/target-profiles/` del escaneo de Engram. El comentario dice que solo se admite el path del addendum en `drop`, pero el prefijo también admite lógica o constantes de Engram en un perfil, que es justo la ruta de decisión que el test debe vigilar. Un perfil futuro con lógica de Engram pasaría sin aviso.","acceptance_criteria":"En los archivos bajo target-profiles, el test solo admite el literal exacto del path del addendum. Por ejemplo, quita esa línea del contenido antes de aplicar PATTERN, o compara contra una lista de archivos permitidos. Cualquier otra mención de Engram en esos archivos falla el test."},{"severity":"SUGGESTION","summary":"Los patrones de detección de engram-setup.js son laxos frente a un cambio del upstream. MARKETPLACE_RE=/\\bengram\\b/i (l.28) da por presente el marketplace con cualquier línea que mencione 'engram', aunque su source sea otro. PLUGIN_RE=/\\bengram@[\\w.-]+/ (l.23) acepta cualquier marketplace, mientras que la instalación fija `engram@engram` (l.20-21). Si se renombra el marketplace o plugin upstream, o aparece un fork, el planificador puede omitir la instalación o dar por configurado un plugin distinto. Los tres valores están acoplados al nombre upstream sin un test que fije su relación.","acceptance_criteria":"MARKETPLACE_RE y PLUGIN_RE se derivan de MARKETPLACE_NAME y PLUGIN_ID, o hay un test que fija su coherencia con ellos. Un test cubre el caso de un marketplace o plugin con nombre similar pero source distinto y comprueba que no cuenta como configurado."}]},"operation":null,"result_request_id":"result-evolution-add-engram-session-memory"},"efficiency":{"selected":true,"status":"completed","request_id":"start-efficiency-add-engram-session-memory","result_digest":"sha256:e64e0618f9fbec665adddf9dfa245cea6aee9e8995dfffb4a2e4b6382cae8e43","result":{"findings":[{"severity":"WARNING","summary":"scripts/configure/engram-setup.js:85-94 detectEngram ejecuta 5 sondas en serie con spawnSync y timeout de 10 s cada una (línea 22). Peor caso unos 60 s de bloqueo del instalador: 2 intentos de `engram version`, `doctor --json` y 3 listados de `claude`. Las sondas corren sin condición. Sin opt-in y sin binario, las 3 listas de claude se ejecutan aunque guidance() (121-126) solo use binary.found. `doctor` se ejecuta sin opt-in solo para un aviso (150-152). Con plugin ya registrado se sondea igual marketplace/mcp, y el fallback re-sondea plugin/mcp (174-175).","acceptance_criteria":"Si no se encuentra el binario, detectEngram no lanza las sondas de claude ni `doctor`. Sin opt-in, no se ejecuta `doctor` (o se limita a un timeout corto, ej. 3 s). Si `plugin list` ya devuelve registered, se omiten `marketplace list` y `mcp list`. Hay tests con un spawn inyectado que verifican el número de llamadas en esos casos y que el peor caso sin opt-in queda acotado."}]},"operation":null,"result_request_id":"result-efficiency-add-engram-session-memory"}},"findings":[{"id":"F-34b6de94c2a9574f","owner":"trust","severity":"WARNING","summary":"Cadena de suministro y consentimiento. Con `--with-engram`, engram-setup.js:112-115 ejecuta `claude plugin marketplace add Gentleman-Programming/engram` y `claude plugin install engram@engram`. Ambos usan una fuente de terceros sin pin de ref/commit ni verificación. Eso instala hooks bash que corren en cada sesión, y el mismo flujo puede ejecutar `engram setup claude-code` (engram-setup.js:115, 181). El único consentimiento es el flag. El texto 