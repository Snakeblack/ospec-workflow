assumptions:
  - id: sdd-spec-001
    phase: sdd-spec
    statement: "El contrato de recuperación irrecuperable pertenece al dominio verify-lineage y no crea una autoridad de identidad alternativa."
    reversibility: low
    basis: "El gap está documentado en apply-progress.md y el baseline separa recovery material de candidate_id."
    recorded_at: "2026-09-07T23:55:00Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Confirmada: la recuperación irrecuperable pertenece a verify-lineage sin crear identidades alternativas."
      resolved_at: "2026-09-09T08:26:00Z"
  - id: sdd-spec-002
    phase: sdd-spec
    statement: "La lineage sucesora comienza en recheck-pending para ejecutar únicamente las recetas congeladas sobre el Candidate nuevo."
    reversibility: low
    basis: "No puede afirmarse el delta A→B sin evidencia de A; el recheck dirigido conserva la validación existente sin redescubrimiento."
    recorded_at: "2026-09-07T23:55:00Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Confirmada: la sucesora evalúa únicamente recetas congeladas sin reabrir discovery."
      resolved_at: "2026-09-09T08:26:00Z"
  - id: sdd-design-001
    phase: sdd-design
    statement: "Separar la auditoría y reconciliación de recuperación de la ejecución dirigida de recetas en dos módulos Node locales."
    reversibility: high
    basis: "verify-lineage.js concentra transiciones y candidate-store separa persistencia; los nuevos módulos mantienen esos límites."
    recorded_at: "2026-09-08T00:00:17Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Confirmada: separación modular en scripts/lib de auditoría y ejecución de recetas."
      resolved_at: "2026-09-09T08:26:00Z"
  - id: sdd-tasks-001
    phase: sdd-tasks
    statement: "La extensión de lineage se entrega en el mismo PR single-pr bajo size-exception aprobada."
    reversibility: high
    basis: "La estrategia de delivery persistida ya autoriza el PR único sobredimensionado."
    recorded_at: "2026-09-08T00:03:03Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Confirmada: entrega consolidada en single-pr bajo la size:exception aprobada."
      resolved_at: "2026-09-09T08:26:00Z"
  - id: sdd-spec-003
    phase: sdd-spec
    statement: "La preservación terminal de operaciones dirigidas inconclusas se expresa mediante un resultado non-reconcilable y un marcador preserved=true, sin sobrescribir el registro pending original."
    reversibility: low
    basis: "La nueva especificación exige marca terminal preservada, evidencia inmutable y prohibición de replay o promoción desde prosa."
    recorded_at: "2026-09-08T07:12:00Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Confirmada: preservación terminal inmutable con preserved=true."
      resolved_at: "2026-09-09T08:26:00Z"

