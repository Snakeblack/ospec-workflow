  - id: harness-root-scope-001
    gate: new-scope
    decision: authorize-harness-root-remediation-and-current-source-verification
    source: codex/plain-chat
    accepted_at: "2026-09-09T05:44:46Z"
    detail: "Explicit user request: intenta cerrar rapido el problema y remedia desde la raiz el problema ... codex tiene su propio tool para preguntas, pero sobretodo quiero que remedies este problema de candidatos, etc, el flujo del harness no deberia de tener este tipo de errores. User subsequently requested continua."
    scope: "Installer fixes plus recoverable Candidate capture, snapshot-derived remediation deltas, durable recheck/restart behavior, and host-native question provenance. Verify the final source through the existing code-drift route; preserve all historical lineages, operations, findings and budgets. This does not authorize replay, fabricated completion evidence or blanket review resets."
