phases:
  proposal:
    status: done
    artifact: "openspec/changes/modernize-installer-model-selection/proposal.md"
    summary: "Preset-first model setup with phase customization, target reasoning controls, Copilot parity, and static discovery fallback."
    key_decisions:
      - "Modify existing install and generator capabilities; create no new domain."
      - "GitHub Copilot matches VS Code configurability; Antigravity remains inherited."
      - "Dynamic Codex/OpenCode discovery is bounded and never replaces static fallback."
  spec:
    status: done
    artifacts:
      - "openspec/changes/modernize-installer-model-selection/specs/install/spec.md"
      - "openspec/changes/modernize-installer-model-selection/specs/generator/spec.md"
      - "openspec/changes/modernize-installer-model-selection/specs/verify-lineage/spec.md"
    summary: "Delta specs add audited terminal/successor recovery for unrecoverable candidates and unreconciled directed operations, preserving findings, recipes and budgets without replay."
    key_decisions:
      - "GitHub Copilot is selectable with VS Code-equivalent configuration semantics; Antigravity remains inherited without a selector."
      - "Codex/OpenCode discovery only augments the static catalog and always falls back safely."
      - "Reasoning fields are capability-gated and stale defaults are cleared per target contract."
      - "An unrecoverable candidate may terminate only with explicit approvals and exhaustive recovery audit; its successor preserves findings and budget."
  clarify:
    status: skipped
  design:
    status: done
    artifact: "openspec/changes/modernize-installer-model-selection/design.md"
    summary: "Diseño ampliado con terminación auditada, sucesora para operaciones dirigidas inconclusas, journal independiente, captura verificable y preservación literal de historia/presupuesto."
    key_decisions:
      - "Node owns finite choices and fresh request validation; Go retains opaque reversible selection state."
      - "Profiles enable Copilot parity, disable Antigravity injection, and clear stale reasoning fields."
      - "Ship static catalogs; defer optional native discovery until read-only capability-bearing CLI support is evidenced."
      - "La recuperación irrecuperable es una nueva frontera aprobada, no una equivalencia A→B; las operaciones usan journal reconciliable."
      - "Las operaciones dirigidas inconclusas se preservan sin replay y solo una sucesora auditada puede abrir un journal nuevo."
  tasks:
    status: done
    artifact: "openspec/changes/modernize-installer-model-selection/tasks.md"
    summary: "Tasks conserva fases 1–6 completadas y añade Phase 7 para disposiciones non-reconcilable, sucesora fresca, snapshot C/B, recheck sin replay y verificación."
    key_decisions:
      - "Todos los MUST tienen asignación explícita al diseño y verificación; no hay bloqueos de reconciliación."
      - "El trabajo se estima en 850–1.150 líneas; delivery_strategy single-pr exige decisión explícita antes de apply."
      - "La extensión mantiene forecast High y usa la size:exception ya aprobada sin nueva decisión antes de apply."
  apply:
    status: done
    artifact: "openspec/changes/modernize-installer-model-selection/apply-progress.md"
    summary: "La corrección raíz captura Candidate inicial/posterior con árbol Git recuperable, excluye solo metadatos operacionales y deriva scopes desde OID persistidos; la gen3 histórica permanece sin mutación ante drift fuera de V001–V004."
  verify:
    status: done
    artifact: "openspec/changes/modernize-installer-model-selection/verify-report.md"
    summary: "PASS: 45/45 escenarios spec verificados con runtime-test (npm test exit 0, go test exit 0), 28/28 tareas completas y asunciones reconciliadas."
    verdict: PASS
  archive:
    status: done
    artifact: "openspec/changes/modernize-installer-model-selection/archive-report.md"
    summary: "Archive plan y reporte emitidos; 3 specs preparadas, 4 ADRs propuestos, 45/45 escenarios verificados."
    key_decisions:
      - "Fusión change-local de generator, install y verify-lineage"
      - "Promoción de 4 ADRs hacia docs/adr/adr-20260909-*"

