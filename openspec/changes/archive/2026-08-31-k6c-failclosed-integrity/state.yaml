assumptions:
  - id: sdd-propose-001
    phase: sdd-propose
    statement: "El planner rechaza cualquier evidenceStrategy fuera del enum cerrado, incluida omitida o vacía, no solo un string desconocido no vacío."
    reversibility: high
    basis: "REQ-adversarial-challenges-002 fija el enum cerrado; el briefing prohíbe reinterpretar a strict-tdd; createChallengePlan hoy mapea undefined a strict-tdd y eso es coerción silenciosa."
    recorded_at: "2026-08-31T00:12:00Z"
    status: resolved
    resolved_by: sdd-design-001
    resolved_at: "2026-08-31T00:26:00Z"
  - id: sdd-spec-001
    phase: sdd-spec
    statement: "El planner rechaza estrategia omitida/vacía/desconocida sin emitir ChallengePlan; el mecanismo (TypeError vs reason_code) queda para design."
    reversibility: high
    basis: "createChallengePlan ya lanza TypeError en campos requeridos; el contrato observable es no emitir plan ni coerción a strict-tdd."
    recorded_at: "2026-08-31T00:25:00Z"
    status: resolved
    resolved_by: sdd-design-001
    resolved_at: "2026-08-31T00:26:00Z"
  - id: sdd-spec-002
    phase: sdd-spec
    statement: "missing_tests, mutations_tested === 0 y revert/mutación no-op fallan cerrado sin outcome passed; failed vs error queda para design."
    reversibility: high
    basis: "Los success criteria del proposal prohiben passed; el catálogo existente ya distingue failed (COMPLACENT_TEST_DETECTED) y error (timeout)."
    recorded_at: "2026-08-31T00:25:00Z"
    status: resolved
    resolved_by: sdd-design-002
    resolved_at: "2026-08-31T00:26:00Z"
  - id: sdd-design-001
    phase: sdd-design
    statement: "createChallengePlan lanza TypeError para evidenceStrategy omitida, vacía o desconocida; no emite plan ni envelope reason_code."
    reversibility: high
    basis: "Mismo constructor TypeError que candidateId/nodeId/policySnapshotId; el spec solo exige no emitir plan ni coerción a strict-tdd."
    recorded_at: "2026-08-31T00:26:00Z"
    status: confirmed
    resolution:
      action: confirm
      note: "User continuation after interrupted confirmation gate; matches ADR-001 TypeError planner."
      resolved_at: "2026-08-31T07:19:00Z"
  - id: sdd-design-002
    phase: sdd-design
    statement: "missing_tests, mutations_tested===0 y no-op de bytes emiten outcome error con MISSING_TESTS, NO_MUTATION_APPLIED o CHALLENGE_NOOP; no COMPLACENT."
    reversibility: high
    basis: "outcome error ya existe en challenge-result/v1; COMPLACENT invertiría el significado; details es objeto abierto."
    recorded_at: "2026-08-31T00:26:00Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Matches ADR-002 outcome error MISSING_TESTS / NO_MUTATION_APPLIED / CHALLENGE_NOOP."
      resolved_at: "2026-08-31T07:19:00Z"
  - id: sdd-design-003
    phase: sdd-design
    statement: "validateChallengeResultSet exige bindings.evidenceStrategy no vacío e igual al plan; validateChallengePlan solo si hay bindings de evaluación."
    reversibility: high
    basis: "El hueco es el skip truthy; auto-comparar plan.evidence_strategy ocultaría el mismatch; identity-only usa bindings vacíos."
    recorded_at: "2026-08-31T00:26:00Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Matches ADR-003 required selected evidenceStrategy binding on evaluation."
      resolved_at: "2026-08-31T07:19:00Z"
  - id: sdd-design-004
    phase: sdd-design
    statement: "Metaschema Draft 2020-12 vía validateSchemaDocument (uniqueItems recursivo en required) sin Ajv; challenge-result es el único duplicado conocido."
    reversibility: high
    basis: "package.json no tiene Ajv; el intérprete ignora $dynamicRef/allOf del metaschema oficial; uniqueItems ya está implementado."
    recorded_at: "2026-08-31T00:26:00Z"
    status: confirmed
    resolution:
      action: confirm
      note: "Matches ADR-004 local uniqueItems metaschema walk without Ajv."
      resolved_at: "2026-08-31T07:19:00Z"
