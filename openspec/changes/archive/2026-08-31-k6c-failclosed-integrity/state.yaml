approvals:
  - id: intent-briefing-001
    gate: intent-briefing
    decision: accepted
    source: vscode/askQuestions
    accepted_at: "2026-08-31T00:07:00Z"
    applies_to:
      - change-classification
    synthesis: >-
      Cerrar K6c con remediación quirúrgica, sin rediseño ni arranque de K6d.
      La estrategia elegida por verifyCandidate() y projector/replay debe
      llegar a validateChallengeResultSet. Un ChallengePlan canónico de otra
      estrategia debe fallar con CHALLENGE_INTEGRITY_INVALID. missing_tests,
      mutations_tested === 0 o revert/mutación sin cambio real son fail-closed.
      Estrategia desconocida se rechaza. Schema challenge-result corrige
      node_id duplicado y se valida contra Draft 2020-12. K6c permanece
      revise / NO-GO para K6d hasta esos tests negativos.
    scope:
      - evidenceStrategy binding from verifier and projector/replay into integrity gate
      - adversarial test feature verifier + canonical bug ChallengePlan
      - missing_tests, mutations_tested === 0, and no-op revert/mutation fail-closed
      - reject unknown evidence strategy instead of strict-tdd fallback
      - challenge-result schema required uniqueness and Draft 2020-12 metaschema check
      - out of scope: K6d, K6c redesign, unrelated 4R follow-ups
  - id: execution-mode-001
    gate: execution-mode
    decision: auto
    source: vscode/askQuestions
    accepted_at: "2026-08-31T00:10:00Z"
    applies_to:
      - sdd-session
  - id: delivery-strategy-001
    gate: delivery-strategy
    decision: exception-ok
    source: vscode/askQuestions
    accepted_at: "2026-08-31T00:10:00Z"
    applies_to:
      - sdd-tasks
      - sdd-apply
  - id: assumption-reconciliation-001
    gate: assumption-reconciliation
    decision: confirm sdd-design-001,sdd-design-002,sdd-design-003,sdd-design-004
    source: vscode/askQuestions
    accepted_at: "2026-08-31T07:19:00Z"
    applies_to:
      - sdd-verify
