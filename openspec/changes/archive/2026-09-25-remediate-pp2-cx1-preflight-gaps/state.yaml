    synthesis: >
      Change correctivo acotado remediate-pp2-cx1-preflight-gaps sobre main 2.68.1.
      Reconoce el replay de un state.yaml escrito con el hash de v2.67 en Node y en Go,
      sin incrementar la revisión. Resuelve por separado el directorio del plugin y el
      del proyecto para que validate-phase funcione instalado fuera del repo, al menos
      en Claude y en otro target de instalación global. Exige actual_route en changes
      nuevos, con una excepción legacy explícita y comprobable. Cierra con un inventario
      breve de consumidores que confirme approvals, lineage y recovery.
    scope: >
      Dentro: compatibilidad de replay del hash previo en
      scripts/lib/lifecycle-kernel/phase-completion-reducer.js e
      internal/hooks/phase-completion-reducer.go; resolución de raíz de runtime y de
      proyecto en scripts/validate-phase.js y su comando por target; política comprobable
      de actual_route para changes nuevos frente a la excepción legacy; inventario breve
      de consumidores (approvals, lineage, recovery). Fuera: una segunda implementación
      de PP2 o CX1, runtime Adaptive global, y el change adaptive-operation-identity-binding.
