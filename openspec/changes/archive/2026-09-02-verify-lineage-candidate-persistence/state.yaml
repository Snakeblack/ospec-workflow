    status: done
    artifact: "openspec/changes/verify-lineage-candidate-persistence/proposal.md"
    summary: "Durable Candidate/v2 references make verify-lineage remediation resumable and fail closed across process restarts."
    key_decisions:
      - "Persist and verify Candidate material before lineage state references it."
      - "Legacy states without recoverable material remain readable but cannot mutate."
      - "Candidate storage is recovery material, not a new authority."
  spec:
    status: done
    artifacts:
      - "openspec/changes/verify-lineage-candidate-persistence/specs/verify-lineage/spec.md"
    summary: "Define Candidate/v2 recovery records, double validation, restart continuity, and ID-only legacy immutability."
    key_decisions:
      - "Content address identifies immutable recovery bytes but never replaces candidate_id authority."
      - "Missing, tampered, divergent, and legacy-unrecoverable material blocks mutation without history changes."
  clarify:
    status: skipped
  design:
    status: done
    artifact: "openspec/changes/verify-lineage-candidate-persistence/design.md"
    summary: "Change-local Candidate CAS with double validation and persist-before-state restart continuity."
    key_decisions:
      - "Lineage-carried refs select immutable change-local Candidate blobs."
      - "Candidate bytes publish and validate before lineage state references them."
      - "Legacy ID-only lineages stay readable but mutable transitions fail closed."
  tasks:
    status: done
    artifact: "openspec/changes/verify-lineage-candidate-persistence/tasks.md"
    summary: "Fifteen TDD-oriented tasks cover the Candidate CAS, lineage integration, legacy fail-closed behavior, and restart/crash verification."
    key_decisions:
      - "Use three autonomous work units while honoring the accepted size-exception delivery strategy."
      - "Run store RED/GREEN/REFACTOR before lineage integration and cross-process verification."
  apply:
    status: done
    artifact: "openspec/changes/verify-lineage-candidate-persistence/apply-progress.md"
    summary: "Implemented change-local Candidate/v2 recovery CAS, lineage integration, legacy fail-closed behavior, restart coverage, and focal validation."
    key_decisions:
      - "The store publishes exact canonical bytes with atomic no-clobber linking before a returned lineage carries its reference."
      - "Mutable lineage operations recover their baseline from the reference and preserve history on recovery failure."
  verify:
