synthesis: >-
  Habilitar la selección segura de la ruta lite en repositorios activos y conectar
  los mínimos de riesgo (hard floors K1) al routing vivo, evitando que standard
  capture todo por project.status: active o que hotfix degrade garantías en áreas críticas
  (auth, migración de datos, API pública).
scope: >-
  scripts/lib/route-dispatcher.js, openspec/config.yaml, scripts/lib/change-classification.js,
  tests de integración y routing (scripts/configure/real-repo.test.js y afines),
  documentación y contratos de targets sin alterar el parser genérico ni introducir recetas Direct.
