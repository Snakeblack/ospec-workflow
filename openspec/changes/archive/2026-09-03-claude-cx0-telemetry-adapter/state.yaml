    status: unresolved
  - id: sdd-spec-002
    phase: sdd-spec
    statement: "Para el formato Anthropic, cached_input_tokens equivale a la suma de cache_read_input_tokens y cache_creation_input_tokens."
    reversibility: high
    basis: "La mitigación de riesgos de la propuesta nombra ambas familias de campos como soporte equivalente al campo estándar cached_input_tokens."
    recorded_at: "2026-09-03T15:48:00.000Z"
    status: unresolved
  - id: sdd-spec-003
    phase: sdd-spec
    statement: "La extracción desde transcripción alimenta únicamente la lane CX0 de context-measurements.jsonl, no la grabación de phase-cost."
    reversibility: high
    basis: "Intent y Success Criteria de la propuesta mencionan solo context-measurements.jsonl; REQ-hooks-001 permanece sin cambios y Out of Scope excluye ampliar lanes."
    recorded_at: "2026-09-03T15:48:00.000Z"
    status: unresolved
  - id: sdd-design-001
    phase: sdd-design
    statement: "Una entrada de transcripción califica como observación de uso solo cuando input_tokens y output_tokens son válidos; los contadores de caché son opcionales (ruta de cobertura parcial)."
    reversibility: high
    basis: "Escenario de cobertura parcial de REQ-context-measurement-007 requiere input/output available con caché unavailable; decide internalamente qué entrada gana el escaneo reverso."
    recorded_at: "2026-09-03T16:10:00.000Z"
    status: unresolved
  - id: sdd-design-002
    phase: sdd-design
    statement: "El par Anthropic de caché es all-or-nothing: cache_read_input_tokens + cache_creation_input_tokens requieren ambos ser válidos; un solo miembro degrada cached_input_tokens a unavailable."
    reversibility: high
    basis: "REQ-context-measurement-007 prohíbe ceros evidenciales y trata el par como fuente equivalente; la spec no fija el caso de un solo miembro."
    recorded_at: "2026-09-03T16:10:00.000Z"
    status: unresolved
  - id: sdd-design-003
