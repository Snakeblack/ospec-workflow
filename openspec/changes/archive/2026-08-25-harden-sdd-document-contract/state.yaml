assumptions:
  - id: sdd-propose-001
    phase: sdd-propose
    statement: "El requisito normativo de P7 (QA de contenido post-run) se aloja en el dominio agents como hermano de REQ-agents-006, no dentro de sdd-document."
    reversibility: high
    basis: "Precedente existente: REQ-agents-006 ya normaliza la verificacion orchestrator-owned del sandbox para la misma ruta /sdd-document."
    recorded_at: "2026-08-24T20:22:00Z"
    status: unresolved
  - id: sdd-propose-002
    phase: sdd-propose
    statement: "La remediacion del wiki vivo openwiki/ (seccion 6 del analisis) queda fuera del alcance de este change."
    reversibility: high
    basis: "El encargo acota este change a las propuestas P1-P7 sobre el contrato del skill; la seccion 6 se declara independiente del skill en el propio analisis. Remediacion ya ejecutada en commit 9855a1f."
    recorded_at: "2026-08-24T20:22:00Z"
    status: confirmed
  - id: sdd-spec-001
    phase: sdd-spec
    statement: "Los artefactos delta se redactan en inglés normativo, imitando el estilo del baseline openspec/specs/sdd-document/spec.md y el precedente archivado del mismo dominio."
    reversibility: high
    basis: "El baseline openspec/specs/sdd-document/spec.md es íntegramente inglés; el delta archivado 2026-07-06-starlight-web-doc confirma esa convención para ambos dominios."
    recorded_at: "2026-08-24T23:33:00Z"
    status: unresolved
  - id: sdd-design-001
    phase: sdd-design
    statement: "La renumeración de pasos (metadata 6.4→6.6) es preferible a sufijos 6.4a/6.4b; requiere actualizar la regex '### Step 6\\.4:' del test y cross-refs en route-document.md §4 y option-d-starlight.md."
    reversibility: high
    basis: "El test scripts/sdd-document.test.js ya está en Affected Areas; las otras dos referencias son de una línea y quedan enumeradas en design.md."
    recorded_at: "2026-08-24T23:45:00Z"
    status: unresolved
  - id: sdd-design-002
    phase: sdd-design
    statement: "En update-mode no-op se refresca SOLO updatedAt/gitHead de .last-update.json (no es una página wiki), avanzando la ventana diff sin violar 'NOT edit any wiki files' (REQ-008)."
    reversibility: high
    basis: "Lectura estricta del escenario del delta; evita re-escanear diffs antiguos en runs siguientes."
    recorded_at: "2026-08-24T23:45:00Z"
    status: unresolved
  - id: sdd-design-003
    phase: sdd-design
    statement: "No se añaden escenarios golden eval nuevos en este change; la verificación conductual de J6 queda como deuda futura."
    reversibility: high
    basis: "Los evals live son manuales y structural-only (scripts/evals/README.md); un escenario no mediría prosa ni factualidad."
    recorded_at: "2026-08-24T23:45:00Z"
    status: unresolved
  - id: sdd-verify-001
    phase: sdd-verify
    statement: "Se ejecutó discovery completo sin bloqueo de assumption_resolutions porque todas las entradas unresolved son reversibility high y el orquestador pidió honrarlas, incluida sdd-design-003."
    reversibility: high
    basis: "Decision Gates: unresolved high MUST NOT escalate; precedente de verify en este repo; launch prompt Honor assumptions."
    recorded_at: "2026-08-25T00:25:00Z"
    status: unresolved
