phases:
  proposal:
    status: "done"
    artifact: "openspec/changes/k2-1f-close-authority-surface-and-real-backend-cas/proposal.md"
    summary: "Encapsulación estricta de permit issuer, verificación expectedRevision en CAS backend, fail-closed sin reinit silencioso en FileSystemStore y lockfile seguro."
    key_decisions:
      - "createKernelRuntime es el único punto de entrada público de producción para kernel ops y permisos."
      - "FileSystemStore exige initializeIfMissing: true explícito para crear lifecycle inicial en disk vacíos."
      - "FileLock usa token de propietario JSON para desvincular solo el candado propio."
  spec:
    status: "done"
    artifacts:
      - "openspec/changes/k2-1f-close-authority-surface-and-real-backend-cas/specs/authority-store/spec.md"
      - "openspec/changes/k2-1f-close-authority-surface-and-real-backend-cas/specs/lifecycle-kernel/spec.md"
    summary: "Especificación de deltas para verificación de expectedRevision en compareAndSwap/commit, comportamiento fail-closed en FileSystemStore.load, teardown seguro de candados con ownerToken JSON, des-exportación de funciones internas de permit minting, aislamiento de permitIssuer en KernelRuntime y propagación de conflictos CAS en AuthorityStore."
    key_decisions:
      - "compareAndSwap pasa expectedRevision a inner.commit tanto en CAS normal como en heal convergente."
      - "FileSystemStore.load falla cerrado con authority-head-not-found si no existe primary ni .bak excepto si initializeIfMissing: true."
      - "withFileLock escribe JSON { ownerToken, pid, timestamp } y solo elimina .lock si ownerToken coincide o si el PID propietario ha fallecido."
      - "createKernelRuntime es el único entrypoint público en lifecycle-kernel; runOperation ignora permitLedger recibido del caller."
  design:
    status: "done"
    artifact: "openspec/changes/k2-1f-close-authority-surface-and-real-backend-cas/design.md"
    summary: "Diseño técnico para cierre de superficie pública de permisos, propagación de expectedRevision y conflictos CAS en AuthorityStore y FileSystemStore, teardown seguro de candados con token de propietario JSON/liveness y fail-closed en FileSystemStore.load."
    key_decisions:
      - "Des-exportación de funciones internas de permisos y runKernelOperation de la API de producción, promoviendo createKernelRuntime como único entrypoint."
      - "Creación del módulo de soporte para tests scripts/lib/test-support/permit-test-helpers.js."
      - "Verificación estricta de expectedRevision en FileSystemStore.commit bajo lockfile con token de propietario JSON y comprobación isPidAlive."
      - "Propagación explícita de persisted.ok === false en AuthorityStore.compareAndSwapLocked."
