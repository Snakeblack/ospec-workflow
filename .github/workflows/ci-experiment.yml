name: CI Experiment (temporary)

# Temporary measurement of Windows speed-ups; removed before the PR merges.
# Round 2: every variant puts TEMP on a Dev Drive (round 1: -40 %).
on:
  push:
    branches:
      - ci/windows-ci-optimization

permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.variant }}-${{ matrix.rep }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
        variant: [devdrive, shard-1, shard-2, workspace, stress]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Dev Drive for TEMP
        shell: pwsh
        run: |
          $t0 = Get-Date
          $vhd = "C:\ospec-devdrive.vhdx"
          "create vdisk file=`"$vhd`" maximum=20480 type=expandable`nselect vdisk file=`"$vhd`"`nattach vdisk`ncreate partition primary`nassign letter=R" | Set-Content "$env:RUNNER_TEMP\dp.txt"
          diskpart /s "$env:RUNNER_TEMP\dp.txt" | Out-Null
          Format-Volume -DriveLetter R -DevDrive -Confirm:$false -Force | Out-Null
          New-Item -ItemType Directory -Path R:\tmp | Out-Null
          "TEMP=R:\tmp" >> $env:GITHUB_ENV
          "TMP=R:\tmp" >> $env:GITHUB_ENV
          Write-Host "dev drive setup took $(((Get-Date) - $t0).TotalSeconds) s"

      - name: Copy the checkout to the Dev Drive
        if: matrix.variant == 'workspace'
        shell: pwsh
        run: |
          $t0 = Get-Date
          robocopy $env:GITHUB_WORKSPACE R:\ws /E /NFL /NDL /NJH /NJS /NP | Out-Null
          Write-Host "copy took $(((Get-Date) - $t0).TotalSeconds) s"

      - name: Native Node tests
        shell: pwsh
        run: |
          $extra = @()
          if ("${{ matrix.variant }}" -eq "stress") { $extra += "--test-concurrency=8" }
          if ("${{ matrix.variant }}" -like "shard-*") { $extra += "--test-shard=$("${{ matrix.variant }}".Substring(6))/2" }
          if ("${{ matrix.variant }}" -eq "workspace") { Set-Location R:\ws }
          $t0 = Get-Date
          node --test @extra --test-reporter=dot --test-reporter-destination=stdout --test-reporter=tap --test-reporter-destination=tap.txt "scripts/**/*.test.js" "tests/**/*.test.js"
          $code = $LASTEXITCODE
          Write-Host "WALL_SECONDS=$(((Get-Date) - $t0).TotalSeconds)"
          Select-String -Path tap.txt -Pattern "retrying|without a verdict" | Select-Object -First 20 | Out-Host
          Get-Content tap.txt -Tail 12
          exit $code
