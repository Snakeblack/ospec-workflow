name: Experiment Windows hotspots

# Temporary (windows-test-hotspots): measures, removed before merge.
on:
  push:
    branches:
      - ci/windows-test-hotspots

permissions:
  contents: read

jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: PowerShell and Go timings
        run: node .github/experiments/windows-hotspots.js
      - name: Hotspot test files alone
        run: node --test --test-reporter=tap scripts/configure/codex-hook-shell.test.js scripts/configure/codex-smoke.test.js scripts/evals/bench/hosts/agy.test.js scripts/configure/install-codex-env-isolation.test.js
