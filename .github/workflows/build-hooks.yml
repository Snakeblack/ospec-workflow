name: Build ospec-hooks

on:
  # Same as Validate Harness: a PR branch builds once, through pull_request,
  # and push builds only main. No path filter: the Go tests also read JS and
  # YAML inputs (hooks/hooks.json, scripts/hooks/session-start.js, the skill
  # registry, schemas/kernel), and publish-marketplace.yml waits for this run.
  push:
    branches:
      - main
  pull_request:

# Least privilege: the build only reads the checkout, never writes to the repo.
permissions:
  contents: read

# A new push to a PR supersedes its in-flight run. A main run is never
# cancelled: publish-marketplace.yml needs the run of its own SHA to succeed.
concurrency:
  group: build-hooks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The parity tests run the JS sources they mirror with node.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # A Windows checkout may carry CRLF, which gofmt reports as unformatted.
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }

      # Each runner vets its own build tags (pathsafe_windows vs. _posix).
      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # Fails only on a vulnerability the code can reach.
      - name: govulncheck
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  build:
    name: Cross-compile (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: amd64
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Only proves the matrix compiles: publish-marketplace.yml builds the
      # binaries it ships, so nothing is uploaded.
      - name: Cross-compile ospec-hooks
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p release/dist
          go build -o release/dist/ospec-hooks-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/ospec-hooks
